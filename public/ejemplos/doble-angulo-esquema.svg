<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="da-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="da-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="840" height="470" fill="#ffffff"/>
  <text x="420" y="26" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">Misma viga, misma reacción, mismos pernos: dos anatomías (vista en planta)</text>

  <!-- ================= IZQUIERDA: SHEAR TAB ================= -->
  <text x="215" y="58" font-size="12.5" text-anchor="middle" fill="#1f4e79" font-weight="bold">Shear tab — 1 plano de corte, 10 mm de apoyo</text>

  <!-- ala de la columna -->
  <rect x="70" y="90" width="14" height="180" fill="#dfe5ec" stroke="#333" stroke-width="1.3"/>
  <text x="77" y="286" font-size="9.5" text-anchor="middle" fill="#555">columna</text>

  <!-- alma de la viga -->
  <rect x="140" y="166" width="230" height="9" fill="#9bb0c6" stroke="#333" stroke-width="1"/>
  <text x="320" y="160" font-size="10" fill="#7a8ba0">alma de la viga, 9 mm</text>

  <!-- plancha -->
  <rect x="84" y="175" width="180" height="10" fill="#eef2f7" stroke="#333" stroke-width="1.4"/>
  <text x="150" y="224" font-size="10.5" text-anchor="middle" fill="#333">plancha PL 10 (A36)</text>
  <!-- soldadura -->
  <path d="M84,175 l0,10 -7,-5 z" fill="#c07a00"/>

  <!-- perno con 1 plano de corte -->
  <rect x="196" y="150" width="9" height="52" fill="#333"/>
  <rect x="188" y="144" width="25" height="8" fill="#333"/>
  <rect x="188" y="200" width="25" height="8" fill="#333"/>
  <line x1="150" y1="175" x2="255" y2="175" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="262" y="179" font-size="10.5" fill="#c0392b" font-weight="bold">1 plano</text>

  <!-- excentricidad -->
  <line x1="84" y1="238" x2="200" y2="238" stroke="#555" stroke-width="0.8" marker-start="url(#da-a)" marker-end="url(#da-a)"/>
  <text x="142" y="252" font-size="10" text-anchor="middle" fill="#555">a = 60 mm</text>

  <!-- barra del estado gobernante -->
  <text x="70" y="304" font-size="10.5" fill="#333" font-weight="bold">Gobierna la cadena: rotura por corte</text>
  <rect x="70" y="312" width="290" height="18" fill="#eef2f7" stroke="#9bb0c6"/>
  <rect x="70" y="312" width="270" height="18" fill="#c0392b"/>
  <text x="196" y="326" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">uso 0.93</text>
  <text x="70" y="350" font-size="10.5" fill="#333" font-weight="bold">Con la excentricidad: perno extremo (elástico)</text>
  <rect x="70" y="358" width="290" height="18" fill="#eef2f7" stroke="#9bb0c6"/>
  <rect x="70" y="358" width="287" height="18" fill="#7d1f14"/>
  <text x="196" y="372" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">uso 0.995</text>

  <!-- separador -->
  <line x1="420" y1="50" x2="420" y2="400" stroke="#d5dde6" stroke-width="1.5"/>

  <!-- ================= DERECHA: DOBLE ANGULO ================= -->
  <text x="628" y="58" font-size="12.5" text-anchor="middle" fill="#1f6f4a" font-weight="bold">Doble ángulo — 2 planos de corte, 20 mm de apoyo</text>

  <!-- ala de la columna -->
  <rect x="470" y="90" width="14" height="180" fill="#dfe5ec" stroke="#333" stroke-width="1.3"/>
  <text x="477" y="286" font-size="9.5" text-anchor="middle" fill="#555">columna</text>

  <!-- alma de la viga -->
  <rect x="540" y="166" width="230" height="9" fill="#9bb0c6" stroke="#333" stroke-width="1"/>
  <text x="720" y="160" font-size="10" fill="#7a8ba0">alma de la viga, 9 mm</text>

  <!-- angulos: alas al alma -->
  <rect x="484" y="156" width="180" height="10" fill="#e8f0e8" stroke="#333" stroke-width="1.4"/>
  <rect x="484" y="175" width="180" height="10" fill="#e8f0e8" stroke="#333" stroke-width="1.4"/>
  <!-- alas salientes hacia la columna -->
  <rect x="484" y="116" width="10" height="40" fill="#e8f0e8" stroke="#333" stroke-width="1.4"/>
  <rect x="484" y="185" width="10" height="40" fill="#e8f0e8" stroke="#333" stroke-width="1.4"/>
  <text x="556" y="234" font-size="10.5" text-anchor="middle" fill="#333">2L 100×100×10 (A36)</text>
  <!-- pernos al soporte -->
  <g fill="#333"><circle cx="477" cy="136" r="4.5"/><circle cx="477" cy="205" r="4.5"/></g>

  <!-- perno con 2 planos de corte -->
  <rect x="596" y="140" width="9" height="72" fill="#333"/>
  <rect x="588" y="134" width="25" height="8" fill="#333"/>
  <rect x="588" y="210" width="25" height="8" fill="#333"/>
  <line x1="550" y1="166" x2="660" y2="166" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 3"/>
  <line x1="550" y1="175" x2="660" y2="175" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="668" y="196" font-size="10.5" fill="#c0392b" font-weight="bold">2 planos</text>

  <!-- excentricidad -->
  <line x1="484" y1="238" x2="590" y2="238" stroke="#555" stroke-width="0.8" marker-start="url(#da-a)" marker-end="url(#da-a)"/>
  <text x="537" y="252" font-size="10" text-anchor="middle" fill="#555">e = 55 mm</text>

  <!-- barra del estado gobernante -->
  <text x="470" y="304" font-size="10.5" fill="#333" font-weight="bold">Gobierna la cadena: rotura en corte de los ángulos</text>
  <rect x="470" y="312" width="290" height="18" fill="#eef2f7" stroke="#9bb0c6"/>
  <rect x="470" y="312" width="133" height="18" fill="#1f6f4a"/>
  <text x="536" y="326" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="bold">uso 0.46</text>
  <text x="470" y="350" font-size="10.5" fill="#333" font-weight="bold">Con la excentricidad: perno extremo (elástico)</text>
  <rect x="470" y="358" width="290" height="18" fill="#eef2f7" stroke="#9bb0c6"/>
  <rect x="470" y="358" width="139" height="18" fill="#1f6f4a"/>
  <text x="539" y="372" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="bold">uso 0.48</text>

  <!-- reaccion comun -->
  <rect x="70" y="404" width="690" height="46" rx="6" fill="#f8fafc" stroke="#9bb0c6"/>
  <text x="84" y="422" font-size="10.5" fill="#333">Común a las dos: V_u = 30 tonf · 4 Ø22 A325-N · s = 70 mm · profundidad 280 mm · viga W460×74.</text>
  <text x="84" y="440" font-size="10.5" fill="#333">Duplicar el plano de corte y el espesor de apoyo saca el eslabón débil del elemento de conexión hasta el alma de la viga.</text>
</svg>
