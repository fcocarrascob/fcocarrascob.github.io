  <text x="612.0" y="337.0" font-size="10.5" fill="#666">18.7.5.3(a) mod. por 18.10.6.4(e):</text>
  <text x="612.0" y="352.0" font-size="10.5" fill="#b02a1a" font-weight="bold">   1/3 de la menor dim. del borde = 100 mm</text>
  <text x="612.0" y="367.0" font-size="10.5" fill="#666">18.7.5.3(b)  6d_b = 168 mm</text>
  <text x="612.0" y="382.0" font-size="10.5" fill="#666">18.7.5.3(d)  s_o = 100+(350−h_x)/3 = 150 mm</text>
  <text x="612.0" y="397.0" font-size="10.5" fill="#666">Tabla 18.10.6.5(b) Grado 420: 150 mm</text>
  <text x="612.0" y="412.0" font-size="10.5" fill="#222"></text>
  <text x="612.0" y="427.0" font-size="10.5" fill="#b02a1a" font-weight="bold">s = 100 mm</text>
  <text x="612.0" y="442.0" font-size="10.5" fill="#666">No lo pide la resistencia: lo pide que el</text>
  <text x="612.0" y="457.0" font-size="10.5" fill="#666">hormigón no se desgrane al reversarse.</text>
