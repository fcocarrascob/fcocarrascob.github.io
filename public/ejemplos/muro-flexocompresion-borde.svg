  <text x="612.0" y="397.0" font-size="10.5" fill="#666">18.7.5.3(b)  6d_b = 168 mm</text>
  <text x="612.0" y="412.0" font-size="10.5" fill="#666">18.7.5.3(d)  s_o = 100+(350−h_x)/3 = 150 mm</text>
  <text x="612.0" y="427.0" font-size="10.5" fill="#666">Tabla 18.10.6.5(b) Grado 420: 150 mm</text>
