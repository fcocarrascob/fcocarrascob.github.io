  <text x="612.0" y="457.0" font-size="10.5" fill="#b02a1a" font-weight="bold">s = 100 mm</text>
  <text x="612.0" y="472.0" font-size="10.5" fill="#666">No lo pide la resistencia: lo pide que el</text>
  <text x="612.0" y="487.0" font-size="10.5" fill="#666">hormigón no se desgrane al reversarse.</text>
