  <text x="128.0" y="442.0" font-size="10.5" fill="#222"></text>
  <text x="128.0" y="457.0" font-size="10.5" fill="#222">A_sh ⊥ b_c1 = 11,11 cm²  con s = 100 mm</text>
  <text x="128.0" y="472.0" font-size="10.5" fill="#2f7a4f" font-weight="bold">6 ramas de estribo + 2 trabas φ16 = 16,08 cm²   ✓</text>
