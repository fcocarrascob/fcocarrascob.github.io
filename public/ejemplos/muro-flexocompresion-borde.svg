  <text x="128.0" y="337.0" font-size="10.5" fill="#666">A_g/A_ch = 1,627   (núcleo 904×204 mm)</text>
  <text x="128.0" y="352.0" font-size="10.5" fill="#b02a1a" font-weight="bold">(a) 0,3(A_g/A_ch − 1)f'_c/f_yt = 0,01343</text>
  <text x="128.0" y="367.0" font-size="10.5" fill="#666">(b) 0,09 f'_c/f_yt = 0,00643</text>
