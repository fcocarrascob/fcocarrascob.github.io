  <text x="128.0" y="397.0" font-size="10.5" fill="#b02a1a">perdido en un muro delgado</text>
  <text x="128.0" y="412.0" font-size="10.5" fill="#222"></text>
  <text x="128.0" y="427.0" font-size="10.5" fill="#222">A_sh ⊥ b_c1 = 12,14 cm²  con s = 100 mm</text>
  <text x="128.0" y="442.0" font-size="10.5" fill="#2f7a4f" font-weight="bold">8 ramas φ16 = 16,08 cm²   ✓</text>
