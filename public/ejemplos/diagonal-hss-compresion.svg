<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" font-family="Segoe UI, Arial, sans-serif">
  <rect width="840" height="470" fill="#ffffff"/>
  <defs>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <!-- ══════════ PANEL IZQUIERDO · el paño en X ══════════ -->
  <text x="212" y="26" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">El paño en X y las dos longitudes de pandeo</text>

  <!-- marco -->
  <line x1="110" y1="300" x2="310" y2="300" stroke="#333" stroke-width="2"/>
  <line x1="110" y1="80" x2="310" y2="80" stroke="#333" stroke-width="2"/>
  <line x1="110" y1="80" x2="110" y2="300" stroke="#333" stroke-width="2"/>
  <line x1="310" y1="80" x2="310" y2="300" stroke="#333" stroke-width="2"/>
  <g stroke="#888" stroke-width="1">
    <line x1="96" y1="310" x2="124" y2="310"/><line x1="296" y1="310" x2="324" y2="310"/>
    <line x1="98" y1="310" x2="92" y2="318"/><line x1="106" y1="310" x2="100" y2="318"/>
    <line x1="114" y1="310" x2="108" y2="318"/><line x1="122" y1="310" x2="116" y2="318"/>
    <line x1="298" y1="310" x2="292" y2="318"/><line x1="306" y1="310" x2="300" y2="318"/>
    <line x1="314" y1="310" x2="308" y2="318"/><line x1="322" y1="310" x2="316" y2="318"/>
  </g>

  <!-- diagonal traccionada: recta y continua en el cruce -->
  <line x1="110" y1="300" x2="310" y2="80" stroke="#1c7c3c" stroke-width="3.4"/>

  <!-- diagonal comprimida: eje recto punteado + forma pandeada en dos semiondas -->
  <line x1="310" y1="300" x2="110" y2="80" stroke="#c0392b" stroke-width="0.9" stroke-dasharray="4 4" opacity="0.5"/>
  <path d="M310,300 Q222,232 210,190 Q198,148 110,80" fill="none" stroke="#c0392b" stroke-width="3.4"/>

  <!-- el cruce -->
  <circle cx="210" cy="190" r="7" fill="#fff" stroke="#222" stroke-width="2"/>
  <circle cx="210" cy="190" r="2.4" fill="#222"/>

  <!-- acotados a la derecha, fuera del marco -->
  <line x1="344" y1="300" x2="344" y2="80" stroke="#777" stroke-width="0.9" marker-start="url(#ac)" marker-end="url(#ac)"/>
  <text x="352" y="186" font-size="10" fill="#555">L = 4.5 m</text>
  <text x="352" y="199" font-size="9" fill="#9a9a9a">pto. a pto.</text>

  <line x1="326" y1="300" x2="326" y2="190" stroke="#c0392b" stroke-width="1.1" marker-start="url(#ac)" marker-end="url(#ac)"/>
  <text x="332" y="252" font-size="10.5" fill="#c0392b" font-weight="bold">L_c = 2.25 m</text>

  <!-- leyenda, fuera del dibujo -->
  <line x1="62" y1="344" x2="90" y2="344" stroke="#1c7c3c" stroke-width="3.4"/>
  <text x="98" y="348" font-size="10.5" fill="#1c7c3c" font-weight="bold">traccionada</text>
  <text x="184" y="348" font-size="10" fill="#555">— continua en el cruce</text>

  <line x1="62" y1="366" x2="90" y2="366" stroke="#c0392b" stroke-width="3.4"/>
  <text x="98" y="370" font-size="10.5" fill="#c0392b" font-weight="bold">comprimida</text>
  <text x="184" y="370" font-size="10" fill="#555">— pandea en dos semiondas de L/2</text>

  <circle cx="76" cy="388" r="6" fill="#fff" stroke="#222" stroke-width="1.8"/>
  <circle cx="76" cy="388" r="2" fill="#222"/>
  <text x="98" y="392" font-size="10.5" fill="#222" font-weight="bold">cruce conectado</text>
  <text x="184" y="392" font-size="10" fill="#555">— punto fijo fuera del plano</text>

  <rect x="52" y="406" width="336" height="48" rx="4" fill="#f3f7fb" stroke="#bcd0e2"/>
  <text x="64" y="423" font-size="10" fill="#2c5f8a" font-weight="bold">8.6.4 lo permite si se cumplen las dos:</text>
  <text x="64" y="438" font-size="9.8" fill="#33526b">la otra diagonal traccionada · una de las dos continua en el cruce</text>
  <text x="64" y="450" font-size="9.3" fill="#7a8ba0">C8.6.4: si la plancha del cruce es esbelta, hay que atiesarla</text>

  <!-- ══════════ PANEL DERECHO · la curva de columna ══════════ -->
  <text x="628" y="26" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">Los dos puntos sobre la curva de columna</text>

  <!-- ejes: x = 450 + λ·1.8 · y = 320 − F_n·0.073864 -->
  <line x1="450" y1="52" x2="450" y2="320" stroke="#333" stroke-width="1.2"/>
  <line x1="450" y1="320" x2="815" y2="320" stroke="#333" stroke-width="1.2"/>
  <text x="444" y="50" font-size="10.5" text-anchor="end" fill="#333">F_n</text>
  <text x="444" y="62" font-size="9" text-anchor="end" fill="#999">kgf/cm²</text>
  <text x="815" y="338" font-size="10.5" text-anchor="end" fill="#333">L_c / r</text>

  <!-- techo Fy -->
  <line x1="450" y1="60" x2="815" y2="60" stroke="#c07a00" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="812" y="54" font-size="10" text-anchor="end" fill="#a56a00">F_y = 3520</text>

  <!-- marcas eje x -->
  <g font-size="9.5" fill="#666" text-anchor="middle">
    <line x1="450" y1="320" x2="450" y2="325" stroke="#333"/><text x="450" y="337">0</text>
    <line x1="540" y1="320" x2="540" y2="325" stroke="#333"/><text x="540" y="337">50</text>
    <line x1="630" y1="320" x2="630" y2="325" stroke="#333"/><text x="630" y="337">100</text>
    <line x1="720" y1="320" x2="720" y2="325" stroke="#333"/><text x="720" y="337">150</text>
  </g>

  <!-- quiebre en λ = 113.4 -->
  <line x1="654" y1="60" x2="654" y2="320" stroke="#9bb0c6" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text x="650" y="80" font-size="9.5" text-anchor="end" fill="#7a8ba0">quiebre 113.4</text>
  <text x="650" y="92" font-size="9.5" text-anchor="end" fill="#2c5f8a" font-weight="bold">= el límite de 8.6.3</text>

  <!-- ramas -->
  <polyline points="466,62 477,64 488,68 499,74 509,80 520,87 531,96 542,105 553,115 563,126 574,136 585,148 596,159 607,171 617,182 628,193 639,204 650,214 654,219" fill="none" stroke="#1c7c3c" stroke-width="2.4"/>
  <polyline points="654,219 670,233 686,244 703,254 719,262 735,268 751,273 767,278 784,282 800,285 810,287" fill="none" stroke="#1a63a8" stroke-width="2.4"/>
  <text x="462" y="108" font-size="10" fill="#1c7c3c">inelástico</text>
  <text x="462" y="120" font-size="10" fill="#1c7c3c">(Ec. E3-2)</text>
  <text x="812" y="262" font-size="10" text-anchor="end" fill="#1a63a8">elástico: 0.877·F_e</text>
  <text x="812" y="274" font-size="10" text-anchor="end" fill="#1a63a8">(Ec. E3-3)</text>

  <!-- punto A: con el cruce -->
  <line x1="555" y1="118" x2="555" y2="320" stroke="#1c7c3c" stroke-width="0.8" stroke-dasharray="3 3"/>
  <circle cx="555" cy="118" r="6" fill="#1c7c3c"/>
  <text x="555" y="122" font-size="9" text-anchor="middle" fill="#fff" font-weight="bold">A</text>
  <text x="555" y="103" font-size="9.5" text-anchor="middle" fill="#1c7c3c" font-weight="bold">58.6</text>

  <!-- punto B: sin el cruce -->
  <line x1="661" y1="225" x2="661" y2="320" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="3 3"/>
  <circle cx="661" cy="225" r="6" fill="#c0392b"/>
  <text x="661" y="229" font-size="9" text-anchor="middle" fill="#fff" font-weight="bold">B</text>
  <text x="676" y="221" font-size="9.5" fill="#c0392b" font-weight="bold">117.2</text>

  <!-- leyenda de los dos puntos, fuera del gráfico -->
  <circle cx="462" cy="362" r="6" fill="#1c7c3c"/>
  <text x="462" y="366" font-size="9" text-anchor="middle" fill="#fff" font-weight="bold">A</text>
  <text x="478" y="359" font-size="10.5" fill="#1c7c3c" font-weight="bold">con el cruce fijo · L_c = 2.25 m</text>
  <text x="478" y="373" font-size="9.8" fill="#2f5c40">λ = 58.6 → F_n = 2738 → φP_n = 53.5 tonf · uso 0.79 ✓</text>

  <circle cx="462" cy="398" r="6" fill="#c0392b"/>
  <text x="462" y="402" font-size="9" text-anchor="middle" fill="#fff" font-weight="bold">B</text>
  <text x="478" y="395" font-size="10.5" fill="#c0392b" font-weight="bold">sin el cruce · L_c = 4.5 m</text>
  <text x="478" y="409" font-size="9.8" fill="#8a3226">λ = 117.2 → F_n = 1286 → φP_n = 25.1 tonf · uso 1.67 ✗</text>

  <rect x="452" y="422" width="372" height="34" rx="4" fill="#fdf6ee" stroke="#e8c9a0"/>
  <text x="464" y="437" font-size="9.8" fill="#7d5320">Sin el cruce las dos puertas se cierran: 8.6.3 también lo rechaza</text>
  <text x="464" y="450" font-size="9.8" fill="#7d5320">(117.2 &gt; 113.4) y su exención pide 117.6 tonf contra 25.1 → uso 4.68</text>
</svg>
