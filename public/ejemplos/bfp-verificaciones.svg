<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="bv-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/>
    </marker>
  </defs>
  <rect width="840" height="460" fill="#ffffff"/>
  <text x="420" y="26" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">Usos: las cinco verificaciones de la conexión y la viga contra las cuatro de la columna</text>

  <!-- eje -->
  <line x1="70" y1="370" x2="670" y2="370" stroke="#333" stroke-width="1.2"/>
  <line x1="70" y1="80" x2="70" y2="370" stroke="#333" stroke-width="1.2"/>
  <g font-size="10" fill="#555" text-anchor="end">
    <line x1="65" y1="370" x2="70" y2="370" stroke="#555"/><text x="60" y="374">0</text>
    <line x1="65" y1="276.7" x2="70" y2="276.7" stroke="#555"/><text x="60" y="280">0.5</text>
    <line x1="65" y1="183.3" x2="70" y2="183.3" stroke="#555"/><text x="60" y="187">1.0</text>
    <line x1="65" y1="90" x2="70" y2="90" stroke="#555"/><text x="60" y="94">1.5</text>
  </g>
  <text x="26" y="225" font-size="11.5" fill="#333" transform="rotate(-90 26 225)" text-anchor="middle">uso = demanda / capacidad</text>

  <!-- limite 1.0 -->
  <line x1="70" y1="183.3" x2="670" y2="183.3" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="8 4"/>
  <text x="676" y="180" font-size="10.5" fill="#c0392b" font-weight="bold">límite 1.0</text>

  <!-- grupo A: la conexion -->
  <rect x="82" y="60" width="278" height="20" rx="4" fill="#eaf2fa" stroke="#1f4e79"/>
  <text x="221" y="75" font-size="11" text-anchor="middle" fill="#1f4e79" font-weight="bold">LA CONEXIÓN Y LA VIGA — todo pasa</text>

  <g fill="#5b8db8">
    <rect x="90" y="278.5" width="46" height="91.5"/>
    <rect x="150" y="241.2" width="46" height="128.8"/>
    <rect x="210" y="231.8" width="46" height="138.2"/>
    <rect x="270" y="228.1" width="46" height="141.9"/>
    <rect x="330" y="228.1" width="46" height="141.9"/>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#1f4e79" font-weight="bold">
    <text x="113" y="272">0.49</text><text x="173" y="235">0.69</text><text x="233" y="225">0.74</text>
    <text x="293" y="221">0.76</text><text x="353" y="221">0.76</text>
  </g>
  <g font-size="9" fill="#444" text-anchor="middle">
    <text x="113" y="386">apoyo ala</text><text x="113" y="397">(J3-6)</text>
    <text x="173" y="386">pernos</text><text x="173" y="397">(J3-1)</text>
    <text x="233" y="386">placa fluenc.</text><text x="233" y="397">(J4-1)</text>
    <text x="293" y="386">placa rotura</text><text x="293" y="397">(J4-2)</text>
    <text x="353" y="386">ala perforada</text><text x="353" y="397">(F13-1)</text>
  </g>

  <!-- grupo B: la columna -->
  <rect x="422" y="60" width="238" height="20" rx="4" fill="#fdf3f2" stroke="#c0392b"/>
  <text x="541" y="75" font-size="11" text-anchor="middle" fill="#c0392b" font-weight="bold">LA COLUMNA — tres fallan</text>

  <rect x="430" y="187" width="46" height="183" fill="#e0a08c"/>
  <rect x="490" y="170.2" width="46" height="199.8" fill="#c0392b"/>
  <rect x="550" y="160.9" width="46" height="209.1" fill="#c0392b"/>
  <rect x="610" y="103" width="46" height="267" fill="#c0392b"/>
  <!-- aporte del axial en la zona panel -->
  <rect x="490" y="170.2" width="46" height="13.1" fill="#7d1f14"/>
  <g font-size="10.5" text-anchor="middle" font-weight="bold">
    <text x="453" y="180" fill="#a8583f">0.98</text>
    <text x="513" y="163" fill="#c0392b">1.07</text>
    <text x="573" y="154" fill="#c0392b">1.12</text>
    <text x="633" y="96" fill="#c0392b">1.43</text>
  </g>
  <g font-size="9" fill="#444" text-anchor="middle">
    <text x="453" y="386">aplastam.</text><text x="453" y="397">(J10-4)</text>
    <text x="513" y="386">zona panel</text><text x="513" y="397">(J10-10)</text>
    <text x="573" y="386">fluencia alma</text><text x="573" y="397">(J10-2)</text>
    <text x="633" y="386">flexión ala</text><text x="633" y="397">(J10-1)</text>
  </g>

  <!-- efecto del doubler -->
  <line x1="513" y1="196" x2="513" y2="240" stroke="#1f4e79" stroke-width="2" marker-end="url(#bv-d)"/>
  <circle cx="513" cy="246.8" r="4.5" fill="#1f4e79"/>
  <text x="513" y="266" font-size="10.5" text-anchor="middle" fill="#ffffff" font-weight="bold">0.66</text>

  <!-- leyenda -->
  <rect x="676" y="200" width="150" height="140" rx="6" fill="#f8fafc" stroke="#9bb0c6"/>
  <rect x="688" y="214" width="18" height="11" fill="#7d1f14"/>
  <text x="712" y="223" font-size="9.5" fill="#333">término axial</text>
  <text x="688" y="238" font-size="9.5" fill="#666">(1.4 − P_r/P_c) de J10-10:</text>
  <text x="688" y="251" font-size="9.5" fill="#666">lleva la zona panel de</text>
  <text x="688" y="264" font-size="9.5" fill="#666">1.00 a 1.07 sin que la</text>
  <text x="688" y="277" font-size="9.5" fill="#666">conexión cambie nada.</text>
  <text x="688" y="295" font-size="9.5" fill="#1f4e79">Con doubler de 6 mm: 0.66</text>
  <text x="688" y="309" font-size="9.5" fill="#888">M_u = 32 tonf·m</text>
  <text x="688" y="322" font-size="9.5" fill="#888">P_u = 200 tonf (0.46 P_c)</text>

  <text x="70" y="430" font-size="10.5" fill="#555">El eslabón débil no está en lo que se dibuja en el plano de conexiones, sino en el nudo que la recibe: ala, alma y zona panel de la columna.</text>
</svg>
