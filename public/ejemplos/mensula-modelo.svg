<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="840" height="400" fill="#ffffff"/>
  <text x="420" y="24" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">La ménsula y su enrejado interno (escala 2.25 px/cm)</text>

  <!-- ===== Panel izquierdo: geometría y cargas ===== -->
  <text x="190" y="50" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">Geometría y cargas</text>
  <!-- columna -->
  <rect x="70" y="60" width="90" height="270" fill="#f2f4f6" stroke="#333" stroke-width="1.4"/>
  <text x="115" y="320" font-size="9.5" text-anchor="middle" fill="#666">columna 40×40</text>
  <!-- mensula: cara en x=160 -->
  <path d="M 160 120 L 228 120 L 228 188 L 160 221 Z" fill="#f2f4f6" stroke="#333" stroke-width="1.4"/>
  <line x1="160" y1="120" x2="160" y2="221" stroke="#f2f4f6" stroke-width="2"/>
  <!-- placa -->
  <rect x="171" y="113" width="45" height="7" fill="#5a6b7c"/>
  <!-- Vu -->
  <line x1="194" y1="72" x2="194" y2="104" stroke="#c0392b" stroke-width="2.4"/>
  <path d="M 194 111 L 189 100 L 199 100 Z" fill="#c0392b"/>
  <text x="204" y="84" font-size="11" fill="#c0392b" font-weight="bold">V_u = 28 tonf</text>
  <!-- Nuc -->
  <line x1="222" y1="109" x2="252" y2="109" stroke="#c07a00" stroke-width="2.2"/>
  <path d="M 259 109 L 249 104 L 249 114 Z" fill="#c07a00"/>
  <text x="240" y="98" font-size="10.5" fill="#c07a00" font-weight="bold">N_uc = 5.6 tonf</text>
  <text x="240" y="132" font-size="8.5" fill="#c07a00">(0.2·V_u, 16.5.3.4)</text>
  <!-- cotas -->
  <line x1="160" y1="228" x2="194" y2="228" stroke="#888" stroke-width="1"/>
  <text x="177" y="242" font-size="9" text-anchor="middle" fill="#888">a_v = 15</text>
  <line x1="240" y1="120" x2="240" y2="188" stroke="#888" stroke-width="1"/>
  <text x="246" y="156" font-size="9" fill="#888">30</text>
  <line x1="146" y1="120" x2="146" y2="221" stroke="#888" stroke-width="1"/>
  <text x="140" y="174" font-size="9" text-anchor="end" fill="#888">h = 45</text>
  <text x="177" y="264" font-size="9" text-anchor="middle" fill="#888">vuelo 30 cm</text>

  <!-- ===== Panel derecho: modelo puntal-tensor ===== -->
  <text x="590" y="50" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">Modelo puntal-tensor</text>
  <rect x="450" y="60" width="90" height="270" fill="#f7f8fa" stroke="#999" stroke-width="1.1"/>
  <path d="M 540 120 L 608 120 L 608 188 L 540 221 Z" fill="#f7f8fa" stroke="#999" stroke-width="1.1"/>
  <line x1="540" y1="120" x2="540" y2="221" stroke="#f7f8fa" stroke-width="2"/>
  <rect x="551" y="113" width="45" height="7" fill="#8fa0af"/>
  <!-- puntal: banda de A(574,131) a B(540,212), ancho ~16px -->
  <path d="M 566 127 L 582 135 L 548 216 L 532 208 Z" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
  <!-- tirante -->
  <line x1="480" y1="131" x2="596" y2="131" stroke="#1a63a8" stroke-width="3"/>
  <path d="M 480 131 q -10 0 -10 12" fill="none" stroke="#1a63a8" stroke-width="3"/>
  <path d="M 596 131 q 10 0 10 12" fill="none" stroke="#1a63a8" stroke-width="3"/>
  <!-- nodos -->
  <circle cx="574" cy="131" r="6" fill="#fff" stroke="#333" stroke-width="1.8"/>
  <circle cx="540" cy="212" r="6" fill="#333"/>
  <text x="586" y="146" font-size="9.5" fill="#333" font-weight="bold">A (CCT)</text>
  <text x="514" y="230" font-size="9.5" fill="#333" font-weight="bold">B (CCC)</text>
  <!-- Vu en A -->
  <line x1="574" y1="78" x2="574" y2="106" stroke="#c0392b" stroke-width="2.2"/>
  <path d="M 574 113 L 569 102 L 579 102 Z" fill="#c0392b"/>
  <text x="582" y="88" font-size="10" fill="#c0392b" font-weight="bold">V_u</text>
  <!-- etiquetas de fuerzas -->
  <text x="612" y="170" font-size="10.5" fill="#c0392b" font-weight="bold">C = 30.3 tonf</text>
  <text x="612" y="184" font-size="9.5" fill="#c0392b">θ = 67.4°</text>
  <text x="612" y="198" font-size="9.5" fill="#c0392b">w_s = 8 cm</text>
  <text x="500" y="122" font-size="10.5" fill="#1a63a8" font-weight="bold">T = 18.0 tonf</text>
  <text x="452" y="160" font-size="9" fill="#1a63a8">3Ø16 ancladas</text>
  <text x="452" y="172" font-size="9" fill="#1a63a8">en la columna</text>
  <!-- jd -->
  <line x1="628" y1="131" x2="628" y2="212" stroke="#888" stroke-width="1"/>
  <line x1="624" y1="131" x2="632" y2="131" stroke="#888"/>
  <line x1="624" y1="212" x2="632" y2="212" stroke="#888"/>
  <text x="634" y="176" font-size="9" fill="#888">jd = 36</text>

  <!-- caja equilibrio -->
  <rect x="70" y="286" width="700" height="100" rx="6" fill="#f4f7fb" stroke="#1a63a8"/>
  <text x="84" y="307" font-size="11.5" fill="#222" font-weight="bold">Un triángulo en equilibrio — no hay “flexión” ni “corte”</text>
  <text x="84" y="327" font-size="10.5" fill="#333">jd = d − w_s/2 = 40 − 4 = 36 cm   ·   θ = atan(36/15) = 67.4° ≥ 25°   ·   C = V_u/sin θ = 30.3 tonf</text>
  <text x="84" y="345" font-size="10.5" fill="#333">T = [V_u·a_v + N_uc·(jd+5)]/jd = 11.7 + 6.4 = 18.0 tonf — la tracción “olvidada” N_uc, con su palanca, pone un tercio.</text>
  <text x="84" y="364" font-size="10" fill="#888">El brazo jd no sale de una fórmula: lo declara el modelo (ancho de puntal supuesto w_s) y luego se verifica.</text>
</svg>
