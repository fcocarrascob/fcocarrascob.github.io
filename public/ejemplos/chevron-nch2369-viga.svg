<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="880" height="470" fill="#ffffff"/>
  <text x="440" y="25" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">El salto de catálogo: la viga que exige 8.6.6 hay que soldarla a medida</text>
  <text x="440" y="43" font-size="10" text-anchor="middle" fill="#666">Secciones a escala · escala 0,25 px/mm · línea de base común</text>

  <!-- base común de las tres secciones -->
  <line x1="60" y1="285" x2="820" y2="285" stroke="#c3d3e6" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ============ (a) H 400x200x109,5 — catálogo ============ -->
  <g>
    <!-- d=400 -> 100 px ; bf=200 -> 50 px ; tf=28 -> 7 px ; tw=8 -> 2 px -->
    <rect x="145" y="185" width="50" height="7" fill="#c0392b" opacity="0.75" stroke="#8a2f24" stroke-width="0.8"/>
    <rect x="169" y="192" width="2" height="86" fill="#c0392b" opacity="0.75" stroke="#8a2f24" stroke-width="0.5"/>
    <rect x="145" y="278" width="50" height="7" fill="#c0392b" opacity="0.75" stroke="#8a2f24" stroke-width="0.8"/>
    <line x1="128" y1="185" x2="128" y2="285" stroke="#555" stroke-width="0.8" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <text x="121" y="235" font-size="9" text-anchor="middle" fill="#555" transform="rotate(-90 121 235)">400</text>
  </g>
  <text x="170" y="72" font-size="11.5" text-anchor="middle" fill="#c0392b" font-weight="bold">(a) H 400×200×109,5</text>
  <text x="170" y="87" font-size="9.5" text-anchor="middle" fill="#666">el mayor del catálogo ICHA</text>
  <text x="170" y="99" font-size="9.5" text-anchor="middle" fill="#666">Tabla 2.1.1 — termina acá</text>
  <rect x="90" y="112" width="160" height="30" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="170" y="132" font-size="12.5" text-anchor="middle" fill="#c0392b" font-weight="bold">uso 2,20 — no cumple</text>
  <g font-size="9.5" fill="#444">
    <text x="170" y="308" text-anchor="middle">A = 139,5 cm²  ·  Z = 2 320 cm³</text>
    <text x="170" y="322" text-anchor="middle">r_y = 5,17 cm  ·  alas 28 / alma 8 mm</text>
  </g>

  <!-- ============ (b) H 700x300x179 — a medida ============ -->
  <g>
    <!-- d=700 -> 175 px ; bf=300 -> 75 px ; tf=25 -> 6.25 px ; tw=12 -> 3 px -->
    <rect x="402" y="110" width="75" height="6.25" fill="#2c7a4b" opacity="0.75" stroke="#1d5231" stroke-width="0.8"/>
    <rect x="438" y="116.25" width="3" height="162.5" fill="#2c7a4b" opacity="0.75" stroke="#1d5231" stroke-width="0.5"/>
    <rect x="402" y="278.75" width="75" height="6.25" fill="#2c7a4b" opacity="0.75" stroke="#1d5231" stroke-width="0.8"/>
    <line x1="385" y1="110" x2="385" y2="285" stroke="#555" stroke-width="0.8" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <text x="378" y="197" font-size="9" text-anchor="middle" fill="#555" transform="rotate(-90 378 197)">700</text>
  </g>
  <text x="440" y="72" font-size="11.5" text-anchor="middle" fill="#2c7a4b" font-weight="bold">(b) H 700×300×179</text>
  <text x="440" y="87" font-size="9.5" text-anchor="middle" fill="#666">soldada a medida</text>
  <rect x="360" y="96" width="160" height="0" fill="none"/>
  <g font-size="9.5" fill="#444">
    <text x="440" y="308" text-anchor="middle">A = 228,0 cm²  ·  Z = 6 330 cm³</text>
    <text x="440" y="322" text-anchor="middle">r_y = 7,03 cm  ·  alas 25 / alma 12 mm</text>
  </g>
  <rect x="360" y="330" width="160" height="26" rx="4" fill="#eaf6ef" stroke="#2c7a4b" stroke-width="1.2"/>
  <text x="440" y="348" font-size="12" text-anchor="middle" fill="#2c7a4b" font-weight="bold">uso 0,87 ✓</text>

  <!-- ============ (c) H 600x300x147 ============ -->
  <g>
    <!-- d=600 -> 150 px ; bf=300 -> 75 px ; tf=22 -> 5.5 px ; tw=10 -> 2.5 px -->
    <rect x="672" y="135" width="75" height="5.5" fill="#2c7a4b" opacity="0.6" stroke="#1d5231" stroke-width="0.8"/>
    <rect x="708" y="140.5" width="2.5" height="139" fill="#2c7a4b" opacity="0.6" stroke="#1d5231" stroke-width="0.5"/>
    <rect x="672" y="279.5" width="75" height="5.5" fill="#2c7a4b" opacity="0.6" stroke="#1d5231" stroke-width="0.8"/>
    <line x1="655" y1="135" x2="655" y2="285" stroke="#555" stroke-width="0.8" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <text x="648" y="210" font-size="9" text-anchor="middle" fill="#555" transform="rotate(-90 648 210)">600</text>
  </g>
  <text x="710" y="72" font-size="11.5" text-anchor="middle" fill="#2c7a4b" font-weight="bold">(c) H 600×300×147</text>
  <text x="710" y="87" font-size="9.5" text-anchor="middle" fill="#666">con la diagonal de cajón soldado</text>
  <text x="710" y="99" font-size="9.5" text-anchor="middle" fill="#666">que sí cumple λ_md</text>
  <g font-size="9.5" fill="#444">
    <text x="710" y="308" text-anchor="middle">A = 187,6 cm²  ·  Z = 4 588 cm³</text>
    <text x="710" y="322" text-anchor="middle">r_y = 7,27 cm  ·  alas 22 / alma 10 mm</text>
  </g>
  <rect x="630" y="330" width="160" height="26" rx="4" fill="#eaf6ef" stroke="#2c7a4b" stroke-width="1.2"/>
  <text x="710" y="348" font-size="12" text-anchor="middle" fill="#2c7a4b" font-weight="bold">uso 0,88 ✓</text>

  <!-- ============ barra de pesos ============ -->
  <text x="60" y="386" font-size="11" fill="#1a63a8" font-weight="bold">Peso de la viga (kgf/m)</text>
  <g>
    <rect x="200" y="376" width="110" height="13" fill="#c0392b" opacity="0.6"/>
    <text x="316" y="386" font-size="9.5" fill="#c0392b" font-weight="bold">110</text>
    <rect x="200" y="393" width="179" height="13" fill="#2c7a4b" opacity="0.75"/>
    <text x="385" y="403" font-size="9.5" fill="#2c7a4b" font-weight="bold">179   (+63 %)</text>
    <rect x="200" y="410" width="147" height="13" fill="#2c7a4b" opacity="0.5"/>
    <text x="353" y="420" font-size="9.5" fill="#2c7a4b" font-weight="bold">147   (+34 %)</text>
  </g>

  <!-- nota del acero total -->
  <rect x="500" y="372" width="340" height="54" rx="5" fill="#fff8e6" stroke="#c07a00" stroke-width="1.1"/>
  <text x="514" y="390" font-size="10" fill="#c07a00" font-weight="bold">Pero el acero TOTAL del paño va al revés</text>
  <text x="514" y="405" font-size="9.5" fill="#5a4a20">(b) 339 kg de diagonales + 1 432 de viga = 1 771 kg</text>
  <text x="514" y="418" font-size="9.5" fill="#5a4a20">(c) 675 kg de diagonales + 1 178 de viga = <tspan font-weight="bold">1 853 kg (+5 %)</tspan></text>

  <text x="440" y="450" font-size="9" text-anchor="middle" fill="#8a94a3">La diagonal que cumple λ_md no sale más barata: sale conforme. Aliviana la viga y se lo cobra en el propio arriostramiento.</text>
</svg>
