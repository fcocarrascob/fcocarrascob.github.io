<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="880" height="470" fill="#ffffff"/>
  <text x="440" y="25" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">No hay salto fuera del catálogo: hay salto de familia</text>
  <text x="440" y="43" font-size="10" text-anchor="middle" fill="#666">Las tres son secciones de la Tabla 2.1.1 del ICHA · a escala, 0,25 px/mm · línea de base común</text>

  <line x1="60" y1="270" x2="820" y2="270" stroke="#c3d3e6" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ============ (a) H 400x200x109,5 ============ -->
  <g>
    <!-- d=400 -> 100 px ; bf=200 -> 50 px ; tf=28 -> 7 px ; tw=8 -> 2 px -->
    <rect x="145" y="170" width="50" height="7" fill="#c0392b" opacity="0.75" stroke="#8a2f24" stroke-width="0.8"/>
    <rect x="169" y="177" width="2" height="86" fill="#c0392b" opacity="0.75" stroke="#8a2f24" stroke-width="0.5"/>
    <rect x="145" y="263" width="50" height="7" fill="#c0392b" opacity="0.75" stroke="#8a2f24" stroke-width="0.8"/>
    <line x1="128" y1="170" x2="128" y2="270" stroke="#555" stroke-width="0.8" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <text x="121" y="220" font-size="9" text-anchor="middle" fill="#555" transform="rotate(-90 121 220)">400</text>
  </g>
  <text x="170" y="72" font-size="11.5" text-anchor="middle" fill="#c0392b" font-weight="bold">(a) H 400×200×109,5</text>
  <text x="170" y="87" font-size="9.5" text-anchor="middle" fill="#666">la que sugiere el modelo elástico</text>
  <rect x="90" y="98" width="160" height="30" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="170" y="118" font-size="12.5" text-anchor="middle" fill="#c0392b" font-weight="bold">uso 1,57 — no cumple</text>
  <g font-size="9.5" fill="#444">
    <text x="170" y="292" text-anchor="middle">A = 139,5 cm²  ·  Z = 2 320 cm³</text>
    <text x="170" y="306" text-anchor="middle">r_y = 5,17 cm  ·  h/t_w = 43,0</text>
  </g>

  <!-- ============ (b) H 600x300x129,4 ============ -->
  <g>
    <!-- d=600 -> 150 px ; bf=300 -> 75 px ; tf=20 -> 5 px ; tw=8 -> 2 px -->
    <rect x="402" y="120" width="75" height="5" fill="#2c7a4b" opacity="0.55" stroke="#1d5231" stroke-width="0.8"/>
    <rect x="438" y="125" width="2" height="140" fill="#2c7a4b" opacity="0.55" stroke="#1d5231" stroke-width="0.5"/>
    <rect x="402" y="265" width="75" height="5" fill="#2c7a4b" opacity="0.55" stroke="#1d5231" stroke-width="0.8"/>
    <line x1="385" y1="120" x2="385" y2="270" stroke="#555" stroke-width="0.8" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <text x="378" y="195" font-size="9" text-anchor="middle" fill="#555" transform="rotate(-90 378 195)">600</text>
  </g>
  <text x="440" y="72" font-size="11.5" text-anchor="middle" fill="#2c7a4b" font-weight="bold">(b) H 600×300×129,4</text>
  <text x="440" y="85" font-size="9.5" text-anchor="middle" fill="#666">la más liviana que cumple</text>
  <rect x="360" y="90" width="160" height="24" rx="4" fill="#eaf6ef" stroke="#2c7a4b" stroke-width="1" opacity="0.9"/>
  <text x="440" y="107" font-size="12" text-anchor="middle" fill="#2c7a4b" font-weight="bold">uso 0,99</text>
  <g font-size="9.5" fill="#444">
    <text x="440" y="292" text-anchor="middle">A = 164,8 cm²  ·  Z = 4 107 cm³</text>
    <text x="440" y="306" text-anchor="middle">r_y = 7,39 cm  ·  h/t_w = 70,0</text>
  </g>

  <!-- ============ (c) H 600x300x138,5 — adoptada ============ -->
  <g>
    <!-- tf=22 -> 5.5 px -->
    <rect x="672" y="120" width="75" height="5.5" fill="#2c7a4b" opacity="0.8" stroke="#1d5231" stroke-width="0.8"/>
    <rect x="708" y="125.5" width="2" height="139" fill="#2c7a4b" opacity="0.8" stroke="#1d5231" stroke-width="0.5"/>
    <rect x="672" y="264.5" width="75" height="5.5" fill="#2c7a4b" opacity="0.8" stroke="#1d5231" stroke-width="0.8"/>
    <line x1="655" y1="120" x2="655" y2="270" stroke="#555" stroke-width="0.8" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <text x="648" y="195" font-size="9" text-anchor="middle" fill="#555" transform="rotate(-90 648 195)">600</text>
  </g>
  <text x="710" y="72" font-size="11.5" text-anchor="middle" fill="#2c7a4b" font-weight="bold">(c) H 600×300×138,5</text>
  <text x="710" y="85" font-size="9.5" text-anchor="middle" fill="#666">la que se adopta</text>
  <rect x="630" y="90" width="160" height="24" rx="4" fill="#eaf6ef" stroke="#2c7a4b" stroke-width="1.4"/>
  <text x="710" y="107" font-size="12" text-anchor="middle" fill="#2c7a4b" font-weight="bold">uso 0,92 ✓</text>
  <g font-size="9.5" fill="#444">
    <text x="710" y="292" text-anchor="middle">A = 176,5 cm²  ·  Z = 4 433 cm³</text>
    <text x="710" y="306" text-anchor="middle">r_y = 7,49 cm  ·  h/t_w = 69,5</text>
  </g>

  <!-- ============ barra de pesos ============ -->
  <text x="60" y="342" font-size="11" fill="#1a63a8" font-weight="bold">Peso de la viga (kgf/m)</text>
  <g>
    <rect x="215" y="332" width="110" height="13" fill="#c0392b" opacity="0.55"/>
    <text x="331" y="342" font-size="9.5" fill="#c0392b" font-weight="bold">109,5</text>
    <rect x="215" y="349" width="129" height="13" fill="#2c7a4b" opacity="0.55"/>
    <text x="350" y="359" font-size="9.5" fill="#2c7a4b" font-weight="bold">129,4   (+18 %)</text>
    <rect x="215" y="366" width="139" height="13" fill="#2c7a4b" opacity="0.8"/>
    <text x="360" y="376" font-size="9.5" fill="#2c7a4b" font-weight="bold">138,5   (+26 %)</text>
  </g>

  <!-- nota del alma no compacta -->
  <rect x="470" y="326" width="370" height="60" rx="5" fill="#fff8e6" stroke="#c07a00" stroke-width="1.1"/>
  <text x="484" y="344" font-size="10" fill="#c07a00" font-weight="bold">Las tres tienen el alma de 8 mm, y bajo el axial no es compacta</text>
  <text x="484" y="359" font-size="9.5" fill="#5a4a20">h/t_w = 69,5 &gt; λ_pw = 1,12√(E/F_y)(2,33 − C_a) = 65,1</text>
  <text x="484" y="372" font-size="9.5" fill="#5a4a20">→ M_n por la Sec. F4 con R_pc = 1,088, no como M_p</text>

  <text x="440" y="410" font-size="9" text-anchor="middle" fill="#8a94a3">La Tabla 2.1.1 del ICHA tiene 52 familias, de H 1100×600 a H 200×100: la viga que exige 8.6.6 existe.</text>
  <text x="440" y="424" font-size="9" text-anchor="middle" fill="#8a94a3">Lo que hay que hacer no es soldarla a medida, sino subir de familia — y pagar un 26 % de peso.</text>
</svg>
