<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="pa-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="840" height="440" fill="#ffffff"/>
  <text x="420" y="26" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">La capacidad del perno depende del espesor de la placa: la curva de la palanca</text>

  <!-- zona que se lleva la palanca -->
  <path d="M90,281.9 L129.2,252.0 L168.3,218.0 L187.9,199.5 L207.5,180.0 L225.1,161.6 L227.1,160.3
           L246.7,155.5 L266.3,150.5 L285.8,145.3 L325.1,134.1 L364.2,122.1 L403.4,109.1 L425.7,101.4
           L425.7,101.4 L90,101.4 z" fill="#fdf0e6" opacity="0.85"/>

  <!-- ejes -->
  <line x1="90" y1="380" x2="580" y2="380" stroke="#333" stroke-width="1.2"/>
  <line x1="90" y1="70" x2="90" y2="380" stroke="#333" stroke-width="1.2"/>
  <text x="335" y="412" font-size="11.5" text-anchor="middle" fill="#333">espesor de la placa de extremo t_p (mm)</text>
  <text x="30" y="225" font-size="11.5" fill="#333" transform="rotate(-90 30 225)" text-anchor="middle">tracción disponible por perno (tonf)</text>

  <!-- grilla y ticks x -->
  <g font-size="10" fill="#555" text-anchor="middle">
    <line x1="90" y1="380" x2="90" y2="385" stroke="#555"/><text x="90" y="398">14</text>
    <line x1="168.3" y1="380" x2="168.3" y2="385" stroke="#555"/><text x="168.3" y="398">18</text>
    <line x1="246.7" y1="380" x2="246.7" y2="385" stroke="#555"/><text x="246.7" y="398">22</text>
    <line x1="325.1" y1="380" x2="325.1" y2="385" stroke="#555"/><text x="325.1" y="398">26</text>
    <line x1="403.4" y1="380" x2="403.4" y2="385" stroke="#555"/><text x="403.4" y="398">30</text>
    <line x1="481.8" y1="380" x2="481.8" y2="385" stroke="#555"/><text x="481.8" y="398">34</text>
    <line x1="560" y1="380" x2="560" y2="385" stroke="#555"/><text x="560" y="398">38</text>
  </g>
  <g font-size="10" fill="#555" text-anchor="end">
    <line x1="85" y1="380" x2="90" y2="380" stroke="#555"/><text x="80" y="384">0</text>
    <line x1="85" y1="328.3" x2="90" y2="328.3" stroke="#555"/><text x="80" y="332">5</text>
    <line x1="85" y1="276.7" x2="90" y2="276.7" stroke="#555"/><text x="80" y="280">10</text>
    <line x1="85" y1="225" x2="90" y2="225" stroke="#555"/><text x="80" y="229">15</text>
    <line x1="85" y1="173.3" x2="90" y2="173.3" stroke="#555"/><text x="80" y="177">20</text>
    <line x1="85" y1="121.7" x2="90" y2="121.7" stroke="#555"/><text x="80" y="125">25</text>
    <line x1="85" y1="70" x2="90" y2="70" stroke="#555"/><text x="80" y="74">30</text>
  </g>

  <!-- meseta B = 27.0 -->
  <line x1="90" y1="101.4" x2="580" y2="101.4" stroke="#1f6f4a" stroke-width="1.2" stroke-dasharray="7 4"/>
  <text x="96" y="95" font-size="10.5" fill="#1f6f4a" font-weight="bold">B = φr_n = 27.0 tonf  (perno sin palanca, Ec. J3-1)</text>

  <!-- demanda -->
  <line x1="90" y1="193.2" x2="580" y2="193.2" stroke="#c0392b" stroke-width="1.6"/>
  <text x="576" y="188" font-size="10.5" fill="#c0392b" text-anchor="end" font-weight="bold">demanda T/4 = 18.1 tonf</text>

  <!-- espesor critico -->
  <line x1="425.7" y1="101.4" x2="425.7" y2="380" stroke="#666" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="431" y="372" font-size="10.5" fill="#444" font-weight="bold">t_c = 31.1 mm</text>
  <text x="431" y="358" font-size="9.5" fill="#666">la palanca desaparece</text>

  <!-- espesor minimo -->
  <line x1="194.4" y1="193.2" x2="194.4" y2="380" stroke="#c0392b" stroke-width="0.9" stroke-dasharray="3 3"/>
  <text x="199" y="372" font-size="10" fill="#c0392b">t_p mín ≈ 19.3 mm</text>

  <!-- curva -->
  <polyline points="90,281.9 129.2,252.0 168.3,218.0 187.9,199.5 207.5,180.0 225.1,161.6 227.1,160.3 246.7,155.5 266.3,150.5 285.8,145.3 325.1,134.1 364.2,122.1 403.4,109.1 425.7,101.4 580,101.4"
            fill="none" stroke="#1f4e79" stroke-width="2.6"/>

  <!-- puntos marcados -->
  <g>
    <circle cx="168.3" cy="218.0" r="5.5" fill="#c0392b"/>
    <text x="146" y="243" font-size="10.5" text-anchor="middle" fill="#c0392b" font-weight="bold">18 mm</text>
    <text x="146" y="258" font-size="10" text-anchor="middle" fill="#c0392b">15.7 · uso 1.15</text>

    <circle cx="246.7" cy="155.5" r="5.5" fill="#1f4e79"/>
    <text x="238" y="139" font-size="10.5" text-anchor="end" fill="#1f4e79" font-weight="bold">22 mm — elegido</text>
    <text x="238" y="126" font-size="10" text-anchor="end" fill="#1f4e79">21.7 · uso 0.83</text>

    <circle cx="305.4" cy="139.8" r="4.5" fill="#1f4e79"/>
    <text x="313" y="134" font-size="10" fill="#666">25 mm · 23.3 · 0.78</text>

    <circle cx="425.7" cy="101.4" r="5.5" fill="#1f6f4a"/>
  </g>

  <!-- leyenda -->
  <rect x="600" y="70" width="222" height="196" rx="6" fill="#f8fafc" stroke="#9bb0c6"/>
  <text x="614" y="90" font-size="11" fill="#222" font-weight="bold">Lo que dice la curva</text>
  <text x="614" y="110" font-size="10" fill="#333">El perno "vale" 27.0 tonf solo si la</text>
  <text x="614" y="123" font-size="10" fill="#333">placa llega a t_c = 31.1 mm.</text>
  <rect x="614" y="134" width="26" height="12" fill="#fdf0e6" stroke="#c07a00"/>
  <text x="648" y="144" font-size="10" fill="#333">se lo lleva la palanca</text>
  <text x="614" y="164" font-size="10" fill="#333">Con 18 mm la palanca se come el</text>
  <text x="614" y="177" font-size="10" fill="#333">42 % y la conexión falla; con 22 mm</text>
  <text x="614" y="190" font-size="10" fill="#333">queda al 0.83. Mismos pernos.</text>
  <text x="614" y="212" font-size="10" fill="#888">4 mm de plancha = pasar o no pasar.</text>
  <text x="614" y="236" font-size="9.5" fill="#888">Modelo T-stub, AISC Manual Parte 9</text>
  <text x="614" y="249" font-size="9.5" fill="#888">(J3.7 exige incluir la palanca).</text>

  <text x="600" y="300" font-size="10" fill="#555">La curva tiene dos tramos: mientras α' = 1</text>
  <text x="600" y="314" font-size="10" fill="#555">(placa muy delgada, palanca máxima) crece con</text>
  <text x="600" y="328" font-size="10" fill="#555">t_p²; pasado t_p ≈ 21 mm la palanca empieza a</text>
  <text x="600" y="342" font-size="10" fill="#555">ceder y la curva se aplana hacia B.</text>
</svg>
