<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="vr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c07a00"/>
    </marker>
  </defs>
  <rect width="840" height="470" fill="#ffffff"/>
  <text x="420" y="26" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">Grupo de anclajes en pedestal: la interacción tracción–corte gobierna</text>

  <!-- =============== PANEL A: planta + sección =============== -->
  <text x="40" y="52" font-size="11.5" fill="#1a63a8" font-weight="bold">Planta del pedestal (100 × 100 cm)</text>

  <!-- pedestal -->
  <rect x="150" y="72" width="120" height="120" fill="#f4f7fb" stroke="#333" stroke-width="1.6"/>
  <!-- área proyectada del grupo traccionado con h'_ef = 16.7 cm: 50 x 100 cm -->
  <rect x="150" y="72" width="60" height="120" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-dasharray="4 3" opacity="0.55"/>
  <text x="206" y="86" font-size="8.5" text-anchor="end" fill="#c0392b">A_Nc = 5 000 cm²</text>
  <!-- pernos -->
  <g stroke="#333" stroke-width="1.2">
    <circle cx="180" cy="102" r="5" fill="#c0392b"/>
    <circle cx="180" cy="162" r="5" fill="#c0392b"/>
    <circle cx="240" cy="102" r="5" fill="#dfe5ec"/>
    <circle cx="240" cy="162" r="5" fill="#dfe5ec"/>
  </g>
  <text x="180" y="62" font-size="9.5" text-anchor="middle" fill="#c0392b">fila traccionada (T = 4 tonf c/u)</text>

  <!-- corte V hacia borde x+ -->
  <line x1="275" y1="132" x2="315" y2="132" stroke="#c07a00" stroke-width="2.4" marker-end="url(#vr)"/>
  <text x="318" y="128" font-size="10.5" fill="#c07a00" font-weight="bold">V = 3.5 tonf</text>

  <!-- cotas -->
  <line x1="180" y1="205" x2="240" y2="205" stroke="#555" stroke-width="0.9" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="210" y="218" font-size="10" text-anchor="middle" fill="#555">s = 50</text>
  <line x1="150" y1="205" x2="180" y2="205" stroke="#555" stroke-width="0.9" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="146" y="209" font-size="10" text-anchor="end" fill="#555">c_a = 25</text>
  <line x1="150" y1="232" x2="270" y2="232" stroke="#555" stroke-width="0.9" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="210" y="245" font-size="10" text-anchor="middle" fill="#555">B₂ = 100 cm</text>

  <!-- sección: las dos superficies de falla -->
  <text x="40" y="278" font-size="11" fill="#1a63a8" font-weight="bold">Sección: 17.6.2.1.2 sube la superficie de falla hasta que su borde toca la cara</text>
  <!-- pedestal: 240 px = 100 cm (2,4 px/cm); se dibujan los 50 cm superiores -->
  <rect x="110" y="300" width="240" height="120" fill="#f8fafc" stroke="#333" stroke-width="1.2"/>
  <!-- superficie real (h_ef = 40 cm): su traza a la superficie cae fuera del pedestal -->
  <path d="M26,300 L170,396 L314,300" fill="none" stroke="#9aa7b4" stroke-width="1.1" stroke-dasharray="5 4"/>
  <path d="M26,300 L314,300" stroke="#9aa7b4" stroke-width="1.1" stroke-dasharray="5 4" fill="none"/>
  <!-- superficie que limita h_ef: su borde izquierdo cae justo en la cara -->
  <path d="M110,300 L230,300 L170,340 Z" fill="#eaf1fb" stroke="#1a63a8" stroke-width="1.4"/>
  <!-- perno -->
  <line x1="170" y1="292" x2="170" y2="396" stroke="#333" stroke-width="2.4"/>
  <rect x="162" y="392" width="16" height="9" fill="#333"/>
  <circle cx="110" cy="300" r="3.5" fill="#c0392b"/>
  <text x="118" y="295" font-size="9" fill="#c0392b">punto A</text>
  <!-- cotas -->
  <line x1="192" y1="300" x2="192" y2="396" stroke="#555" stroke-width="0.9" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="199" y="352" font-size="9.5" fill="#555">h_ef = 40 cm</text>
  <line x1="148" y1="300" x2="148" y2="340" stroke="#1a63a8" stroke-width="0.9" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="143" y="324" font-size="9.5" text-anchor="end" fill="#1a63a8">h'_ef = 16.7</text>
  <text x="180" y="414" font-size="8.5" fill="#333">tuerca hex. pesada · A_brg = 9.69 cm²</text>
  <!-- leyenda -->
  <path d="M42,436 L70,436" stroke="#1a63a8" stroke-width="1.4"/>
  <text x="76" y="440" font-size="9.5" fill="#333">superficie que limita h_ef: su borde cae justo en la cara, y eso fija h'_ef = 16.7 cm</text>
  <path d="M42,454 L70,454" stroke="#9aa7b4" stroke-width="1.1" stroke-dasharray="5 4"/>
  <text x="76" y="458" font-size="9.5" fill="#333">superficie real: pediría 1.5·h_ef = 60 cm de hormigón a cada lado y hay 25</text>

  <!-- =============== PANEL B: interacción + modos =============== -->
  <text x="430" y="52" font-size="11.5" fill="#1a63a8" font-weight="bold">Interacción tracción–corte (17.8.3, ley de potencia 5/3)</text>

  <!-- ejes -->
  <line x1="575" y1="235" x2="575" y2="70" stroke="#333" stroke-width="1"/>
  <line x1="575" y1="235" x2="775" y2="235" stroke="#333" stroke-width="1"/>
  <text x="775" y="269" font-size="10" text-anchor="end" fill="#333">N / φN_n,cg</text>
  <text x="568" y="74" font-size="10" text-anchor="end" fill="#333">V / φV_n,cg</text>

  <!-- region segura: (N/φN)^(5/3) + (V/φV)^(5/3) <= 1 -->
  <path d="M575,235 L575,95 L590,97 L605,101 L620,107 L635,114 L650,123 L665,135 L680,149 L695,166 L710,188 L718,204 L725,235 Z"
        fill="#eef7ee" stroke="#1c7c3c" stroke-width="1.6"/>
  <text x="606" y="212" font-size="10" fill="#1c7c3c">seguro</text>

  <!-- regla anterior (318-19), como referencia -->
  <line x1="575" y1="67" x2="755" y2="235" stroke="#999" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="770" y="205" font-size="8.5" text-anchor="end" fill="#999">regla 318-19: N/φN + V/φV ≤ 1.2</text>

  <!-- ecuacion de la curva -->
  <text x="598" y="86" font-size="9.5" fill="#1c7c3c">(N/φN)<tspan font-size="7" dy="-4">5/3</tspan><tspan dy="4"> + (V/φV)</tspan><tspan font-size="7" dy="-4">5/3</tspan><tspan dy="4"> = 1</tspan></text>

  <!-- marcas 1.0 -->
  <line x1="725" y1="233" x2="725" y2="239" stroke="#888"/>
  <text x="725" y="251" font-size="8" text-anchor="middle" fill="#888">1.0</text>
  <text x="571" y="251" font-size="8" text-anchor="middle" fill="#888">0</text>
  <line x1="571" y1="95" x2="579" y2="95" stroke="#888"/>
  <text x="566" y="99" font-size="8" text-anchor="end" fill="#888">1.0</text>

  <!-- punto (0.52, 0.55): 150 px y 140 px por unidad -->
  <circle cx="652.5" cy="157.4" r="4.5" fill="#c0392b"/>
  <line x1="575" y1="157.4" x2="652.5" y2="157.4" stroke="#c0392b" stroke-width="0.7" stroke-dasharray="3 2"/>
  <line x1="652.5" y1="235" x2="652.5" y2="157.4" stroke="#c0392b" stroke-width="0.7" stroke-dasharray="3 2"/>
  <text x="662" y="150" font-size="10" fill="#c0392b" font-weight="bold">(0.52, 0.55)</text>
  <text x="662" y="163" font-size="9.5" fill="#c0392b">0.33 + 0.37 = 0.71 ≤ 1 ✓</text>

  <!-- lista de modos -->
  <text x="430" y="292" font-size="11.5" fill="#1a63a8" font-weight="bold">Modos verificados (φ·Ψa = 0.75×0.95, hormigón fisurado)</text>
  <g font-size="10.5">
    <text x="436" y="315" fill="#333">Breakout tracción (17.6.2)</text><text x="806" y="315" text-anchor="end" fill="#c0392b" font-weight="bold">dem 8.0 / 15.48 tonf → 0.52 ◄</text>
    <text x="436" y="336" fill="#333">Pullout (17.6.3)</text><text x="806" y="336" text-anchor="end" fill="#555">dem 4.0 / 13.80 tonf → 0.29</text>
    <text x="436" y="357" fill="#333">Side-face blowout (17.6.4)</text><text x="806" y="357" text-anchor="end" fill="#555">no aplica (h_ef &lt; 2.5·c_a1 = 62.5 cm)</text>
    <text x="436" y="378" fill="#333">Breakout de corte (17.7.2)</text><text x="806" y="378" text-anchor="end" fill="#c07a00" font-weight="bold">dem 3.5 / 6.31 tonf → 0.55 ◄</text>
    <text x="436" y="399" fill="#333">Pryout (17.7.3)</text><text x="806" y="399" text-anchor="end" fill="#555">dem 3.5 / 61.9 tonf → 0.06</text>
    <text x="436" y="420" fill="#333">Acero del perno (17.8.4, ζ = 2)</text><text x="806" y="420" text-anchor="end" fill="#555">0.11 ≤ 1</text>
    <text x="436" y="441" fill="#c0392b" font-weight="bold">Interacción N–V (17.8.3)</text><text x="806" y="441" text-anchor="end" fill="#c0392b" font-weight="bold">0.71 ≤ 1 → gobierna</text>
  </g>
</svg>
