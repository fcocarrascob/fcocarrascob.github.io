<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="tr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="vr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c07a00"/>
    </marker>
  </defs>
  <rect width="860" height="470" fill="#ffffff"/>
  <text x="430" y="25" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">Los dos niveles de carga de NCh2369: amplificar el sismo 2,80 multiplica la tracción del perno por 5,00</text>

  <!-- ============ PANEL A ============ -->
  <text x="45" y="55" font-size="12" fill="#2c7a4b" font-weight="bold">A · E sin amplificar — el nivel del FUSIBLE (8.5.2 vía a)</text>
  <text x="45" y="71" font-size="10" fill="#666">Combinación 0,9D + SA + E · es el nivel al que trabajaba el ejemplo de ACI</text>

  <!-- acciones -->
  <text x="112" y="98" font-size="10.5" fill="#333">P = +4,00 tonf (compresión)</text>
  <text x="112" y="113" font-size="10.5" fill="#333">M = 5,55 tonf·m</text>
  <line x1="255" y1="110" x2="300" y2="110" stroke="#c07a00" stroke-width="2.2" marker-end="url(#vr)"/>
  <text x="308" y="114" font-size="10.5" fill="#c07a00" font-weight="bold">V = 3,50 tonf</text>

  <!-- placa base -->
  <rect x="60" y="140" width="300" height="10" fill="#dfe5ec" stroke="#333" stroke-width="1.4"/>
  <text x="210" y="134" font-size="9.5" text-anchor="middle" fill="#555">placa base 60 × 60 cm</text>
  <!-- hormigón -->
  <rect x="40" y="150" width="340" height="70" fill="#f4f7fb" stroke="#333" stroke-width="1.4"/>
  <text x="300" y="214" font-size="9" text-anchor="end" fill="#8a94a3">pedestal</text>

  <!-- bloque de aplastamiento (derecha) -->
  <rect x="336" y="150" width="24" height="26" fill="#1a63a8" opacity="0.75"/>
  <text x="348" y="192" font-size="9.5" text-anchor="middle" fill="#1a63a8" font-weight="bold">C = 12,00</text>
  <text x="348" y="204" font-size="8.5" text-anchor="middle" fill="#1a63a8">Y = 0,87 cm</text>

  <!-- perno traccionado -->
  <line x1="85" y1="212" x2="85" y2="88" stroke="#c0392b" stroke-width="3" marker-end="url(#tr)"/>
  <circle cx="85" cy="212" r="4.5" fill="#c0392b"/>
  <text x="95" y="176" font-size="11" fill="#c0392b" font-weight="bold">T = 8,00 tonf</text>
  <text x="95" y="190" font-size="9.5" fill="#c0392b">(2 pernos)</text>

  <!-- resultado -->
  <rect x="45" y="238" width="320" height="34" rx="4" fill="#eaf6ef" stroke="#2c7a4b" stroke-width="1.2"/>
  <text x="205" y="260" font-size="12.5" text-anchor="middle" fill="#2c7a4b" font-weight="bold">T = 4,00 tonf / perno   →   uso 0,26 sobre φN_sa</text>

  <!-- ============ PANEL B ============ -->
  <text x="470" y="55" font-size="12" fill="#c0392b" font-weight="bold">B · E × 0,7R₁ = 2,80 — el nivel de TODO LO DEMÁS (8.5.3, 9.5.2)</text>
  <text x="470" y="71" font-size="10" fill="#666">Llave de corte, hormigón del pedestal y columna de acero</text>

  <text x="537" y="98" font-size="10.5" fill="#333">P = −21,20 tonf (levantamiento neto)</text>
  <text x="537" y="113" font-size="10.5" fill="#333">M = 15,54 tonf·m</text>
  <line x1="700" y1="128" x2="762" y2="128" stroke="#c07a00" stroke-width="3" marker-end="url(#vr)"/>
  <text x="695" y="132" font-size="10.5" text-anchor="end" fill="#c07a00" font-weight="bold">V = 9,80 tonf</text>

  <rect x="485" y="140" width="300" height="10" fill="#dfe5ec" stroke="#333" stroke-width="1.4"/>
  <rect x="465" y="150" width="340" height="70" fill="#f4f7fb" stroke="#333" stroke-width="1.4"/>

  <rect x="757" y="150" width="28" height="34" fill="#1a63a8" opacity="0.75"/>
  <text x="771" y="200" font-size="9.5" text-anchor="middle" fill="#1a63a8" font-weight="bold">C = 18,85</text>
  <text x="771" y="212" font-size="8.5" text-anchor="middle" fill="#1a63a8">Y = 1,37 cm</text>

  <line x1="510" y1="212" x2="510" y2="80" stroke="#c0392b" stroke-width="6" marker-end="url(#tr)"/>
  <circle cx="510" cy="212" r="5.5" fill="#c0392b"/>
  <text x="522" y="168" font-size="11.5" fill="#c0392b" font-weight="bold">T = 40,05 tonf</text>
  <text x="522" y="182" font-size="9.5" fill="#c0392b">(2 pernos)</text>

  <rect x="470" y="238" width="320" height="34" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="630" y="260" font-size="12.5" text-anchor="middle" fill="#c0392b" font-weight="bold">T = 20,03 tonf / perno   →   uso 1,30 — no cumple</text>

  <!-- ============ flecha de amplificación ============ -->
  <line x1="385" y1="255" x2="455" y2="255" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="420" y="248" font-size="10" text-anchor="middle" fill="#555" font-weight="bold">× 2,80</text>

  <!-- ============ explicación del efecto no lineal ============ -->
  <rect x="45" y="292" width="770" height="70" rx="5" fill="#fff8e6" stroke="#c07a00" stroke-width="1.2"/>
  <text x="60" y="313" font-size="11.5" fill="#c07a00" font-weight="bold">Por qué 2,80 se convierte en 5,00</text>
  <text x="60" y="331" font-size="10.5" fill="#5a4a20">El perno no toma la carga: toma el <tspan font-weight="bold">desbalance</tspan> entre el momento que vuelca y el peso que estabiliza. Al amplificar</text>
  <text x="60" y="347" font-size="10.5" fill="#5a4a20">solo el estado sísmico, el peso se queda quieto (0,9D no cambia) y todo el incremento se lo lleva la fila traccionada.</text>

  <!-- ============ mapa de niveles ============ -->
  <text x="45" y="390" font-size="11.5" fill="#1a63a8" font-weight="bold">A qué nivel se diseña cada pieza</text>
  <g font-size="10">
    <rect x="45" y="400" width="185" height="46" rx="4" fill="#eaf6ef" stroke="#2c7a4b" stroke-width="1"/>
    <text x="137" y="418" font-size="10.5" text-anchor="middle" fill="#2c7a4b" font-weight="bold">Perno de anclaje</text>
    <text x="137" y="434" text-anchor="middle" fill="#2c7a4b">E sin amplificar · 8.5.2 (a)</text>

    <rect x="240" y="400" width="185" height="46" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
    <text x="332" y="418" font-size="10.5" text-anchor="middle" fill="#c0392b" font-weight="bold">Llave de corte</text>
    <text x="332" y="434" text-anchor="middle" fill="#c0392b">E × 0,7R₁ · 8.5.3</text>

    <rect x="435" y="400" width="185" height="46" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
    <text x="527" y="418" font-size="10.5" text-anchor="middle" fill="#c0392b" font-weight="bold">Hormigón del pedestal</text>
    <text x="527" y="434" text-anchor="middle" fill="#c0392b">E × 0,7R₁ · 8.5.5 → 9.5.2</text>

    <rect x="630" y="400" width="185" height="46" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
    <text x="722" y="418" font-size="10.5" text-anchor="middle" fill="#c0392b" font-weight="bold">Columna de acero</text>
    <text x="722" y="434" text-anchor="middle" fill="#c0392b">E × 0,7R₁ · 8.3.4</text>
  </g>

  <text x="430" y="462" font-size="8.5" text-anchor="middle" fill="#8a94a3">Bloques de aplastamiento dibujados fuera de escala para hacerlos visibles; sus longitudes reales Y están acotadas.</text>
</svg>
