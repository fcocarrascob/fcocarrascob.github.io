<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="840" height="400" fill="#ffffff"/>
  <text x="420" y="26" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">Las seis verificaciones de la ménsula, por uso (demanda/capacidad)</text>

  <!-- escala: uso 1.0 = 400 px desde x=250 -->
  <line x1="250" y1="56" x2="250" y2="260" stroke="#333" stroke-width="1"/>
  <line x1="250" y1="260" x2="700" y2="260" stroke="#333" stroke-width="1"/>
  <line x1="650" y1="52" x2="650" y2="260" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="650" y="46" font-size="10" text-anchor="middle" fill="#c0392b" font-weight="bold">uso = 1.0</text>

  <!-- tirante 0.95 -->
  <rect x="250" y="64" width="380" height="18" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
  <text x="244" y="77" font-size="10" text-anchor="end" fill="#c0392b" font-weight="bold">Tirante 3Ø16 (con N_uc)</text>
  <text x="636" y="77" font-size="9.5" fill="#c0392b" font-weight="bold">0.95 ◄ gobierna (dúctil)</text>
  <!-- puntal 0.86 -->
  <rect x="250" y="94" width="344" height="18" fill="#fff5e6" stroke="#c07a00" stroke-width="1.4"/>
  <text x="244" y="107" font-size="10" text-anchor="end" fill="#a56a00">Puntal diagonal (β_s = 0.75)</text>
  <text x="600" y="107" font-size="9.5" fill="#a56a00">0.86 — el respaldo frágil</text>
  <!-- nodo B 0.64 -->
  <rect x="250" y="124" width="256" height="18" fill="#eef7ee" stroke="#1c7c3c" stroke-width="1.2"/>
  <text x="244" y="137" font-size="10" text-anchor="end" fill="#4a5b6c">Nodo B (CCC)</text>
  <text x="512" y="137" font-size="9.5" fill="#1c7c3c">0.64</text>
  <!-- techo corte 0.47 -->
  <rect x="250" y="154" width="188" height="18" fill="#eef7ee" stroke="#1c7c3c" stroke-width="1.2"/>
  <text x="244" y="167" font-size="10" text-anchor="end" fill="#4a5b6c">Techo de corte (16.5.2.4)</text>
  <text x="444" y="167" font-size="9.5" fill="#1c7c3c">0.47</text>
  <!-- nodo A 0.44 -->
  <rect x="250" y="184" width="176" height="18" fill="#eef7ee" stroke="#1c7c3c" stroke-width="1.2"/>
  <text x="244" y="197" font-size="10" text-anchor="end" fill="#4a5b6c">Nodo A (CCT)</text>
  <text x="432" y="197" font-size="9.5" fill="#1c7c3c">0.44</text>
  <!-- aplastamiento 0.41 -->
  <rect x="250" y="214" width="164" height="18" fill="#eef7ee" stroke="#1c7c3c" stroke-width="1.2"/>
  <text x="244" y="227" font-size="10" text-anchor="end" fill="#4a5b6c">Aplastamiento placa (φ = 0.65)</text>
  <text x="420" y="227" font-size="9.5" fill="#1c7c3c">0.41</text>

  <!-- eje marcas -->
  <text x="250" y="274" font-size="9" text-anchor="middle" fill="#888">0</text>
  <line x1="450" y1="260" x2="450" y2="264" stroke="#888"/>
  <text x="450" y="274" font-size="9" text-anchor="middle" fill="#888">0.5</text>

  <!-- etiqueta lateral -->
  <text x="60" y="80" font-size="10.5" fill="#5a6b7c" font-weight="bold">jerarquía:</text>
  <text x="60" y="98" font-size="9.5" fill="#5a6b7c">acero dúctil</text>
  <text x="60" y="112" font-size="9.5" fill="#5a6b7c">por delante del</text>
  <text x="60" y="126" font-size="9.5" fill="#5a6b7c">hormigón frágil</text>

  <!-- caja tesis -->
  <rect x="250" y="292" width="570" height="94" rx="6" fill="#f4f7fb" stroke="#1a63a8"/>
  <text x="264" y="312" font-size="11.5" fill="#222" font-weight="bold">La jerarquía correcta — y la carga que nadie calcula</text>
  <text x="264" y="331" font-size="10.5" fill="#333">Gobierna el tirante (avisa fluyendo) y el puntal queda detrás: el diseño por</text>
  <text x="264" y="347" font-size="10.5" fill="#333">puntal-tensor busca exactamente ese orden. De las 18.0 tonf del tirante,</text>
  <text x="264" y="363" font-size="10.5" fill="#c0392b" font-weight="bold">6.4 tonf (un tercio) las pone N_uc = 0.2·V_u con su palanca — olvidarla deja el acero 35 % corto.</text>
  <text x="264" y="380" font-size="9.5" fill="#888">El cierre del diseño es el detalle: horquilla o barra soldada bajo la placa (16.5.6.3).</text>
</svg>
