<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 450" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="es-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="es-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="es-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6f4a"/>
    </marker>
  </defs>
  <rect width="840" height="450" fill="#ffffff"/>
  <text x="420" y="26" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">Empalme apernado: el momento va a las alas como un par, el corte al alma</text>

  <!-- viga -->
  <rect x="60" y="140" width="560" height="10" fill="#9bb0c6" stroke="#333" stroke-width="1"/>
  <rect x="60" y="290" width="560" height="10" fill="#9bb0c6" stroke="#333" stroke-width="1"/>
  <rect x="60" y="150" width="560" height="140" fill="#f4f7fa" stroke="#c8d2dd" stroke-width="1"/>
  <text x="164" y="262" font-size="11" fill="#7a8ba0">viga W460×74</text>

  <!-- junta -->
  <line x1="340" y1="132" x2="340" y2="308" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="8 4"/>
  <text x="340" y="126" font-size="10.5" text-anchor="middle" fill="#c0392b" font-weight="bold">junta</text>

  <!-- cubreplacas de ala -->
  <rect x="200" y="128" width="280" height="12" fill="#eef2f7" stroke="#333" stroke-width="1.5"/>
  <rect x="200" y="300" width="280" height="12" fill="#eef2f7" stroke="#333" stroke-width="1.5"/>
  <text x="196" y="122" font-size="10.5" text-anchor="end" fill="#333">cubreplaca PL 190×14 (A36)</text>
  <text x="500" y="310" font-size="10.5" fill="#333">cubreplaca PL 190×14</text>

  <!-- planchas de alma -->
  <rect x="248" y="155" width="184" height="130" fill="#eef2f7" stroke="#333" stroke-width="1.5"/>
  <text x="340" y="152" font-size="10" text-anchor="middle" fill="#333">2 PL 8×280 en el alma</text>

  <!-- pernos de ala -->
  <g fill="#333">
    <circle cx="222" cy="134" r="5"/><circle cx="252" cy="134" r="5"/><circle cx="282" cy="134" r="5"/><circle cx="312" cy="134" r="5"/>
    <circle cx="368" cy="134" r="5"/><circle cx="398" cy="134" r="5"/><circle cx="428" cy="134" r="5"/><circle cx="458" cy="134" r="5"/>
    <circle cx="222" cy="306" r="5"/><circle cx="252" cy="306" r="5"/><circle cx="282" cy="306" r="5"/><circle cx="312" cy="306" r="5"/>
    <circle cx="368" cy="306" r="5"/><circle cx="398" cy="306" r="5"/><circle cx="428" cy="306" r="5"/><circle cx="458" cy="306" r="5"/>
  </g>
  <text x="267" y="112" font-size="10" text-anchor="middle" fill="#333">8 Ø22 pretensados por lado</text>
  <text x="267" y="100" font-size="9.5" text-anchor="middle" fill="#666">(2 líneas × 4 filas)</text>

  <!-- pernos de alma -->
  <g fill="#333">
    <circle cx="304" cy="180" r="4.5"/><circle cx="304" cy="210" r="4.5"/><circle cx="304" cy="240" r="4.5"/><circle cx="304" cy="270" r="4.5"/>
    <circle cx="376" cy="180" r="4.5"/><circle cx="376" cy="210" r="4.5"/><circle cx="376" cy="240" r="4.5"/><circle cx="376" cy="270" r="4.5"/>
  </g>
  <line x1="340" y1="330" x2="376" y2="330" stroke="#555" stroke-width="0.8" marker-start="url(#es-a)" marker-end="url(#es-a)"/>
  <text x="358" y="344" font-size="9.5" text-anchor="middle" fill="#555">e = 45</text>

  <!-- fuerzas -->
  <line x1="500" y1="134" x2="600" y2="134" stroke="#c0392b" stroke-width="2.6" marker-end="url(#es-t)"/>
  <text x="550" y="118" font-size="11.5" text-anchor="middle" fill="#c0392b" font-weight="bold">T = 45.2 tonf</text>
  <line x1="180" y1="306" x2="80" y2="306" stroke="#1f6f4a" stroke-width="2.6" marker-end="url(#es-c)"/>
  <text x="130" y="326" font-size="11.5" text-anchor="middle" fill="#1f6f4a" font-weight="bold">C = 45.2 tonf</text>
  <line x1="452" y1="190" x2="452" y2="250" stroke="#1f4e79" stroke-width="2.4" marker-end="url(#es-t)"/>
  <text x="460" y="216" font-size="11" fill="#1f4e79" font-weight="bold">V_u = 12 tonf</text>

  <!-- brazo -->
  <line x1="150" y1="134" x2="150" y2="306" stroke="#555" stroke-width="0.8" marker-start="url(#es-a)" marker-end="url(#es-a)"/>
  <text x="142" y="216" font-size="10" text-anchor="end" fill="#555">d − t_f</text>
  <text x="142" y="229" font-size="10" text-anchor="end" fill="#555">= 442.5</text>

  <!-- caja del reparto -->
  <rect x="60" y="360" width="380" height="76" rx="6" fill="#f8fafc" stroke="#9bb0c6"/>
  <text x="74" y="380" font-size="11" fill="#222" font-weight="bold">El reparto: momento a las alas, corte al alma</text>
  <text x="74" y="399" font-size="10.5" fill="#333">Las dos alas aportan el 81 % de I_x → mandarles todo el M</text>
  <text x="74" y="414" font-size="10.5" fill="#333">es conservador. El 19 % del alma = 3.8 tonf·m (4.34 con V·e), y</text>
  <text x="74" y="429" font-size="10.5" fill="#333">las planchas del alma dan 7.14 tonf·m (uso 0.61): sirven igual.</text>

  <rect x="460" y="360" width="316" height="76" rx="6" fill="#fdf3f2" stroke="#c0392b"/>
  <text x="474" y="380" font-size="11" fill="#c0392b" font-weight="bold">La cubreplaca es más chica que el ala</text>
  <text x="474" y="399" font-size="10.5" fill="#333">A_g cubreplaca = 26.6 cm² &lt; A_f del ala = 27.55 cm²</text>
  <text x="474" y="414" font-size="10.5" fill="#333">y aun así pasa (uso 0.76): la demanda son 45.2 tonf,</text>
  <text x="474" y="429" font-size="10.5" fill="#333">no las 87 tonf que el ala podría desarrollar.</text>
</svg>
