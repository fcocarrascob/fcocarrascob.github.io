<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="840" height="400" fill="#ffffff"/>
  <text x="420" y="26" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">La misma sección, los dos signos del momento (escala 2.2 px/cm)</text>

  <!-- ===== Panel izquierdo: M+ ===== -->
  <text x="210" y="56" font-size="12" text-anchor="middle" fill="#1c7c3c" font-weight="bold">Momento positivo (vano): compresión arriba, en el ala</text>
  <!-- ala 172.5x12 -> 380x26 ; alma 30x48 -> 66x106 ; origen ala x=20,y=80 -->
  <g>
    <rect x="20" y="80" width="380" height="26" fill="#f2f4f6" stroke="#333" stroke-width="1.3"/>
    <rect x="177" y="106" width="66" height="106" fill="#f2f4f6" stroke="#333" stroke-width="1.3"/>
    <line x1="177" y1="106" x2="243" y2="106" stroke="#f2f4f6" stroke-width="2"/>
    <!-- bloque comprimido a=1.74 cm -> 4 px -->
    <rect x="20" y="80" width="380" height="4" fill="#c0392b"/>
    <!-- eje neutro c=2.05 -> 4.5 px -->
    <line x1="10" y1="84.5" x2="410" y2="84.5" stroke="#1a63a8" stroke-width="1.2" stroke-dasharray="5 3"/>
    <text x="414" y="88" font-size="9.5" fill="#1a63a8">EN: c = 2.1 cm (en el ala)</text>
    <text x="414" y="74" font-size="9.5" fill="#c0392b" font-weight="bold">a = 1.7 cm</text>
    <!-- acero 4o22 abajo -->
    <circle cx="192" cy="199" r="4.5" fill="#333"/>
    <circle cx="204" cy="199" r="4.5" fill="#333"/>
    <circle cx="216" cy="199" r="4.5" fill="#333"/>
    <circle cx="228" cy="199" r="4.5" fill="#333"/>
    <text x="210" y="230" font-size="10" text-anchor="middle" fill="#333" font-weight="bold">4Ø22 (15.2 cm²)</text>
    <text x="210" y="244" font-size="9.5" text-anchor="middle" fill="#1c7c3c" font-weight="bold">ε_t = 0.076 — dúctil con enorme margen</text>
  </g>
  <!-- cotas -->
  <line x1="20" y1="270" x2="400" y2="270" stroke="#888" stroke-width="1"/>
  <line x1="20" y1="266" x2="20" y2="274" stroke="#888"/>
  <line x1="400" y1="266" x2="400" y2="274" stroke="#888"/>
  <text x="210" y="284" font-size="9.5" text-anchor="middle" fill="#888">b = 172.5 cm efectivos (Tabla 6.3.2.1: ℓ_n/8 gobierna)</text>

  <!-- ===== Panel derecho: M- ===== -->
  <text x="630" y="56" font-size="12" text-anchor="middle" fill="#c0392b" font-weight="bold">Momento negativo (apoyo): compresión abajo, solo alma</text>
  <g>
    <rect x="440" y="80" width="380" height="26" fill="#f2f4f6" stroke="#333" stroke-width="1.3"/>
    <rect x="597" y="106" width="66" height="106" fill="#f2f4f6" stroke="#333" stroke-width="1.3"/>
    <line x1="597" y1="106" x2="663" y2="106" stroke="#f2f4f6" stroke-width="2"/>
    <!-- bloque comprimido abajo a=15 cm -> 33 px -->
    <rect x="597" y="179" width="66" height="33" fill="#c0392b"/>
    <!-- eje neutro c=17.7 desde abajo -> 39 px sobre fondo (y=212-39=173) -->
    <line x1="587" y1="173" x2="673" y2="173" stroke="#1a63a8" stroke-width="1.2" stroke-dasharray="5 3"/>
    <text x="679" y="177" font-size="9.5" fill="#1a63a8">EN: c = 17.7 cm</text>
    <text x="679" y="200" font-size="9.5" fill="#c0392b" font-weight="bold">a = 15.0 cm</text>
    <text x="679" y="213" font-size="9.5" fill="#c0392b">(¼ de la altura)</text>
    <!-- acero 6o22 arriba en franja de 57 cm (125 px) centrada en el alma -->
    <circle cx="568" cy="90" r="4.5" fill="#333"/>
    <circle cx="593" cy="90" r="4.5" fill="#333"/>
    <circle cx="618" cy="90" r="4.5" fill="#333"/>
    <circle cx="643" cy="90" r="4.5" fill="#333"/>
    <circle cx="668" cy="90" r="4.5" fill="#333"/>
    <circle cx="693" cy="90" r="4.5" fill="#333"/>
    <line x1="568" y1="76" x2="693" y2="76" stroke="#888" stroke-width="1"/>
    <text x="630" y="72" font-size="8.5" text-anchor="middle" fill="#888">57 cm (ℓ_n/10)</text>
    <text x="630" y="240" font-size="10" text-anchor="middle" fill="#333" font-weight="bold">6Ø22 (22.8 cm²) en 57 cm = ℓ_n/10 (24.3.4) + refuerzo en el resto del ala</text>
    <text x="630" y="254" font-size="9.5" text-anchor="middle" fill="#c07a00" font-weight="bold">ε_t = 0.0062 — φ = 0.90 justo</text>
  </g>
  <text x="630" y="284" font-size="9.5" text-anchor="middle" fill="#888">el ala está en tracción: no aporta compresión</text>

  <!-- caja tesis -->
  <rect x="120" y="306" width="600" height="80" rx="6" fill="#f4f7fb" stroke="#1a63a8"/>
  <text x="134" y="326" font-size="11.5" fill="#222" font-weight="bold">El ala manda solo cuando la compresión está de su lado</text>
  <text x="134" y="345" font-size="10.5" fill="#333">Mismo momento de 35 tonf·m: la cara positiva pediría 17.5 cm² y la negativa 19.5 cm²;</text>
  <text x="134" y="361" font-size="10.5" fill="#333">y en las secciones armadas, el brazo cae 12 % (46.5 vs 53.1 cm) y ε_t cae 12 veces.</text>
  <text x="134" y="378" font-size="9.5" fill="#888">Misma sección, dos vigas — y el diseño lo gobierna la cara sin ala (uso 0.87 vs 0.82).</text>
</svg>
