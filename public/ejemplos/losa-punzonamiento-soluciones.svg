<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" font-family="Segoe UI, Arial, sans-serif">
  <rect width="860" height="500" fill="#ffffff"/>
  <defs>
    <marker id="fm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b02a1a"/>
    </marker>
  </defs>
  <text x="430.0" y="24.0" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">Dos maneras de arreglarlo: engrosar toda la losa o engrosarla solo donde falla</text>
  <line x1="630" y1="50" x2="630" y2="216" stroke="#b02a1a" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="630.0" y="44.0" font-size="9" fill="#b02a1a" text-anchor="middle" font-weight="bold">uso = 1.00</text>
  <rect x="250" y="56" width="300.1" height="17" fill="#eef7ee" stroke="#2f7a4f" stroke-width="1.4"/>
  <text x="244.0" y="68.5" font-size="9.5" fill="#222" text-anchor="end">Solo carga vertical (sin M_sc)</text>
  <text x="556.1" y="68.5" font-size="9" fill="#2f7a4f" text-anchor="start">0.79</text>
  <rect x="250" y="82" width="438.1" height="17" fill="#fdecea" stroke="#b02a1a" stroke-width="1.4"/>
  <text x="244.0" y="94.5" font-size="9.5" fill="#222" text-anchor="end">h = 22 cm con M_sc</text>
  <text x="694.1" y="94.5" font-size="9" fill="#b02a1a" text-anchor="start" font-weight="bold">1.15</text>
  <text x="722.1" y="94.5" font-size="9" fill="#b02a1a" text-anchor="start" font-weight="bold">◄ no cumple</text>
  <rect x="250" y="108" width="390.7" height="17" fill="#fff5e6" stroke="#c07a00" stroke-width="1.4"/>
  <text x="244.0" y="120.5" font-size="9.5" fill="#222" text-anchor="end">h = 24 cm (toda la planta)</text>
  <text x="646.7" y="120.5" font-size="9" fill="#c07a00" text-anchor="start">1.03</text>
  <rect x="250" y="134" width="351.1" height="17" fill="#fff5e6" stroke="#c07a00" stroke-width="1.4"/>
  <text x="244.0" y="146.5" font-size="9.5" fill="#222" text-anchor="end">h = 26 cm (toda la planta)</text>
  <text x="607.1" y="146.5" font-size="9" fill="#c07a00" text-anchor="start" font-weight="bold">0.92</text>
  <text x="646.0" y="146.5" font-size="9" fill="#c07a00" text-anchor="start" font-weight="bold">primer espesor que cumple</text>
  <rect x="250" y="160" width="253.5" height="17" fill="#eef7ee" stroke="#2f7a4f" stroke-width="1.4"/>
  <text x="244.0" y="172.5" font-size="9.5" fill="#222" text-anchor="end">Ábaco: sección interior</text>
  <text x="509.5" y="172.5" font-size="9" fill="#2f7a4f" text-anchor="start">0.67</text>
  <rect x="250" y="186" width="110.3" height="17" fill="#eef7ee" stroke="#2f7a4f" stroke-width="1.4"/>
  <text x="244.0" y="198.5" font-size="9.5" fill="#222" text-anchor="end">Ábaco: sección exterior</text>
  <text x="366.3" y="198.5" font-size="9" fill="#2f7a4f" text-anchor="start">0.29</text>
  <line x1="250" y1="50" x2="250" y2="216" stroke="#333" stroke-width="1"/>
  <text x="40.0" y="238.0" font-size="11" fill="#222" text-anchor="start" font-weight="bold">En corte, y en hormigón:</text>
  <text x="46.0" y="272.0" font-size="10" fill="#b02a1a" text-anchor="start" font-weight="bold">h = 22 cm — falla</text>
  <rect x="46" y="296" width="200" height="57.2" fill="#dcd8d0" stroke="#8a857c" stroke-width="1"/>
  <text x="41.0" y="328.1" font-size="8.5" fill="#666" text-anchor="end">22</text>
  <rect x="139.5" y="353.2" width="13.0" height="60.8" fill="#8a857c"/>
  <text x="46.0" y="440.0" font-size="9.5" fill="#b02a1a" text-anchor="start" font-weight="bold">uso 1.15</text>
  <text x="330.0" y="272.0" font-size="10" fill="#c07a00" text-anchor="start" font-weight="bold">h = 26 cm en toda la planta</text>
  <rect x="330" y="296" width="200" height="67.6" fill="#dcd8d0" stroke="#8a857c" stroke-width="1"/>
  <text x="325.0" y="333.3" font-size="8.5" fill="#666" text-anchor="end">26</text>
  <rect x="423.5" y="363.6" width="13.0" height="50.4" fill="#8a857c"/>
  <text x="330.0" y="440.0" font-size="9.5" fill="#c07a00" text-anchor="start" font-weight="bold">uso 0.92   ·   +1.95 m³ por paño</text>
  <text x="614.0" y="272.0" font-size="10" fill="#2f7a4f" text-anchor="start" font-weight="bold">h = 22 cm + ábaco local</text>
  <rect x="614" y="296" width="200" height="57.2" fill="#dcd8d0" stroke="#8a857c" stroke-width="1"/>
  <text x="609.0" y="328.1" font-size="8.5" fill="#666" text-anchor="end">22</text>
  <rect x="681.5" y="353.2" width="65.0" height="26.0" fill="#dcd8d0" stroke="#8a857c" stroke-width="1"/>
  <text x="752.5" y="369.2" font-size="8.5" fill="#666" text-anchor="start">+10 cm en 2.50 × 2.50 m</text>
  <rect x="707.5" y="379.2" width="13.0" height="34.8" fill="#8a857c"/>
  <text x="614.0" y="440.0" font-size="9.5" fill="#2f7a4f" text-anchor="start" font-weight="bold">uso 0.67   ·   +0.62 m³ por columna</text>
  <text x="430.0" y="482.0" font-size="10.5" fill="#222" text-anchor="middle">El engrosado global gasta 3.1 veces más hormigón que el ábaco — y deja el uso en 0.92 contra 0.67.</text>
</svg>
