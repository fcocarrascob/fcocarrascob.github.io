<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 800" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="ld" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M5,10 L0,0 L10,0 z" fill="#5a6b7c"/>
    </marker>
  </defs>
  <rect width="880" height="800" fill="#ffffff"/>
  <text x="440" y="26" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">Viga de tubo, luz 8 m, w = 2.5 tonf/m → M_u = 20 tonf·m: acá el que diseña es el ancho de pared</text>

  <!-- ============ LA VIGA ============ -->
  <text x="40" y="62" font-size="11.5" fill="#222" font-weight="bold">La misma viga del ejemplo LTB, ahora en tubo</text>
  <g stroke="#5a6b7c" stroke-width="1">
    <line x1="80" y1="78" x2="80" y2="94" marker-end="url(#ld)"/><line x1="130" y1="78" x2="130" y2="94" marker-end="url(#ld)"/>
    <line x1="180" y1="78" x2="180" y2="94" marker-end="url(#ld)"/><line x1="230" y1="78" x2="230" y2="94" marker-end="url(#ld)"/>
    <line x1="280" y1="78" x2="280" y2="94" marker-end="url(#ld)"/><line x1="330" y1="78" x2="330" y2="94" marker-end="url(#ld)"/>
    <line x1="380" y1="78" x2="380" y2="94" marker-end="url(#ld)"/>
  </g>
  <text x="398" y="88" font-size="10" fill="#5a6b7c">w</text>
  <rect x="80" y="96" width="300" height="11" fill="#eef2f7" stroke="#333" stroke-width="1.4"/>
  <path d="M80,107 l-9,14 l18,0 z" fill="#fff" stroke="#333"/><path d="M380,107 l-9,14 l18,0 z" fill="#fff" stroke="#333"/>
  <line x1="80" y1="136" x2="380" y2="136" stroke="#555" stroke-width="0.8" marker-start="url(#ard)" marker-end="url(#ard)"/>
  <text x="230" y="151" font-size="10.5" text-anchor="middle" fill="#1c7c3c" font-weight="bold">L_b = L = 8 m ≤ L_p = 9.87 m</text>
  <text x="230" y="166" font-size="9.5" text-anchor="middle" fill="#888">sin arriostres intermedios · M_u = 20 tonf·m · V_u = 10 tonf</text>

  <!-- ============ CAJA: POR QUÉ NO HAY LTB ============ -->
  <rect x="430" y="48" width="430" height="126" rx="6" fill="#f4f7fb" stroke="#1a63a8"/>
  <text x="444" y="68" font-size="11.5" fill="#222" font-weight="bold">Por qué en el tubo cuadrado el LTB deja de mandar</text>
  <text x="444" y="88" font-size="10.5" fill="#333">• Sección cerrada: J = 251 veces el de la W460×74 del ejemplo hermano.</text>
  <text x="444" y="106" font-size="10.5" fill="#333">• Ec. F7-10: L_p = 9.87 m, más largo que el vano → F7.4(a): no aplica.</text>
  <text x="444" y="124" font-size="10.5" fill="#333">• Es 5.56 veces el L_p = 1.78 m de la W460×74, que fallaba por volcarse.</text>
  <text x="444" y="142" font-size="10.5" fill="#333">• Ec. F7-11: L_r = 253.3 m. Perder el 10 % de M_p pide L_b = 70.7 m.</text>
  <text x="444" y="163" font-size="10" fill="#888">El User Note de F7.4 lo dice en palabras: en sección cuadrada no ocurre.</text>

  <!-- ============ LAS CINCO SECCIONES, A ESCALA ============ -->
  <text x="40" y="200" font-size="11.5" fill="#222" font-weight="bold">Las cinco secciones a escala. El ala comprimida es la de arriba, y su λ = (B − 3t)/t decide la rama de F7.2</text>
  <line x1="40" y1="371" x2="700" y2="371" stroke="#ccc" stroke-width="1"/>

  <!-- A · □250×250×10 -->
  <text x="103" y="273.5" font-size="10" text-anchor="middle" fill="#1c7c3c" font-weight="bold">□250×250×10</text>
  <rect x="60" y="282.5" width="87.5" height="87.5" fill="#dff0d8" stroke="#1c7c3c" stroke-width="1.2"/>
  <rect x="63.255" y="285.755" width="80.99" height="80.99" fill="#ffffff" stroke="#1c7c3c" stroke-width="0.7"/>
  <text x="103" y="388" font-size="10" text-anchor="middle" fill="#333">λ = 23.88</text>
  <text x="103" y="402" font-size="10" text-anchor="middle" fill="#1c7c3c" font-weight="bold">compacta</text>
  <text x="103" y="416" font-size="9.5" text-anchor="middle" fill="#888">Ec. F7-1</text>
  <text x="103" y="430" font-size="9.5" text-anchor="middle" fill="#888">75.4 kg/m</text>

  <!-- B · □250×250×8 -->
  <text x="238" y="273.5" font-size="10" text-anchor="middle" fill="#c0392b" font-weight="bold">□250×250×8</text>
  <rect x="195" y="282.5" width="87.5" height="87.5" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <rect x="197.604" y="285.104" width="82.292" height="82.292" fill="#ffffff" stroke="#c0392b" stroke-width="0.7"/>
  <text x="238" y="388" font-size="10" text-anchor="middle" fill="#333">λ = 30.60</text>
  <text x="238" y="402" font-size="10" text-anchor="middle" fill="#c0392b" font-weight="bold">no compacta</text>
  <text x="238" y="416" font-size="9.5" text-anchor="middle" fill="#888">Ec. F7-2</text>
  <text x="238" y="430" font-size="9.5" text-anchor="middle" fill="#888">60.8 kg/m</text>

  <!-- C · □250×250×6 -->
  <text x="373" y="273.5" font-size="10" text-anchor="middle" fill="#c0392b" font-weight="bold">□250×250×6</text>
  <rect x="330" y="282.5" width="87.5" height="87.5" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <rect x="331.953" y="284.453" width="83.594" height="83.594" fill="#ffffff" stroke="#c0392b" stroke-width="0.7"/>
  <text x="373" y="388" font-size="10" text-anchor="middle" fill="#333">λ = 41.80</text>
  <text x="373" y="402" font-size="10" text-anchor="middle" fill="#c0392b" font-weight="bold">esbelta</text>
  <text x="373" y="416" font-size="9.5" text-anchor="middle" fill="#888">Ecs. F7-4 y F7-3</text>
  <text x="373" y="430" font-size="9.5" text-anchor="middle" fill="#888">46.0 kg/m</text>

  <!-- D · □300×200×6 -->
  <text x="505" y="256" font-size="10" text-anchor="middle" fill="#c0392b" font-weight="bold">□300×200×6</text>
  <rect x="470" y="265" width="70" height="105" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <rect x="471.953" y="266.953" width="66.094" height="101.094" fill="#ffffff" stroke="#c0392b" stroke-width="0.7"/>
  <text x="505" y="388" font-size="10" text-anchor="middle" fill="#333">λ = 32.84</text>
  <text x="505" y="402" font-size="10" text-anchor="middle" fill="#c0392b" font-weight="bold">no compacta</text>
  <text x="505" y="416" font-size="9.5" text-anchor="middle" fill="#888">Ec. F7-2</text>
  <text x="505" y="430" font-size="9.5" text-anchor="middle" fill="#888">46.0 kg/m</text>

  <!-- E · □400×200×6 -->
  <text x="635" y="221" font-size="10" text-anchor="middle" fill="#1c7c3c" font-weight="bold">□400×200×6</text>
  <rect x="600" y="230" width="70" height="140" fill="#dff0d8" stroke="#1c7c3c" stroke-width="1.2"/>
  <rect x="601.953" y="231.953" width="66.094" height="136.094" fill="#ffffff" stroke="#1c7c3c" stroke-width="0.7"/>
  <text x="635" y="388" font-size="10" text-anchor="middle" fill="#333">λ = 32.84</text>
  <text x="635" y="402" font-size="10" text-anchor="middle" fill="#1c7c3c" font-weight="bold">no compacta</text>
  <text x="635" y="416" font-size="9.5" text-anchor="middle" fill="#888">Ecs. F7-2 y F7-6</text>
  <text x="635" y="430" font-size="9.5" text-anchor="middle" fill="#888">55.4 kg/m</text>

  <text x="712" y="252" font-size="10" fill="#888">Los tres primeros son</text>
  <text x="712" y="266" font-size="10" fill="#888">el mismo contorno con</text>
  <text x="712" y="280" font-size="10" fill="#888">10, 8 y 6 mm de pared.</text>
  <text x="712" y="302" font-size="10" fill="#888">D tiene EXACTAMENTE</text>
  <text x="712" y="316" font-size="10" fill="#888">la misma área que C:</text>
  <text x="712" y="330" font-size="10" fill="#888">54.55 cm², repartida</text>
  <text x="712" y="344" font-size="10" fill="#888">de otra manera.</text>

  <!-- ============ DETALLE: EL ANCHO EFECTIVO DEL CASO C ============ -->
  <text x="40" y="466" font-size="11.5" fill="#222" font-weight="bold">Detalle · Ec. F7-4: qué parte del ala comprimida del □250×250×6 sigue trabajando</text>
  <rect x="60" y="480" width="466.52" height="24" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <rect x="60" y="480" width="201.475" height="24" fill="#dff0d8" stroke="#1c7c3c" stroke-width="1.2"/>
  <rect x="325.045" y="480" width="201.475" height="24" fill="#dff0d8" stroke="#1c7c3c" stroke-width="1.2"/>
  <text x="160.737" y="497" font-size="9.5" text-anchor="middle" fill="#1c7c3c">b_e/2 efectivo</text>
  <text x="293.26" y="497" font-size="9" text-anchor="middle" fill="#c0392b">3.179 cm</text>
  <text x="425.783" y="497" font-size="9.5" text-anchor="middle" fill="#1c7c3c">b_e/2 efectivo</text>
  <text x="60" y="521" font-size="10" fill="#888">ancho plano b = 23.33 cm (§B4.1b(d): B − 3t) → b_e = 20.15 cm, un 13.6 % menos.</text>
  <text x="60" y="536" font-size="10" fill="#888">Lo inefectivo es la franja del medio; las esquinas son el apoyo del elemento y siguen trabajando.</text>
  <text x="600" y="480" font-size="10" fill="#333">Al perder ala arriba, el</text>
  <text x="600" y="495" font-size="10" fill="#333">centroide baja 0.411 cm y la</text>
  <text x="600" y="510" font-size="10" fill="#333">fibra comprimida se aleja:</text>
  <text x="600" y="525" font-size="10" fill="#333">S_e = 399.7 cm³ contra los</text>
  <text x="600" y="540" font-size="10" fill="#333">S_x = 434.8 cm³ brutos, 8.06 % menos.</text>

  <!-- ============ BARRAS φM_n ============ -->
  <text x="40" y="574" font-size="11.5" fill="#222" font-weight="bold">φM_n contra M_u = 20 tonf·m — el contorno punteado es el φM_p que F7 no deja usar</text>
  <line x1="610" y1="584" x2="610" y2="702" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="610" y="718" font-size="10" text-anchor="middle" fill="#c0392b" font-weight="bold">M_u = 20</text>
  <line x1="250" y1="584" x2="250" y2="702" stroke="#333" stroke-width="1"/>

  <rect x="250" y="588" width="461.105" height="16" fill="none" stroke="#9bb0c6" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="250" y="588" width="461.105" height="16" fill="#dff0d8" stroke="#1c7c3c" stroke-width="1.3"/>
  <text x="245" y="600" font-size="10" text-anchor="end" fill="#333">A □250×250×10</text>
  <text x="855" y="600" font-size="10" text-anchor="end" fill="#1c7c3c" font-weight="bold">25.62 → uso 0.78 ✓</text>

  <rect x="250" y="611" width="374.538" height="16" fill="none" stroke="#9bb0c6" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="250" y="611" width="346.828" height="16" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
  <text x="245" y="623" font-size="10" text-anchor="end" fill="#333">B □250×250×8</text>
  <text x="855" y="623" font-size="10" text-anchor="end" fill="#c0392b" font-weight="bold">19.27 → uso 1.04 ✗</text>

  <rect x="250" y="634" width="285.189" height="16" fill="none" stroke="#9bb0c6" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="250" y="634" width="227.948" height="16" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/>
  <text x="245" y="646" font-size="10" text-anchor="end" fill="#333">C □250×250×6</text>
  <text x="855" y="646" font-size="10" text-anchor="end" fill="#c0392b" font-weight="bold">12.66 → uso 1.58 ✗</text>

  <rect x="250" y="657" width="320.098" height="16" fill="none" stroke="#9bb0c6" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="250" y="657" width="275.613" height="16" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/>
  <text x="245" y="669" font-size="10" text-anchor="end" fill="#333">D □300×200×6</text>
  <text x="855" y="669" font-size="10" text-anchor="end" fill="#c0392b" font-weight="bold">15.31 → uso 1.31 ✗</text>

  <rect x="250" y="680" width="491.553" height="16" fill="none" stroke="#9bb0c6" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="250" y="680" width="414.669" height="16" fill="#dff0d8" stroke="#1c7c3c" stroke-width="1.8"/>
  <text x="245" y="692" font-size="10" text-anchor="end" fill="#333">E □400×200×6</text>
  <text x="855" y="692" font-size="10" text-anchor="end" fill="#1c7c3c" font-weight="bold">23.04 → uso 0.87 ✓</text>

  <!-- =============== BANDA DE VALORES =============== -->
  <line x1="40" y1="732" x2="840" y2="732" stroke="#d5dbe2" stroke-width="1"/>
  <text x="40" y="750" font-size="11" fill="#333">Demanda M_u = 20 tonf·m y V_u = 10 tonf sobre 8 m · A500 Gr. C, pared de diseño 0.93·t_nominal (B4.2).</text>
  <text x="40" y="768" font-size="11" fill="#333">El LTB de F7.4 no gobierna en ninguna de las cinco: lo que decide es λ contra la Tabla B4.1b caso 17.</text>
  <text x="40" y="786" font-size="11" fill="#1c7c3c" font-weight="bold">Gobierna en □400×200×6: pandeo local del ala (Ec. F7-2) → φM_n = 23.04 tonf·m, uso 0.87, con 55.4 kg/m.</text>
</svg>
