<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 462" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="oa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="940" height="462" fill="#ffffff"/>
  <text x="470" y="28" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">La curva e – log σ' : dos pendientes, y una frontera que lo decide todo</text>

  <!-- ============ IZQUIERDA: la curva ============ -->
  <g>
    <line x1="110" y1="330" x2="450" y2="330" stroke="#8a857c" stroke-width="1.5"/>
    <line x1="110" y1="330" x2="110" y2="80" stroke="#8a857c" stroke-width="1.5"/>
    <text x="98" y="200" font-size="12" fill="#666" transform="rotate(-90 98 200)" text-anchor="middle">índice de vacíos, e</text>
    <text x="280" y="356" font-size="12" fill="#666" text-anchor="middle">tensión efectiva, σ' (escala logarítmica)</text>

    <!-- rama de recompresion: pendiente suave -->
    <polyline points="140,110 200,118 260,128 300,136" fill="none" stroke="#1c7c3c" stroke-width="3"/>
    <!-- rama virgen: pendiente fuerte -->
    <polyline points="300,136 350,196 400,256 440,304" fill="none" stroke="#b02a1a" stroke-width="3"/>

    <!-- sigma'c -->
    <line x1="300" y1="136" x2="300" y2="330" stroke="#222" stroke-width="1.2" stroke-dasharray="5 4"/>
    <circle cx="300" cy="136" r="5" fill="#222"/>
    <text x="300" y="348" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">σ'_c</text>

    <!-- etiquetas de pendiente -->
    <text x="190" y="102" font-size="12.5" fill="#1c7c3c" font-weight="bold">recompresión — pendiente C_s</text>
    <text x="190" y="88" font-size="11" fill="#1c7c3c">barato: el suelo ya estuvo aquí</text>
    <text x="404" y="222" font-size="12.5" fill="#b02a1a" font-weight="bold">compresión</text>
    <text x="404" y="238" font-size="12.5" fill="#b02a1a" font-weight="bold">virgen — C_c</text>
    <text x="404" y="254" font-size="11" fill="#b02a1a">caro: territorio nuevo</text>

    <!-- construccion de Casagrande, esquematica -->
    <line x1="300" y1="136" x2="360" y2="136" stroke="#1a63a8" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="300" y1="136" x2="352" y2="118" stroke="#1a63a8" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="300" y1="136" x2="356" y2="128" stroke="#1a63a8" stroke-width="1.4"/>
    <text x="364" y="132" font-size="10.5" fill="#1a63a8">bisectriz</text>
    <text x="364" y="146" font-size="10.5" fill="#1a63a8">(Casagrande, 1936)</text>

    <text x="140" y="380" font-size="11.5" fill="#555">σ'_c no se mide: se deduce de la curva de laboratorio</text>
    <text x="140" y="396" font-size="11.5" fill="#555">con una construcción gráfica.</text>
  </g>

  <line x1="500" y1="60" x2="500" y2="360" stroke="#e5e2dc" stroke-width="1.5"/>

  <!-- ============ DERECHA: las tres ecuaciones ============ -->
  <g>
    <text x="720" y="82" font-size="13.5" text-anchor="middle" fill="#222" font-weight="bold">Qué ecuación aplica, según dónde caiga la carga</text>

    <!-- caso NC -->
    <rect x="540" y="102" width="360" height="70" rx="5" fill="#b02a1a" fill-opacity="0.07" stroke="#b02a1a" stroke-width="1.2"/>
    <text x="556" y="124" font-size="12.5" fill="#b02a1a" font-weight="bold">σ'_c = σ'_o  ·  NORMALMENTE CONSOLIDADA</text>
    <text x="556" y="146" font-size="12" fill="#222">Todo el recorrido va por la rama virgen.</text>
    <text x="556" y="164" font-size="12" fill="#b02a1a" font-weight="bold">Ec. (9.16): solo C_c</text>

    <!-- caso OC dentro -->
    <rect x="540" y="186" width="360" height="70" rx="5" fill="#1c7c3c" fill-opacity="0.07" stroke="#1c7c3c" stroke-width="1.2"/>
    <text x="556" y="208" font-size="12.5" fill="#1c7c3c" font-weight="bold">σ'_o + Δσ' ≤ σ'_c  ·  LA CARGA CABE</text>
    <text x="556" y="230" font-size="12" fill="#222">Todo el recorrido va por recompresión.</text>
    <text x="556" y="248" font-size="12" fill="#1c7c3c" font-weight="bold">Ec. (9.18): solo C_s</text>

    <!-- caso cruza -->
    <rect x="540" y="270" width="360" height="70" rx="5" fill="#e67e22" fill-opacity="0.09" stroke="#b35c0e" stroke-width="1.2"/>
    <text x="556" y="292" font-size="12.5" fill="#b35c0e" font-weight="bold">σ'_o + Δσ' &gt; σ'_c  ·  LA CARGA CRUZA</text>
    <text x="556" y="314" font-size="12" fill="#222">Un tramo barato y otro caro.</text>
    <text x="556" y="332" font-size="12" fill="#b35c0e" font-weight="bold">Ec. (9.19): C_s hasta σ'_c, luego C_c</text>
  </g>

  <!-- takeaway -->
  <rect x="60" y="414" width="820" height="34" rx="6" fill="#f7f6f3" stroke="#8a857c"/>
  <text x="600" y="436" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">C_s ≈ 0,17 a 0,33 · C_c (Tabla 9.2): quedarse dentro de σ'_c cuesta entre 3 y 6 veces menos.</text>
</svg>
