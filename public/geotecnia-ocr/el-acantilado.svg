<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ca2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="940" height="440" fill="#ffffff"/>
  <text x="470" y="28" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">No es un gradiente: es un acantilado</text>
  <text x="470" y="49" font-size="12" text-anchor="middle" fill="#666">Capa de 3 m · e₀ = 1,0 · C_c = 0,27 · C_s = C_c/4 · σ'_o = 95,5 kPa · Δσ' = 16,5 kPa (Ejemplos 9.10 y 9.11 de Das)</text>

  <!-- zonas -->
  <rect x="130" y="80" width="25" height="220" fill="#b02a1a" fill-opacity="0.07"/>
  <rect x="155" y="80" width="265" height="220" fill="#1c7c3c" fill-opacity="0.06"/>

  <!-- ejes -->
  <line x1="130" y1="300" x2="430" y2="300" stroke="#8a857c" stroke-width="1.5"/>
  <line x1="130" y1="300" x2="130" y2="80" stroke="#8a857c" stroke-width="1.5"/>
  <text x="122" y="117" font-size="11" fill="#666" text-anchor="end">30</text>
  <text x="122" y="184" font-size="11" fill="#666" text-anchor="end">20</text>
  <text x="122" y="250" font-size="11" fill="#666" text-anchor="end">10</text>
  <text x="122" y="304" font-size="11" fill="#666" text-anchor="end">0</text>
  <text x="86" y="190" font-size="11.5" fill="#666" transform="rotate(-90 86 190)" text-anchor="middle">S_p (mm)</text>
  <text x="130" y="318" font-size="11" fill="#666" text-anchor="middle">1,0</text>
  <text x="275" y="318" font-size="11" fill="#666" text-anchor="middle">2,0</text>
  <text x="420" y="318" font-size="11" fill="#666" text-anchor="middle">3,0</text>
  <text x="280" y="338" font-size="12" fill="#666" text-anchor="middle">OCR = σ'_c / σ'_o</text>

  <!-- curva -->
  <polyline points="130,113 137,156 145,197 152,236 155,253 159,253 202,253 275,253 420,253"
            fill="none" stroke="#1a63a8" stroke-width="3"/>
  <circle cx="130" cy="113" r="5" fill="#b02a1a"/>
  <circle cx="155" cy="253" r="5" fill="#1c7c3c"/>

  <!-- umbral -->
  <line x1="155" y1="300" x2="155" y2="253" stroke="#1c7c3c" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="161" y="292" font-size="11" fill="#1c7c3c" font-weight="bold">OCR = 1,17</text>

  <!-- anotaciones -->
  <text x="140" y="104" font-size="12.5" fill="#b02a1a" font-weight="bold">28,0 mm</text>
  <text x="140" y="90" font-size="11" fill="#b02a1a">NC</text>
  <text x="230" y="246" font-size="12.5" fill="#1c7c3c" font-weight="bold">7,0 mm — y plano para todo OCR mayor</text>

  <!-- flecha del factor 4 -->
  <line x1="445" y1="113" x2="445" y2="253" stroke="#666" stroke-width="1.2" marker-start="url(#ca2)" marker-end="url(#ca2)"/>
  <text x="461" y="183" font-size="13" fill="#666" text-anchor="middle" font-weight="bold" transform="rotate(-90 461 183)">factor 4</text>

  <!-- ============ DERECHA ============ -->
  <line x1="490" y1="70" x2="490" y2="350" stroke="#e5e2dc" stroke-width="1.5"/>

  <text x="710" y="94" font-size="13.5" text-anchor="middle" fill="#222" font-weight="bold">Lo que importa no es «cuán sobreconsolidado»,</text>
  <text x="710" y="114" font-size="13.5" text-anchor="middle" fill="#222" font-weight="bold">sino si la carga cabe dentro de σ'_c</text>

  <rect x="540" y="138" width="340" height="56" rx="5" fill="#1a63a8" fill-opacity="0.08" stroke="#1a63a8" stroke-width="1.2"/>
  <text x="710" y="162" font-size="13" text-anchor="middle" fill="#1a63a8" font-weight="bold">OCR umbral = 1 + Δσ' / σ'_o</text>
  <text x="710" y="182" font-size="11.5" text-anchor="middle" fill="#555">y depende de la CARGA, no solo del suelo</text>

  <text x="540" y="222" font-size="12" fill="#555">Con Δσ'/σ'_o = 17 % (este caso), el umbral está en 1,17.</text>
  <text x="540" y="242" font-size="12" fill="#555">Con una carga que agregue un 50 %, se corre a 1,50.</text>
  <text x="540" y="262" font-size="12" fill="#555">Con una que agregue el doble, a 3,00.</text>

  <text x="540" y="298" font-size="12" fill="#222" font-weight="bold">Consecuencia de diseño:</text>
  <text x="540" y="318" font-size="12" fill="#555">bajar la presión de contacto puede meter la carga</text>
  <text x="540" y="336" font-size="12" fill="#555">entera dentro de σ'_c y dividir el asentamiento por 4,</text>
  <text x="540" y="354" font-size="12" fill="#555">de golpe, en vez de reducirlo proporcionalmente.</text>

  <!-- takeaway -->
  <rect x="60" y="382" width="820" height="46" rx="6" fill="#f7f6f3" stroke="#8a857c"/>
  <text x="470" y="404" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">Entre OCR = 1,17 y OCR = 10 el asentamiento no cambia en absoluto. Entre 1,00 y 1,17 cae un 75 %.</text>
  <text x="470" y="422" font-size="12" text-anchor="middle" fill="#555">Toda la información útil del OCR está concentrada en un rango estrechísimo, justo encima de 1.</text>
</svg>
