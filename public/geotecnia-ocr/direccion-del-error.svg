<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="da2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b02a1a"/>
    </marker>
  </defs>
  <rect width="940" height="440" fill="#ffffff"/>
  <text x="470" y="28" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">Si el informe no declara σ'_c, el error tiene dirección — y no es la que conviene</text>

  <line x1="470" y1="52" x2="470" y2="272" stroke="#e5e2dc" stroke-width="1.5"/>

  <!-- ============ IZQUIERDA: suponer NC ============ -->
  <g>
    <text x="240" y="62" font-size="13.5" text-anchor="middle" fill="#b35c0e" font-weight="bold">Suponer NC cuando es OC</text>

    <line x1="140" y1="230" x2="360" y2="230" stroke="#8a857c" stroke-width="1.4"/>
    <rect x="165" y="90" width="66" height="140" fill="#b35c0e" fill-opacity="0.75"/>
    <text x="198" y="82" font-size="14" fill="#b35c0e" text-anchor="middle" font-weight="bold">28,0 mm</text>
    <text x="198" y="248" font-size="11.5" fill="#666" text-anchor="middle">se calcula</text>

    <rect x="277" y="195" width="66" height="35" fill="#1c7c3c" fill-opacity="0.6"/>
    <text x="310" y="187" font-size="14" fill="#1c7c3c" text-anchor="middle" font-weight="bold">7,0 mm</text>
    <text x="310" y="248" font-size="11.5" fill="#666" text-anchor="middle">realidad</text>

    <text x="240" y="278" font-size="13" fill="#b35c0e" text-anchor="middle" font-weight="bold">Se SOBREESTIMA 4×</text>
    <text x="240" y="298" font-size="12" fill="#555" text-anchor="middle">Conservador. Sale caro: fundación</text>
    <text x="240" y="315" font-size="12" fill="#555" text-anchor="middle">sobredimensionada o pilotes innecesarios.</text>
  </g>

  <!-- ============ DERECHA: suponer OC ============ -->
  <g>
    <text x="700" y="62" font-size="13.5" text-anchor="middle" fill="#b02a1a" font-weight="bold">Suponer OC cuando es NC</text>

    <line x1="600" y1="230" x2="820" y2="230" stroke="#8a857c" stroke-width="1.4"/>
    <rect x="625" y="195" width="66" height="35" fill="#1c7c3c" fill-opacity="0.6"/>
    <text x="658" y="187" font-size="14" fill="#1c7c3c" text-anchor="middle" font-weight="bold">7,0 mm</text>
    <text x="658" y="248" font-size="11.5" fill="#666" text-anchor="middle">se calcula</text>

    <rect x="737" y="90" width="66" height="140" fill="#b02a1a" fill-opacity="0.75"/>
    <text x="770" y="82" font-size="14" fill="#b02a1a" text-anchor="middle" font-weight="bold">28,0 mm</text>
    <text x="770" y="248" font-size="11.5" fill="#666" text-anchor="middle">realidad</text>

    <text x="700" y="278" font-size="13" fill="#b02a1a" text-anchor="middle" font-weight="bold">Se SUBESTIMA 4×</text>
    <text x="700" y="298" font-size="12" fill="#555" text-anchor="middle">Del lado inseguro. La estructura asienta</text>
    <text x="700" y="315" font-size="12" fill="#555" text-anchor="middle">cuatro veces lo previsto, y ya está construida.</text>
  </g>

  <!-- el sesgo de la perturbacion -->
  <rect x="90" y="336" width="760" height="88" rx="6" fill="#b02a1a" fill-opacity="0.05" stroke="#b02a1a" stroke-width="1.3"/>
  <text x="470" y="358" font-size="13" text-anchor="middle" fill="#b02a1a" font-weight="bold">Y hay un sesgo sistemático hacia el segundo error (§ 9.6)</text>
  <text x="470" y="380" font-size="12" text-anchor="middle" fill="#555">Una muestra <tspan font-weight="bold">perturbada</tspan> por el muestreo aplana la curva e – log σ'. Curva de campo, curva de laboratorio</text>
  <text x="470" y="398" font-size="12" text-anchor="middle" fill="#555">inalterada y curva remoldeada se cortan cerca de e = 0,4 e₀ (Terzaghi y Peck, 1967), pero la de laboratorio</text>
  <text x="470" y="416" font-size="12" text-anchor="middle" fill="#555">queda a la izquierda: <tspan font-weight="bold" fill="#b02a1a">da un C_c menor y por lo tanto subestima el asentamiento.</tspan></text>

  <!-- flecha del sesgo -->
  <line x1="700" y1="326" x2="700" y2="334" stroke="#b02a1a" stroke-width="2" marker-end="url(#da2)"/>
</svg>
