<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="560" fill="#ffffff"/>

  <text x="500" y="28" font-size="15.5" text-anchor="middle" fill="#222" font-weight="bold">La torre: arriostrada en X, marco de momento en Y — el paso libre elige el sistema</text>
  <text x="500" y="48" font-size="12" text-anchor="middle" fill="#666">escala 20 px/m · 3 niveles de 4 m · planta 6,0 × 4,0 m · el equipo pesa en el nivel 2</text>

  <defs>
    <marker id="dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a857c"/>
    </marker>
    <marker id="sis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d6b9c"/>
    </marker>
  </defs>

  <!-- ===================== ELEVACIÓN CBF (dirección X) ===================== -->
  <!-- marco: x 120..240 = 6,0 m · y 420..180 = 12,0 m -->
  <text x="180" y="92" font-size="13" text-anchor="middle" fill="#1b4a6e" font-weight="bold">Elevación X — CBF</text>
  <text x="180" y="108" font-size="11" text-anchor="middle" fill="#666">cara arriostrada (2 líneas iguales)</text>

  <!-- suelo -->
  <line x1="90" y1="420" x2="270" y2="420" stroke="#8a857c" stroke-width="2"/>
  <line x1="96" y1="420" x2="88" y2="430" stroke="#8a857c" stroke-width="1"/>
  <line x1="126" y1="420" x2="118" y2="430" stroke="#8a857c" stroke-width="1"/>
  <line x1="156" y1="420" x2="148" y2="430" stroke="#8a857c" stroke-width="1"/>
  <line x1="186" y1="420" x2="178" y2="430" stroke="#8a857c" stroke-width="1"/>
  <line x1="216" y1="420" x2="208" y2="430" stroke="#8a857c" stroke-width="1"/>
  <line x1="246" y1="420" x2="238" y2="430" stroke="#8a857c" stroke-width="1"/>

  <!-- diagonales: X apiladas, partidas en el cruce (nodo central) -->
  <line x1="120" y1="420" x2="240" y2="340" stroke="#a8641b" stroke-width="2.2"/>
  <line x1="240" y1="420" x2="120" y2="340" stroke="#a8641b" stroke-width="2.2"/>
  <line x1="120" y1="340" x2="240" y2="260" stroke="#a8641b" stroke-width="2.2"/>
  <line x1="240" y1="340" x2="120" y2="260" stroke="#a8641b" stroke-width="2.2"/>
  <line x1="120" y1="260" x2="240" y2="180" stroke="#a8641b" stroke-width="2.2"/>
  <line x1="240" y1="260" x2="120" y2="180" stroke="#a8641b" stroke-width="2.2"/>
  <circle cx="180" cy="380" r="3" fill="#a8641b"/>
  <circle cx="180" cy="300" r="3" fill="#a8641b"/>
  <circle cx="180" cy="220" r="3" fill="#a8641b"/>

  <!-- columnas y vigas puntal -->
  <line x1="120" y1="420" x2="120" y2="180" stroke="#1b4a6e" stroke-width="3.4"/>
  <line x1="240" y1="420" x2="240" y2="180" stroke="#1b4a6e" stroke-width="3.4"/>
  <line x1="120" y1="340" x2="240" y2="340" stroke="#1b4a6e" stroke-width="2.6"/>
  <line x1="120" y1="260" x2="240" y2="260" stroke="#1b4a6e" stroke-width="2.6"/>
  <line x1="120" y1="180" x2="240" y2="180" stroke="#1b4a6e" stroke-width="2.6"/>

  <!-- bases articuladas en este plano: rótula -->
  <circle cx="120" cy="420" r="5" fill="#ffffff" stroke="#1b4a6e" stroke-width="2"/>
  <circle cx="240" cy="420" r="5" fill="#ffffff" stroke="#1b4a6e" stroke-width="2"/>

  <!-- sismo X -->
  <line x1="52" y1="200" x2="102" y2="200" stroke="#2d6b9c" stroke-width="3" marker-end="url(#sis)"/>
  <text x="50" y="188" font-size="11.5" fill="#2d6b9c" font-weight="bold">E_x</text>

  <!-- cotas -->
  <line x1="262" y1="420" x2="262" y2="180" stroke="#8a857c" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <text x="270" y="304" font-size="10.5" fill="#8a857c">12,0 m</text>
  <line x1="120" y1="444" x2="240" y2="444" stroke="#8a857c" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <text x="180" y="459" font-size="10.5" text-anchor="middle" fill="#8a857c">6,0 m</text>
  <text x="180" y="478" font-size="10.5" text-anchor="middle" fill="#666">base articulada en este plano</text>

  <!-- ===================== ELEVACIÓN MRF (dirección Y) ===================== -->
  <!-- marco: x 400..480 = 4,0 m · y 420..180 -->
  <text x="440" y="92" font-size="13" text-anchor="middle" fill="#1b4a6e" font-weight="bold">Elevación Y — MRF</text>
  <text x="440" y="108" font-size="11" text-anchor="middle" fill="#666">marco de momento (2 marcos): el paso libre</text>

  <line x1="370" y1="420" x2="510" y2="420" stroke="#8a857c" stroke-width="2"/>
  <line x1="376" y1="420" x2="368" y2="430" stroke="#8a857c" stroke-width="1"/>
  <line x1="406" y1="420" x2="398" y2="430" stroke="#8a857c" stroke-width="1"/>
  <line x1="436" y1="420" x2="428" y2="430" stroke="#8a857c" stroke-width="1"/>
  <line x1="466" y1="420" x2="458" y2="430" stroke="#8a857c" stroke-width="1"/>
  <line x1="496" y1="420" x2="488" y2="430" stroke="#8a857c" stroke-width="1"/>

  <line x1="400" y1="420" x2="400" y2="180" stroke="#1b4a6e" stroke-width="3.4"/>
  <line x1="480" y1="420" x2="480" y2="180" stroke="#1b4a6e" stroke-width="3.4"/>
  <line x1="400" y1="340" x2="480" y2="340" stroke="#1b4a6e" stroke-width="2.6"/>
  <line x1="400" y1="260" x2="480" y2="260" stroke="#1b4a6e" stroke-width="2.6"/>
  <line x1="400" y1="180" x2="480" y2="180" stroke="#1b4a6e" stroke-width="2.6"/>

  <!-- nudos rígidos: cuadrado relleno -->
  <rect x="396" y="336" width="8" height="8" fill="#1b4a6e"/>
  <rect x="476" y="336" width="8" height="8" fill="#1b4a6e"/>
  <rect x="396" y="256" width="8" height="8" fill="#1b4a6e"/>
  <rect x="476" y="256" width="8" height="8" fill="#1b4a6e"/>
  <rect x="396" y="176" width="8" height="8" fill="#1b4a6e"/>
  <rect x="476" y="176" width="8" height="8" fill="#1b4a6e"/>

  <!-- bases empotradas en este plano: achurado -->
  <rect x="392" y="420" width="16" height="6" fill="#1b4a6e"/>
  <rect x="472" y="420" width="16" height="6" fill="#1b4a6e"/>

  <!-- gálibo del paso libre -->
  <path d="M 414 420 A 26 26 0 0 1 466 420" fill="none" stroke="#8a857c" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="440" y="408" font-size="10" text-anchor="middle" fill="#8a857c">paso</text>

  <!-- sismo Y -->
  <line x1="332" y1="200" x2="382" y2="200" stroke="#2d6b9c" stroke-width="3" marker-end="url(#sis)"/>
  <text x="330" y="188" font-size="11.5" fill="#2d6b9c" font-weight="bold">E_y</text>

  <line x1="400" y1="444" x2="480" y2="444" stroke="#8a857c" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <text x="440" y="459" font-size="10.5" text-anchor="middle" fill="#8a857c">4,0 m</text>
  <text x="440" y="478" font-size="10.5" text-anchor="middle" fill="#666">base empotrada en este plano</text>

  <!-- pesos sísmicos por nivel (compartidos por ambas elevaciones) -->
  <text x="530" y="184" font-size="10.5" fill="#666">N3 · P₃ = 262,5 kN</text>
  <text x="530" y="264" font-size="10.5" fill="#666">N2 · P₂ = 612,5 kN — el equipo</text>
  <text x="530" y="344" font-size="10.5" fill="#666">N1 · P₁ = 325,0 kN</text>
  <text x="530" y="200" font-size="9.5" fill="#999">(P = D + 0,25·L, §5.1.2)</text>

  <!-- ===================== PLANTA ===================== -->
  <!-- rectángulo: x 780..900 = 6,0 m · y 250..330 = 4,0 m -->
  <text x="840" y="92" font-size="13" text-anchor="middle" fill="#1b4a6e" font-weight="bold">Planta (cada nivel)</text>
  <text x="840" y="108" font-size="11" text-anchor="middle" fill="#666">sin diafragma rígido: arriostramiento de planta</text>

  <!-- caras CBF (arriba y abajo, llenas) y marcos MRF (izq y der) -->
  <line x1="780" y1="250" x2="900" y2="250" stroke="#a8641b" stroke-width="3"/>
  <line x1="780" y1="330" x2="900" y2="330" stroke="#a8641b" stroke-width="3"/>
  <line x1="780" y1="250" x2="780" y2="330" stroke="#1b4a6e" stroke-width="3"/>
  <line x1="900" y1="250" x2="900" y2="330" stroke="#1b4a6e" stroke-width="3"/>

  <!-- arriostramiento de planta en X, partido al centro -->
  <line x1="780" y1="250" x2="900" y2="330" stroke="#c9a227" stroke-width="1.8"/>
  <line x1="900" y1="250" x2="780" y2="330" stroke="#c9a227" stroke-width="1.8"/>
  <circle cx="840" cy="290" r="3" fill="#c9a227"/>

  <!-- columnas -->
  <rect x="775" y="245" width="10" height="10" fill="#1b4a6e"/>
  <rect x="895" y="245" width="10" height="10" fill="#1b4a6e"/>
  <rect x="775" y="325" width="10" height="10" fill="#1b4a6e"/>
  <rect x="895" y="325" width="10" height="10" fill="#1b4a6e"/>

  <!-- rótulos de sistemas -->
  <text x="840" y="240" font-size="10.5" text-anchor="middle" fill="#a8641b">cara CBF (X)</text>
  <text x="840" y="346" font-size="10.5" text-anchor="middle" fill="#a8641b">cara CBF (X)</text>
  <text x="766" y="292" font-size="10.5" text-anchor="end" fill="#1b4a6e">MRF</text>
  <text x="914" y="292" font-size="10.5" text-anchor="start" fill="#1b4a6e">MRF</text>

  <!-- cotas planta -->
  <line x1="780" y1="368" x2="900" y2="368" stroke="#8a857c" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <text x="840" y="383" font-size="10.5" text-anchor="middle" fill="#8a857c">6,0 m (X)</text>
  <line x1="936" y1="250" x2="936" y2="330" stroke="#8a857c" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <text x="944" y="294" font-size="10.5" fill="#8a857c">4,0 m (Y)</text>

  <!-- ejes -->
  <line x1="780" y1="416" x2="820" y2="416" stroke="#666" stroke-width="1.6" marker-end="url(#dim)"/>
  <text x="826" y="420" font-size="10.5" fill="#666">X</text>
  <line x1="780" y1="416" x2="780" y2="392" stroke="#666" stroke-width="1.6" marker-end="url(#dim)"/>
  <text x="776" y="384" font-size="10.5" fill="#666" text-anchor="end">Y</text>

  <!-- ===================== PERFILERÍA ===================== -->
  <text x="90" y="512" font-size="11" fill="#333" font-weight="bold">Perfilería soldada (propiedades de placas, esquina viva):</text>
  <text x="90" y="530" font-size="10.5" fill="#666">columnas HN 30 (alas 300×16, alma 268×8), eje fuerte al marco Y · vigas IN 30 (alas 150×10, alma 280×6): de momento en Y, puntal en X</text>
  <text x="90" y="546" font-size="10.5" fill="#666">diagonales cajón 125×125×6 (A = 2 856 mm²) · planta cajón 100×100×4 · acero A36 · masas en las 4 esquinas de cada nivel, sin torsión</text>
</svg>
