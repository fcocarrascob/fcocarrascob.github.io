<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="700" fill="#ffffff"/>
  <text x="500" y="30" font-size="15.5" text-anchor="middle" fill="#222" font-weight="bold">El peralte variable: una recta de proyecto, siete secciones de análisis</text>
  <text x="500" y="50" font-size="12" text-anchor="middle" fill="#666">alma 6 mm · alas 220 × 12 mm · acero A36 · el dintel se dibuja hasta la cumbrera y se refleja por simetría</text>
  <defs>
    <marker id="dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a857c"/>
    </marker>
    <marker id="sis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d6b9c"/>
    </marker>
  </defs>
  <line x1="78.0" y1="340.0" x2="678.0" y2="340.0" stroke="#d1d5db" stroke-width="1"/>
  <text x="70.0" y="344.0" font-size="11" text-anchor="end" fill="#666">0</text>
