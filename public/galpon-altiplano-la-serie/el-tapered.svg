  <line x1="78.0" y1="162.2" x2="678.0" y2="162.2" stroke="#d1d5db" stroke-width="1"/>
  <text x="70.0" y="166.2" font-size="11" text-anchor="end" fill="#666">800</text>
  <line x1="78.0" y1="340.0" x2="678.0" y2="340.0" stroke="#333" stroke-width="1.5"/>
  <line x1="78.0" y1="140.0" x2="78.0" y2="340.0" stroke="#333" stroke-width="1.5"/>
  <text x="70.0" y="102" font-size="11.5" fill="#333">peralte d [mm]</text>
  <line x1="78.0" y1="340.0" x2="78.0" y2="346.0" stroke="#333" stroke-width="1.5"/>
  <text x="78.0" y="376.0" font-size="10.5" text-anchor="start" fill="#333">base · s = 0</text>
  <line x1="315.8" y1="340.0" x2="315.8" y2="346.0" stroke="#333" stroke-width="1.5"/>
  <text x="315.8" y="376.0" font-size="10.5" text-anchor="middle" fill="#333">alero · s = 8,0 m</text>
  <line x1="678.0" y1="340.0" x2="678.0" y2="346.0" stroke="#333" stroke-width="1.5"/>
  <text x="678.0" y="376.0" font-size="10.5" text-anchor="end" fill="#333">cumbrera · s = 20,19 m</text>
  <line x1="315.8" y1="140.0" x2="315.8" y2="340.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="196.9" y="126" font-size="11.5" text-anchor="middle" fill="#1b4a6e" font-weight="bold">COLUMNA · 4 tramos de 2,0 m</text>
  <text x="496.9" y="126" font-size="11.5" text-anchor="middle" fill="#1b4a6e" font-weight="bold">DINTEL (medio faldón) · 3 tramos</text>
  <polyline points="78.0,262.2 315.8,162.2 678.0,262.2" fill="none" stroke="#a8641b" stroke-width="2.2" stroke-dasharray="7 4"/>
  <rect x="78.0" y="249.7" width="59.4" height="90.3" fill="#1b4a6e" fill-opacity="0.14" stroke="#1b4a6e" stroke-width="1.4"/>
  <text x="107.7" y="242.7" font-size="10" text-anchor="middle" fill="#1b4a6e" font-weight="bold">406,25</text>
  <text x="107.7" y="356.0" font-size="9.5" text-anchor="middle" fill="#666">COL_1</text>
  <rect x="137.4" y="224.7" width="59.4" height="115.3" fill="#1b4a6e" fill-opacity="0.14" stroke="#1b4a6e" stroke-width="1.4"/>
  <text x="167.2" y="217.7" font-size="10" text-anchor="middle" fill="#1b4a6e" font-weight="bold">518,75</text>
  <text x="167.2" y="356.0" font-size="9.5" text-anchor="middle" fill="#666">COL_2</text>
  <rect x="196.9" y="199.7" width="59.4" height="140.3" fill="#1b4a6e" fill-opacity="0.14" stroke="#1b4a6e" stroke-width="1.4"/>
  <text x="226.6" y="192.7" font-size="10" text-anchor="middle" fill="#1b4a6e" font-weight="bold">631,25</text>
  <text x="226.6" y="356.0" font-size="9.5" text-anchor="middle" fill="#666">COL_3</text>
  <rect x="256.3" y="174.7" width="59.4" height="165.3" fill="#1b4a6e" fill-opacity="0.14" stroke="#1b4a6e" stroke-width="1.4"/>
  <text x="286.1" y="167.7" font-size="10" text-anchor="middle" fill="#1b4a6e" font-weight="bold">743,75</text>
  <text x="286.1" y="356.0" font-size="9.5" text-anchor="middle" fill="#666">COL_4</text>
  <rect x="315.8" y="178.9" width="120.7" height="161.1" fill="#1b4a6e" fill-opacity="0.14" stroke="#1b4a6e" stroke-width="1.4"/>
  <text x="376.2" y="171.9" font-size="10" text-anchor="middle" fill="#1b4a6e" font-weight="bold">725,00</text>
  <text x="376.2" y="356.0" font-size="9.5" text-anchor="middle" fill="#666">DIN_1</text>
  <rect x="436.5" y="212.2" width="120.7" height="127.8" fill="#1b4a6e" fill-opacity="0.14" stroke="#1b4a6e" stroke-width="1.4"/>
  <text x="496.9" y="205.2" font-size="10" text-anchor="middle" fill="#1b4a6e" font-weight="bold">575,00</text>
  <text x="496.9" y="356.0" font-size="9.5" text-anchor="middle" fill="#666">DIN_2</text>
  <rect x="557.3" y="245.6" width="120.7" height="94.4" fill="#1b4a6e" fill-opacity="0.14" stroke="#1b4a6e" stroke-width="1.4"/>
  <text x="617.6" y="238.6" font-size="10" text-anchor="middle" fill="#1b4a6e" font-weight="bold">425,00</text>
  <text x="617.6" y="356.0" font-size="9.5" text-anchor="middle" fill="#666">DIN_3</text>
  <circle cx="78.0" cy="262.2" r="4" fill="#a8641b"/>
  <text x="84.0" y="282.2" font-size="10.5" text-anchor="start" fill="#a8641b">350 en la base</text>
  <circle cx="315.8" cy="162.2" r="4" fill="#a8641b"/>
  <text x="315.8" y="148.2" font-size="10.5" text-anchor="middle" fill="#a8641b">800 en el alero</text>
  <circle cx="678.0" cy="262.2" r="4" fill="#a8641b"/>
  <text x="672.0" y="282.2" font-size="10.5" text-anchor="end" fill="#a8641b">350 en la cumbrera</text>
  <line x1="700" y1="120" x2="734" y2="120" stroke="#a8641b" stroke-width="2.2" stroke-dasharray="7 4"/>
  <text x="744" y="124" font-size="11" fill="#333">la ley lineal d(s) del proyecto</text>
  <rect x="700" y="140" width="34" height="12" fill="#1b4a6e" fill-opacity="0.14" stroke="#1b4a6e" stroke-width="1.4"/>
  <text x="744" y="150" font-size="11" fill="#333">las 7 secciones del modelo</text>
  <text x="700" y="182" font-size="11" fill="#222" font-weight="bold">El peralte se evalúa en el PUNTO MEDIO</text>
  <text x="700" y="200" font-size="10.5" fill="#666">de cada tramo, nunca en un extremo. Con ley</text>
  <text x="700" y="214" font-size="10.5" fill="#666">lineal eso equivale a promediar los peraltes,</text>
  <text x="700" y="228" font-size="10.5" fill="#666">pero no las inercias: I va con d² y promediar</text>
  <text x="700" y="242" font-size="10.5" fill="#666">secciones da un tramo más rígido del que hay.</text>
  <text x="700" y="252" font-size="11" fill="#222" font-weight="bold">Por qué 4 y 3, y no más</text>
  <text x="700" y="270" font-size="10.5" fill="#666">La malla se corta en las uniones con el</text>
  <text x="700" y="284" font-size="10.5" fill="#666">arriostramiento de techo, que ya existen.</text>
  <text x="700" y="298" font-size="10.5" fill="#666">Un solo mallado sirve para cargar, para</text>
  <text x="700" y="312" font-size="10.5" fill="#666">arriostrar y para verificar por estación.</text>
  <text x="260.0" y="422" font-size="13" text-anchor="middle" fill="#1b4a6e" font-weight="bold">La sección: doble T soldada, definida por planchas</text>
  <text x="260.0" y="438" font-size="11" text-anchor="middle" fill="#666">dibujada en el alero (d = 800 mm) · A, I, J y Z salen de primeros principios</text>
  <rect x="235.8" y="472.0" width="48.4" height="2.6" fill="#1b4a6e" fill-opacity="0.3" stroke="#1b4a6e" stroke-width="1.2"/>
  <rect x="235.8" y="645.4" width="48.4" height="2.6" fill="#1b4a6e" fill-opacity="0.3" stroke="#1b4a6e" stroke-width="1.2"/>
  <rect x="259.3" y="474.6" width="1.3" height="170.7" fill="#1b4a6e" fill-opacity="0.3" stroke="#1b4a6e" stroke-width="1.2"/>
  <line x1="235.8" y1="454.0" x2="284.2" y2="454.0" stroke="#8a857c" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <text x="260.0" y="469.0" font-size="10.5" text-anchor="middle" fill="#8a857c">b_f = 220 mm</text>
  <line x1="328.2" y1="472.0" x2="328.2" y2="648.0" stroke="#8a857c" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <text x="335.2" y="564.0" font-size="10.5" fill="#8a857c">d = 800 mm</text>
  <line x1="284.2" y1="472.0" x2="332.2" y2="472.0" stroke="#8a857c" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="284.2" y1="648.0" x2="332.2" y2="648.0" stroke="#8a857c" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="290.2" y="484.6" font-size="10" fill="#666">t_f = 12 mm</text>
  <text x="268.7" y="564.0" font-size="10" fill="#666">t_w = 6 mm</text>
  <text x="560" y="470" font-size="11" fill="#222" font-weight="bold">El predimensionamiento está hecho para fallar</text>
  <text x="560" y="490" font-size="10.5" fill="#666">Con alma de 6 mm y el peralte de alero, h = 800 − 2×12 = 776 mm</text>
  <text x="560" y="504" font-size="10.5" fill="#666">y h/t_w = 129,33 — falla el límite de alma no esbelta a compresión.</text>
  <text x="560" y="518" font-size="10.5" fill="#666">Y el arreglo obvio, subir el alma a 8 mm, tampoco alcanza.</text>
  <text x="560" y="546" font-size="11" fill="#222" font-weight="bold">Y el J no se calcula a mano</text>
  <text x="560" y="566" font-size="10.5" fill="#666">La constante torsional que reporta SAP queda entre 2,9 y 3,2 %</text>
  <text x="560" y="580" font-size="10.5" fill="#666">bajo Σbt³/3, según la sección. Se adopta GetSectProps como</text>
  <text x="560" y="594" font-size="10.5" fill="#666">fuente única, o los dos motores no consumen el mismo número.</text>
  <text x="560" y="622" font-size="11" fill="#222" font-weight="bold">Prohibida la sección no prismática de SAP2000</text>
  <text x="560" y="642" font-size="10.5" fill="#666">Su integración interna no es reproducible desde OpenSeesPy, y</text>
  <text x="560" y="656" font-size="10.5" fill="#666">con ella la verificación en dos motores dejaría de verificar nada.</text>
  <text x="78" y="676" font-size="10.5" fill="#666">Leyes de peralte y malla: galpon_altiplano_build.py rev.G · d_col(k) y d_din(m) evaluadas en el punto medio de cada tramo</text>
  <text x="78" y="691" font-size="10.5" fill="#666">Discretizar menos no es conservador: con un solo tramo por columna la deriva se sobreestima un 37,8 %, y el prismático equivalente se equivoca en los dos sentidos a la vez.</text>
</svg>
