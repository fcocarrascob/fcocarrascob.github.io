  <text x="70.0" y="299.6" font-size="11" text-anchor="end" fill="#666">200</text>
  <line x1="78.0" y1="251.1" x2="678.0" y2="251.1" stroke="#d1d5db" stroke-width="1"/>
  <text x="70.0" y="255.1" font-size="11" text-anchor="end" fill="#666">400</text>
