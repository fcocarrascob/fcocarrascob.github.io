<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="940" height="430" fill="#ffffff"/>
  <text x="470" y="28" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">La brecha entre métodos es sistemática, no una casualidad de un φ' puntual</text>
  <text x="470" y="49" font-size="12" text-anchor="middle" fill="#666">Zapata 2,20 × 2,20 m · D_f = 1,5 m · arena c' = 0, γ = 18 kN/m³ · FS = 3</text>

  <line x1="470" y1="70" x2="470" y2="330" stroke="#e5e2dc" stroke-width="1.5"/>

  <!-- ============ IZQUIERDA: curvas q_adm vs phi' ============ -->
  <g>
    <!-- ejes -->
    <line x1="120" y1="300" x2="400" y2="300" stroke="#8a857c" stroke-width="1.5"/>
    <line x1="120" y1="300" x2="120" y2="88" stroke="#8a857c" stroke-width="1.5"/>
    <text x="112" y="94" font-size="11.5" fill="#666" text-anchor="end">800</text>
    <text x="112" y="200" font-size="11.5" fill="#666" text-anchor="end">400</text>
    <text x="112" y="304" font-size="11.5" fill="#666" text-anchor="end">0</text>
    <text x="70" y="180" font-size="12" fill="#666" transform="rotate(-90 70 180)" text-anchor="middle">q_adm (kPa)</text>
    <text x="120" y="320" font-size="11.5" fill="#666" text-anchor="middle">20°</text>
    <text x="207" y="320" font-size="11.5" fill="#666" text-anchor="middle">25°</text>
    <text x="293" y="320" font-size="11.5" fill="#666" text-anchor="middle">30°</text>
    <text x="380" y="320" font-size="11.5" fill="#666" text-anchor="middle">35°</text>
    <text x="260" y="340" font-size="12" fill="#666" text-anchor="middle">φ' supuesto</text>

    <!-- banda entre curvas -->
    <path d="M120,277 L207,258 L293,221 L380,139 L380,93 L293,195 L207,244 L120,269 Z"
          fill="#1a63a8" fill-opacity="0.10"/>

    <!-- curva general -->
    <polyline points="120,269 207,244 293,195 380,93" fill="none" stroke="#1a63a8" stroke-width="2.6"/>
    <g fill="#1a63a8">
      <circle cx="120" cy="269" r="3.5"/><circle cx="207" cy="244" r="3.5"/>
      <circle cx="293" cy="195" r="3.5"/><circle cx="380" cy="93" r="3.5"/>
    </g>
    <text x="356" y="82" font-size="12" fill="#1a63a8" text-anchor="end" font-weight="bold">Ec. general</text>

    <!-- curva Terzaghi -->
    <polyline points="120,277 207,258 293,221 380,139" fill="none" stroke="#b02a1a" stroke-width="2.6"/>
    <g fill="#b02a1a">
      <circle cx="120" cy="277" r="3.5"/><circle cx="207" cy="258" r="3.5"/>
      <circle cx="293" cy="221" r="3.5"/><circle cx="380" cy="139" r="3.5"/>
    </g>
    <text x="392" y="143" font-size="12" fill="#b02a1a" font-weight="bold">Terzaghi</text>

    <!-- etiquetas de brecha -->
    <line x1="293" y1="221" x2="293" y2="195" stroke="#1a63a8" stroke-width="1.2" marker-start="url(#ba)" marker-end="url(#ba)"/>
    <text x="309" y="211" font-size="11.5" fill="#1a63a8" font-weight="bold">+32 %</text>

    <text x="260" y="366" font-size="12" fill="#555" text-anchor="middle">La ecuación general entrega entre <tspan font-weight="bold">23 % y 36 %</tspan> más</text>
    <text x="260" y="384" font-size="12" fill="#555" text-anchor="middle">en todo el rango útil de φ'.</text>
  </g>

  <!-- ============ DERECHA: sensibilidad a un grado ============ -->
  <g>
    <text x="700" y="88" font-size="13.5" text-anchor="middle" fill="#222" font-weight="bold">¿Cuánto mueve q_adm un solo grado de φ'?</text>

    <line x1="560" y1="270" x2="850" y2="270" stroke="#8a857c" stroke-width="1.5"/>

    <!-- barras: 13.5, 14.5, 16.1 % escaladas x 8 px por punto -->
    <rect x="595" y="162" width="56" height="108" fill="#8a7449" fill-opacity="0.8"/>
    <text x="623" y="154" font-size="15" fill="#8a7449" text-anchor="middle" font-weight="bold">+13,5 %</text>
    <text x="623" y="288" font-size="11.5" fill="#666" text-anchor="middle">25° → 26°</text>

    <rect x="677" y="154" width="56" height="116" fill="#8a7449" fill-opacity="0.8"/>
    <text x="705" y="146" font-size="15" fill="#8a7449" text-anchor="middle" font-weight="bold">+14,5 %</text>
    <text x="705" y="288" font-size="11.5" fill="#666" text-anchor="middle">30° → 31°</text>

    <rect x="759" y="141" width="56" height="129" fill="#8a7449" fill-opacity="0.8"/>
    <text x="787" y="133" font-size="15" fill="#8a7449" text-anchor="middle" font-weight="bold">+16,1 %</text>
    <text x="787" y="288" font-size="11.5" fill="#666" text-anchor="middle">35° → 36°</text>

    <text x="700" y="320" font-size="12.5" fill="#555" text-anchor="middle">Un grado — dentro del ruido de cualquier</text>
    <text x="700" y="338" font-size="12.5" fill="#555" text-anchor="middle">correlación con el SPT — vale más que</text>
    <text x="700" y="356" font-size="12.5" fill="#555" text-anchor="middle">la mitad de la brecha entre los dos métodos.</text>
  </g>

  <!-- takeaway -->
  <rect x="70" y="396" width="800" height="26" rx="6" fill="#f7f6f3" stroke="#8a857c"/>
  <text x="470" y="414" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">Elegir bien el método importa. Estimar bien φ' importa más.</text>
</svg>
