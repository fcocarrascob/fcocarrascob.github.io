<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="940" height="420" fill="#ffffff"/>
  <text x="470" y="28" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">Las dos tablas de factores no son intercambiables — y no difieren en un simple factor de escala</text>
  <text x="470" y="49" font-size="12" text-anchor="middle" fill="#666">Diferencia del factor de Terzaghi (Tabla 16.1) respecto del de la ecuación general (Tabla 16.2)</text>

  <!-- eje cero -->
  <line x1="120" y1="200" x2="850" y2="200" stroke="#8a857c" stroke-width="1.5"/>
  <text x="108" y="204" font-size="12" fill="#666" text-anchor="end" font-weight="bold">0 %</text>

  <!-- guias -->
  <g stroke="#e5e2dc" stroke-width="1">
    <line x1="120" y1="140" x2="850" y2="140"/>
    <line x1="120" y1="170" x2="850" y2="170"/>
    <line x1="120" y1="230" x2="850" y2="230"/>
    <line x1="120" y1="260" x2="850" y2="260"/>
  </g>
  <text x="108" y="144" font-size="11" fill="#aaa" text-anchor="end">+30 %</text>
  <text x="108" y="174" font-size="11" fill="#aaa" text-anchor="end">+15 %</text>
  <text x="108" y="234" font-size="11" fill="#aaa" text-anchor="end">−15 %</text>
  <text x="108" y="264" font-size="11" fill="#aaa" text-anchor="end">−30 %</text>

  <!-- ============ grupo Nc ============ -->
  <text x="215" y="82" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">N_c</text>
  <text x="215" y="100" font-size="11.5" fill="#666" text-anchor="middle">Terzaghi siempre mayor</text>
  <!-- +19, +23, +27 -->
  <rect x="150" y="162" width="34" height="38" fill="#b02a1a" fill-opacity="0.75"/>
  <text x="167" y="155" font-size="11.5" fill="#b02a1a" text-anchor="middle" font-weight="bold">+19 %</text>
  <text x="167" y="216" font-size="11" fill="#666" text-anchor="middle">φ'=20</text>
  <rect x="198" y="154" width="34" height="46" fill="#b02a1a" fill-opacity="0.75"/>
  <text x="215" y="147" font-size="11.5" fill="#b02a1a" text-anchor="middle" font-weight="bold">+23 %</text>
  <text x="215" y="216" font-size="11" fill="#666" text-anchor="middle">30</text>
  <rect x="246" y="146" width="34" height="54" fill="#b02a1a" fill-opacity="0.75"/>
  <text x="263" y="139" font-size="11.5" fill="#b02a1a" text-anchor="middle" font-weight="bold">+27 %</text>
  <text x="263" y="216" font-size="11" fill="#666" text-anchor="middle">40</text>

  <!-- ============ grupo Nq ============ -->
  <text x="450" y="82" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">N_q</text>
  <text x="450" y="100" font-size="11.5" fill="#666" text-anchor="middle">Terzaghi siempre mayor</text>
  <rect x="385" y="168" width="34" height="32" fill="#b02a1a" fill-opacity="0.75"/>
  <text x="402" y="161" font-size="11.5" fill="#b02a1a" text-anchor="middle" font-weight="bold">+16 %</text>
  <text x="402" y="216" font-size="11" fill="#666" text-anchor="middle">φ'=20</text>
  <rect x="433" y="156" width="34" height="44" fill="#b02a1a" fill-opacity="0.75"/>
  <text x="450" y="149" font-size="11.5" fill="#b02a1a" text-anchor="middle" font-weight="bold">+22 %</text>
  <text x="450" y="216" font-size="11" fill="#666" text-anchor="middle">30</text>
  <rect x="481" y="146" width="34" height="54" fill="#b02a1a" fill-opacity="0.75"/>
  <text x="498" y="139" font-size="11.5" fill="#b02a1a" text-anchor="middle" font-weight="bold">+27 %</text>
  <text x="498" y="216" font-size="11" fill="#666" text-anchor="middle">40</text>

  <!-- ============ grupo Ngamma ============ -->
  <text x="690" y="82" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">N_γ</text>
  <text x="690" y="100" font-size="11.5" fill="#1a63a8" text-anchor="middle" font-weight="bold">cambia de signo</text>
  <rect x="625" y="200" width="34" height="64" fill="#1a63a8" fill-opacity="0.75"/>
  <text x="642" y="278" font-size="11.5" fill="#1a63a8" text-anchor="middle" font-weight="bold">−32 %</text>
  <text x="642" y="192" font-size="11" fill="#666" text-anchor="middle">φ'=20</text>
  <rect x="673" y="200" width="34" height="30" fill="#1a63a8" fill-opacity="0.75"/>
  <text x="690" y="244" font-size="11.5" fill="#1a63a8" text-anchor="middle" font-weight="bold">−15 %</text>
  <text x="690" y="192" font-size="11" fill="#666" text-anchor="middle">30</text>
  <rect x="721" y="190" width="34" height="10" fill="#b02a1a" fill-opacity="0.75"/>
  <text x="738" y="183" font-size="11.5" fill="#b02a1a" text-anchor="middle" font-weight="bold">+5 %</text>
  <text x="738" y="216" font-size="11" fill="#666" text-anchor="middle">40</text>

  <!-- separadores -->
  <line x1="330" y1="70" x2="330" y2="290" stroke="#e5e2dc" stroke-width="1.5"/>
  <line x1="570" y1="70" x2="570" y2="290" stroke="#e5e2dc" stroke-width="1.5"/>

  <!-- takeaway -->
  <rect x="90" y="308" width="760" height="94" rx="6" fill="#f7f6f3" stroke="#8a857c"/>
  <text x="470" y="332" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">Cada tabla va con su ecuación. Mezclarlas no es un error de segundo orden.</text>
  <text x="470" y="356" font-size="12.5" text-anchor="middle" fill="#555">En N_c y N_q, Terzaghi entrega entre 16 % y 27 % más. Pero en N_γ entrega <tspan font-weight="bold" fill="#1a63a8">menos</tspan> a ángulos bajos y</text>
  <text x="470" y="375" font-size="12.5" text-anchor="middle" fill="#555">más a ángulos altos: no hay un factor de corrección único que permita pasar de una tabla a la otra.</text>
  <text x="470" y="394" font-size="12" text-anchor="middle" fill="#888">Tabla 16.1 → Ec. (16.4)  ·  Tabla 16.2 → Ec. (16.9)  ·  Das, 4ª ed., Cap. 16</text>
</svg>
