<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" font-family="Segoe UI, Arial, sans-serif">
  <rect width="940" height="450" fill="#ffffff"/>
  <text x="470" y="28" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">El mismo muro, el mismo suelo: el FS al deslizamiento según qué convenciones se apliquen</text>
  <text x="470" y="49" font-size="12" text-anchor="middle" fill="#666">Ninguna de las cuatro variantes cambia un solo dato del terreno. Cambian las reglas de cuánto contar.</text>

  <!-- eje -->
  <line x1="330" y1="330" x2="330" y2="80" stroke="#8a857c" stroke-width="1.5"/>
  <line x1="330" y1="330" x2="880" y2="330" stroke="#8a857c" stroke-width="1.5"/>
  <text x="330" y="348" font-size="11" fill="#666" text-anchor="middle">0</text>
  <text x="468" y="348" font-size="11" fill="#666" text-anchor="middle">1,0</text>
  <text x="606" y="348" font-size="11" fill="#666" text-anchor="middle">2,0</text>
  <text x="744" y="348" font-size="11" fill="#666" text-anchor="middle">3,0</text>
  <text x="882" y="348" font-size="11" fill="#666" text-anchor="middle">4,0</text>
  <text x="606" y="368" font-size="12" fill="#666" text-anchor="middle">factor de seguridad al deslizamiento</text>

  <!-- linea del minimo -->
  <line x1="537" y1="76" x2="537" y2="336" stroke="#b02a1a" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="543" y="74" font-size="11" fill="#b02a1a" font-weight="bold">mínimo exigido: 1,5</text>

  <!-- fila 1: caso de diseno -->
  <text x="316" y="106" font-size="12.5" fill="#b02a1a" text-anchor="end" font-weight="bold">Reducido a 2/3, sin P_p</text>
  <text x="316" y="122" font-size="11" fill="#b02a1a" text-anchor="end">← el caso de diseño</text>
  <rect x="330" y="94" width="207" height="34" fill="#b02a1a" fill-opacity="0.8"/>
  <text x="549" y="117" font-size="14" fill="#b02a1a" font-weight="bold">1,50</text>

  <!-- fila 2: con Pp -->
  <text x="316" y="166" font-size="12.5" fill="#555" text-anchor="end">Reducido a 2/3, <tspan font-weight="bold">contando P_p</tspan></text>
  <rect x="330" y="150" width="334" height="34" fill="#b35c0e" fill-opacity="0.7"/>
  <text x="676" y="173" font-size="14" fill="#b35c0e" font-weight="bold">2,42</text>
  <text x="722" y="173" font-size="11.5" fill="#888">+61 %</text>

  <!-- fila 3: sin reducir -->
  <text x="316" y="222" font-size="12.5" fill="#555" text-anchor="end"><tspan font-weight="bold">Sin reducir</tspan> φ'₂ y c'₂, sin P_p</text>
  <rect x="330" y="206" width="320" height="34" fill="#b35c0e" fill-opacity="0.7"/>
  <text x="662" y="229" font-size="14" fill="#b35c0e" font-weight="bold">2,32</text>
  <text x="708" y="229" font-size="11.5" fill="#888">+55 %</text>

  <!-- fila 4: nada -->
  <text x="316" y="278" font-size="12.5" fill="#555" text-anchor="end">Sin reducir <tspan font-weight="bold">y</tspan> contando P_p</text>
  <rect x="330" y="262" width="447" height="34" fill="#1c7c3c" fill-opacity="0.7"/>
  <text x="789" y="285" font-size="14" fill="#1c7c3c" font-weight="bold">3,24</text>
  <text x="835" y="285" font-size="11.5" fill="#888">+116 %</text>

  <!-- takeaway -->
  <rect x="60" y="386" width="820" height="52" rx="6" fill="#f7f6f3" stroke="#8a857c"/>
  <text x="470" y="408" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">Las convenciones de cálculo más que duplican el factor de seguridad — y son ellas, no el suelo, las que deciden si el muro pasa.</text>
  <text x="470" y="428" font-size="12" text-anchor="middle" fill="#555">Cada una tiene su justificación física, pero conviene saber que están ahí y por qué: un muro «al límite» puede estarlo por el método.</text>
</svg>
