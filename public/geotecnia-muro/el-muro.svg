<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ma3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="mr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b02a1a"/>
    </marker>
  </defs>
  <rect width="940" height="470" fill="#ffffff"/>
  <text x="470" y="28" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">Un muro en voladizo de 6 m — dosificado según §15.3 y verificado por los tres criterios</text>

  <!-- ===== geometria: escala 40 px por metro, sello en y = 330 ===== -->
  <!-- terreno del relleno -->
  <rect x="336" y="110" width="230" height="200" fill="#e8e0cd" stroke="#8a857c" stroke-width="1"/>
  <line x1="336" y1="110" x2="580" y2="110" stroke="#8a857c" stroke-width="1.4"/>
  <!-- suelo de la puntera -->
  <rect x="160" y="290" width="160" height="40" fill="#dcd8d0" stroke="#8a857c" stroke-width="1"/>
  <line x1="160" y1="290" x2="320" y2="290" stroke="#8a857c" stroke-width="1.4"/>
  <!-- suelo de fundacion -->
  <rect x="160" y="330" width="420" height="46" fill="#c9c2b4" stroke="#8a857c" stroke-width="1"/>

  <!-- muro: zapata + alzado -->
  <rect x="320" y="310" width="140" height="20" fill="#dcd8d0" stroke="#555" stroke-width="1.6"/>
  <rect x="360" y="110" width="16" height="200" fill="#dcd8d0" stroke="#555" stroke-width="1.6"/>

  <!-- empuje activo -->
  <polygon points="376,110 407,310 376,310" fill="#b02a1a" fill-opacity="0.35" stroke="#b02a1a" stroke-width="1.2"/>
  <line x1="420" y1="243" x2="470" y2="243" stroke="#b02a1a" stroke-width="2.4" marker-start="url(#mr3)"/>
  <text x="476" y="240" font-size="12.5" fill="#b02a1a" font-weight="bold">P_a = 100 kN/m</text>
  <text x="476" y="256" font-size="11" fill="#b02a1a">a 2,00 m del sello</text>

  <!-- pesos -->
  <line x1="368" y1="150" x2="368" y2="182" stroke="#666" stroke-width="1.8" marker-end="url(#ma3)"/>
  <text x="356" y="168" font-size="10.5" fill="#666" text-anchor="end">53</text>
  <line x1="418" y1="180" x2="418" y2="212" stroke="#666" stroke-width="1.8" marker-end="url(#ma3)"/>
  <text x="426" y="198" font-size="10.5" fill="#666">208 (suelo sobre el talón)</text>
  <line x1="338" y1="286" x2="338" y2="306" stroke="#666" stroke-width="1.8" marker-end="url(#ma3)"/>
  <text x="330" y="300" font-size="10.5" fill="#666" text-anchor="end">42</text>

  <!-- cotas -->
  <line x1="300" y1="110" x2="300" y2="330" stroke="#666" stroke-width="1" marker-start="url(#ma3)" marker-end="url(#ma3)"/>
  <text x="292" y="224" font-size="12" fill="#666" text-anchor="end" font-weight="bold">H = 6,0 m</text>
  <line x1="320" y1="350" x2="460" y2="350" stroke="#666" stroke-width="1" marker-start="url(#ma3)" marker-end="url(#ma3)"/>
  <text x="390" y="366" font-size="12" fill="#666" text-anchor="middle" font-weight="bold">B = 3,5 m</text>
  <line x1="176" y1="290" x2="176" y2="330" stroke="#1c7c3c" stroke-width="1" marker-start="url(#ma3)" marker-end="url(#ma3)"/>
  <text x="184" y="314" font-size="10.5" fill="#1c7c3c">D_f = 1,0</text>

  <!-- ===== datos ===== -->
  <line x1="620" y1="60" x2="620" y2="380" stroke="#e5e2dc" stroke-width="1.5"/>
  <text x="650" y="86" font-size="13" fill="#222" font-weight="bold">Materiales</text>
  <g font-size="12">
    <text x="650" y="112" fill="#555">Relleno</text>
    <text x="890" y="112" fill="#222" text-anchor="end" font-weight="bold">φ' = 32° · γ = 18 · c' = 0</text>
    <text x="650" y="134" fill="#555">Suelo de fundación</text>
    <text x="890" y="134" fill="#222" text-anchor="end" font-weight="bold">φ'₂ = 28° · c'₂ = 20 kPa</text>
    <text x="650" y="156" fill="#555">Hormigón</text>
    <text x="890" y="156" fill="#222" text-anchor="end" font-weight="bold">γ_c = 24 kN/m³</text>
  </g>
  <line x1="650" y1="172" x2="890" y2="172" stroke="#e5e2dc" stroke-width="1.2"/>

  <text x="650" y="198" font-size="13" fill="#222" font-weight="bold">Acciones</text>
  <g font-size="12">
    <text x="650" y="224" fill="#555">Empuje activo (Rankine)</text>
    <text x="890" y="224" fill="#b02a1a" text-anchor="end" font-weight="bold">P_a = 99,6 kN/m</text>
    <text x="650" y="246" fill="#555">Peso total (Σ V)</text>
    <text x="890" y="246" fill="#222" text-anchor="end" font-weight="bold">302,7 kN/m</text>
    <text x="650" y="268" fill="#555">Momento resistente</text>
    <text x="890" y="268" fill="#222" text-anchor="end" font-weight="bold">646,2 kN·m/m</text>
    <text x="650" y="290" fill="#555">Momento volcador</text>
    <text x="890" y="290" fill="#222" text-anchor="end" font-weight="bold">199,1 kN·m/m</text>
  </g>

  <rect x="650" y="308" width="240" height="60" rx="5" fill="#efece6" stroke="#8a857c" stroke-width="1.2"/>
  <text x="666" y="330" font-size="11.5" fill="#555">El 69 % del peso resistente no es el muro:</text>
  <text x="666" y="350" font-size="12.5" fill="#222" font-weight="bold">es el suelo que descansa sobre el talón.</text>

  <!-- takeaway -->
  <rect x="60" y="396" width="820" height="58" rx="6" fill="#f7f6f3" stroke="#8a857c"/>
  <text x="470" y="418" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">Un muro en voladizo no resiste con su masa: resiste con el peso del suelo que carga sobre el talón.</text>
  <text x="470" y="440" font-size="12" text-anchor="middle" fill="#555">De los 303 kN/m verticales, 208 son relleno. Por eso la longitud del talón es la variable de dimensionamiento más eficaz.</text>
</svg>
