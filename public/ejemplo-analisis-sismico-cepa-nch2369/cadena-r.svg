<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="330" fill="#ffffff"/>

  <text x="450" y="28" font-size="15.5" text-anchor="middle" fill="#222" font-weight="bold">Los cuatro factores R de la cadena, y cuál multiplica de verdad</text>
  <text x="450" y="48" font-size="12" text-anchor="middle" fill="#666">cepa arriostrada de dos niveles · zona 3 · suelo D · T* = 0,1762 s · NCh 2369:2025</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a857c"/>
    </marker>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a8641b"/>
    </marker>
  </defs>

  <!-- ================= las cuatro cajas de la cadena ================= -->
  <!-- caja 1: R de tabla -->
  <rect x="55" y="82" width="151" height="64" rx="4" fill="#f7f5f1" stroke="#e0dbd2" stroke-width="1.2"/>
  <text x="130" y="104" font-size="10.5" text-anchor="middle" fill="#8a857c">Tabla 7, fila 5.3</text>
  <text x="130" y="130" font-size="18" text-anchor="middle" fill="#333" font-weight="bold">R = 5</text>

  <!-- caja 2: R* -->
  <rect x="268" y="82" width="151" height="64" rx="4" fill="#f7f5f1" stroke="#e0dbd2" stroke-width="1.2"/>
  <text x="343" y="104" font-size="10.5" text-anchor="middle" fill="#8a857c">el que divide el espectro</text>
  <text x="343" y="130" font-size="18" text-anchor="middle" fill="#1b4a6e" font-weight="bold">R* = 3,38</text>

  <!-- caja 3: R1 -->
  <rect x="481" y="82" width="151" height="64" rx="4" fill="#f7f5f1" stroke="#e0dbd2" stroke-width="1.2"/>
  <text x="556" y="104" font-size="10.5" text-anchor="middle" fill="#8a857c">el del diseño por capacidad</text>
  <text x="556" y="130" font-size="18" text-anchor="middle" fill="#1b4a6e" font-weight="bold">R<tspan font-size="12" dy="4">1</tspan><tspan dy="-4"> = 3,38</tspan></text>

  <!-- caja 4: 0,7 R1 -->
  <rect x="694" y="82" width="151" height="64" rx="4" fill="#fdf6ec" stroke="#d9b98a" stroke-width="1.4"/>
  <text x="769" y="104" font-size="10.5" text-anchor="middle" fill="#8a857c">el multiplicador de demanda</text>
  <text x="769" y="130" font-size="18" text-anchor="middle" fill="#a8641b" font-weight="bold">0,7R<tspan font-size="12" dy="4">1</tspan><tspan dy="-4"> = 2,37</tspan></text>

  <!-- ================= flechas ================= -->
  <line x1="212" y1="114" x2="262" y2="114" stroke="#8a857c" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="237" y="106" font-size="11" text-anchor="middle" fill="#a8641b" font-weight="bold">× 0,676</text>
  <text x="237" y="133" font-size="10.5" text-anchor="middle" fill="#8a857c">Ec. (1b)</text>

  <line x1="425" y1="114" x2="475" y2="114" stroke="#8a857c" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="450" y="106" font-size="11" text-anchor="middle" fill="#333" font-weight="bold">× 1,000</text>
  <text x="450" y="133" font-size="10.5" text-anchor="middle" fill="#8a857c">Ec. (14)</text>

  <line x1="638" y1="114" x2="688" y2="114" stroke="#a8641b" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="663" y="106" font-size="11" text-anchor="middle" fill="#a8641b" font-weight="bold">× 0,70</text>
  <text x="663" y="133" font-size="10.5" text-anchor="middle" fill="#8a857c">cláusula 8</text>

  <!-- ================= por qué cada uno vale lo que vale ================= -->
  <text x="130" y="172" font-size="10.5" text-anchor="middle" fill="#555">marcos arriostrados con</text>
  <text x="130" y="188" font-size="10.5" text-anchor="middle" fill="#555">anclajes dúctiles · ξ = 0,02</text>
  <text x="130" y="204" font-size="10.5" text-anchor="middle" fill="#8a857c">el valor de catálogo</text>

  <text x="343" y="172" font-size="10.5" text-anchor="middle" fill="#555">T* = 0,1762 s &lt; C<tspan font-size="8" dy="3">r</tspan><tspan dy="-3">T</tspan><tspan font-size="8" dy="3">1</tspan><tspan dy="-3"> = 0,328 s</tspan></text>
  <text x="343" y="188" font-size="10.5" text-anchor="middle" fill="#555">entra por la rampa, no por R</text>
  <text x="343" y="204" font-size="10.5" text-anchor="middle" fill="#8a857c">lo baja el período, nada más</text>

  <text x="556" y="172" font-size="10.5" text-anchor="middle" fill="#555">Q<tspan font-size="8" dy="3">0</tspan><tspan dy="-3"> = 599 kN &gt; Q</tspan><tspan font-size="8" dy="3">0</tspan><tspan font-size="8">mín</tspan><tspan dy="-3"> = 189 kN</tspan></text>
  <text x="556" y="188" font-size="10.5" text-anchor="middle" fill="#555">el mínimo de §5.12 no muerde:</text>
  <text x="556" y="204" font-size="10.5" text-anchor="middle" fill="#8a857c">mín(Q<tspan font-size="8" dy="3">0</tspan><tspan dy="-3">/Q</tspan><tspan font-size="8" dy="3">0</tspan><tspan font-size="8">mín</tspan><tspan dy="-3"> ; 1) = 1,00</tspan></text>

  <text x="769" y="172" font-size="10.5" text-anchor="middle" fill="#555">amplifica la demanda del</text>
  <text x="769" y="188" font-size="10.5" text-anchor="middle" fill="#555">fusible y de todo lo que</text>
  <text x="769" y="204" font-size="10.5" text-anchor="middle" fill="#8a857c">cuelga de él</text>

  <!-- ================= el cierre ================= -->
  <rect x="55" y="228" width="790" height="80" fill="#f7f5f1" stroke="#e0dbd2" stroke-width="1"/>
  <text x="75" y="252" font-size="12.5" fill="#222" font-weight="bold">R ≥ R* ≥ R<tspan font-size="9" dy="3">1</tspan><tspan dy="-3"> por construcción: el de la Tabla 7 nunca es el que multiplica.</tspan></text>
  <text x="75" y="274" font-size="12" fill="#555">Lo único que separa R* de R es el período. Una cepa rígida no alcanza el R de su propia fila.</text>
  <text x="75" y="296" font-size="12" fill="#a8641b" font-weight="bold">Usar el R = 5 de la tabla donde va R<tspan font-size="9" dy="3">1</tspan><tspan dy="-3"> da 0,7R</tspan><tspan font-size="9" dy="3">1</tspan><tspan dy="-3"> = 3,50 en vez de 2,37: un 48 % más de demanda de capacidad.</tspan></text>
</svg>
