<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="400" fill="#ffffff"/>

  <text x="450" y="28" font-size="15.5" text-anchor="middle" fill="#222" font-weight="bold">La banda de §5.12 y §5.13: el mínimo es para estructuras flexibles, el máximo para rígidas</text>
  <text x="450" y="48" font-size="12" text-anchor="middle" fill="#666">coeficiente sísmico de diseño C(T*) según el período de la estructura · zona 3 · suelo D · I = 1,0 · R = 5 · ξ = 0,02</text>

  <defs>
    <marker id="dn2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a8641b"/>
    </marker>
  </defs>

  <!-- marco: x 90..690 = T de 0 a 2,0 s (300 px/s) · y 290..80 = C de 0 a 0,60 (350 px/unidad) -->

  <!-- los tres regimenes -->
  <rect x="90" y="80" width="172.7" height="210" fill="#fbf3e8"/>
  <rect x="262.7" y="80" width="288.4" height="210" fill="#eef2e9"/>
  <rect x="551.1" y="80" width="138.9" height="210" fill="#e9eff5"/>

  <!-- grilla -->
  <line x1="90" y1="255" x2="690" y2="255" stroke="#eeebe5" stroke-width="1"/>
  <line x1="90" y1="220" x2="690" y2="220" stroke="#eeebe5" stroke-width="1"/>
  <line x1="90" y1="185" x2="690" y2="185" stroke="#eeebe5" stroke-width="1"/>
  <line x1="90" y1="150" x2="690" y2="150" stroke="#eeebe5" stroke-width="1"/>
  <line x1="90" y1="115" x2="690" y2="115" stroke="#eeebe5" stroke-width="1"/>
  <line x1="165" y1="80" x2="165" y2="290" stroke="#eeebe5" stroke-width="1"/>
  <line x1="240" y1="80" x2="240" y2="290" stroke="#eeebe5" stroke-width="1"/>
  <line x1="315" y1="80" x2="315" y2="290" stroke="#eeebe5" stroke-width="1"/>
  <line x1="390" y1="80" x2="390" y2="290" stroke="#eeebe5" stroke-width="1"/>
  <line x1="465" y1="80" x2="465" y2="290" stroke="#eeebe5" stroke-width="1"/>
  <line x1="540" y1="80" x2="540" y2="290" stroke="#eeebe5" stroke-width="1"/>
  <line x1="615" y1="80" x2="615" y2="290" stroke="#eeebe5" stroke-width="1"/>

  <!-- ejes -->
  <line x1="90" y1="290" x2="690" y2="290" stroke="#8a857c" stroke-width="1.4"/>
  <line x1="90" y1="80" x2="90" y2="290" stroke="#8a857c" stroke-width="1.4"/>
  <text x="90" y="306" font-size="10.5" text-anchor="middle" fill="#666">0</text>
  <text x="240" y="306" font-size="10.5" text-anchor="middle" fill="#666">0,50</text>
  <text x="390" y="306" font-size="10.5" text-anchor="middle" fill="#666">1,00</text>
  <text x="540" y="306" font-size="10.5" text-anchor="middle" fill="#666">1,50</text>
  <text x="690" y="306" font-size="10.5" text-anchor="middle" fill="#666">2,00</text>
  <text x="390" y="324" font-size="11.5" text-anchor="middle" fill="#444">período fundamental T* [s]</text>

  <text x="82" y="294" font-size="10.5" text-anchor="end" fill="#666">0</text>
  <text x="82" y="224" font-size="10.5" text-anchor="end" fill="#666">0,20</text>
  <text x="82" y="154" font-size="10.5" text-anchor="end" fill="#666">0,40</text>
  <text x="82" y="84" font-size="10.5" text-anchor="end" fill="#666">0,60</text>
  <text x="30" y="185" font-size="11.5" text-anchor="middle" fill="#444" transform="rotate(-90 30 185)">coeficiente sísmico C = Q₀ / P</text>

  <!-- C(T*) con R* recalculado en cada T por la Ec. (1b) -->
  <polyline fill="none" stroke="#1b4a6e" stroke-width="2.2"
    points="90.0,101.5 96.0,105.8 102.0,109.2 108.0,112.2 114.0,114.9 120.0,117.5 126.0,120.2 132.0,122.8 138.0,125.6 144.0,128.5 150.0,131.6 156.0,134.8 162.0,138.2 168.0,141.8 174.0,145.6 180.0,149.4 186.0,153.4 192.0,154.1 198.0,152.9 204.0,152.1 210.0,151.7 216.0,151.6 222.0,151.9 228.0,152.5 234.0,153.3 240.0,154.4 246.0,155.8 252.0,157.3 258.0,159.0 264.0,160.8 270.0,162.8 276.0,164.8 282.0,166.9 288.0,169.1 294.0,171.4 300.0,173.6 306.0,175.9 312.0,178.2 318.0,180.5 324.0,182.8 330.0,185.0 336.0,187.3 342.0,189.5 348.0,191.6 354.0,193.8 360.0,195.9 366.0,197.9 372.0,200.0 378.0,201.9 384.0,203.9 390.0,205.7 396.0,207.6 402.0,209.4 408.0,211.1 414.0,212.8 420.0,214.4 426.0,216.0 432.0,217.6 438.0,219.1 444.0,220.6 450.0,222.0 456.0,223.4 462.0,224.8 468.0,226.1 474.0,227.4 480.0,228.6 486.0,229.8 492.0,231.0 498.0,232.2 504.0,233.3 510.0,234.4 516.0,235.4 522.0,236.4 528.0,237.4 534.0,238.4 540.0,239.3 546.0,240.2 552.0,241.1 558.0,242.0 564.0,242.8 570.0,243.7 576.0,244.5 582.0,245.2 588.0,246.0 594.0,246.7 600.0,247.5 606.0,248.2 612.0,248.8 618.0,249.5 624.0,250.2 630.0,250.8 636.0,251.4 642.0,252.0 648.0,252.6 654.0,253.2 660.0,253.7 666.0,254.3 672.0,254.8 678.0,255.3 684.0,255.8 690.0,256.3"/>

  <!-- el quiebre en Cr T1, donde R* deja de subir -->
  <circle cx="188.4" cy="155.1" r="3" fill="none" stroke="#8a857c" stroke-width="1.2"/>
  <line x1="188.4" y1="155.1" x2="248" y2="126" stroke="#8a857c" stroke-width="0.9"/>
  <text x="253" y="122" font-size="10.5" fill="#666">quiebre en C<tspan font-size="8" dy="3">r</tspan><tspan dy="-3">T</tspan><tspan font-size="8" dy="3">1</tspan><tspan dy="-3"> = 0,328 s:</tspan></text>
  <text x="253" y="136" font-size="10.5" fill="#666">R* llega a R y deja de subir</text>

  <!-- las dos bandas -->
  <line x1="90" y1="160.4" x2="690" y2="160.4" stroke="#a8641b" stroke-width="1.8" stroke-dasharray="6 4"/>
  <line x1="90" y1="241.0" x2="690" y2="241.0" stroke="#2d6b9c" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="686" y="156" font-size="11" text-anchor="end" fill="#a8641b" font-weight="bold">Q<tspan font-size="8" dy="3">0</tspan><tspan font-size="8">máx</tspan><tspan dy="-3">/P = 0,370 — Ec. (13), §5.13</tspan></text>
  <text x="300" y="260" font-size="11" fill="#2d6b9c" font-weight="bold">Q<tspan font-size="8" dy="3">0</tspan><tspan font-size="8">mín</tspan><tspan dy="-3">/P = 0,140 — Ec. (12), §5.12</tspan></text>

  <!-- rotulos de los tres regimenes -->
  <text x="176" y="70" font-size="11" text-anchor="middle" fill="#a8641b" font-weight="bold">T* &lt; 0,58 s</text>
  <text x="176" y="284" font-size="10.5" text-anchor="middle" fill="#a8641b">el máximo recorta</text>
  <text x="407" y="70" font-size="11" text-anchor="middle" fill="#4a6b3a" font-weight="bold">0,58 s ≤ T* &lt; 1,54 s</text>
  <text x="407" y="284" font-size="10.5" text-anchor="middle" fill="#4a6b3a">ni una cosa ni la otra</text>
  <text x="620" y="70" font-size="11" text-anchor="middle" fill="#2d6b9c" font-weight="bold">T* ≥ 1,54 s</text>
  <text x="620" y="284" font-size="10.5" text-anchor="middle" fill="#2d6b9c">el mínimo escala</text>

  <!-- la cepa -->
  <line x1="142.9" y1="127.9" x2="142.9" y2="188" stroke="#8a857c" stroke-width="1.1" stroke-dasharray="4 3"/>
  <circle cx="142.9" cy="127.9" r="4.5" fill="#1b4a6e"/>
  <line x1="142.9" y1="134" x2="142.9" y2="157" stroke="#a8641b" stroke-width="2" marker-end="url(#dn2)"/>
  <circle cx="142.9" cy="160.4" r="4" fill="#a8641b"/>
  <text x="96" y="204" font-size="11.5" fill="#1b4a6e" font-weight="bold">la cepa: T* = 0,1762 s</text>
  <text x="96" y="221" font-size="11" fill="#1b4a6e">C(T*) = 0,463 — el análisis</text>
  <text x="96" y="237" font-size="11" fill="#a8641b" font-weight="bold">0,370 — lo que se diseña (−16,6 %)</text>

  <!-- ================= panel de cierre ================= -->
  <rect x="55" y="336" width="790" height="52" fill="#f7f5f1" stroke="#e0dbd2" stroke-width="1"/>
  <text x="75" y="358" font-size="12.5" fill="#222" font-weight="bold">Las dos cláusulas ponen una banda alrededor del análisis, y la banda no depende del análisis: es P por una constante del sitio y del sistema.</text>
  <text x="75" y="378" font-size="12" fill="#555">Lo único que decide cuál muerde es dónde cae T*. El análisis modal entregó Q<tspan font-size="9" dy="3">0</tspan><tspan dy="-3"> = 599 kN y se diseña con 500 kN.</tspan></text>
</svg>
