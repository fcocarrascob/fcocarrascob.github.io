<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="720" height="290" fill="#ffffff"/>

  <!-- Eje normalizado: x = 130 + 95 * (lambda / sqrt(E/Fy)) -->

  <!-- ── Fila 1: compresión (Tabla B4.1a) ── -->
  <text x="12" y="46" font-size="13" font-weight="600" fill="#0f172a">Compresión</text>
  <text x="12" y="62" font-size="11" fill="#64748b">Tabla B4.1a, caso 5</text>

  <rect x="130" y="34" width="141.6" height="34" fill="#dcfce7" stroke="#94a3b8" stroke-width="1"/>
  <rect x="271.6" y="34" width="428.4" height="34" fill="#fee2e2" stroke="#94a3b8" stroke-width="1"/>
  <text x="200" y="56" font-size="12" text-anchor="middle" fill="#166534">no esbelta</text>
  <text x="486" y="56" font-size="12" text-anchor="middle" fill="#991b1b">esbelta &#8594; Cap. E7, área efectiva</text>

  <line x1="271.6" y1="28" x2="271.6" y2="74" stroke="#0f172a" stroke-width="1.5"/>
  <text x="271.6" y="22" font-size="11" text-anchor="middle" fill="#0f172a">1,49</text>

  <!-- ── Fila 2: flexión (Tabla B4.1b) ── -->
  <text x="12" y="150" font-size="13" font-weight="600" fill="#0f172a">Flexión</text>
  <text x="12" y="166" font-size="11" fill="#64748b">Tabla B4.1b, caso 15</text>

  <rect x="130" y="138" width="357.2" height="34" fill="#dcfce7" stroke="#94a3b8" stroke-width="1"/>
  <rect x="487.2" y="138" width="184.3" height="34" fill="#fef3c7" stroke="#94a3b8" stroke-width="1"/>
  <rect x="671.5" y="138" width="28.5" height="34" fill="#fee2e2" stroke="#94a3b8" stroke-width="1"/>
  <text x="308" y="160" font-size="12" text-anchor="middle" fill="#166534">compacta &#8594; F2, M&#8346; completo</text>
  <text x="579" y="160" font-size="12" text-anchor="middle" fill="#92400e">no compacta</text>

  <line x1="487.2" y1="132" x2="487.2" y2="178" stroke="#0f172a" stroke-width="1.5"/>
  <text x="487.2" y="126" font-size="11" text-anchor="middle" fill="#0f172a">3,76</text>
  <line x1="671.5" y1="132" x2="671.5" y2="178" stroke="#0f172a" stroke-width="1.5"/>
  <text x="671.5" y="126" font-size="11" text-anchor="middle" fill="#0f172a">5,70</text>

  <!-- ── La sección del ejemplo ── -->
  <line x1="340.5" y1="20" x2="340.5" y2="238" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 3"/>
  <circle cx="340.5" cy="51" r="4.5" fill="#b91c1c"/>
  <circle cx="340.5" cy="155" r="4.5" fill="#b91c1c"/>
  <text x="340.5" y="256" font-size="12" text-anchor="middle" font-weight="600" fill="#b91c1c">h/t<tspan font-size="9" dy="2.5">w</tspan><tspan dy="-2.5"> = 62,7 &#8594; 2,22</tspan></text>
  <text x="340.5" y="272" font-size="11" text-anchor="middle" fill="#b91c1c">H soldada 400 &#215; 200, alas 12 mm, alma 6 mm, F<tspan font-size="9" dy="2.5">y</tspan><tspan dy="-2.5"> = 250 MPa</tspan></text>

  <!-- ── Eje ── -->
  <line x1="130" y1="200" x2="700" y2="200" stroke="#334155" stroke-width="1"/>
  <g font-size="10" fill="#64748b" text-anchor="middle">
    <line x1="130" y1="200" x2="130" y2="205" stroke="#334155"/><text x="130" y="217">0</text>
    <line x1="225" y1="200" x2="225" y2="205" stroke="#334155"/><text x="225" y="217">1</text>
    <line x1="320" y1="200" x2="320" y2="205" stroke="#334155"/><text x="320" y="217">2</text>
    <line x1="415" y1="200" x2="415" y2="205" stroke="#334155"/><text x="415" y="217">3</text>
    <line x1="510" y1="200" x2="510" y2="205" stroke="#334155"/><text x="510" y="217">4</text>
    <line x1="605" y1="200" x2="605" y2="205" stroke="#334155"/><text x="605" y="217">5</text>
    <line x1="700" y1="200" x2="700" y2="205" stroke="#334155"/><text x="700" y="217">6</text>
  </g>
  <text x="700" y="233" font-size="11" text-anchor="end" fill="#334155">&#955; / &#8730;(E/F<tspan font-size="9" dy="2.5">y</tspan><tspan dy="-2.5">)</tspan></text>
</svg>
