<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ea" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="940" height="500" fill="#ffffff"/>
  <text x="470" y="28" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">Los tres umbrales de excentricidad, y dónde cae cada combinación</text>
  <text x="470" y="49" font-size="12" text-anchor="middle" fill="#666">Con la base en despegue, el área apoyada vale 3(1/2 − e/B). De ahí salen los límites de 10.1.4.</text>

  <!-- ======== escala de e/B ======== -->
  <text x="516" y="80" font-size="12.5" text-anchor="end" fill="#b02a1a" font-weight="bold">el caso: e/B = 0,289 → 63,3 % apoyado</text>
  <path d="M524.6,84 l-6,-10 l12,0 z" fill="#b02a1a"/>

  <rect x="120" y="90" width="233.3" height="30" fill="#1a63a8" fill-opacity="0.12" stroke="#8a857c" stroke-width="0.8"/>
  <rect x="353.3" y="90" width="93.4" height="30" fill="#2e7d32" fill-opacity="0.14" stroke="#8a857c" stroke-width="0.8"/>
  <rect x="446.7" y="90" width="140" height="30" fill="#b35c0e" fill-opacity="0.16" stroke="#8a857c" stroke-width="0.8"/>
  <rect x="586.7" y="90" width="233.3" height="30" fill="#b02a1a" fill-opacity="0.16" stroke="#8a857c" stroke-width="0.8"/>
  <line x1="524.6" y1="86" x2="524.6" y2="124" stroke="#b02a1a" stroke-width="2"/>

  <g font-size="10.5" fill="#666" text-anchor="middle">
    <text x="236" y="110">100 % apoyada</text>
    <text x="400" y="110">≥ 80 %</text>
    <text x="488" y="110">≥ 50 %</text>
    <text x="703" y="110">&lt; 50 %</text>
  </g>

  <g stroke="#8a857c" stroke-width="1">
    <line x1="120" y1="120" x2="120" y2="130"/>
    <line x1="353.3" y1="120" x2="353.3" y2="130"/>
    <line x1="446.7" y1="120" x2="446.7" y2="130"/>
    <line x1="586.7" y1="120" x2="586.7" y2="130"/>
    <line x1="820" y1="120" x2="820" y2="130"/>
  </g>
  <g font-size="11" text-anchor="middle">
    <text x="120" y="146" fill="#222" font-weight="bold">0</text>
    <text x="353.3" y="146" fill="#222" font-weight="bold">0,167</text>
    <text x="446.7" y="146" fill="#222" font-weight="bold">0,233</text>
    <text x="586.7" y="146" fill="#222" font-weight="bold">0,333</text>
    <text x="820" y="146" fill="#222" font-weight="bold">0,50</text>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#666">
    <text x="353.3" y="162">núcleo central</text>
    <text x="446.7" y="162">límite 80 %</text>
    <text x="586.7" y="162">límite 50 %</text>
    <text x="820" y="162">vuelco</text>
  </g>
  <text x="120" y="162" font-size="10.5" fill="#666" text-anchor="start">e/B</text>

  <!-- ======== diagramas de presión ======== -->
  <text x="240" y="206" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">Sismo, compresión · e/B = 0,080</text>
  <text x="240" y="224" font-size="11.5" text-anchor="middle" fill="#1a63a8">100 % de la base apoyada</text>

  <rect x="140" y="238" width="200" height="16" fill="#dcd8d0" stroke="#8a857c" stroke-width="1.4"/>
  <polygon points="140,254 340,254 340,336.8 140,282.8" fill="#1a63a8" fill-opacity="0.18" stroke="#1a63a8" stroke-width="1.5"/>
  <text x="134" y="288" font-size="11" fill="#555" text-anchor="end">0,48</text>
  <text x="348" y="342" font-size="11.5" fill="#1a63a8" font-weight="bold">q_max = 1,38 kgf/cm²</text>
  <line x1="140" y1="360" x2="340" y2="360" stroke="#666" stroke-width="1" marker-start="url(#ea)" marker-end="url(#ea)"/>
  <text x="240" y="376" font-size="11" fill="#666" text-anchor="middle">3,00 m en contacto</text>

  <text x="680" y="206" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">Sismo, levantamiento · e/B = 0,289</text>
  <text x="680" y="224" font-size="11.5" text-anchor="middle" fill="#b02a1a" font-weight="bold">63,3 % apoyada — no cumple el 80 %</text>

  <rect x="580" y="238" width="200" height="16" fill="#dcd8d0" stroke="#8a857c" stroke-width="1.4"/>
  <polygon points="653.3,254 780,254 780,303.2" fill="#b02a1a" fill-opacity="0.18" stroke="#b02a1a" stroke-width="1.5"/>
  <line x1="580" y1="254" x2="653.3" y2="254" stroke="#b02a1a" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="616" y="276" font-size="11" fill="#b02a1a" text-anchor="middle">despegado</text>
  <text x="788" y="308" font-size="11.5" fill="#b02a1a" font-weight="bold">q_max = 0,82 kgf/cm²</text>
  <line x1="653.3" y1="360" x2="780" y2="360" stroke="#666" stroke-width="1" marker-start="url(#ea)" marker-end="url(#ea)"/>
  <text x="716" y="376" font-size="11" fill="#666" text-anchor="middle">1,90 m en contacto</text>
  <line x1="580" y1="360" x2="653.3" y2="360" stroke="#b02a1a" stroke-width="1" marker-start="url(#ea)" marker-end="url(#ea)"/>
  <text x="616" y="376" font-size="11" fill="#b02a1a" text-anchor="middle">1,10 m</text>

  <!-- takeaway -->
  <rect x="60" y="410" width="820" height="60" rx="6" fill="#f7f6f3" stroke="#8a857c"/>
  <text x="470" y="434" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">La combinación que despega es la que menos presión produce: 0,82 contra 1,38 kgf/cm².</text>
  <text x="470" y="456" font-size="12.5" text-anchor="middle" fill="#555">Son problemas distintos, y por eso el 80 % de área apoyada es una verificación aparte y no un subproducto de la tensión de contacto.</text>
</svg>
