<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" font-family="Segoe UI, Arial, sans-serif">
  <rect width="940" height="450" fill="#ffffff"/>
  <text x="470" y="28" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">Los dos términos saturan — alargar el pilote deja de comprar capacidad</text>
  <text x="470" y="49" font-size="12" text-anchor="middle" fill="#666">Pilote hincado de alto desplazamiento, D = 0,40 m, arena φ' = 32°, N₆₀ = 20</text>

  <!-- ejes -->
  <line x1="130" y1="300" x2="430" y2="300" stroke="#8a857c" stroke-width="1.5"/>
  <line x1="130" y1="300" x2="130" y2="80" stroke="#8a857c" stroke-width="1.5"/>
  <text x="122" y="94" font-size="11" fill="#666" text-anchor="end">2500</text>
  <text x="122" y="178" font-size="11" fill="#666" text-anchor="end">1500</text>
  <text x="122" y="262" font-size="11" fill="#666" text-anchor="end">500</text>
  <text x="122" y="304" font-size="11" fill="#666" text-anchor="end">0</text>
  <text x="86" y="190" font-size="11.5" fill="#666" transform="rotate(-90 86 190)" text-anchor="middle">capacidad (kN)</text>
  <text x="130" y="318" font-size="11" fill="#666" text-anchor="middle">0</text>
  <text x="246" y="318" font-size="11" fill="#666" text-anchor="middle">10</text>
  <text x="362" y="318" font-size="11" fill="#666" text-anchor="middle">20</text>
  <text x="420" y="318" font-size="11" fill="#666" text-anchor="middle">25</text>
  <text x="280" y="338" font-size="12" fill="#666" text-anchor="middle">longitud del pilote (m)</text>

  <!-- profundidad critica -->
  <line x1="200" y1="300" x2="200" y2="82" stroke="#8a857c" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text x="205" y="94" font-size="10" fill="#666">L' = 15D = 6 m</text>

  <!-- Qs SIN profundidad critica (el error) -->
  <polyline points="130,300 200,288 246,267 304,226 362,167 420,93"
            fill="none" stroke="#b02a1a" stroke-width="2.4" stroke-dasharray="7 4"/>
  <text x="398" y="86" font-size="11.5" fill="#b02a1a" text-anchor="end" font-weight="bold">Q_s si se ignora L'</text>

  <!-- Qs CON profundidad critica -->
  <polyline points="130,300 200,288 246,272 304,252 362,232 420,213"
            fill="none" stroke="#1c7c3c" stroke-width="2.8"/>
  <text x="304" y="268" font-size="11.5" fill="#1c7c3c" font-weight="bold">Q_s real</text>

  <!-- Qp -->
  <polyline points="130,300 176,216 420,216" fill="none" stroke="#1a63a8" stroke-width="2.8"/>
  <text x="216" y="209" font-size="11.5" fill="#1a63a8" font-weight="bold">Q_p</text>

  <circle cx="420" cy="214" r="4.5" fill="none" stroke="#222" stroke-width="1.4"/>

  <!-- brecha -->
  <line x1="420" y1="93" x2="420" y2="213" stroke="#b02a1a" stroke-width="1.2"/>
  <text x="432" y="155" font-size="12" fill="#b02a1a" font-weight="bold">+137 %</text>

  <!-- ============ DERECHA ============ -->
  <line x1="490" y1="70" x2="490" y2="350" stroke="#e5e2dc" stroke-width="1.5"/>
  <text x="700" y="92" font-size="13.5" text-anchor="middle" fill="#222" font-weight="bold">Ignorar la profundidad crítica sobreestima el fuste</text>

  <line x1="540" y1="112" x2="880" y2="112" stroke="#8a857c" stroke-width="1.2"/>
  <text x="560" y="106" font-size="11" fill="#666">L</text>
  <text x="700" y="106" font-size="11" fill="#666" text-anchor="middle">Q_s real</text>
  <text x="870" y="106" font-size="11" fill="#666" text-anchor="end">sobreestimación</text>
  <g font-size="12.5">
    <text x="560" y="134" fill="#555">6 m</text><text x="716" y="134" fill="#222" text-anchor="end">142 kN</text><text x="870" y="134" fill="#888" text-anchor="end">0 %</text>
    <text x="560" y="158" fill="#555">10 m</text><text x="716" y="158" fill="#222" text-anchor="end">331 kN</text><text x="870" y="158" fill="#b35c0e" text-anchor="end">+19 %</text>
    <text x="560" y="182" fill="#555">15 m</text><text x="716" y="182" fill="#222" text-anchor="end">568 kN</text><text x="870" y="182" fill="#b35c0e" text-anchor="end">+56 %</text>
    <text x="560" y="206" fill="#555">20 m</text><text x="716" y="206" fill="#222" text-anchor="end">805 kN</text><text x="870" y="206" fill="#b02a1a" text-anchor="end" font-weight="bold">+96 %</text>
    <text x="560" y="230" fill="#555">25 m</text><text x="716" y="230" fill="#222" text-anchor="end">1041 kN</text><text x="870" y="230" fill="#b02a1a" text-anchor="end" font-weight="bold">+137 %</text>
  </g>

  <rect x="540" y="252" width="340" height="76" rx="5" fill="#1a63a8" fill-opacity="0.07" stroke="#1a63a8" stroke-width="1.2"/>
  <text x="556" y="274" font-size="12.5" fill="#1a63a8" font-weight="bold">Y la punta satura antes todavía</text>
  <text x="556" y="294" font-size="12" fill="#555">q_p = 40 N₆₀ (L/D) ≤ 400 N₆₀ — Ec. (18.15)</text>
  <text x="556" y="314" font-size="12" fill="#555">El tope llega en L/D = 10: <tspan font-weight="bold">L = 4 m</tspan> en este pilote.</text>

  <!-- takeaway -->
  <rect x="60" y="368" width="820" height="66" rx="6" fill="#f7f6f3" stroke="#8a857c"/>
  <text x="470" y="392" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">Es la lógica inversa a la de la zapata, donde enterrar un metro más sumaba +47 % de capacidad.</text>
  <text x="470" y="416" font-size="12.5" text-anchor="middle" fill="#555">Un pilote tiene una longitud natural más allá de la cual seguir bajando compra poco: la punta ya topó y el fuste crece solo linealmente.</text>
</svg>
