<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="pa1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c7c3c"/>
    </marker>
    <marker id="pa2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b02a1a"/>
    </marker>
    <marker id="pa3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="940" height="460" fill="#ffffff"/>
  <text x="470" y="28" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">Q_u = Q_p + Q_s — pero los dos términos no se movilizan al mismo tiempo</text>
  <text x="470" y="49" font-size="12" text-anchor="middle" fill="#666">Pilote de 400 mm de diámetro · las cifras de desplazamiento son de la sección 18.6</text>

  <!-- ===== el pilote ===== -->
  <line x1="200" y1="76" x2="200" y2="104" stroke="#666" stroke-width="2.6" marker-end="url(#pa3)"/>
  <text x="212" y="94" font-size="12.5" fill="#666" font-weight="bold">Q</text>
  <rect x="186" y="104" width="28" height="200" fill="#dcd8d0" stroke="#555" stroke-width="1.6"/>
  <rect x="120" y="104" width="66" height="200" fill="#efece6" opacity="0.55"/>
  <rect x="214" y="104" width="66" height="200" fill="#efece6" opacity="0.55"/>
  <rect x="120" y="304" width="160" height="42" fill="#dcd8d0" opacity="0.7"/>

  <!-- flechas de friccion -->
  <g stroke="#1c7c3c" stroke-width="1.8">
    <line x1="176" y1="150" x2="176" y2="132" marker-end="url(#pa1)"/>
    <line x1="176" y1="196" x2="176" y2="178" marker-end="url(#pa1)"/>
    <line x1="176" y1="242" x2="176" y2="224" marker-end="url(#pa1)"/>
    <line x1="224" y1="150" x2="224" y2="132" marker-end="url(#pa1)"/>
    <line x1="224" y1="196" x2="224" y2="178" marker-end="url(#pa1)"/>
    <line x1="224" y1="242" x2="224" y2="224" marker-end="url(#pa1)"/>
  </g>
  <text x="240" y="196" font-size="12" fill="#1c7c3c" font-weight="bold">Q_s</text>

  <!-- flecha de punta -->
  <line x1="200" y1="330" x2="200" y2="310" stroke="#b02a1a" stroke-width="2.6" marker-end="url(#pa2)"/>
  <text x="212" y="330" font-size="12" fill="#b02a1a" font-weight="bold">Q_p</text>

  <!-- ===== las dos escalas de desplazamiento ===== -->
  <line x1="330" y1="70" x2="330" y2="330" stroke="#e5e2dc" stroke-width="1.5"/>

  <text x="640" y="92" font-size="13.5" text-anchor="middle" fill="#222" font-weight="bold">Cuánto hay que moverse para conseguir cada uno</text>

  <!-- escala -->
  <line x1="400" y1="200" x2="880" y2="200" stroke="#8a857c" stroke-width="1.5"/>
  <text x="400" y="220" font-size="11" fill="#666" text-anchor="middle">0</text>
  <text x="520" y="220" font-size="11" fill="#666" text-anchor="middle">25</text>
  <text x="640" y="220" font-size="11" fill="#666" text-anchor="middle">50</text>
  <text x="760" y="220" font-size="11" fill="#666" text-anchor="middle">75</text>
  <text x="880" y="220" font-size="11" fill="#666" text-anchor="middle">100</text>
  <text x="640" y="240" font-size="12" fill="#666" text-anchor="middle">desplazamiento necesario (mm)</text>

  <!-- fuste -->
  <rect x="400" y="164" width="48" height="30" fill="#1c7c3c" fill-opacity="0.8"/>
  <text x="460" y="184" font-size="13" fill="#1c7c3c" font-weight="bold">5 a 10 mm</text>
  <text x="400" y="152" font-size="12.5" fill="#1c7c3c" font-weight="bold">FRICCIÓN DEL FUSTE</text>
  <text x="400" y="136" font-size="11" fill="#666">sin importar el tamaño ni la longitud del pilote</text>

  <!-- punta -->
  <rect x="592" y="256" width="288" height="30" fill="#b02a1a" fill-opacity="0.8"/>
  <text x="584" y="276" font-size="13" fill="#b02a1a" text-anchor="end" font-weight="bold">40 a 100 mm</text>
  <text x="400" y="308" font-size="12.5" fill="#b02a1a" font-weight="bold">RESISTENCIA DE PUNTA</text>
  <text x="400" y="324" font-size="11" fill="#666">10 a 25 % del diámetro — hincado el 10 %, perforado el 25 %</text>

  <!-- takeaway -->
  <rect x="60" y="360" width="820" height="86" rx="6" fill="#f7f6f3" stroke="#8a857c"/>
  <text x="470" y="384" font-size="13.5" text-anchor="middle" fill="#222" font-weight="bold">Ningún edificio tolera que su fundación baje 100 mm.</text>
  <text x="470" y="408" font-size="12.5" text-anchor="middle" fill="#555">Así que en cargas de servicio <tspan font-weight="bold" fill="#1c7c3c">trabaja el fuste</tspan>, y <tspan font-weight="bold" fill="#b02a1a">la punta es reserva de seguridad</tspan> — no capacidad utilizable.</text>
  <text x="470" y="430" font-size="12.5" text-anchor="middle" fill="#555">La suma Q_u = Q_p + Q_s solo se alcanza en la falla. Es el mismo patrón del empuje pasivo en muros.</text>
</svg>
