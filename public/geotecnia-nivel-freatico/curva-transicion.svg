<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="940" height="430" fill="#ffffff"/>
  <text x="470" y="28" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">Cuánto cuesta el agua según dónde esté: la curva completa</text>
  <text x="470" y="49" font-size="12" text-anchor="middle" fill="#666">Zapata 2,20 × 2,20 m · D_f = 1,5 m · arena φ' = 26,7°, c' = 0 · Terzaghi, Ec. (16.4) · FS = 3</text>

  <!-- zonas de fondo -->
  <rect x="130" y="80" width="90" height="220" fill="#b02a1a" fill-opacity="0.06"/>
  <rect x="220" y="80" width="132" height="220" fill="#e67e22" fill-opacity="0.07"/>
  <rect x="352" y="80" width="68" height="220" fill="#1c7c3c" fill-opacity="0.06"/>
  <text x="175" y="96" font-size="11.5" fill="#b02a1a" text-anchor="middle" font-weight="bold">Caso I</text>
  <text x="286" y="96" font-size="11.5" fill="#b35c0e" text-anchor="middle" font-weight="bold">Caso II</text>
  <text x="386" y="96" font-size="11.5" fill="#1c7c3c" text-anchor="middle" font-weight="bold">Caso III</text>

  <!-- ejes -->
  <line x1="130" y1="300" x2="425" y2="300" stroke="#8a857c" stroke-width="1.5"/>
  <line x1="130" y1="300" x2="130" y2="80" stroke="#8a857c" stroke-width="1.5"/>
  <text x="122" y="114" font-size="11" fill="#666" text-anchor="end">200</text>
  <text x="122" y="209" font-size="11" fill="#666" text-anchor="end">100</text>
  <text x="122" y="304" font-size="11" fill="#666" text-anchor="end">0</text>
  <text x="78" y="190" font-size="11.5" fill="#666" transform="rotate(-90 78 190)" text-anchor="middle">q_adm (kPa)</text>
  <text x="130" y="318" font-size="11" fill="#666" text-anchor="middle">0</text>
  <text x="220" y="318" font-size="11" fill="#666" text-anchor="middle">1,5</text>
  <text x="352" y="318" font-size="11" fill="#666" text-anchor="middle">3,7</text>
  <text x="278" y="338" font-size="11.5" fill="#666" text-anchor="middle">profundidad de la napa desde la superficie (m)</text>

  <!-- lineas de referencia -->
  <line x1="130" y1="112" x2="425" y2="112" stroke="#1c7c3c" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="432" y="116" font-size="11" fill="#1c7c3c">196,8 kPa · sin napa</text>

  <!-- curva -->
  <polyline points="130,204 160,183 190,161 220,140 250,133 286,126 322,118 352,112 425,112"
            fill="none" stroke="#1a63a8" stroke-width="2.8"/>
  <g fill="#1a63a8">
    <circle cx="130" cy="204" r="4"/><circle cx="220" cy="140" r="4"/><circle cx="352" cy="112" r="4"/>
  </g>

  <!-- quiebre -->
  <line x1="220" y1="300" x2="220" y2="140" stroke="#b35c0e" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="226" y="256" font-size="10.5" fill="#b35c0e">quiebre en z = D_f</text>

  <!-- anotaciones de los dos puntos clave -->
  <text x="138" y="222" font-size="12" fill="#b02a1a" font-weight="bold">−48,9 %</text>
  <text x="138" y="238" font-size="10.5" fill="#b02a1a">napa en superficie</text>
  <text x="234" y="176" font-size="12" fill="#b35c0e" font-weight="bold">−14,5 %</text>
  <text x="234" y="190" font-size="10.5" fill="#b35c0e">napa en el sello</text>

  <!-- ============ DERECHA: tabla ============ -->
  <line x1="500" y1="70" x2="500" y2="330" stroke="#e5e2dc" stroke-width="1.5"/>
  <text x="720" y="92" font-size="13.5" text-anchor="middle" fill="#222" font-weight="bold">La pendiente no es la misma en los dos tramos</text>

  <rect x="540" y="112" width="360" height="1" fill="#8a857c"/>
  <text x="556" y="106" font-size="11.5" fill="#666">tramo</text>
  <text x="800" y="106" font-size="11.5" fill="#666" text-anchor="end">q_adm gana por metro</text>

  <text x="556" y="140" font-size="12" fill="#b02a1a" font-weight="bold">Caso I (0 → 1,5 m)</text>
  <text x="880" y="140" font-size="13" fill="#b02a1a" text-anchor="end" font-weight="bold">+45,1 kPa/m</text>
  <text x="556" y="158" font-size="11" fill="#555">bajan los dos términos a la vez</text>

  <text x="556" y="196" font-size="12" fill="#b35c0e" font-weight="bold">Caso II (1,5 → 3,7 m)</text>
  <text x="880" y="196" font-size="13" fill="#b35c0e" text-anchor="end" font-weight="bold">+13,0 kPa/m</text>
  <text x="556" y="214" font-size="11" fill="#555">solo el término de peso propio</text>

  <text x="556" y="252" font-size="12" fill="#1c7c3c" font-weight="bold">Caso III (&gt; 3,7 m)</text>
  <text x="880" y="252" font-size="13" fill="#1c7c3c" text-anchor="end" font-weight="bold">0</text>
  <text x="556" y="270" font-size="11" fill="#555">el agua ya no entra en el bulbo</text>

  <text x="556" y="304" font-size="11.5" fill="#222" font-weight="bold">Bajar la napa 1 m cuando está alta vale</text>
  <text x="556" y="321" font-size="11.5" fill="#222" font-weight="bold">3,5 veces más que cuando ya está bajo el sello.</text>

  <!-- takeaway -->
  <rect x="70" y="356" width="800" height="56" rx="6" fill="#f7f6f3" stroke="#8a857c"/>
  <text x="470" y="378" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">Preguntar «¿hay napa?» no basta. Hay que preguntar a qué cota, y con qué estacionalidad.</text>
  <text x="470" y="399" font-size="12" text-anchor="middle" fill="#555">Entre la napa en superficie y la napa a 3,7 m hay un factor 2 en la capacidad — sin que cambie nada del suelo.</text>
</svg>
