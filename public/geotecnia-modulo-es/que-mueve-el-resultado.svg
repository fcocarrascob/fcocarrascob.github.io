<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="940" height="420" fill="#ffffff"/>
  <text x="470" y="28" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">Qué mueve realmente el asentamiento calculado</text>
  <text x="470" y="49" font-size="12" text-anchor="middle" fill="#666">Caso base: arcilla blanda, E_s = 10 MN/m² → S_e = 25,0 mm. Cada barra es una decisión distinta sobre el mismo caso.</text>

  <!-- eje cero -->
  <line x1="560" y1="80" x2="560" y2="330" stroke="#8a857c" stroke-width="1.6"/>
  <text x="560" y="348" font-size="11" fill="#666" text-anchor="middle">caso base</text>

  <!-- guias -->
  <g stroke="#e5e2dc" stroke-width="1">
    <line x1="479" y1="80" x2="479" y2="330"/>
    <line x1="641" y1="80" x2="641" y2="330"/>
    <line x1="723" y1="80" x2="723" y2="330"/>
    <line x1="804" y1="80" x2="804" y2="330"/>
  </g>
  <text x="479" y="346" font-size="10" fill="#aaa" text-anchor="middle">−50 %</text>
  <text x="641" y="346" font-size="10" fill="#aaa" text-anchor="middle">+50 %</text>
  <text x="723" y="346" font-size="10" fill="#aaa" text-anchor="middle">+100 %</text>
  <text x="804" y="346" font-size="10" fill="#aaa" text-anchor="middle">+150 %</text>

  <!-- fila 1: E_s al minimo -->
  <text x="545" y="102" font-size="12" fill="#b02a1a" text-anchor="end" font-weight="bold">E_s al mínimo del rango (4)</text>
  <rect x="560" y="90" width="244" height="20" fill="#b02a1a" fill-opacity="0.8"/>
  <text x="812" y="105" font-size="13" fill="#b02a1a" font-weight="bold">+150 %  ·  62,4 mm</text>

  <!-- fila 2: E_s al maximo -->
  <text x="575" y="140" font-size="12" fill="#b02a1a" font-weight="bold">E_s al máximo del rango (20)</text>
  <rect x="479" y="128" width="81" height="20" fill="#b02a1a" fill-opacity="0.8"/>
  <text x="471" y="143" font-size="13" fill="#b02a1a" text-anchor="end" font-weight="bold">−50 %  ·  12,5 mm</text>

  <!-- separador -->
  <line x1="60" y1="166" x2="880" y2="166" stroke="#e5e2dc" stroke-width="1.5"/>
  <text x="60" y="184" font-size="11.5" fill="#666" font-style="italic">Todo lo demás, junto, no alcanza a la mitad de eso:</text>

  <!-- fila 3: roca somera -->
  <text x="545" y="212" font-size="12" fill="#555" text-anchor="end">roca a 2 m en vez de 10</text>
  <rect x="535" y="200" width="25" height="18" fill="#1a63a8" fill-opacity="0.7"/>
  <text x="700" y="214" font-size="12" fill="#1a63a8" font-weight="bold">−15,6 %</text>

  <!-- fila 4: mu -->
  <text x="545" y="244" font-size="12" fill="#555" text-anchor="end">μ_s = 0,30 en vez de 0,45</text>
  <rect x="560" y="232" width="21" height="18" fill="#1a63a8" fill-opacity="0.7"/>
  <text x="700" y="246" font-size="12" fill="#1a63a8" font-weight="bold">+12,7 %</text>

  <!-- fila 5: flexible -->
  <text x="545" y="276" font-size="12" fill="#555" text-anchor="end">suponerla flexible, no rígida</text>
  <rect x="560" y="264" width="12" height="18" fill="#1a63a8" fill-opacity="0.7"/>
  <text x="700" y="278" font-size="12" fill="#1a63a8" font-weight="bold">+7,5 %</text>

  <!-- fila 6: roca profunda -->
  <text x="545" y="308" font-size="12" fill="#555" text-anchor="end">roca a 30 m en vez de 10</text>
  <rect x="560" y="296" width="4" height="18" fill="#1a63a8" fill-opacity="0.7"/>
  <text x="700" y="310" font-size="12" fill="#1a63a8" font-weight="bold">+2,6 %</text>

  <!-- takeaway -->
  <rect x="60" y="362" width="820" height="48" rx="6" fill="#f7f6f3" stroke="#8a857c"/>
  <text x="470" y="384" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">Discutir si la zapata es rígida o flexible mueve el resultado un 7 %. Elegir mal E_s lo mueve un 150 %.</text>
  <text x="470" y="402" font-size="12" text-anchor="middle" fill="#555">El esfuerzo de cálculo y el esfuerzo de investigación geotécnica deberían repartirse en esa proporción, y casi nunca se reparten así.</text>
</svg>
