<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 446" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="cot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#777"/>
    </marker>
    <pattern id="suelo" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#c9d2da" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="840" height="446" fill="#ffffff"/>

  <text x="420" y="24" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">El mismo pórtico, tres veces: lo único que cambia es cómo se dibujó la base</text>
  <text x="420" y="42" font-size="10" text-anchor="middle" fill="#777">HEB 300 · h = 4 m · L = 6 m · 40 tonf de gravedad por columna · 20 tonf laterales · deriva a escala común (7,60 cm → 40 px)</text>

  <!-- ================== 1. EMPOTRADA · Δ = 1,74 cm → 9 px ================== -->
  <g transform="translate(24,0)">
    <text x="115" y="72" font-size="11.5" text-anchor="middle" fill="#1c7c3c" font-weight="bold">1 · EMPOTRADA</text>
    <rect x="20" y="300" width="200" height="16" fill="url(#suelo)" stroke="#b8c2cc" stroke-width="0.9"/>
    <path d="M45,300 L45,120 L185,120 L185,300" fill="none" stroke="#d3d9de" stroke-width="1.4" stroke-dasharray="4 4"/>
    <!-- doble curvatura: tangente VERTICAL en la base y en el tope -->
    <path d="M45,300 C45,240 54,180 54,120 L194,120 C194,180 185,240 185,300"
          fill="none" stroke="#333" stroke-width="2.6" stroke-linejoin="round"/>
    <g fill="#1c7c3c"><rect x="33" y="298" width="24" height="7"/><rect x="173" y="298" width="24" height="7"/></g>
    <line x1="6" y1="120" x2="44" y2="120" stroke="#c0392b" stroke-width="2.2" marker-end="url(#fl)"/>
    <text x="4" y="114" font-size="9.5" text-anchor="end" fill="#c0392b">H</text>
    <line x1="45" y1="104" x2="54" y2="104" stroke="#777" stroke-width="0.9" marker-start="url(#cot)" marker-end="url(#cot)"/>
    <text x="49" y="98" font-size="9" text-anchor="middle" fill="#777">Δ</text>
    <text x="115" y="334" font-size="9.5" text-anchor="middle" fill="#1c7c3c">giro de base nulo · M = 24,1 tonf·m</text>
  </g>

  <!-- ================== 2. RESORTE β · Δ = 3,18 cm → 17 px ================== -->
  <g transform="translate(294,0)">
    <text x="115" y="72" font-size="11.5" text-anchor="middle" fill="#c0392b" font-weight="bold">2 · RESORTE β = 3 045 tonf·m/rad</text>
    <rect x="20" y="300" width="200" height="16" fill="url(#suelo)" stroke="#b8c2cc" stroke-width="0.9"/>
    <path d="M45,300 L45,120 L185,120 L185,300" fill="none" stroke="#d3d9de" stroke-width="1.4" stroke-dasharray="4 4"/>
    <!-- la base ya gira: la tangente sale inclinada, pero el resorte la frena -->
    <path d="M45,300 C51,242 62,180 62,120 L202,120 C202,180 191,242 185,300"
          fill="none" stroke="#333" stroke-width="2.6" stroke-linejoin="round"/>
    <g fill="none" stroke="#c0392b" stroke-width="1.7">
      <path d="M45,296 a4,4 0 1,1 -4,-4 a7,7 0 1,1 7,7 a10,10 0 1,1 -10,-10"/>
      <path d="M185,296 a4,4 0 1,1 -4,-4 a7,7 0 1,1 7,7 a10,10 0 1,1 -10,-10"/>
    </g>
    <line x1="6" y1="120" x2="52" y2="120" stroke="#c0392b" stroke-width="2.2" marker-end="url(#fl)"/>
    <text x="4" y="114" font-size="9.5" text-anchor="end" fill="#c0392b">H</text>
    <line x1="45" y1="104" x2="62" y2="104" stroke="#777" stroke-width="0.9" marker-start="url(#cot)" marker-end="url(#cot)"/>
    <text x="53" y="98" font-size="9" text-anchor="middle" fill="#777">Δ</text>
    <text x="115" y="334" font-size="9.5" text-anchor="middle" fill="#c0392b">θ = 3,9 mrad · M = 18,2 tonf·m</text>
  </g>

  <!-- ================== 3. ROTULADA · Δ = 7,60 cm → 40 px ================== -->
  <g transform="translate(564,0)">
    <text x="115" y="72" font-size="11.5" text-anchor="middle" fill="#1c6fa8" font-weight="bold">3 · ROTULADA</text>
    <rect x="20" y="300" width="200" height="16" fill="url(#suelo)" stroke="#b8c2cc" stroke-width="0.9"/>
    <path d="M45,300 L45,120 L185,120 L185,300" fill="none" stroke="#d3d9de" stroke-width="1.4" stroke-dasharray="4 4"/>
    <!-- curvatura simple: la base gira libre, momento cero -->
    <path d="M45,300 C67,244 85,180 85,120 L225,120 C225,180 207,244 185,300"
          fill="none" stroke="#333" stroke-width="2.6" stroke-linejoin="round"/>
    <g fill="#ffffff" stroke="#1c6fa8" stroke-width="2">
      <circle cx="45" cy="300" r="5"/><circle cx="185" cy="300" r="5"/>
    </g>
    <line x1="6" y1="120" x2="75" y2="120" stroke="#c0392b" stroke-width="2.2" marker-end="url(#fl)"/>
    <text x="4" y="114" font-size="9.5" text-anchor="end" fill="#c0392b">H</text>
    <line x1="45" y1="104" x2="85" y2="104" stroke="#777" stroke-width="0.9" marker-start="url(#cot)" marker-end="url(#cot)"/>
    <text x="65" y="98" font-size="9" text-anchor="middle" fill="#777">Δ</text>
    <text x="115" y="334" font-size="9.5" text-anchor="middle" fill="#1c6fa8">giro libre · M = 0</text>
  </g>

  <!-- ================== TABLA RESUMEN ================== -->
  <line x1="30" y1="352" x2="810" y2="352" stroke="#e4e8ec" stroke-width="1"/>
  <g font-size="10.5">
    <text x="34" y="374" fill="#888">Deriva del nivel</text>
    <text x="34" y="394" fill="#888">M en el tope de columna</text>
    <text x="34" y="414" fill="#888">M en la base</text>

    <text x="290" y="374" text-anchor="end" fill="#1c7c3c" font-weight="bold">1,74 cm</text>
    <text x="290" y="394" text-anchor="end" fill="#1c7c3c" font-weight="bold">16,0 tonf·m</text>
    <text x="290" y="414" text-anchor="end" fill="#1c7c3c" font-weight="bold">24,1 tonf·m</text>

    <text x="470" y="374" text-anchor="end" fill="#c0392b" font-weight="bold">3,18 cm</text>
    <text x="470" y="394" text-anchor="end" fill="#c0392b" font-weight="bold">21,9 tonf·m</text>
    <text x="470" y="414" text-anchor="end" fill="#c0392b" font-weight="bold">18,2 tonf·m</text>

    <text x="620" y="374" text-anchor="end" fill="#1c6fa8" font-weight="bold">7,60 cm</text>
    <text x="620" y="394" text-anchor="end" fill="#1c6fa8" font-weight="bold">40,0 tonf·m</text>
    <text x="620" y="414" text-anchor="end" fill="#1c6fa8" font-weight="bold">0</text>
  </g>
  <g font-size="9.5">
    <text x="646" y="374" fill="#b03a2e">empotrada subestima 45 %</text>
    <text x="646" y="394" fill="#b03a2e">empotrada subestima 27 %</text>
    <text x="646" y="414" fill="#1c7c3c">empotrada sobrestima 33 %</text>
  </g>
  <text x="34" y="436" font-size="9.5" fill="#999">Empotrada es NO conservadora para el pórtico (menos deriva, menos momento arriba) y a la vez CONSERVADORA para la placa base (más momento abajo). Es la misma decisión.</text>
</svg>
