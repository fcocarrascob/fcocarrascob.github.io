  <text x="285.3" y="286.7" font-size="11.5" fill="#333" font-weight="bold">rigidez × 4,6</text>
  <text x="285.3" y="302.7" font-size="10.5" fill="#6b7280">para que la deriva baje de 169,5 a 60 mm</text>
  <text x="712" y="120" font-size="10.5" fill="#333" font-weight="bold">La curva crece casi monótona con T:</text>
  <text x="712" y="134" font-size="10.5" fill="#6b7280">flexibilizar siempre agranda el</text>
  <text x="712" y="148" font-size="10.5" fill="#6b7280">desplazamiento. Y al revés: rigidizar</text>
  <text x="712" y="162" font-size="10.5" fill="#6b7280">rinde poco al principio, porque S_a</text>
  <text x="712" y="176" font-size="10.5" fill="#6b7280">sube mientras T² baja. Para cortar la</text>
  <text x="712" y="190" font-size="10.5" fill="#6b7280">deriva a un tercio (169,5 → 60 mm) el</text>
  <text x="712" y="204" font-size="10.5" fill="#6b7280">período debe bajar a menos de la</text>
  <text x="712" y="218" font-size="10.5" fill="#6b7280">mitad: rigidez × 4,6.</text>
  <text x="712" y="244" font-size="10.5" fill="#1a63a8">El CBF vive en la otra punta: en</text>
  <text x="712" y="258" font-size="10.5" fill="#1a63a8">T*_X = 0,220 s el espectro solo</text>
  <text x="712" y="272" font-size="10.5" fill="#1a63a8">le pide 21 mm.</text>
  <text x="84" y="470" font-size="10.5" fill="#6b7280">Curva: src/lib/nch2369-spectrum.ts (Ec. 3 corregida por ξ) · T* y derivas: análisis validado en dos motores (case09 rukan ↔ SAP2000) · estimación con forma modal constante</text>
