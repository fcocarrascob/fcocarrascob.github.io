<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="940" height="420" fill="#ffffff"/>
  <text x="470" y="28" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">Y una buena noticia: el empuje es mucho menos sensible a φ' que la capacidad</text>
  <text x="470" y="49" font-size="12" text-anchor="middle" fill="#666">Cuánto cambia cada resultado por cada grado de error en el ángulo de fricción</text>

  <!-- eje -->
  <line x1="300" y1="290" x2="300" y2="90" stroke="#8a857c" stroke-width="1.5"/>
  <line x1="300" y1="290" x2="860" y2="290" stroke="#8a857c" stroke-width="1.5"/>
  <text x="300" y="308" font-size="11" fill="#666" text-anchor="middle">0 %</text>
  <text x="440" y="308" font-size="11" fill="#666" text-anchor="middle">4 %</text>
  <text x="580" y="308" font-size="11" fill="#666" text-anchor="middle">8 %</text>
  <text x="720" y="308" font-size="11" fill="#666" text-anchor="middle">12 %</text>
  <text x="860" y="308" font-size="11" fill="#666" text-anchor="middle">16 %</text>
  <text x="580" y="328" font-size="12" fill="#666" text-anchor="middle">cambio en el resultado por cada grado de φ'</text>

  <!-- capacidad de soporte -->
  <text x="286" y="128" font-size="13.5" fill="#b02a1a" text-anchor="end" font-weight="bold">Capacidad de soporte</text>
  <text x="286" y="146" font-size="11" fill="#666" text-anchor="end">q_adm — nota 2 de esta serie</text>
  <rect x="300" y="110" width="490" height="42" fill="#b02a1a" fill-opacity="0.8"/>
  <text x="778" y="137" font-size="16" fill="#ffffff" text-anchor="end" font-weight="bold">~14 %</text>

  <!-- empuje pasivo -->
  <text x="286" y="196" font-size="13" fill="#b35c0e" text-anchor="end" font-weight="bold">Empuje pasivo K_p</text>
  <text x="286" y="212" font-size="11" fill="#666" text-anchor="end">tan²(45 + φ'/2)</text>
  <rect x="300" y="180" width="147" height="38" fill="#b35c0e" fill-opacity="0.8"/>
  <text x="457" y="204" font-size="14" fill="#b35c0e" font-weight="bold">+4,1 %</text>

  <!-- empuje activo -->
  <text x="286" y="258" font-size="13" fill="#1c7c3c" text-anchor="end" font-weight="bold">Empuje activo K_a</text>
  <text x="286" y="274" font-size="11" fill="#666" text-anchor="end">tan²(45 − φ'/2)</text>
  <rect x="300" y="242" width="140" height="38" fill="#1c7c3c" fill-opacity="0.8"/>
  <text x="450" y="266" font-size="14" fill="#1c7c3c" font-weight="bold">−4,0 %</text>

  <!-- por que -->
  <rect x="60" y="346" width="820" height="62" rx="6" fill="#f7f6f3" stroke="#8a857c"/>
  <text x="470" y="368" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">La razón está en la forma de las funciones: N_q crece exponencialmente con φ', y K_a solo como una tangente.</text>
  <text x="470" y="390" font-size="12.5" text-anchor="middle" fill="#555">Consecuencia práctica: conviene gastar en caracterizar el suelo <tspan font-weight="bold">tres veces más para fundar que para contener</tspan>.</text>
</svg>
