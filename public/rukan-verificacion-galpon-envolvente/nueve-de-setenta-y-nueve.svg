  <text x="470" y="150" font-size="13" fill="#333" text-anchor="start" font-weight="bold">Las nueve que dimensionan algo</text>
  <rect x="470" y="162" width="15" height="15" rx="3" fill="#1a63a8" stroke="#333" stroke-width="1"/>
  <text x="494" y="174" font-size="11.5" fill="#333" text-anchor="start" font-weight="bold">G3A_B</text>
  <text x="586" y="174" font-size="11" fill="#6b7280" text-anchor="start">nieve balanceada — la compresión de casi todo</text>
  <rect x="470" y="186" width="15" height="15" rx="3" fill="#1a63a8" stroke="#333" stroke-width="1"/>
  <text x="494" y="198" font-size="11.5" fill="#333" text-anchor="start" font-weight="bold">G3A_I</text>
  <text x="586" y="198" font-size="11" fill="#6b7280" text-anchor="start">nieve DESbalanceada — solo el dintel medio</text>
  <rect x="470" y="210" width="15" height="15" rx="3" fill="#1a63a8" stroke="#333" stroke-width="1"/>
  <text x="494" y="222" font-size="11.5" fill="#333" text-anchor="start" font-weight="bold">G4_BLYPN</text>
  <text x="586" y="222" font-size="11" fill="#6b7280" text-anchor="start">viento + nieve — el pilar de hastial</text>
  <rect x="470" y="234" width="15" height="15" rx="3" fill="#1a63a8" stroke="#333" stroke-width="1"/>
  <text x="494" y="246" font-size="11.5" fill="#333" text-anchor="start" font-weight="bold">G6_TXPP</text>
  <text x="586" y="246" font-size="11" fill="#6b7280" text-anchor="start">viento transversal — tracción de columna</text>
  <rect x="470" y="258" width="15" height="15" rx="3" fill="#1a63a8" stroke="#333" stroke-width="1"/>
  <text x="494" y="270" font-size="11.5" fill="#333" text-anchor="start" font-weight="bold">G6_TXNP</text>
  <text x="586" y="270" font-size="11" fill="#6b7280" text-anchor="start">viento transversal — puntal de cumbrera</text>
  <rect x="470" y="282" width="15" height="15" rx="3" fill="#1a63a8" stroke="#333" stroke-width="1"/>
  <text x="494" y="294" font-size="11.5" fill="#333" text-anchor="start" font-weight="bold">G6_LYNP</text>
  <text x="586" y="294" font-size="11" fill="#6b7280" text-anchor="start">viento longitudinal — tracción de dintel</text>
  <rect x="470" y="306" width="15" height="15" rx="3" fill="#b02a1a" stroke="#333" stroke-width="1"/>
  <text x="494" y="318" font-size="11.5" fill="#333" text-anchor="start" font-weight="bold">E2P_A</text>
  <text x="586" y="318" font-size="11" fill="#6b7280" text-anchor="start">sismo, ecuación 2 — diagonal de muro</text>
  <rect x="470" y="330" width="15" height="15" rx="3" fill="#b02a1a" stroke="#333" stroke-width="1"/>
  <text x="494" y="342" font-size="11.5" fill="#333" text-anchor="start" font-weight="bold">E2N_B</text>
  <text x="586" y="342" font-size="11" fill="#6b7280" text-anchor="start">sismo, ecuación 2 — puntal y diagonales</text>
  <rect x="470" y="354" width="15" height="15" rx="3" fill="#b02a1a" stroke="#333" stroke-width="1"/>
  <text x="494" y="366" font-size="11.5" fill="#333" text-anchor="start" font-weight="bold">E3P_A</text>
  <text x="586" y="366" font-size="11" fill="#6b7280" text-anchor="start">sismo, ecuación 3 — el M₃ de todo el arriostramiento</text>
  <rect x="48" y="440" width="904" height="84" rx="8" fill="#f7f9fb" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="70" y="468" font-size="13.5" fill="#333" text-anchor="start" font-weight="bold">Nueve de setenta y nueve. Y las setenta que no gobiernan nada tampoco sobran:</text>
  <text x="70" y="490" font-size="12" fill="#6b7280" text-anchor="start">no se sabe cuáles son hasta correrlas. Armar el árbol completo es barato —una suma lineal por combinación— y saltárselo</text>
  <text x="70" y="507" font-size="12" fill="#6b7280" text-anchor="start">es la clase de atajo que se cobra en el miembro que a nadie se le ocurrió mirar: el dintel medio lo gobierna la nieve DESbalanceada.</text>
