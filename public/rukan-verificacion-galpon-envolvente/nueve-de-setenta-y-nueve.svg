  <text x="60" y="311" font-size="12.5" fill="#333" text-anchor="start" font-weight="bold">4 de la rama ilustrativa</text>
  <text x="60" y="327" font-size="10.5" fill="#6b7280" text-anchor="start">con R = 5, para comparar</text>
  <rect x="60" y="337" width="15" height="15" rx="3" fill="#c7ccd1"/>
  <rect x="79" y="337" width="15" height="15" rx="3" fill="#c7ccd1"/>
