<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="la" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b02a1a"/>
    </marker>
  </defs>
  <rect width="940" height="450" fill="#ffffff"/>
  <text x="470" y="28" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">T_v = c_v · t / H_dr²  —  el camino de drenaje entra al cuadrado</text>
  <text x="470" y="49" font-size="12" text-anchor="middle" fill="#666">Tiempo hasta el 90 % de consolidación · c_v = 0,003 cm²/s (el del Ejemplo 9.6 de Das)</text>

  <!-- tabla -->
  <line x1="60" y1="92" x2="560" y2="92" stroke="#8a857c" stroke-width="1.3"/>
  <text x="130" y="84" font-size="11.5" fill="#666" font-weight="bold" text-anchor="end">espesor de arcilla</text>
  <text x="300" y="84" font-size="11.5" fill="#1c7c3c" font-weight="bold" text-anchor="middle">drenaje en DOS caras</text>
  <text x="300" y="70" font-size="10.5" fill="#1c7c3c" text-anchor="middle">H_dr = H/2</text>
  <text x="470" y="84" font-size="11.5" fill="#b02a1a" font-weight="bold" text-anchor="middle">drenaje en UNA cara</text>
  <text x="470" y="70" font-size="10.5" fill="#b02a1a" text-anchor="middle">H_dr = H</text>

  <g font-size="12.5">
    <text x="130" y="118" fill="#222" text-anchor="end">1 m</text>
    <text x="300" y="118" fill="#1c7c3c" text-anchor="middle">8 días</text>
    <text x="470" y="118" fill="#b02a1a" text-anchor="middle">33 días</text>

    <text x="130" y="148" fill="#222" text-anchor="end">2 m</text>
    <text x="300" y="148" fill="#1c7c3c" text-anchor="middle">33 días</text>
    <text x="470" y="148" fill="#b02a1a" text-anchor="middle">4 meses</text>

    <text x="130" y="178" fill="#222" text-anchor="end">3 m</text>
    <text x="300" y="178" fill="#1c7c3c" text-anchor="middle">2 meses</text>
    <text x="470" y="178" fill="#b02a1a" text-anchor="middle">10 meses</text>

    <text x="130" y="208" fill="#222" text-anchor="end">5 m</text>
    <text x="300" y="208" fill="#1c7c3c" text-anchor="middle">7 meses</text>
    <text x="470" y="208" fill="#b02a1a" text-anchor="middle">27 meses</text>

    <text x="130" y="238" fill="#222" text-anchor="end">10 m</text>
    <text x="300" y="238" fill="#1c7c3c" text-anchor="middle" font-weight="bold">27 meses</text>
    <text x="470" y="238" fill="#b02a1a" text-anchor="middle" font-weight="bold">9,0 años</text>
  </g>
  <line x1="352" y1="234" x2="418" y2="234" stroke="#b02a1a" stroke-width="1.3" marker-end="url(#la)"/>
  <text x="385" y="228" font-size="10.5" fill="#b02a1a" text-anchor="middle" font-weight="bold">×4</text>
  <line x1="60" y1="254" x2="560" y2="254" stroke="#e5e2dc" stroke-width="1.2"/>

  <!-- las dos flechas del x4 -->

  <text x="60" y="280" font-size="12" fill="#555">Duplicar el espesor multiplica el tiempo por <tspan font-weight="bold">4</tspan>.</text>
  <text x="60" y="298" font-size="12" fill="#555">Perder una cara de drenaje hace exactamente lo mismo: H_dr pasa de H/2 a H.</text>

  <!-- ============ DERECHA: la cola ============ -->
  <line x1="600" y1="60" x2="600" y2="330" stroke="#e5e2dc" stroke-width="1.5"/>
  <text x="770" y="84" font-size="13.5" text-anchor="middle" fill="#222" font-weight="bold">La cola: el último 10 % cuesta</text>
  <text x="770" y="102" font-size="13.5" text-anchor="middle" fill="#222" font-weight="bold">más que el primer 90 %</text>

  <!-- cuatro barras horizontales, escala 70 px por unidad de t/t90 -->
  <text x="690" y="140" font-size="11" fill="#666" text-anchor="end">grado</text>
  <text x="706" y="140" font-size="11" fill="#666">tiempo relativo, tomando t(90 %) = 1</text>

  <text x="690" y="172" font-size="12" fill="#666" text-anchor="end">50 %</text>
  <rect x="706" y="161" width="16" height="15" fill="#1c7c3c" fill-opacity="0.75"/>
  <text x="730" y="173" font-size="11.5" fill="#1c7c3c" font-weight="bold">0,23</text>

  <text x="690" y="204" font-size="12" fill="#666" text-anchor="end">90 %</text>
  <rect x="706" y="193" width="70" height="15" fill="#1a63a8" fill-opacity="0.75"/>
  <text x="784" y="205" font-size="11.5" fill="#1a63a8" font-weight="bold">1,00</text>

  <text x="690" y="236" font-size="12" fill="#666" text-anchor="end">95 %</text>
  <rect x="706" y="225" width="93" height="15" fill="#b35c0e" fill-opacity="0.75"/>
  <text x="807" y="237" font-size="11.5" fill="#b35c0e" font-weight="bold">1,33</text>

  <text x="690" y="268" font-size="12" fill="#666" text-anchor="end" font-weight="bold">99 %</text>
  <rect x="706" y="257" width="147" height="15" fill="#b02a1a" fill-opacity="0.8"/>
  <text x="861" y="269" font-size="11.5" fill="#b02a1a" font-weight="bold">2,10</text>

  <text x="770" y="336" font-size="12" fill="#555" text-anchor="middle">Llegar al 99 % toma <tspan font-weight="bold">2,1 veces</tspan> lo que</text>
  <text x="770" y="354" font-size="12" fill="#555" text-anchor="middle">toma llegar al 90 %. Por eso se diseña</text>
  <text x="770" y="372" font-size="12" fill="#555" text-anchor="middle">contra el 90 %, no contra el 100 %.</text>

  <!-- takeaway -->
  <rect x="60" y="392" width="820" height="46" rx="6" fill="#f7f6f3" stroke="#8a857c"/>
  <text x="470" y="414" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">Si el informe no dice si la capa de arcilla drena por una cara o por dos, falta un factor 4 en el plazo.</text>
  <text x="470" y="432" font-size="12" text-anchor="middle" fill="#555">Y ese dato no es del suelo: es de la estratigrafía — qué hay arriba y qué hay abajo de la capa compresible.</text>
</svg>
