<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" font-family="Segoe UI, Arial, sans-serif">
  <rect width="940" height="440" fill="#ffffff"/>
  <text x="470" y="28" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">La misma zapata, medida en el tiempo: de 25 mm a 106 mm</text>
  <text x="470" y="49" font-size="12" text-anchor="middle" fill="#666">Zapata 2,20 × 2,20 m sobre 3 m de arcilla blanda · c_v = 0,0005 cm²/s · drenaje en dos caras · C'_α = 0,011</text>

  <!-- lineas de referencia -->
  <line x1="120" y1="275" x2="860" y2="275" stroke="#1c7c3c" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="866" y="279" font-size="11" fill="#1c7c3c">25 mm</text>
  <line x1="120" y1="230" x2="860" y2="230" stroke="#b02a1a" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="866" y="234" font-size="11" fill="#b02a1a">50 mm</text>

  <!-- eje -->
  <line x1="120" y1="320" x2="860" y2="320" stroke="#8a857c" stroke-width="1.5"/>

  <!-- ===== barra 1: al construir ===== -->
  <rect x="180" y="275" width="90" height="45" fill="#1a63a8" fill-opacity="0.75"/>
  <text x="225" y="303" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">25,0</text>
  <text x="225" y="266" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">25,0 mm</text>
  <text x="225" y="340" font-size="12.5" fill="#555" text-anchor="middle" font-weight="bold">al construir</text>
  <text x="225" y="356" font-size="11" fill="#888" text-anchor="middle">solo el elástico</text>

  <!-- ===== barra 2: 1 anio ===== -->
  <rect x="360" y="275" width="90" height="45" fill="#1a63a8" fill-opacity="0.75"/>
  <rect x="360" y="232" width="90" height="43" fill="#b35c0e" fill-opacity="0.75"/>
  <text x="405" y="303" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">25,0</text>
  <text x="405" y="259" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">24,0</text>
  <text x="405" y="223" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">49,0 mm</text>
  <text x="405" y="340" font-size="12.5" fill="#555" text-anchor="middle" font-weight="bold">1 año</text>
  <text x="405" y="356" font-size="11" fill="#888" text-anchor="middle">primaria al 86 %</text>

  <!-- ===== barra 3: 10 anios ===== -->
  <rect x="540" y="275" width="90" height="45" fill="#1a63a8" fill-opacity="0.75"/>
  <rect x="540" y="225" width="90" height="50" fill="#b35c0e" fill-opacity="0.75"/>
  <rect x="540" y="171" width="90" height="54" fill="#b02a1a" fill-opacity="0.75"/>
  <text x="585" y="303" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">25,0</text>
  <text x="585" y="255" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">28,0</text>
  <text x="585" y="203" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">30,3</text>
  <text x="585" y="162" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">83,2 mm</text>
  <text x="585" y="340" font-size="12.5" fill="#555" text-anchor="middle" font-weight="bold">10 años</text>
  <text x="585" y="356" font-size="11" fill="#888" text-anchor="middle">primaria terminada</text>

  <!-- ===== barra 4: 50 anios ===== -->
  <rect x="720" y="275" width="90" height="45" fill="#1a63a8" fill-opacity="0.75"/>
  <rect x="720" y="225" width="90" height="50" fill="#b35c0e" fill-opacity="0.75"/>
  <rect x="720" y="129" width="90" height="96" fill="#b02a1a" fill-opacity="0.75"/>
  <text x="765" y="303" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">25,0</text>
  <text x="765" y="255" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">28,0</text>
  <text x="765" y="182" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">53,3</text>
  <text x="765" y="120" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">106,3 mm</text>
  <text x="765" y="340" font-size="12.5" fill="#555" text-anchor="middle" font-weight="bold">50 años</text>
  <text x="765" y="356" font-size="11" fill="#888" text-anchor="middle">y sigue creciendo</text>

  <!-- leyenda -->
  <rect x="130" y="106" width="14" height="14" fill="#1a63a8" fill-opacity="0.75"/>
  <text x="152" y="118" font-size="11.5" fill="#555">elástico (inmediato)</text>
  <rect x="130" y="128" width="14" height="14" fill="#b35c0e" fill-opacity="0.75"/>
  <text x="152" y="140" font-size="11.5" fill="#555">consolidación primaria</text>
  <rect x="130" y="150" width="14" height="14" fill="#b02a1a" fill-opacity="0.75"/>
  <text x="152" y="162" font-size="11.5" fill="#555">secundaria (fluencia)</text>

  <!-- takeaway -->
  <rect x="60" y="376" width="820" height="52" rx="6" fill="#f7f6f3" stroke="#8a857c"/>
  <text x="470" y="398" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">Un cálculo que solo entrega el asentamiento elástico reporta 25 mm de un total que llegará a 106 mm.</text>
  <text x="470" y="417" font-size="12" text-anchor="middle" fill="#555">La secundaria no se detiene: crece con log t, así que la pregunta no es «cuánto asienta» sino «cuánto asienta ¿a qué plazo?».</text>
</svg>
