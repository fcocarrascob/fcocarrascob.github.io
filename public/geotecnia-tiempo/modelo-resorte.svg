<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ma2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="mab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a63a8"/>
    </marker>
  </defs>
  <rect width="940" height="430" fill="#ffffff"/>
  <text x="470" y="28" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">El modelo del resorte: consolidar es transferir la carga del agua al esqueleto</text>

  <line x1="330" y1="52" x2="330" y2="316" stroke="#e5e2dc" stroke-width="1.5"/>
  <line x1="630" y1="52" x2="630" y2="316" stroke="#e5e2dc" stroke-width="1.5"/>

  <!-- ============ t = 0 ============ -->
  <g>
    <text x="175" y="72" font-size="13.5" text-anchor="middle" fill="#1a63a8" font-weight="bold">t = 0 · válvula cerrada</text>

    <line x1="175" y1="88" x2="175" y2="112" stroke="#666" stroke-width="2.5" marker-end="url(#ma2)"/>
    <text x="187" y="104" font-size="12" fill="#666">P</text>
    <rect x="105" y="112" width="140" height="12" fill="#8a857c"/>
    <rect x="105" y="124" width="140" height="120" fill="#1a63a8" fill-opacity="0.20" stroke="#8a857c" stroke-width="1.4"/>
    <!-- resorte sin comprimir -->
    <polyline points="175,130 155,142 195,154 155,166 195,178 155,190 195,202 175,214"
              fill="none" stroke="#b02a1a" stroke-width="2.4"/>
    <!-- valvula cerrada -->
    <circle cx="245" cy="140" r="9" fill="#ffffff" stroke="#b02a1a" stroke-width="2"/>
    <line x1="239" y1="134" x2="251" y2="146" stroke="#b02a1a" stroke-width="2"/>

    <text x="175" y="272" font-size="13" text-anchor="middle" fill="#1a63a8" font-weight="bold">Δu = P/A · Δσ' = 0</text>
    <text x="175" y="294" font-size="12" text-anchor="middle" fill="#555">El agua es incompresible:</text>
    <text x="175" y="310" font-size="12" text-anchor="middle" fill="#555">toma <tspan font-weight="bold">toda</tspan> la carga. El resorte no se mueve.</text>
  </g>

  <!-- ============ 0 < t < inf ============ -->
  <g>
    <text x="480" y="72" font-size="13.5" text-anchor="middle" fill="#b35c0e" font-weight="bold">0 &lt; t &lt; ∞ · sale agua</text>

    <line x1="480" y1="88" x2="480" y2="112" stroke="#666" stroke-width="2.5" marker-end="url(#ma2)"/>
    <text x="492" y="104" font-size="12" fill="#666">P</text>
    <rect x="410" y="130" width="140" height="12" fill="#8a857c"/>
    <rect x="410" y="142" width="140" height="102" fill="#1a63a8" fill-opacity="0.13" stroke="#8a857c" stroke-width="1.4"/>
    <!-- pistón bajando -->
    <line x1="405" y1="112" x2="555" y2="112" stroke="#8a857c" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="392" y1="112" x2="392" y2="128" stroke="#b35c0e" stroke-width="1.6" marker-end="url(#ma2)"/>
    <!-- resorte a medio comprimir -->
    <polyline points="480,148 460,158 500,168 460,178 500,188 460,198 500,208 480,216"
              fill="none" stroke="#b02a1a" stroke-width="2.4"/>
    <!-- valvula abierta + chorro -->
    <circle cx="550" cy="158" r="9" fill="#ffffff" stroke="#1c7c3c" stroke-width="2"/>
    <line x1="559" y1="158" x2="590" y2="158" stroke="#1a63a8" stroke-width="2" marker-end="url(#mab)"/>
    <text x="596" y="153" font-size="10.5" fill="#1a63a8">agua</text>

    <text x="480" y="272" font-size="13" text-anchor="middle" fill="#b35c0e" font-weight="bold">Δu baja · Δσ' sube</text>
    <text x="480" y="294" font-size="12" text-anchor="middle" fill="#555">La carga se traspasa gradualmente.</text>
    <text x="480" y="310" font-size="12" text-anchor="middle" fill="#555">El asentamiento ocurre <tspan font-weight="bold">aquí</tspan>.</text>
  </g>

  <!-- ============ t = inf ============ -->
  <g>
    <text x="780" y="72" font-size="13.5" text-anchor="middle" fill="#1c7c3c" font-weight="bold">t = ∞ · equilibrio</text>

    <line x1="780" y1="88" x2="780" y2="112" stroke="#666" stroke-width="2.5" marker-end="url(#ma2)"/>
    <text x="792" y="104" font-size="12" fill="#666">P</text>
    <rect x="710" y="152" width="140" height="12" fill="#8a857c"/>
    <rect x="710" y="164" width="140" height="80" fill="#1a63a8" fill-opacity="0.07" stroke="#8a857c" stroke-width="1.4"/>
    <line x1="705" y1="112" x2="855" y2="112" stroke="#8a857c" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="860" y="110" font-size="9.5" fill="#888">posición inicial</text>
    <line x1="692" y1="112" x2="692" y2="150" stroke="#1c7c3c" stroke-width="1.6" marker-end="url(#ma2)"/>
    <text x="684" y="134" font-size="11" fill="#1c7c3c" text-anchor="end" font-weight="bold">S</text>
    <!-- resorte comprimido -->
    <polyline points="780,170 760,178 800,186 760,194 800,202 760,210 800,218 780,224"
              fill="none" stroke="#b02a1a" stroke-width="2.4"/>
    <circle cx="850" cy="180" r="9" fill="#ffffff" stroke="#1c7c3c" stroke-width="2"/>

    <text x="780" y="272" font-size="13" text-anchor="middle" fill="#1c7c3c" font-weight="bold">Δu = 0 · Δσ' = Δσ</text>
    <text x="780" y="294" font-size="12" text-anchor="middle" fill="#555">Toda la carga la toma el resorte.</text>
    <text x="780" y="310" font-size="12" text-anchor="middle" fill="#555">El asentamiento se completó.</text>
  </g>

  <!-- takeaway -->
  <rect x="70" y="336" width="800" height="76" rx="6" fill="#f7f6f3" stroke="#8a857c"/>
  <text x="470" y="360" font-size="13.5" text-anchor="middle" fill="#222" font-weight="bold">Δσ = Δσ' + Δu</text>
  <text x="470" y="384" font-size="12.5" text-anchor="middle" fill="#555">El resorte es el esqueleto de suelo; el agua, la presión de poros. <tspan font-weight="bold">Consolidar no es «comprimir el suelo»:</tspan></text>
  <text x="470" y="403" font-size="12.5" text-anchor="middle" fill="#555">es esperar a que salga el agua para que la carga llegue a los granos. En arena eso es instantáneo; en arcilla, años.</text>
</svg>
