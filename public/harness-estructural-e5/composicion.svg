<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c7c3c"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a63a8"/>
    </marker>
  </defs>
  <rect width="900" height="440" fill="#ffffff"/>
  <text x="450" y="26" font-size="15.5" text-anchor="middle" fill="#222" font-weight="bold">E5: el LLM elige nombres; los números viajan de SAP2000 a la herramienta por Python</text>

  <!-- ===== LLM arriba ===== -->
  <rect x="330" y="48" width="240" height="86" rx="8" fill="#f4eefb" stroke="#b9a3d8"/>
  <text x="450" y="70" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">LLM local (llama3.1:8b)</text>
  <text x="450" y="90" font-size="10.5" text-anchor="middle" fill="#555">elige la herramienta y pasa NOMBRES</text>
  <text x="450" y="108" font-size="10.5" text-anchor="middle" fill="#333" font-family="Consolas, monospace">barra "8" · combo "LRFD_1"</text>
  <text x="450" y="124" font-size="10.5" text-anchor="middle" fill="#333" font-family="Consolas, monospace">criterio: Ky, Ly = 164 cm</text>

  <!-- flecha LLM -> funcion compuesta -->
  <line x1="450" y1="134" x2="450" y2="188" stroke="#1a63a8" stroke-width="2" marker-end="url(#b)"/>
  <text x="458" y="166" font-size="9.5" fill="#1a63a8">nombres + criterio</text>

  <!-- ===== SAP2000 ===== -->
  <rect x="20" y="196" width="200" height="150" rx="8" fill="#f7f8fa" stroke="#cfd6de"/>
  <text x="120" y="218" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">SAP2000 (abierto)</text>
  <text x="120" y="238" font-size="10.5" text-anchor="middle" fill="#555">Modelo_Prueba_MCP.sdb</text>
  <text x="120" y="256" font-size="10.5" text-anchor="middle" fill="#555">nave real: 1435 barras,</text>
  <text x="120" y="272" font-size="10.5" text-anchor="middle" fill="#555">42 combos LRFD/ASD</text>
  <text x="120" y="298" font-size="10" text-anchor="middle" fill="#888" font-style="italic">puente COM de Skills_SAP,</text>
  <text x="120" y="313" font-size="10" text-anchor="middle" fill="#888" font-style="italic">importado tal cual</text>
  <text x="120" y="328" font-size="10" text-anchor="middle" fill="#888" font-style="italic">(componer, no reescribir)</text>

  <!-- flecha SAP -> lector -->
  <line x1="220" y1="270" x2="286" y2="270" stroke="#1c7c3c" stroke-width="2.4" marker-end="url(#g)"/>
  <text x="253" y="258" font-size="9.5" text-anchor="middle" fill="#555">solo lectura</text>

  <!-- ===== lector + funcion compuesta ===== -->
  <rect x="288" y="196" width="324" height="150" rx="8" fill="#eef6ef" stroke="#9fc7a7"/>
  <text x="450" y="216" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">verificar_columna_desde_sap(barra, combo, K, L)</text>
  <text x="304" y="238" font-size="10.5" fill="#333">lee con procedencia (unidades fijadas):</text>
  <text x="304" y="256" font-size="10.5" fill="#333" font-family="Consolas, monospace">sección: Ag 112.48 cm² · Fy 2531</text>
  <text x="304" y="272" font-size="10.5" fill="#333" font-family="Consolas, monospace">demanda: Pu = <tspan font-weight="bold">12.98 tonf</tspan> (LRFD_1)</text>
  <text x="304" y="292" font-size="10.5" fill="#333">y llama a la tool de E1 <tspan font-weight="bold">Python → Python</tspan></text>
  <text x="304" y="312" font-size="10" fill="#555" font-style="italic">nombre inválido → rechazo reparable</text>
  <text x="304" y="327" font-size="10" fill="#555" font-style="italic">con la lista de combos del modelo</text>

  <!-- flecha lector -> resultado -->
  <line x1="612" y1="270" x2="678" y2="270" stroke="#1c7c3c" stroke-width="2.4" marker-end="url(#g)"/>
  <text x="645" y="258" font-size="9.5" text-anchor="middle" fill="#555">tool E1</text>

  <!-- ===== resultado ===== -->
  <rect x="680" y="196" width="200" height="150" rx="8" fill="#f7f8fa" stroke="#cfd6de"/>
  <text x="780" y="218" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">Resultado (JSON)</text>
  <text x="696" y="240" font-size="10.5" fill="#333" font-family="Consolas, monospace">φPn = 155.59 tonf</text>
  <text x="696" y="256" font-size="10.5" fill="#333" font-family="Consolas, monospace">uso <tspan fill="#1c7c3c" font-weight="bold">0.083</tspan> · CUMPLE</text>
  <text x="696" y="272" font-size="10.5" fill="#1a63a8" font-family="Consolas, monospace">cita: AISC E3, Ec. E3-2</text>
  <text x="696" y="288" font-size="10.5" fill="#333" font-family="Consolas, monospace">procedencia: .sdb,</text>
  <text x="696" y="304" font-size="10.5" fill="#333" font-family="Consolas, monospace">barra 8, LRFD_1</text>
  <text x="780" y="330" font-size="10" text-anchor="middle" fill="#555" font-style="italic">→ memoria Word (E6)</text>

  <!-- ===== la regla: los numeros no pasan por el LLM ===== -->
  <path d="M 560 140 C 640 160, 700 175, 740 192" stroke="#c0392b" stroke-width="1.8" fill="none" stroke-dasharray="6 4"/>
  <line x1="655" y1="152" x2="685" y2="180" stroke="#c0392b" stroke-width="2.6"/>
  <line x1="685" y1="152" x2="655" y2="180" stroke="#c0392b" stroke-width="2.6"/>
  <text x="720" y="150" font-size="10.5" fill="#c0392b" font-weight="bold">los números no pasan</text>
  <text x="720" y="165" font-size="10.5" fill="#c0392b" font-weight="bold">por el LLM</text>

  <!-- ===== franja inferior: las tres composiciones ===== -->
  <rect x="20" y="368" width="860" height="52" rx="8" fill="#fbf8ee" stroke="#dccf9e"/>
  <text x="450" y="388" font-size="11" text-anchor="middle" fill="#333" font-weight="bold">El mismo patrón, tres veces</text>
  <text x="450" y="408" font-size="10.5" text-anchor="middle" fill="#555">columna ← fuerzas de barra · zapata ← reacciones del apoyo (D y L de servicio) · viga LTB ← perfil + M3 del combo</text>
</svg>
