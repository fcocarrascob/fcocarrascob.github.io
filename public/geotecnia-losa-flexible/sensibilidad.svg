<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" font-family="Segoe UI, Arial, sans-serif">
  <rect width="940" height="440" fill="#ffffff"/>
  <text x="470" y="28" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">Sensibilidad de la presión máxima de contacto</text>
  <text x="470" y="49" font-size="12" text-anchor="middle" fill="#666">Caso base: q_max = 9,57 tonf/m² con 3,40 m de losa levantados. Escala única de 4,2 px por punto porcentual.</text>

  <!-- eje del caso base -->
  <line x1="560" y1="76" x2="560" y2="288" stroke="#8a857c" stroke-width="1.6"/>
  <text x="560" y="306" font-size="11" fill="#666" text-anchor="middle">caso base · 9,57 tonf/m²</text>

  <!-- guias -->
  <g stroke="#e5e2dc" stroke-width="1">
    <line x1="350" y1="76" x2="350" y2="288"/>
    <line x1="455" y1="76" x2="455" y2="288"/>
    <line x1="665" y1="76" x2="665" y2="288"/>
  </g>
  <g font-size="10" fill="#aaa" text-anchor="middle">
    <text x="350" y="306">−50 %</text>
    <text x="455" y="306">−25 %</text>
    <text x="665" y="306">+25 %</text>
  </g>

  <!-- fila 1: solo gravedad -->
  <text x="313" y="101" font-size="12.5" fill="#b02a1a" text-anchor="end" font-weight="bold">Solo gravedad (sin la cupla sísmica)</text>
  <rect x="320.6" y="85" width="239.4" height="22" fill="#b02a1a" fill-opacity="0.85"/>
  <text x="330" y="101" font-size="12" fill="#ffffff" font-weight="bold">4,11 · sin levantamiento</text>
  <text x="552" y="101" font-size="12.5" fill="#ffffff" text-anchor="end" font-weight="bold">−57 %</text>

  <!-- fila 2: kv upper -->
  <text x="313" y="135" font-size="12" fill="#555" text-anchor="end">k_v = 6.000 tonf/m³ (upper bound)</text>
  <rect x="560" y="120" width="31.1" height="20" fill="#1a63a8" fill-opacity="0.7"/>
  <text x="600" y="135" font-size="12" fill="#1a63a8" font-weight="bold">+7,4 % · 10,28 · 3,9 m levantados</text>

  <!-- fila 3: espesor 0,30 -->
  <text x="313" y="169" font-size="12" fill="#555" text-anchor="end">Espesor 0,30 m (Ec. 25 = 180)</text>
  <rect x="560" y="154" width="26.9" height="20" fill="#b35c0e" fill-opacity="0.7"/>
  <text x="596" y="169" font-size="12" fill="#b35c0e" font-weight="bold">+6,4 % · 10,18 · 5,9 m levantados</text>

  <!-- fila 4: kv lower -->
  <text x="313" y="203" font-size="12" fill="#555" text-anchor="end">k_v = 1.500 tonf/m³ (lower bound)</text>
  <rect x="529.3" y="188" width="30.7" height="20" fill="#1a63a8" fill-opacity="0.7"/>
  <text x="521" y="203" font-size="12" fill="#1a63a8" text-anchor="end" font-weight="bold">−7,3 % · 8,87 · 3,0 m levantados</text>

  <!-- fila 5: espesor 0,80 -->
  <text x="313" y="237" font-size="12" fill="#555" text-anchor="end">Espesor 0,80 m (Ec. 25 = 14)</text>
  <rect x="536.1" y="222" width="23.9" height="20" fill="#b35c0e" fill-opacity="0.7"/>
  <text x="528" y="237" font-size="12" fill="#b35c0e" text-anchor="end" font-weight="bold">−5,7 % · 9,02 · 0,7 m levantados</text>

  <!-- fila 6: espesor 1,20 -->
  <text x="313" y="271" font-size="12" fill="#555" text-anchor="end">Espesor 1,20 m (Ec. 25 = 2,8)</text>
  <rect x="549.9" y="256" width="10.1" height="20" fill="#b35c0e" fill-opacity="0.7"/>
  <text x="542" y="271" font-size="12" fill="#b35c0e" text-anchor="end" font-weight="bold">−2,4 % · 9,34 · sin levantamiento</text>

  <!-- takeaway -->
  <rect x="60" y="328" width="820" height="94" rx="6" fill="#f7f6f3" stroke="#8a857c"/>
  <text x="470" y="354" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">La banda de k_v que C10.1.5 manda explorar mueve poco la presión y mucho el desplazamiento.</text>
  <text x="470" y="378" font-size="12.5" text-anchor="middle" fill="#555">Entre 1.500 y 6.000 tonf/m³ —un factor 4— q_max se mueve un 15 % de punta a punta, pero el asentamiento de la columna central</text>
  <text x="470" y="400" font-size="12.5" text-anchor="middle" fill="#555">pasa de 2,18 a 0,71 mm: un factor 3. Y el espesor casi no mueve la presión, pero decide cuánta losa deja de tocar el suelo.</text>
</svg>
