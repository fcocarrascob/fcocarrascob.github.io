<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ea" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="er" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b02a1a"/>
    </marker>
    <pattern id="suelo" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#e8e0cd"/>
      <line x1="0" y1="10" x2="10" y2="0" stroke="#b3a98f" stroke-width="0.7" opacity="0.55"/>
    </pattern>
  </defs>
  <rect width="940" height="470" fill="#ffffff"/>
  <text x="470" y="28" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">El caso: losa de fundación de una sala eléctrica</text>

  <g>
    <!-- suelo (escala 1 m = 28 px, borde izquierdo en x = 70) -->
    <rect x="50" y="268" width="432" height="72" fill="url(#suelo)" stroke="#8a857c" stroke-width="1"/>
    <!-- losa -->
    <rect x="70" y="250" width="392" height="18" fill="#dcd8d0" stroke="#8a857c" stroke-width="1.6"/>

    <!-- columnas -->
    <rect x="90" y="196" width="16" height="54" fill="#dfe3e8" stroke="#8a857c" stroke-width="1.2"/>
    <rect x="258" y="196" width="16" height="54" fill="#dfe3e8" stroke="#8a857c" stroke-width="1.2"/>
    <rect x="426" y="196" width="16" height="54" fill="#dfe3e8" stroke="#8a857c" stroke-width="1.2"/>

    <!-- cargas de la combinacion ASD -->
    <line x1="98" y1="188" x2="98" y2="148" stroke="#b02a1a" stroke-width="2.6" marker-end="url(#er)"/>
    <text x="98" y="138" font-size="12" fill="#b02a1a" text-anchor="middle" font-weight="bold">−26,5</text>
    <line x1="266" y1="148" x2="266" y2="188" stroke="#666" stroke-width="2.6" marker-end="url(#ea)"/>
    <text x="266" y="138" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">70,0</text>
    <line x1="434" y1="148" x2="434" y2="188" stroke="#666" stroke-width="2.6" marker-end="url(#ea)"/>
    <text x="434" y="138" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">106,5</text>
    <text x="266" y="120" font-size="11.5" fill="#666" text-anchor="middle">combinación ASD, tonf</text>

    <!-- peso propio -->

    <!-- cotas -->
    <line x1="98" y1="298" x2="266" y2="298" stroke="#666" stroke-width="1" marker-start="url(#ea)" marker-end="url(#ea)"/>
    <text x="182" y="292" font-size="11" fill="#666" text-anchor="middle">6,00 m</text>
    <line x1="266" y1="298" x2="434" y2="298" stroke="#666" stroke-width="1" marker-start="url(#ea)" marker-end="url(#ea)"/>
    <text x="350" y="292" font-size="11" fill="#666" text-anchor="middle">6,00 m</text>
    <rect x="146" y="310" width="240" height="20" fill="#ffffff" opacity="0.88"/>
    <text x="266" y="325" font-size="11" fill="#555" text-anchor="middle">peso propio 7,5 tonf/m (105 tonf)</text>
    <line x1="70" y1="356" x2="462" y2="356" stroke="#666" stroke-width="1" marker-start="url(#ea)" marker-end="url(#ea)"/>
    <text x="266" y="372" font-size="11.5" fill="#222" text-anchor="middle" font-weight="bold">14,00 m  ·  ancho 6,00 m  ·  espesor 0,50 m</text>
    <text x="266" y="394" font-size="11.5" fill="#555" text-anchor="middle">suelo: k_v = 3.000 tonf/m³ (banda 1.500 – 6.000, C10.1.5)</text>
  </g>

  <!-- ======== Ec. (25) ======== -->
  <line x1="520" y1="52" x2="520" y2="400" stroke="#e5e2dc" stroke-width="1.5"/>
  <text x="550" y="78" font-size="13" fill="#222" font-weight="bold">Ec. (25): L⁴k_v / 4EI ≤ 1</text>
  <text x="550" y="100" font-size="11.5" fill="#666">La Tabla 10 da dos longitudes de cálculo</text>
  <text x="550" y="117" font-size="11.5" fill="#666">para la misma losa.</text>

  <rect x="550" y="136" width="340" height="76" rx="5" fill="#2e7d32" fill-opacity="0.08" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="566" y="158" font-size="12" fill="#222" font-weight="bold">Zarpa (voladizo del borde)</text>
  <text x="566" y="178" font-size="11.5" fill="#555">L = 1,10 m</text>
  <text x="874" y="178" font-size="15" fill="#2e7d32" text-anchor="end" font-weight="bold">0,044</text>
  <text x="566" y="198" font-size="11.5" fill="#2e7d32" font-weight="bold">rígida ✓</text>

  <rect x="550" y="226" width="340" height="76" rx="5" fill="#b02a1a" fill-opacity="0.08" stroke="#b02a1a" stroke-width="1.2"/>
  <text x="566" y="248" font-size="12" fill="#222" font-weight="bold">Zona interior entre columnas</text>
  <text x="566" y="268" font-size="11.5" fill="#555">L = 6,00 m</text>
  <text x="874" y="268" font-size="15" fill="#b02a1a" text-anchor="end" font-weight="bold">38,9</text>
  <text x="566" y="288" font-size="11.5" fill="#b02a1a" font-weight="bold">no es rígida — por 39 veces</text>

  <text x="550" y="330" font-size="11.5" fill="#555">Espesor que la haría rígida entre columnas:</text>
  <text x="550" y="352" font-size="13" fill="#222" font-weight="bold">e = (3L⁴k_v/E)^⅓ = 1,69 m</text>
  <text x="550" y="372" font-size="11.5" fill="#666">3,4 veces el espesor real.</text>

  <!-- takeaway -->
  <rect x="60" y="414" width="820" height="42" rx="6" fill="#f7f6f3" stroke="#8a857c"/>
  <text x="470" y="440" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">L entra a la CUARTA potencia: pasar de 1,10 a 6,00 m multiplica la razón por 885.</text>
</svg>
