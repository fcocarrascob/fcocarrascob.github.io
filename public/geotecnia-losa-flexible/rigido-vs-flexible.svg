<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ea" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="940" height="520" fill="#ffffff"/>
  <text x="470" y="28" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">La misma losa, los dos análisis</text>
  <text x="470" y="49" font-size="12" text-anchor="middle" fill="#666">Escala horizontal 1 m = 55 px · presión 1 tonf/m² = 8 px. Las marcas ▼ son las líneas de columnas.</text>

  <!-- ============ panel A: hipotesis rigida ============ -->
  <text x="90" y="82" font-size="13" fill="#222" font-weight="bold">Hipótesis rígida: distribución plana (10.1.4)</text>
  <text x="90" y="98" font-size="11.5" fill="#666">82,9 % del área en contacto — «cumple» el 80 %</text>

  <g fill="#8a857c">
    <path d="M145,112 l-6,-9 l12,0 z"/>
    <path d="M475,112 l-6,-9 l12,0 z"/>
    <path d="M805,112 l-6,-9 l12,0 z"/>
  </g>
  <rect x="90" y="112" width="770" height="16" fill="#dcd8d0" stroke="#8a857c" stroke-width="1.5"/>
  <polygon points="221.7,128 860,128 860,186.6" fill="#1a63a8" fill-opacity="0.18" stroke="#1a63a8" stroke-width="1.6"/>
  <line x1="90" y1="128" x2="221.7" y2="128" stroke="#1a63a8" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="155" y="146" font-size="11" fill="#1a63a8" text-anchor="middle">2,39 m sin contacto</text>
  <text x="866" y="190" font-size="12" fill="#1a63a8" font-weight="bold">7,32</text>
  <text x="866" y="205" font-size="10.5" fill="#1a63a8">tonf/m²</text>

  <!-- ============ panel B: flexible ============ -->
  <text x="90" y="268" font-size="13" fill="#222" font-weight="bold">Análisis flexible: resortes de Winkler, sin tracción (10.1.5)</text>
  <text x="90" y="284" font-size="11.5" fill="#b02a1a" font-weight="bold">75,9 % en contacto · 34 resortes anulados de 141</text>

  <g fill="#8a857c">
    <path d="M145,298 l-6,-9 l12,0 z"/>
    <path d="M475,298 l-6,-9 l12,0 z"/>
    <path d="M805,298 l-6,-9 l12,0 z"/>
  </g>
  <rect x="90" y="298" width="770" height="16" fill="#dcd8d0" stroke="#8a857c" stroke-width="1.5"/>
  <path d="M271.5,314 L282.5,315.7 L310,322.1 L337.5,327.7 L365,332.6 L392.5,336.7 L420,340.0
           L447.5,342.2 L475,343.3 L502.5,342.8 L530,341.6 L557.5,340.2 L585,339.3 L612.5,339.3
           L640,340.6 L667.5,343.3 L695,347.5 L722.5,353.3 L750,360.3 L777.5,368.2 L805,376.1
           L832.5,383.5 L860,390.6 L860,314 Z"
        fill="#b02a1a" fill-opacity="0.18" stroke="#b02a1a" stroke-width="1.6"/>
  <line x1="90" y1="314" x2="271.5" y2="314" stroke="#b02a1a" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="180" y="332" font-size="11.5" fill="#b02a1a" text-anchor="middle" font-weight="bold">3,40 m levantados</text>
  <text x="180" y="348" font-size="11" fill="#b02a1a" text-anchor="middle">el borde sube 2,46 mm</text>
  <text x="866" y="394" font-size="12.5" fill="#b02a1a" font-weight="bold">9,57</text>
  <text x="866" y="409" font-size="10.5" fill="#b02a1a">tonf/m²</text>
  <text x="475" y="360" font-size="11" fill="#b02a1a" text-anchor="middle">3,66 bajo la columna central</text>

  <!-- cota total -->
  <line x1="90" y1="428" x2="860" y2="428" stroke="#666" stroke-width="1" marker-start="url(#ea)" marker-end="url(#ea)"/>
  <text x="475" y="422" font-size="11" fill="#666" text-anchor="middle">14,00 m</text>

  <!-- takeaway -->
  <rect x="60" y="440" width="820" height="66" rx="6" fill="#f7f6f3" stroke="#8a857c"/>
  <text x="470" y="466" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">La distribución plana es una recta; la real no lo es.</text>
  <text x="470" y="490" font-size="12.5" text-anchor="middle" fill="#555">Subestima la presión máxima un 31 % y el largo levantado en un metro, y no puede representar la concentración bajo cada columna.</text>
</svg>
