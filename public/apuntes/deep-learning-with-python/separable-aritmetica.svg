<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="'Segoe UI', system-ui, Arial, sans-serif">
  <defs>
    <marker id="sa-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="780" height="400" fill="#ffffff"/>

  <text x="390" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Convolución separable: partir el problema en dos</text>
  <text x="390" y="50" text-anchor="middle" font-size="11.5" fill="#6b7280">Aprender patrones espaciales y patrones entre canales son dos trabajos distintos</text>

  <!-- ── LEFT: regular ── -->
  <rect x="20" y="70" width="240" height="230" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="140" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">Conv2D regular</text>

  <rect x="60" y="110" width="160" height="46" rx="5" fill="#ffffff" stroke="#d1d5db"/>
  <text x="140" y="130" text-anchor="middle" font-size="10.5" fill="#374151">Entrada</text>
  <text x="140" y="146" text-anchor="middle" font-size="10" fill="#6b7280">H × W × 64 canales</text>

  <line x1="140" y1="156" x2="140" y2="176" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#sa-ar)"/>

  <rect x="44" y="178" width="192" height="56" rx="5" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="140" y="198" text-anchor="middle" font-size="10.5" font-weight="600" fill="#374151">Un kernel 3×3×64</text>
  <text x="140" y="213" text-anchor="middle" font-size="10.5" font-weight="600" fill="#374151">por cada filtro de salida</text>
  <text x="140" y="228" text-anchor="middle" font-size="9.5" fill="#6b7280">espacio y canales, todo junto</text>

  <line x1="140" y1="234" x2="140" y2="252" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#sa-ar)"/>
  <rect x="60" y="254" width="160" height="34" rx="5" fill="#ffffff" stroke="#d1d5db"/>
  <text x="140" y="276" text-anchor="middle" font-size="10.5" fill="#374151">H' × W' × 64</text>

  <!-- ── RIGHT: separable ── -->
  <rect x="290" y="70" width="470" height="230" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="525" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">SeparableConv2D — dos pasos</text>

  <rect x="320" y="110" width="130" height="46" rx="5" fill="#ffffff" stroke="#93c5fd"/>
  <text x="385" y="130" text-anchor="middle" font-size="10.5" fill="#1e3a8a">Entrada</text>
  <text x="385" y="146" text-anchor="middle" font-size="10" fill="#2563eb">H × W × 64</text>

  <line x1="450" y1="133" x2="472" y2="133" stroke="#2563eb" stroke-width="1.6" marker-end="url(#sa-ar)"/>

  <rect x="474" y="104" width="126" height="58" rx="5" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="537" y="122" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e3a8a">1 · Depthwise</text>
  <text x="537" y="137" text-anchor="middle" font-size="9.5" fill="#1e3a8a">una conv 3×3 por</text>
  <text x="537" y="150" text-anchor="middle" font-size="9.5" fill="#1e3a8a">CADA canal, aparte</text>

  <line x1="600" y1="133" x2="620" y2="133" stroke="#2563eb" stroke-width="1.6" marker-end="url(#sa-ar)"/>

  <rect x="622" y="104" width="118" height="58" rx="5" fill="#2563eb"/>
  <text x="681" y="122" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">2 · Pointwise</text>
  <text x="681" y="137" text-anchor="middle" font-size="9.5" fill="#dbeafe">conv 1×1 que</text>
  <text x="681" y="150" text-anchor="middle" font-size="9.5" fill="#dbeafe">mezcla los canales</text>

  <!-- channel split illustration -->
  <text x="310" y="192" font-size="10" fill="#6b7280">canales separados:</text>
  <g>
    <rect x="320" y="200" width="30" height="30" rx="3" fill="#ffffff" stroke="#93c5fd"/>
    <rect x="356" y="200" width="30" height="30" rx="3" fill="#ffffff" stroke="#93c5fd"/>
    <rect x="392" y="200" width="30" height="30" rx="3" fill="#ffffff" stroke="#93c5fd"/>
    <text x="440" y="220" font-size="11" fill="#6b7280">···</text>
    <rect x="466" y="200" width="30" height="30" rx="3" fill="#ffffff" stroke="#93c5fd"/>
  </g>
  <text x="335" y="248" font-size="9" text-anchor="middle" fill="#2563eb">3×3</text>
  <text x="371" y="248" font-size="9" text-anchor="middle" fill="#2563eb">3×3</text>
  <text x="407" y="248" font-size="9" text-anchor="middle" fill="#2563eb">3×3</text>
  <text x="481" y="248" font-size="9" text-anchor="middle" fill="#2563eb">3×3</text>
  <line x1="510" y1="215" x2="534" y2="215" stroke="#2563eb" stroke-width="1.6" marker-end="url(#sa-ar)"/>
  <rect x="536" y="200" width="204" height="30" rx="4" fill="#bfdbfe" stroke="#3b82f6"/>
  <text x="638" y="220" text-anchor="middle" font-size="10.5" fill="#1e3a8a">se concatenan y se mezclan con 1×1</text>

  <text x="310" y="278" font-size="10.5" fill="#1e3a8a">El prior: <tspan font-weight="700">las ubicaciones espaciales están correlacionadas, los canales son independientes</tspan></text>

  <!-- ── BOTTOM: the arithmetic ── -->
  <rect x="20" y="312" width="740" height="72" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="40" y="334" font-size="11.5" font-weight="700" fill="#374151">La aritmética, con 64 canales de entrada y 64 de salida:</text>

  <text x="40" y="358" font-size="11" fill="#991b1b">Regular:</text>
  <text x="110" y="358" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace" fill="#374151">3 × 3 × 64 × 64 = <tspan font-weight="700" fill="#991b1b">36 864</tspan> parámetros</text>

  <text x="400" y="358" font-size="11" fill="#2563eb">Separable:</text>
  <text x="480" y="358" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace" fill="#374151">3×3×64 + 64×64 = <tspan font-weight="700" fill="#2563eb">4 672</tspan></text>

  <text x="40" y="376" font-size="10.5" fill="#6b7280">Casi <tspan font-weight="700" fill="#1a1a1a">8 veces menos</tspan>, y la ventaja crece con el número de filtros. Menos parámetros = menos riesgo de overfitting.</text>
</svg>
