<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="'Segoe UI', system-ui, Arial, sans-serif">
  <rect width="780" height="400" fill="#ffffff"/>

  <text x="390" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">El mismo paso de entrenamiento, tres dialectos</text>
  <text x="390" y="50" text-anchor="middle" font-size="11.5" fill="#6b7280">Lo único que cambia: cómo se guarda el estado y cómo se piden los gradientes</text>

  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5">

    <!-- TensorFlow column -->
    <rect x="24" y="68" width="230" height="252" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
    <rect x="24" y="68" width="230" height="30" rx="8" fill="#dbeafe"/>
    <rect x="24" y="88" width="230" height="10" fill="#dbeafe"/>
    <text x="139" y="88" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a" font-family="'Segoe UI', system-ui, Arial, sans-serif">TensorFlow</text>

    <text x="40" y="122" fill="#6b7280" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="10.5">estado</text>
    <text x="40" y="140" fill="#1a1a1a">W = tf.Variable(...)</text>

    <text x="40" y="172" fill="#6b7280" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="10.5">gradientes</text>
    <text x="40" y="190" fill="#2563eb">with tf.GradientTape()</text>
    <text x="40" y="206" fill="#1a1a1a">    pred = model(x)</text>
    <text x="40" y="222" fill="#1a1a1a">    loss = mse(...)</text>
    <text x="40" y="238" fill="#2563eb">gW, gb = tape.gradient(</text>
    <text x="40" y="254" fill="#2563eb">    loss, [W, b])</text>

    <text x="40" y="286" fill="#6b7280" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="10.5">update</text>
    <text x="40" y="304" fill="#1a1a1a">W.assign_sub(gW * lr)</text>

    <!-- PyTorch column -->
    <rect x="275" y="68" width="230" height="252" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
    <rect x="275" y="68" width="230" height="30" rx="8" fill="#dbeafe"/>
    <rect x="275" y="88" width="230" height="10" fill="#dbeafe"/>
    <text x="390" y="88" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a" font-family="'Segoe UI', system-ui, Arial, sans-serif">PyTorch</text>

    <text x="291" y="122" fill="#6b7280" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="10.5">estado</text>
    <text x="291" y="140" fill="#1a1a1a">self.W = nn.Parameter(</text>
    <text x="291" y="156" fill="#1a1a1a">    ...)</text>

    <text x="291" y="188" fill="#6b7280" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="10.5">gradientes</text>
    <text x="291" y="206" fill="#1a1a1a">pred = model(x)</text>
    <text x="291" y="222" fill="#1a1a1a">loss = mse(...)</text>
    <text x="291" y="238" fill="#2563eb">loss.backward()</text>

    <text x="291" y="270" fill="#6b7280" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="10.5">update</text>
    <text x="291" y="288" fill="#1a1a1a">optimizer.step()</text>
    <text x="291" y="304" fill="#dc2626">model.zero_grad()</text>

    <!-- JAX column -->
    <rect x="526" y="68" width="230" height="252" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
    <rect x="526" y="68" width="230" height="30" rx="8" fill="#dbeafe"/>
    <rect x="526" y="88" width="230" height="10" fill="#dbeafe"/>
    <text x="641" y="88" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a" font-family="'Segoe UI', system-ui, Arial, sans-serif">JAX</text>

    <text x="542" y="122" fill="#6b7280" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="10.5">estado</text>
    <text x="542" y="140" fill="#1a1a1a">state = (W, b)</text>
    <text x="542" y="156" fill="#6b7280" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="10">no vive en ningún lado</text>

    <text x="542" y="188" fill="#6b7280" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="10.5">gradientes</text>
    <text x="542" y="206" fill="#2563eb">grad_fn = jax.</text>
    <text x="542" y="222" fill="#2563eb">  value_and_grad(loss)</text>
    <text x="542" y="238" fill="#1a1a1a">l, g = grad_fn(state,</text>
    <text x="542" y="254" fill="#1a1a1a">              x, y)</text>

    <text x="542" y="286" fill="#6b7280" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="10.5">update</text>
    <text x="542" y="304" fill="#1a1a1a">W = W - g[0] * lr</text>
  </g>

  <!-- bottom notes -->
  <rect x="24" y="336" width="230" height="44" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="139" y="354" text-anchor="middle" font-size="10.5" fill="#1e3a8a">Una <tspan font-weight="700">cinta</tspan> graba las ops</text>
  <text x="139" y="370" text-anchor="middle" font-size="10.5" fill="#1e3a8a">dentro de su scope</text>

  <rect x="275" y="336" width="230" height="44" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="390" y="354" text-anchor="middle" font-size="10.5" fill="#991b1b">Los gradientes <tspan font-weight="700">se acumulan</tspan>:</text>
  <text x="390" y="370" text-anchor="middle" font-size="10.5" fill="#991b1b">olvidar el reset es un bug real</text>

  <rect x="526" y="336" width="230" height="44" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="641" y="354" text-anchor="middle" font-size="10.5" fill="#1e3a8a">Una <tspan font-weight="700">meta-función</tspan> convierte</text>
  <text x="641" y="370" text-anchor="middle" font-size="10.5" fill="#1e3a8a">la pérdida en su gradiente</text>
</svg>
