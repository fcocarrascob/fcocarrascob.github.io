<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'Segoe UI', system-ui, Arial, sans-serif">
  <defs>
    <marker id="sp-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="800" height="440" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Síntesis de programas: la pieza que falta, y por qué todavía no funciona sola</text>
  <text x="400" y="48" text-anchor="middle" font-size="11.5" fill="#6b7280">Mismo problema que el machine learning —pares entrada-salida— resuelto con búsqueda discreta en vez de gradiente</text>

  <!-- parallel table -->
  <rect x="20" y="66" width="760" height="150" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>

  <text x="300" y="92" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e40af">Machine learning</text>
  <text x="600" y="92" text-anchor="middle" font-size="11.5" font-weight="700" fill="#166534">Síntesis de programas</text>
  <line x1="40" y1="102" x2="760" y2="102" stroke="#e5e7eb"/>

  <text x="40" y="124" font-size="10.5" font-weight="700" fill="#374151">Modelo</text>
  <text x="300" y="124" text-anchor="middle" font-size="10.5" fill="#374151">función paramétrica diferenciable</text>
  <text x="600" y="124" text-anchor="middle" font-size="10.5" fill="#374151">grafo de operadores de un lenguaje</text>

  <text x="40" y="150" font-size="10.5" font-weight="700" fill="#374151">Motor</text>
  <text x="300" y="150" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e40af">descenso de gradiente</text>
  <text x="600" y="150" text-anchor="middle" font-size="10.5" font-weight="700" fill="#166534">búsqueda discreta</text>

  <text x="40" y="176" font-size="10.5" font-weight="700" fill="#374151">Datos</text>
  <text x="300" y="176" text-anchor="middle" font-size="10.5" fill="#991b1b">requiere muchísimos</text>
  <text x="600" y="176" text-anchor="middle" font-size="10.5" fill="#166534">funciona con un par de ejemplos</text>

  <line x1="40" y1="190" x2="760" y2="190" stroke="#e5e7eb"/>
  <text x="400" y="208" text-anchor="middle" font-size="10.5" fill="#6b7280">La diferencia: en vez de aprender los valores de los parámetros de un programa fijo, <tspan font-weight="700" fill="#374151">se genera el código fuente</tspan>.</text>

  <!-- explosion -->
  <rect x="20" y="232" width="374" height="192" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="207" y="256" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991b1b">El obstáculo: explosión combinatoria</text>

  <g stroke="#dc2626" fill="none" stroke-width="1.2">
    <line x1="207" y1="272" x2="147" y2="300"/><line x1="207" y1="272" x2="207" y2="300"/><line x1="207" y1="272" x2="267" y2="300"/>
    <line x1="147" y1="300" x2="117" y2="330"/><line x1="147" y1="300" x2="177" y2="330"/>
    <line x1="207" y1="300" x2="207" y2="330"/>
    <line x1="267" y1="300" x2="237" y2="330"/><line x1="267" y1="300" x2="297" y2="330"/>
  </g>
  <g fill="#dc2626">
    <circle cx="207" cy="272" r="4"/>
    <circle cx="147" cy="300" r="4"/><circle cx="207" cy="300" r="4"/><circle cx="267" cy="300" r="4"/>
    <circle cx="117" cy="330" r="4"/><circle cx="177" cy="330" r="4"/><circle cx="207" cy="330" r="4"/>
    <circle cx="237" cy="330" r="4"/><circle cx="297" cy="330" r="4"/>
  </g>
  <text x="330" y="304" font-size="10" fill="#991b1b">crece más</text>
  <text x="330" y="317" font-size="10" fill="#991b1b">rápido que</text>
  <text x="330" y="330" font-size="10" font-weight="700" fill="#991b1b">exponencial</text>

  <text x="40" y="360" font-size="10.5" fill="#374151">A medida que crece la especificación o el vocabulario de</text>
  <text x="40" y="374" font-size="10.5" fill="#374151">primitivas, el espacio de programas posibles explota.</text>
  <text x="40" y="396" font-size="10.5" font-weight="700" fill="#991b1b">Hoy solo sirve para generar programas muy cortos.</text>
  <text x="40" y="412" font-size="10" fill="#6b7280">«No vas a generar un sistema operativo nuevo pronto.»</text>

  <!-- guided search -->
  <rect x="410" y="232" width="370" height="192" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="595" y="256" text-anchor="middle" font-size="11.5" font-weight="700" fill="#166534">La salida: que el deep learning guíe la búsqueda</text>

  <rect x="430" y="272" width="150" height="42" rx="5" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="505" y="290" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">intuición aprendida</text>
  <text x="505" y="305" text-anchor="middle" font-size="9.5" fill="#374151">sobre el espacio de programas</text>

  <line x1="583" y1="293" x2="605" y2="293" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#sp-ar)"/>

  <rect x="608" y="272" width="150" height="42" rx="5" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="683" y="290" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">poda del árbol</text>
  <text x="683" y="305" text-anchor="middle" font-size="9.5" fill="#374151">quedan unos pocos caminos</text>

  <text x="430" y="340" font-size="10.5" fill="#374151">Cada programa concreto es un objeto discreto, <tspan font-weight="700">pero el</tspan></text>
  <text x="430" y="354" font-size="10.5" fill="#374151"><tspan font-weight="700">espacio de todos los programas útiles</tspan> parece parecerse</text>
  <text x="430" y="368" font-size="10.5" fill="#374151">bastante a <tspan font-weight="700">un manifold continuo</tspan>.</text>

  <text x="430" y="392" font-size="10" fill="#6b7280">Es lo que hace un programador: al abrir el editor no piensa en</text>
  <text x="430" y="405" font-size="10" fill="#6b7280">todos los programas posibles, solo en un puñado de enfoques.</text>
  <text x="430" y="420" font-size="10" font-weight="700" fill="#166534">La síntesis no reemplaza al deep learning: es su complemento.</text>
</svg>
