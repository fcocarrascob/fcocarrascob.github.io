<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 388" font-family="'Segoe UI', system-ui, Arial, sans-serif">
  <rect width="780" height="388" fill="#ffffff"/>

  <text x="390" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">El mismo problema, cuatro veces: 2 000 imágenes de perros y gatos</text>
  <text x="390" y="50" text-anchor="middle" font-size="11.5" fill="#6b7280">En la competencia original de Kaggle las mejores entradas llegaron hasta 95 %, con 10 veces más datos</text>

  <!-- axis -->
  <line x1="300" y1="72" x2="300" y2="330" stroke="#e5e7eb"/>
  <text x="300" y="66" text-anchor="middle" font-size="10" fill="#9ca3af">70 %</text>
  <line x1="740" y1="72" x2="740" y2="330" stroke="#e5e7eb"/>
  <text x="740" y="66" text-anchor="middle" font-size="10" fill="#9ca3af">100 %</text>

  <!-- Row 1 -->
  <text x="24" y="98" font-size="12" font-weight="700" fill="#374151">1 · Desde cero</text>
  <text x="24" y="114" font-size="10.5" fill="#6b7280">ConvNet de 5 bloques, sin regularizar</text>
  <text x="24" y="129" font-size="10" fill="#9ca3af">overfittea desde la época 10</text>
  <rect x="300" y="92" width="440" height="26" rx="4" fill="#f3f4f6"/>
  <rect x="300" y="92" width="126" height="26" rx="4" fill="#fca5a5"/>
  <text x="438" y="110" font-size="13" font-weight="700" fill="#991b1b">78,6 %</text>

  <!-- Row 2 -->
  <text x="24" y="170" font-size="12" font-weight="700" fill="#374151">2 · + data augmentation</text>
  <text x="24" y="186" font-size="10.5" fill="#6b7280">RandomFlip · RandomRotation · RandomZoom</text>
  <text x="24" y="201" font-size="10" fill="#9ca3af">+ Dropout(0.25) · overfittea recién en la 60–70</text>
  <rect x="300" y="164" width="440" height="26" rx="4" fill="#f3f4f6"/>
  <rect x="300" y="164" width="204" height="26" rx="4" fill="#fbbf24"/>
  <text x="516" y="182" font-size="13" font-weight="700" fill="#92400e">83,9 %</text>

  <!-- Row 3 -->
  <text x="24" y="242" font-size="12" font-weight="700" fill="#374151">3 · Feature extraction rápida</text>
  <text x="24" y="258" font-size="10.5" fill="#6b7280">features de Xception cacheadas + clasificador nuevo</text>
  <text x="24" y="273" font-size="10" fill="#9ca3af">una época toma &lt; 1 s incluso en CPU</text>
  <rect x="300" y="236" width="440" height="26" rx="4" fill="#f3f4f6"/>
  <rect x="300" y="236" width="413" height="26" rx="4" fill="#60a5fa"/>
  <text x="701" y="254" text-anchor="end" font-size="13" font-weight="700" fill="#ffffff">98,1 %</text>

  <!-- Row 4 -->
  <text x="24" y="314" font-size="12" font-weight="700" fill="#1e3a8a">4 · Fine-tuning</text>
  <text x="24" y="330" font-size="10.5" fill="#2563eb">descongelar la base, lr = 1e-5</text>
  <text x="24" y="345" font-size="10" fill="#9ca3af">solo después de entrenar la cabeza</text>
  <rect x="300" y="308" width="440" height="26" rx="4" fill="#f3f4f6"/>
  <rect x="300" y="308" width="420" height="26" rx="4" fill="#2563eb"/>
  <text x="708" y="326" text-anchor="end" font-size="13" font-weight="700" fill="#ffffff">98,6 %</text>

  <!-- footer -->
  <rect x="24" y="358" width="716" height="0" rx="6"/>
  <text x="390" y="376" text-anchor="middle" font-size="11" fill="#374151">El salto grande no viene de un modelo mejor: viene de <tspan font-weight="700" fill="#2563eb">reutilizar features</tspan> aprendidas en 1,4 millones de imágenes</text>
</svg>
