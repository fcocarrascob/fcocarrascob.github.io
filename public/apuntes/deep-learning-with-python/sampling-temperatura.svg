<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 412" font-family="'Segoe UI', system-ui, Arial, sans-serif">
  <rect width="800" height="412" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">La salida no es un token: es una distribución sobre 32 000</text>
  <text x="400" y="48" text-anchor="middle" font-size="11.5" fill="#6b7280">La temperatura divide los logits antes del softmax. Bajarla afila la distribución; subirla la aplana. No descarta nada.</text>

  <!-- T = 0.2 -->
  <rect x="20" y="66" width="246" height="182" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="143" y="88" text-anchor="middle" font-size="11.5" font-weight="700" fill="#374151">temperature = 0,2</text>
  <line x1="40" y1="206" x2="250" y2="206" stroke="#d1d5db"/>
  <g>
    <rect x="46" y="107" width="30" height="99" fill="#2563eb" fill-opacity="0.55"/><text x="61" y="101" text-anchor="middle" font-size="9" fill="#1e3a8a">0,90</text>
    <rect x="88" y="196" width="30" height="10" fill="#2563eb" fill-opacity="0.25"/><text x="103" y="190" text-anchor="middle" font-size="9" fill="#6b7280">0,09</text>
    <rect x="130" y="205" width="30" height="1" fill="#2563eb" fill-opacity="0.25"/><text x="145" y="199" text-anchor="middle" font-size="9" fill="#9ca3af">0,01</text>
    <rect x="172" y="206" width="30" height="0.5" fill="#2563eb" fill-opacity="0.25"/><text x="187" y="199" text-anchor="middle" font-size="9" fill="#9ca3af">~0</text>
    <rect x="214" y="206" width="30" height="0.5" fill="#2563eb" fill-opacity="0.25"/><text x="229" y="199" text-anchor="middle" font-size="9" fill="#9ca3af">~0</text>
  </g>
  <text x="143" y="222" text-anchor="middle" font-size="10" fill="#6b7280">casi siempre el mismo token</text>
  <text x="143" y="239" text-anchor="middle" font-size="10.5" fill="#991b1b">Vuelve al greedy: se repite en bucle.</text>

  <!-- T = 1.0 -->
  <rect x="277" y="66" width="246" height="182" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="400" y="88" text-anchor="middle" font-size="11.5" font-weight="700" fill="#374151">temperature = 1,0 · la distribución cruda</text>
  <line x1="297" y1="206" x2="507" y2="206" stroke="#d1d5db"/>
  <g>
    <rect x="303" y="162" width="30" height="44" fill="#2563eb" fill-opacity="0.45"/><text x="318" y="156" text-anchor="middle" font-size="9" fill="#1e3a8a">0,40</text>
    <rect x="345" y="178" width="30" height="28" fill="#2563eb" fill-opacity="0.4"/><text x="360" y="172" text-anchor="middle" font-size="9" fill="#374151">0,25</text>
    <rect x="387" y="189" width="30" height="17" fill="#2563eb" fill-opacity="0.35"/><text x="402" y="183" text-anchor="middle" font-size="9" fill="#374151">0,15</text>
    <rect x="429" y="193" width="30" height="13" fill="#2563eb" fill-opacity="0.3"/><text x="444" y="187" text-anchor="middle" font-size="9" fill="#374151">0,12</text>
    <rect x="471" y="197" width="30" height="9" fill="#2563eb" fill-opacity="0.25"/><text x="486" y="191" text-anchor="middle" font-size="9" fill="#374151">0,08</text>
  </g>
  <text x="400" y="222" text-anchor="middle" font-size="10" fill="#6b7280">se muestrea tal cual</text>
  <text x="400" y="239" text-anchor="middle" font-size="10.5" fill="#92400e">Diverso, pero salta sin continuidad.</text>

  <!-- T = 2.0 -->
  <rect x="534" y="66" width="246" height="182" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="657" y="88" text-anchor="middle" font-size="11.5" font-weight="700" fill="#374151">temperature = 2,0</text>
  <line x1="554" y1="206" x2="764" y2="206" stroke="#d1d5db"/>
  <g>
    <rect x="560" y="174" width="30" height="32" fill="#2563eb" fill-opacity="0.4"/><text x="575" y="168" text-anchor="middle" font-size="9" fill="#374151">0,29</text>
    <rect x="602" y="180" width="30" height="26" fill="#2563eb" fill-opacity="0.38"/><text x="617" y="174" text-anchor="middle" font-size="9" fill="#374151">0,23</text>
    <rect x="644" y="186" width="30" height="20" fill="#2563eb" fill-opacity="0.35"/><text x="659" y="180" text-anchor="middle" font-size="9" fill="#374151">0,18</text>
    <rect x="686" y="188" width="30" height="18" fill="#2563eb" fill-opacity="0.33"/><text x="701" y="182" text-anchor="middle" font-size="9" fill="#374151">0,16</text>
    <rect x="728" y="191" width="30" height="15" fill="#2563eb" fill-opacity="0.3"/><text x="743" y="185" text-anchor="middle" font-size="9" fill="#374151">0,13</text>
  </g>
  <text x="657" y="222" text-anchor="middle" font-size="10" fill="#6b7280">todos casi igual de probables</text>
  <text x="657" y="239" text-anchor="middle" font-size="10.5" fill="#991b1b">Deja de parecerse al inglés.</text>

  <!-- top-k -->
  <rect x="20" y="266" width="760" height="130" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="40" y="290" font-size="12" font-weight="700" fill="#166534">Top-K es otra cosa, y conviene no confundirlas</text>

  <g>
    <rect x="46" y="330" width="30" height="26" fill="#16a34a" fill-opacity="0.45"/><text x="61" y="324" text-anchor="middle" font-size="9" fill="#166534">0,50</text>
    <rect x="88" y="340" width="30" height="16" fill="#16a34a" fill-opacity="0.4"/><text x="103" y="334" text-anchor="middle" font-size="9" fill="#166534">0,31</text>
    <rect x="130" y="346" width="30" height="10" fill="#16a34a" fill-opacity="0.35"/><text x="145" y="340" text-anchor="middle" font-size="9" fill="#166534">0,19</text>
    <rect x="172" y="346" width="30" height="10" fill="#f3f4f6" stroke="#e5e7eb"/><text x="187" y="340" text-anchor="middle" font-size="9" fill="#dc2626">0</text>
    <rect x="214" y="346" width="30" height="10" fill="#f3f4f6" stroke="#e5e7eb"/><text x="229" y="340" text-anchor="middle" font-size="9" fill="#dc2626">0</text>
  </g>
  <line x1="40" y1="356" x2="250" y2="356" stroke="#d1d5db"/>
  <text x="143" y="372" text-anchor="middle" font-size="9.5" fill="#6b7280">k = 3, renormalizado</text>

  <text x="278" y="314" font-size="10.5" fill="#374151"><tspan font-weight="700">La temperatura</tspan> hace más probables a los tokens probables,</text>
  <text x="278" y="330" font-size="10.5" fill="#374151">pero <tspan font-weight="700">no descarta ninguno</tspan>: la cola larga sigue viva.</text>
  <text x="278" y="352" font-size="10.5" fill="#374151"><tspan font-weight="700">El top-K</tspan> pone en cero todo lo que queda fuera de los K</text>
  <text x="278" y="368" font-size="10.5" fill="#374151">candidatos. Se pueden combinar — y combinarlos con una</text>
  <text x="278" y="384" font-size="10.5" fill="#374151">temperatura baja trae la repetición de vuelta.</text>
</svg>
