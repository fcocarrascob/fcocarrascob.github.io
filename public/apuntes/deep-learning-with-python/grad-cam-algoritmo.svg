<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="'Segoe UI', system-ui, Arial, sans-serif">
  <defs>
    <marker id="gc-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="gc-gr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="780" height="400" fill="#ffffff"/>

  <text x="390" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Grad-CAM: el algoritmo completo en tres líneas</text>

  <!-- setup: two half-models -->
  <rect x="20" y="50" width="740" height="122" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="40" y="72" font-size="11.5" font-weight="700" fill="#374151">El montaje: se parte el modelo en dos por la última capa convolucional</text>

  <rect x="40" y="86" width="120" height="46" rx="5" fill="#ffffff" stroke="#d1d5db"/>
  <text x="100" y="106" text-anchor="middle" font-size="10.5" fill="#374151">Imagen</text>
  <text x="100" y="121" text-anchor="middle" font-size="9.5" fill="#6b7280">del elefante</text>

  <line x1="160" y1="109" x2="182" y2="109" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#gc-ar)"/>

  <rect x="184" y="86" width="150" height="46" rx="5" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="259" y="105" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1e3a8a">Modelo A</text>
  <text x="259" y="120" text-anchor="middle" font-size="9.5" fill="#1e3a8a">hasta la última conv</text>

  <line x1="334" y1="109" x2="356" y2="109" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#gc-ar)"/>

  <rect x="358" y="82" width="150" height="54" rx="5" fill="#2563eb"/>
  <text x="433" y="102" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">Mapa de features</text>
  <text x="433" y="117" text-anchor="middle" font-size="9.5" fill="#dbeafe">(alto, ancho, canales)</text>
  <text x="433" y="130" text-anchor="middle" font-size="9" fill="#93c5fd">el objeto de interés</text>

  <line x1="508" y1="109" x2="530" y2="109" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#gc-ar)"/>

  <rect x="532" y="86" width="128" height="46" rx="5" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="596" y="105" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1e3a8a">Modelo B</text>
  <text x="596" y="120" text-anchor="middle" font-size="9.5" fill="#1e3a8a">de ahí a las clases</text>

  <line x1="660" y1="109" x2="682" y2="109" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#gc-ar)"/>
  <rect x="684" y="86" width="56" height="46" rx="5" fill="#ffffff" stroke="#d1d5db"/>
  <text x="712" y="105" text-anchor="middle" font-size="9.5" fill="#374151">clase</text>
  <text x="712" y="119" text-anchor="middle" font-size="9.5" font-weight="700" fill="#374151">argmax</text>

  <!-- gradient arrow back -->
  <path d="M 712 136 C 712 150, 433 150, 433 140" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#gc-gr)"/>
  <text x="572" y="165" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">∂(clase ganadora) / ∂(mapa)</text>

  <!-- the three lines -->
  <text x="390" y="194" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Y con ese gradiente, tres operaciones</text>

  <!-- step 1 -->
  <rect x="20" y="206" width="240" height="120" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="40" y="228" font-size="11" font-weight="700" fill="#1e3a8a">1 · ¿Cuánto importa cada canal?</text>
  <rect x="36" y="238" width="208" height="24" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="140" y="254" text-anchor="middle" font-size="9.5" font-family="'JetBrains Mono', ui-monospace, monospace" fill="#2563eb">mean(grads, axis=(0,1,2))</text>
  <text x="40" y="280" font-size="10" fill="#374151">Promedia el gradiente sobre los ejes</text>
  <text x="40" y="295" font-size="10" fill="#374151">espaciales. Queda <tspan font-weight="700">un número por canal</tspan>:</text>
  <text x="40" y="310" font-size="10" fill="#2563eb">cuánto le importa ese canal a la clase.</text>

  <!-- step 2 -->
  <rect x="270" y="206" width="240" height="120" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="290" y="228" font-size="11" font-weight="700" fill="#1e3a8a">2 · Pondera el mapa</text>
  <rect x="286" y="238" width="208" height="24" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="390" y="254" text-anchor="middle" font-size="9.5" font-family="'JetBrains Mono', ui-monospace, monospace" fill="#2563eb">output[:,:,i] *= pooled[i]</text>
  <text x="290" y="280" font-size="10" fill="#374151">Multiplica cada canal del mapa por</text>
  <text x="290" y="295" font-size="10" fill="#374151">su importancia. Los canales que no</text>
  <text x="290" y="310" font-size="10" fill="#374151">deciden la clase <tspan font-weight="700">se apagan</tspan>.</text>

  <!-- step 3 -->
  <rect x="520" y="206" width="240" height="120" rx="8" fill="#2563eb"/>
  <text x="540" y="228" font-size="11" font-weight="700" fill="#ffffff">3 · Colapsa a un mapa 2D</text>
  <rect x="536" y="238" width="208" height="24" rx="4" fill="#ffffff"/>
  <text x="640" y="254" text-anchor="middle" font-size="9.5" font-family="'JetBrains Mono', ui-monospace, monospace" fill="#1e3a8a">mean(output, axis=-1)</text>
  <text x="540" y="280" font-size="10" fill="#dbeafe">Promedia sobre los canales.</text>
  <text x="540" y="295" font-size="10" fill="#ffffff" font-weight="700">Eso es el heatmap.</text>
  <text x="540" y="310" font-size="10" fill="#93c5fd">Se superpone al 40 % de opacidad.</text>

  <!-- footer: the intuition -->
  <rect x="20" y="336" width="740" height="52" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="390" y="357" text-anchor="middle" font-size="11.5" fill="#374151">La intuición: se pondera un mapa de <tspan font-weight="700">"cuánto activa la imagen cada canal"</tspan> por <tspan font-weight="700">"cuánto le importa cada canal a la clase"</tspan>,</text>
  <text x="390" y="376" text-anchor="middle" font-size="11.5" fill="#374151">y queda un mapa de <tspan font-weight="700" fill="#2563eb">"cuánto activa la imagen la clase, en cada punto"</tspan>.</text>
</svg>
