<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="'Segoe UI', system-ui, Arial, sans-serif">
  <rect width="760" height="380" fill="#ffffff"/>

  <text x="380" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">La curva canónica del overfitting</text>
  <text x="380" y="50" text-anchor="middle" font-size="11.5" fill="#6b7280">Universal: se ve con cualquier tipo de modelo y cualquier dataset</text>

  <!-- zone bands -->
  <rect x="90" y="80" width="185" height="200" fill="#f9fafb"/>
  <rect x="275" y="80" width="115" height="200" fill="#eff6ff"/>
  <rect x="390" y="80" width="310" height="200" fill="#fef2f2"/>

  <!-- axes -->
  <line x1="90" y1="80" x2="90" y2="280" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="90" y1="280" x2="700" y2="280" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="68" y="180" text-anchor="middle" font-size="11.5" fill="#374151" transform="rotate(-90 68 180)">Pérdida</text>
  <text x="395" y="302" text-anchor="middle" font-size="11.5" fill="#374151">Tiempo de entrenamiento</text>

  <!-- vertical separators -->
  <line x1="275" y1="80" x2="275" y2="280" stroke="#d1d5db" stroke-dasharray="4 3"/>
  <line x1="390" y1="80" x2="390" y2="280" stroke="#d1d5db" stroke-dasharray="4 3"/>

  <!-- validation curve: down, minimum, then back up -->
  <path d="M 100 112 C 170 162, 250 192, 332 196 C 430 200, 545 168, 690 108"
        fill="none" stroke="#2563eb" stroke-width="2.5"/>

  <!-- training curve: monotonically down -->
  <path d="M 100 124 C 200 192, 320 234, 450 252 C 550 264, 620 268, 690 272"
        fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- minimum marker -->
  <circle cx="332" cy="196" r="5" fill="#2563eb"/>
  <line x1="332" y1="191" x2="332" y2="112" stroke="#2563eb" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="332" y="104" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb">el mejor modelo está aquí</text>

  <!-- legend, in the empty lower-left of the plot -->
  <line x1="112" y1="248" x2="144" y2="248" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="152" y="252" font-size="11" fill="#374151">curva de entrenamiento</text>
  <line x1="112" y1="268" x2="144" y2="268" stroke="#2563eb" stroke-width="2.5"/>
  <text x="152" y="272" font-size="11" fill="#374151">curva de validación</text>

  <!-- zone labels -->
  <text x="182" y="328" text-anchor="middle" font-size="12.5" font-weight="700" fill="#374151">UNDERFITTING</text>
  <text x="182" y="346" text-anchor="middle" font-size="10.5" fill="#6b7280">ambas bajan; aún hay</text>
  <text x="182" y="361" text-anchor="middle" font-size="10.5" fill="#6b7280">progreso por hacer</text>

  <text x="332" y="328" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">ROBUST FIT</text>
  <text x="332" y="346" text-anchor="middle" font-size="10.5" fill="#2563eb">aproxima el</text>
  <text x="332" y="361" text-anchor="middle" font-size="10.5" fill="#2563eb">manifold latente</text>

  <text x="545" y="328" text-anchor="middle" font-size="12.5" font-weight="700" fill="#991b1b">OVERFITTING</text>
  <text x="545" y="346" text-anchor="middle" font-size="10.5" fill="#991b1b">aprende patrones específicos del entrenamiento</text>
  <text x="545" y="361" text-anchor="middle" font-size="10.5" fill="#991b1b">que son engañosos o irrelevantes fuera de él</text>
</svg>
