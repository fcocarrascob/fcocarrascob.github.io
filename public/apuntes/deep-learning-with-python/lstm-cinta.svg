<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Segoe UI', system-ui, Arial, sans-serif">
  <defs>
    <marker id="ls-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="ls-cy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/>
    </marker>
  </defs>
  <rect width="800" height="400" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">El LSTM es una SimpleRNN con una cinta transportadora al lado</text>
  <text x="400" y="48" text-anchor="middle" font-size="11.5" fill="#6b7280">"La información puede subirse a la cinta en cualquier punto, ser transportada a un timestep posterior, y bajarse intacta cuando la necesites"</text>

  <!-- carry track -->
  <rect x="70" y="80" width="660" height="34" rx="17" fill="#cffafe" stroke="#0891b2"/>
  <text x="92" y="102" font-size="11" font-weight="700" fill="#0e7490">carry track</text>
  <text x="238" y="102" text-anchor="middle" font-size="12" font-weight="700" fill="#0e7490">c t-1</text>
  <text x="400" y="102" text-anchor="middle" font-size="12" font-weight="700" fill="#0e7490">c t</text>
  <text x="562" y="102" text-anchor="middle" font-size="12" font-weight="700" fill="#0e7490">c t+1</text>
  <line x1="270" y1="97" x2="368" y2="97" stroke="#0891b2" stroke-width="1.6" marker-end="url(#ls-cy)"/>
  <line x1="428" y1="97" x2="530" y2="97" stroke="#0891b2" stroke-width="1.6" marker-end="url(#ls-cy)"/>

  <!-- cells -->
  <rect x="180" y="170" width="116" height="66" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="238" y="196" text-anchor="middle" font-size="10.5" fill="#6b7280">celda</text>
  <text x="238" y="214" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">t − 1</text>

  <rect x="342" y="170" width="116" height="66" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="400" y="196" text-anchor="middle" font-size="10.5" fill="#1e3a8a">celda</text>
  <text x="400" y="214" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">t</text>

  <rect x="504" y="170" width="116" height="66" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="562" y="196" text-anchor="middle" font-size="10.5" fill="#6b7280">celda</text>
  <text x="562" y="214" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">t + 1</text>

  <!-- state arrows -->
  <line x1="298" y1="203" x2="338" y2="203" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ls-ar)"/>
  <text x="318" y="196" text-anchor="middle" font-size="9" fill="#6b7280">state</text>
  <line x1="460" y1="203" x2="500" y2="203" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ls-ar)"/>
  <text x="480" y="196" text-anchor="middle" font-size="9" fill="#6b7280">state</text>

  <!-- carry connections -->
  <line x1="400" y1="116" x2="400" y2="166" stroke="#0891b2" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ls-cy)"/>
  <text x="410" y="142" font-size="9.5" fill="#0e7490">Vo · c_t entra al output</text>
  <line x1="440" y1="166" x2="470" y2="120" stroke="#0891b2" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ls-cy)"/>
  <text x="478" y="140" font-size="9.5" fill="#0e7490">i_t, f_t, k_t actualizan la cinta</text>

  <!-- inputs / outputs -->
  <line x1="238" y1="270" x2="238" y2="240" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ls-ar)"/>
  <text x="238" y="286" text-anchor="middle" font-size="10" fill="#6b7280">input t-1</text>
  <line x1="400" y1="270" x2="400" y2="240" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ls-ar)"/>
  <text x="400" y="286" text-anchor="middle" font-size="10" fill="#374151">input t</text>
  <line x1="562" y1="270" x2="562" y2="240" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ls-ar)"/>
  <text x="562" y="286" text-anchor="middle" font-size="10" fill="#6b7280">input t+1</text>

  <text x="238" y="162" text-anchor="middle" font-size="10" fill="#6b7280">output t-1</text>
  <text x="400" y="162" text-anchor="middle" font-size="10" fill="#374151">output t</text>
  <text x="562" y="162" text-anchor="middle" font-size="10" fill="#6b7280">output t+1</text>

  <!-- the formula -->
  <rect x="140" y="304" width="520" height="42" rx="8" fill="#f0f9ff" stroke="#bae6fd"/>
  <text x="400" y="330" text-anchor="middle" font-size="13" font-family="'Consolas', monospace" fill="#0c4a6e">c_t+1 = i_t * k_t + c_t * f_t</text>

  <text x="400" y="368" text-anchor="middle" font-size="10.5" fill="#374151">Podrías leer <tspan font-weight="700">c_t * f_t</tspan> como "olvidar lo irrelevante" y <tspan font-weight="700">i_t * k_t</tspan> como "aportar lo nuevo". Chollet advierte que esa lectura no significa gran cosa:</text>
  <text x="400" y="386" text-anchor="middle" font-size="10.5" fill="#374151">lo que hacen esas operaciones lo deciden los pesos, que se aprenden de cero. La celda <tspan font-weight="700">acota la búsqueda; no es un diseño en sentido ingenieril</tspan>.</text>
</svg>
