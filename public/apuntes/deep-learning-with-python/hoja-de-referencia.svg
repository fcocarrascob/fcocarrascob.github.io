<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Segoe UI', system-ui, Arial, sans-serif">
  <rect width="800" height="480" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">La hoja de referencia: qué arquitectura, y cómo termina el modelo</text>
  <text x="400" y="48" text-anchor="middle" font-size="11.5" fill="#6b7280">«Una arquitectura codifica suposiciones sobre la estructura de los datos. Que funcione depende de si esas suposiciones calzan.»</text>

  <!-- modality table -->
  <rect x="20" y="66" width="374" height="230" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="40" y="90" font-size="11.5" font-weight="700" fill="#374151">Modalidad de datos → arquitectura</text>

  <text x="40" y="114" font-size="10" font-weight="700" fill="#6b7280">Entrada</text>
  <text x="200" y="114" font-size="10" font-weight="700" fill="#6b7280">Salida</text>
  <text x="290" y="114" font-size="10" font-weight="700" fill="#6b7280">Modelo</text>
  <line x1="40" y1="122" x2="374" y2="122" stroke="#e5e7eb"/>

  <text x="40" y="142" font-size="10" fill="#374151">Vectores</text>
  <text x="200" y="142" font-size="10" fill="#6b7280">clase / valor</text>
  <text x="290" y="142" font-size="10" font-weight="700" fill="#1e40af">Dense</text>

  <text x="40" y="166" font-size="10" fill="#374151">Series de tiempo</text>
  <text x="200" y="166" font-size="10" fill="#6b7280">clase / valor</text>
  <text x="290" y="166" font-size="10" font-weight="700" fill="#1e40af">RNN, Transformer</text>

  <text x="40" y="190" font-size="10" fill="#374151">Imágenes</text>
  <text x="200" y="190" font-size="10" fill="#6b7280">clase / valor</text>
  <text x="290" y="190" font-size="10" font-weight="700" fill="#1e40af">ConvNet</text>

  <text x="40" y="214" font-size="10" fill="#374151">Texto</text>
  <text x="200" y="214" font-size="10" fill="#6b7280">clase / valor</text>
  <text x="290" y="214" font-size="10" font-weight="700" fill="#1e40af">Transformer</text>

  <text x="40" y="238" font-size="10" fill="#374151">Texto, imágenes</text>
  <text x="200" y="238" font-size="10" fill="#6b7280">texto</text>
  <text x="290" y="238" font-size="10" font-weight="700" fill="#1e40af">Transformer</text>

  <text x="40" y="262" font-size="10" fill="#374151">Texto, imágenes</text>
  <text x="200" y="262" font-size="10" fill="#6b7280">imágenes</text>
  <text x="290" y="262" font-size="10" font-weight="700" fill="#1e40af">VAE, difusión</text>

  <line x1="40" y1="272" x2="374" y2="272" stroke="#e5e7eb"/>
  <text x="40" y="288" font-size="9.5" fill="#9ca3af">Las capas se combinan como ladrillos LEGO para modelos multimodales.</text>

  <!-- last layer table -->
  <rect x="410" y="66" width="370" height="230" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="430" y="90" font-size="11.5" font-weight="700" fill="#1e40af">Cómo termina el modelo, según la tarea</text>

  <text x="430" y="116" font-size="10" font-weight="700" fill="#374151">Clasificación binaria</text>
  <text x="430" y="132" font-size="10" font-family="'Consolas', monospace" fill="#1e40af">Dense(1) · sigmoid · binary_crossentropy</text>

  <text x="430" y="160" font-size="10" font-weight="700" fill="#374151">Clasificación categórica, una etiqueta</text>
  <text x="430" y="176" font-size="10" font-family="'Consolas', monospace" fill="#1e40af">Dense(n) · softmax · categorical_crossentropy</text>
  <text x="430" y="190" font-size="9.5" fill="#6b7280">o <tspan font-family="'Consolas', monospace">sparse_categorical_crossentropy</tspan> si las etiquetas son enteros</text>

  <text x="430" y="216" font-size="10" font-weight="700" fill="#374151">Clasificación multi-etiqueta</text>
  <text x="430" y="232" font-size="10" font-family="'Consolas', monospace" fill="#1e40af">Dense(n) · sigmoid · binary_crossentropy</text>

  <text x="430" y="260" font-size="10" font-weight="700" fill="#374151">Regresión</text>
  <text x="430" y="276" font-size="10" font-family="'Consolas', monospace" fill="#1e40af">Dense(n) · sin activación · mse</text>

  <text x="430" y="290" font-size="9.5" fill="#991b1b">Ojo: binaria y multi-etiqueta comparten pérdida y activación. Solo cambia n.</text>

  <!-- assumptions -->
  <rect x="20" y="312" width="760" height="156" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="40" y="336" font-size="11.5" font-weight="700" fill="#166534">Qué suposición hace cada una</text>

  <text x="40" y="360" font-size="10.5" font-weight="700" fill="#374151">Dense</text>
  <text x="150" y="360" font-size="10.5" fill="#374151">Cualquier feature puede relacionarse con cualquier otra. No supone nada sobre la estructura.</text>

  <text x="40" y="384" font-size="10.5" font-weight="700" fill="#374151">ConvNet</text>
  <text x="150" y="384" font-size="10.5" fill="#374151">Los patrones son <tspan font-weight="700">locales</tspan> y la misma transformación sirve en cualquier posición → invariancia a la traslación.</text>

  <text x="40" y="408" font-size="10.5" font-weight="700" fill="#374151">Transformer</text>
  <text x="150" y="408" font-size="10.5" fill="#374151">Mira un <tspan font-weight="700">conjunto</tspan> de vectores y reescribe cada uno según el contexto de los demás. Con codificación</text>
  <text x="150" y="422" font-size="10.5" fill="#374151">posicional, además toma en cuenta el orden.</text>

  <text x="40" y="446" font-size="10.5" font-weight="700" fill="#374151">RNN</text>
  <text x="150" y="446" font-size="10.5" fill="#374151">El orden temporal importa y <tspan font-weight="700">no es invariante por traslación</tspan>: el pasado reciente pesa más que el</text>
  <text x="150" y="460" font-size="10.5" fill="#374151">distante. Ese es el criterio para preferirla a una ConvNet 1D.</text>
</svg>
