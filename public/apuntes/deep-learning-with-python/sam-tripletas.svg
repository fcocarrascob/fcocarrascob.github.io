<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="'Segoe UI', system-ui, Arial, sans-serif">
  <defs>
    <marker id="st-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="780" height="400" fill="#ffffff"/>

  <text x="390" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Segment Anything: la arquitectura y el truco de sus datos</text>

  <!-- architecture -->
  <rect x="20" y="50" width="740" height="118" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="40" y="72" font-size="11.5" font-weight="700" fill="#374151">Tres componentes, entrenados simultáneamente</text>

  <rect x="46" y="84" width="120" height="34" rx="5" fill="#ffffff" stroke="#d1d5db"/>
  <text x="106" y="105" text-anchor="middle" font-size="10.5" fill="#374151">Imagen</text>
  <line x1="166" y1="101" x2="188" y2="101" stroke="#2563eb" stroke-width="1.6" marker-end="url(#st-ar)"/>
  <rect x="190" y="84" width="130" height="34" rx="5" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="255" y="99" text-anchor="middle" font-size="10" font-weight="600" fill="#1e3a8a">Image encoder</text>
  <text x="255" y="112" text-anchor="middle" font-size="8.5" fill="#2563eb">"similar a Xception"</text>

  <rect x="46" y="126" width="120" height="34" rx="5" fill="#ffffff" stroke="#d1d5db"/>
  <text x="106" y="141" text-anchor="middle" font-size="10.5" fill="#374151">Prompt</text>
  <text x="106" y="153" text-anchor="middle" font-size="8.5" fill="#6b7280">punto o caja</text>
  <line x1="166" y1="143" x2="188" y2="143" stroke="#2563eb" stroke-width="1.6" marker-end="url(#st-ar)"/>
  <rect x="190" y="126" width="130" height="34" rx="5" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="255" y="147" text-anchor="middle" font-size="10" font-weight="600" fill="#1e3a8a">Prompt encoder</text>

  <path d="M 320 101 L 350 101 L 350 122" fill="none" stroke="#2563eb" stroke-width="1.6"/>
  <path d="M 320 143 L 350 143 L 350 122" fill="none" stroke="#2563eb" stroke-width="1.6"/>
  <line x1="350" y1="122" x2="378" y2="122" stroke="#2563eb" stroke-width="1.6" marker-end="url(#st-ar)"/>

  <rect x="380" y="104" width="130" height="36" rx="5" fill="#2563eb"/>
  <text x="445" y="126" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">Mask decoder</text>

  <line x1="510" y1="122" x2="532" y2="122" stroke="#2563eb" stroke-width="1.6" marker-end="url(#st-ar)"/>
  <rect x="534" y="88" width="200" height="68" rx="5" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="634" y="106" text-anchor="middle" font-size="10" font-weight="700" fill="#1e3a8a">4 máscaras candidatas</text>
  <text x="634" y="121" text-anchor="middle" font-size="9.5" fill="#374151">256 × 256, con su score</text>
  <text x="634" y="136" text-anchor="middle" font-size="9.5" fill="#374151">ordenadas por calidad</text>
  <text x="634" y="150" text-anchor="middle" font-size="9" fill="#2563eb">las otras 3 sirven si el prompt es ambiguo</text>

  <!-- the triplet trick -->
  <rect x="20" y="180" width="740" height="140" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="40" y="202" font-size="11.5" font-weight="700" fill="#1e3a8a">Y cómo se fabrican solos los datos de entrenamiento</text>
  <text x="40" y="220" font-size="10.5" fill="#374151">El modelo se entrena sobre tripletas <tspan font-family="'JetBrains Mono', ui-monospace, monospace">(imagen, prompt, máscara)</tspan> — y las tripletas se generan del propio dataset:</text>

  <rect x="40" y="234" width="150" height="66" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="115" y="254" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e3a8a">1 · Una imagen</text>
  <text x="115" y="271" text-anchor="middle" font-size="9.5" fill="#374151">de SA-1B, con unas</text>
  <text x="115" y="285" text-anchor="middle" font-size="9.5" fill="#374151">100 máscaras</text>

  <line x1="190" y1="267" x2="212" y2="267" stroke="#2563eb" stroke-width="1.6" marker-end="url(#st-ar)"/>

  <rect x="214" y="234" width="150" height="66" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="289" y="254" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e3a8a">2 · Elige una</text>
  <text x="289" y="271" text-anchor="middle" font-size="9.5" fill="#374151">máscara al azar</text>
  <text x="289" y="285" text-anchor="middle" font-size="9.5" fill="#2563eb">esa es la respuesta</text>

  <line x1="364" y1="267" x2="386" y2="267" stroke="#2563eb" stroke-width="1.6" marker-end="url(#st-ar)"/>

  <rect x="388" y="234" width="182" height="66" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="479" y="252" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e3a8a">3 · Inventa el prompt</text>
  <text x="479" y="269" text-anchor="middle" font-size="9.5" fill="#374151">punto = un píxel al azar <tspan font-style="italic">dentro</tspan></text>
  <text x="479" y="283" text-anchor="middle" font-size="9.5" fill="#374151">caja = la que encierra la máscara</text>

  <line x1="570" y1="267" x2="592" y2="267" stroke="#2563eb" stroke-width="1.6" marker-end="url(#st-ar)"/>

  <rect x="594" y="234" width="146" height="66" rx="6" fill="#2563eb"/>
  <text x="667" y="256" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">4 · Tripleta lista</text>
  <text x="667" y="273" text-anchor="middle" font-size="9.5" fill="#dbeafe">repetir indefinidamente</text>
  <text x="667" y="287" text-anchor="middle" font-size="9.5" fill="#93c5fd">sin anotación extra</text>

  <!-- footer: the loop -->
  <rect x="20" y="332" width="740" height="52" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="390" y="353" text-anchor="middle" font-size="11.5" fill="#374151">El dataset y el modelo <tspan font-weight="700">se construyeron mutuamente</tspan>: expertos anotaron un set chico → entrenó un modelo inicial →</text>
  <text x="390" y="372" text-anchor="middle" font-size="11.5" fill="#374151">ese modelo pre-segmentó las imágenes siguientes y los humanos solo <tspan font-weight="700" fill="#2563eb">corrigieron</tspan>. Y ahora SAM sirve para hacer lo mismo con tus datos.</text>
</svg>
