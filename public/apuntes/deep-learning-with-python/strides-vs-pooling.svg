<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="'Segoe UI', system-ui, Arial, sans-serif">
  <defs>
    <marker id="sp-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="780" height="360" fill="#ffffff"/>

  <text x="390" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Por qué en segmentación se submuestrea con strides y no con pooling</text>
  <text x="390" y="50" text-anchor="middle" font-size="11.5" fill="#6b7280">El mismo par de alternativas con el veredicto invertido, y es la misma operación la que lo explica</text>

  <!-- LEFT: max pooling -->
  <rect x="20" y="70" width="365" height="196" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="202" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Max pooling 2 × 2</text>

  <!-- 2x2 window with values -->
  <g>
    <rect x="120" y="110" width="42" height="42" fill="#ffffff" stroke="#dc2626"/>
    <text x="141" y="137" text-anchor="middle" font-size="13" fill="#374151">0,2</text>
    <rect x="162" y="110" width="42" height="42" fill="#ffffff" stroke="#dc2626"/>
    <text x="183" y="137" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">0,9</text>
    <rect x="120" y="152" width="42" height="42" fill="#ffffff" stroke="#dc2626"/>
    <text x="141" y="179" text-anchor="middle" font-size="13" fill="#374151">0,3</text>
    <rect x="162" y="152" width="42" height="42" fill="#ffffff" stroke="#dc2626"/>
    <text x="183" y="179" text-anchor="middle" font-size="13" fill="#374151">0,1</text>
  </g>

  <line x1="216" y1="152" x2="248" y2="152" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#sp-ar)"/>

  <rect x="252" y="131" width="52" height="42" fill="#fecaca" stroke="#dc2626"/>
  <text x="278" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">0,9</text>

  <text x="202" y="222" text-anchor="middle" font-size="11" fill="#991b1b">Devuelve <tspan font-weight="700">un escalar por ventana</tspan>, sin ningún</text>
  <text x="202" y="238" text-anchor="middle" font-size="11" fill="#991b1b">conocimiento de <tspan font-weight="700">cuál de las cuatro</tspan></text>
  <text x="202" y="254" text-anchor="middle" font-size="11" fill="#991b1b"><tspan font-weight="700">ubicaciones</tspan> produjo ese valor.</text>

  <!-- RIGHT: strided conv -->
  <rect x="395" y="70" width="365" height="196" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="577" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Convolución con stride 2</text>

  <g>
    <rect x="495" y="110" width="42" height="42" fill="#ffffff" stroke="#60a5fa"/>
    <text x="516" y="137" text-anchor="middle" font-size="13" fill="#374151">0,2</text>
    <rect x="537" y="110" width="42" height="42" fill="#ffffff" stroke="#60a5fa"/>
    <text x="558" y="137" text-anchor="middle" font-size="13" fill="#374151">0,9</text>
    <rect x="495" y="152" width="42" height="42" fill="#ffffff" stroke="#60a5fa"/>
    <text x="516" y="179" text-anchor="middle" font-size="13" fill="#374151">0,3</text>
    <rect x="537" y="152" width="42" height="42" fill="#ffffff" stroke="#60a5fa"/>
    <text x="558" y="179" text-anchor="middle" font-size="13" fill="#374151">0,1</text>
  </g>

  <line x1="591" y1="152" x2="623" y2="152" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#sp-ar)"/>

  <rect x="627" y="131" width="72" height="42" fill="#dbeafe" stroke="#2563eb"/>
  <text x="663" y="150" text-anchor="middle" font-size="10" fill="#1e3a8a">combinación</text>
  <text x="663" y="164" text-anchor="middle" font-size="10" fill="#1e3a8a">aprendida</text>

  <text x="577" y="222" text-anchor="middle" font-size="11" fill="#1e3a8a">El kernel <tspan font-weight="700">pesa cada posición por separado</tspan>,</text>
  <text x="577" y="238" text-anchor="middle" font-size="11" fill="#1e3a8a">así que la salida <tspan font-weight="700">retiene la estructura</tspan></text>
  <text x="577" y="254" text-anchor="middle" font-size="11" fill="#1e3a8a"><tspan font-weight="700">espacial</tspan> de la ventana.</text>

  <!-- bottom: which task -->
  <rect x="20" y="280" width="365" height="64" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="202" y="302" text-anchor="middle" font-size="11.5" font-weight="700" fill="#374151">Clasificación: da igual dónde estaba</text>
  <text x="202" y="322" text-anchor="middle" font-size="10.5" fill="#6b7280">La salida es una etiqueta para toda la imagen.</text>
  <text x="202" y="337" text-anchor="middle" font-size="10.5" fill="#6b7280">Perder la ubicación no cuesta nada.</text>

  <rect x="395" y="280" width="365" height="64" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="577" y="302" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e3a8a">Segmentación: la ubicación ES el output</text>
  <text x="577" y="322" text-anchor="middle" font-size="10.5" fill="#374151">Hay que emitir una clase por píxel.</text>
  <text x="577" y="337" text-anchor="middle" font-size="10.5" fill="#374151">Perder la ubicación destruye la tarea.</text>
</svg>
