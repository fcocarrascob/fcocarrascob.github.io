<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="'Segoe UI', system-ui, Arial, sans-serif">
  <defs>
    <marker id="va-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="800" height="460" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">El VAE: codificar a una distribución en vez de a un punto</text>
  <text x="400" y="48" text-anchor="middle" font-size="11.5" fill="#6b7280">Todo el truco está en el ruido que se suma antes de decodificar. Sin él, el espacio latente queda lleno de agujeros.</text>

  <!-- pipeline -->
  <rect x="20" y="64" width="760" height="124" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>

  <rect x="36" y="98" width="62" height="42" rx="5" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="67" y="118" text-anchor="middle" font-size="10" fill="#374151">imagen</text>
  <text x="67" y="132" text-anchor="middle" font-size="9" fill="#9ca3af">28×28</text>

  <line x1="101" y1="119" x2="119" y2="119" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#va-ar)"/>

  <rect x="122" y="98" width="76" height="42" rx="5" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="160" y="118" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e40af">encoder</text>
  <text x="160" y="132" text-anchor="middle" font-size="9" fill="#374151">strides, no pooling</text>

  <line x1="201" y1="119" x2="219" y2="119" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#va-ar)"/>

  <rect x="222" y="88" width="90" height="24" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="267" y="104" text-anchor="middle" font-size="10" font-family="'Consolas', monospace" fill="#1e40af">z_mean</text>
  <rect x="222" y="120" width="90" height="24" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="267" y="136" text-anchor="middle" font-size="10" font-family="'Consolas', monospace" fill="#1e40af">z_log_var</text>

  <line x1="315" y1="119" x2="333" y2="119" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#va-ar)"/>

  <rect x="336" y="98" width="128" height="42" rx="5" fill="#fef2f2" stroke="#fecaca"/>
  <text x="400" y="115" text-anchor="middle" font-size="10.5" font-weight="700" fill="#991b1b">Sampler</text>
  <text x="400" y="131" text-anchor="middle" font-size="9.5" fill="#374151">suma ruido gaussiano</text>

  <line x1="400" y1="76" x2="400" y2="94" stroke="#dc2626" stroke-width="1.4" marker-end="url(#va-ar)"/>
  <text x="400" y="72" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">epsilon ~ N(0, 1)</text>

  <line x1="467" y1="119" x2="485" y2="119" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#va-ar)"/>

  <rect x="488" y="98" width="48" height="42" rx="5" fill="#ffffff" stroke="#fecaca"/>
  <text x="512" y="124" text-anchor="middle" font-size="12" font-family="'Consolas', monospace" font-weight="700" fill="#991b1b">z</text>

  <line x1="539" y1="119" x2="557" y2="119" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#va-ar)"/>

  <rect x="560" y="98" width="90" height="42" rx="5" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="605" y="118" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e40af">decoder</text>
  <text x="605" y="132" text-anchor="middle" font-size="9" fill="#374151">Conv2DTranspose</text>

  <line x1="653" y1="119" x2="671" y2="119" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#va-ar)"/>

  <rect x="674" y="98" width="90" height="42" rx="5" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="719" y="118" text-anchor="middle" font-size="10" fill="#374151">reconstrucción</text>
  <text x="719" y="132" text-anchor="middle" font-size="9" fill="#9ca3af">la misma imagen</text>

  <text x="400" y="172" text-anchor="middle" font-size="11.5" font-family="'Consolas', monospace" fill="#991b1b">z = z_mean + exp(0.5 * z_log_var) * epsilon</text>

  <!-- classic AE latent -->
  <rect x="20" y="204" width="246" height="238" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="143" y="226" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991b1b">Autoencoder clásico</text>
  <text x="143" y="243" text-anchor="middle" font-size="9.5" fill="#6b7280">cada imagen → un punto fijo</text>

  <rect x="46" y="254" width="194" height="130" fill="#ffffff" stroke="#fecaca"/>
  <g fill="#dc2626">
    <circle cx="72" cy="286" r="3.5"/><circle cx="118" cy="272" r="3.5"/><circle cx="160" cy="300" r="3.5"/>
    <circle cx="212" cy="278" r="3.5"/><circle cx="90" cy="352" r="3.5"/><circle cx="146" cy="364" r="3.5"/>
    <circle cx="196" cy="340" r="3.5"/><circle cx="66" cy="320" r="3.5"/><circle cx="224" cy="358" r="3.5"/>
  </g>
  <text x="140" y="322" text-anchor="middle" font-size="16" font-weight="700" fill="#9ca3af">?</text>
  <text x="143" y="402" text-anchor="middle" font-size="10" fill="#374151">Entre dos puntos no hay nada garantizado.</text>
  <text x="143" y="418" text-anchor="middle" font-size="10" fill="#374151">El espacio queda lleno de agujeros —</text>
  <text x="143" y="432" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">no sirve para muestrear.</text>

  <!-- VAE latent -->
  <rect x="277" y="204" width="246" height="238" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="400" y="226" text-anchor="middle" font-size="11.5" font-weight="700" fill="#166534">VAE</text>
  <text x="400" y="243" text-anchor="middle" font-size="9.5" fill="#6b7280">cada imagen → una nube de probabilidad</text>

  <rect x="303" y="254" width="194" height="130" fill="#ffffff" stroke="#bbf7d0"/>
  <g fill="#16a34a" fill-opacity="0.22">
    <circle cx="329" cy="286" r="24"/><circle cx="375" cy="272" r="24"/><circle cx="417" cy="300" r="24"/>
    <circle cx="469" cy="278" r="24"/><circle cx="347" cy="352" r="24"/><circle cx="403" cy="364" r="24"/>
    <circle cx="453" cy="340" r="24"/><circle cx="323" cy="320" r="24"/><circle cx="481" cy="358" r="24"/>
  </g>
  <g fill="#166534">
    <circle cx="329" cy="286" r="2.5"/><circle cx="375" cy="272" r="2.5"/><circle cx="417" cy="300" r="2.5"/>
    <circle cx="469" cy="278" r="2.5"/><circle cx="347" cy="352" r="2.5"/><circle cx="403" cy="364" r="2.5"/>
    <circle cx="453" cy="340" r="2.5"/><circle cx="323" cy="320" r="2.5"/><circle cx="481" cy="358" r="2.5"/>
  </g>
  <text x="400" y="402" text-anchor="middle" font-size="10" fill="#374151">El epsilon obliga a que <tspan font-weight="700">todo el vecindario</tspan></text>
  <text x="400" y="418" text-anchor="middle" font-size="10" fill="#374151">decodifique a algo parecido. Las nubes se</text>
  <text x="400" y="432" text-anchor="middle" font-size="10" fill="#374151">solapan y <tspan font-weight="700" fill="#166534">el plano se cubre entero</tspan>.</text>

  <!-- losses -->
  <rect x="534" y="204" width="246" height="238" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="657" y="226" text-anchor="middle" font-size="11.5" font-weight="700" fill="#374151">Las dos pérdidas que lo sostienen</text>

  <text x="552" y="256" font-size="10.5" font-weight="700" fill="#374151">Reconstrucción</text>
  <text x="552" y="272" font-size="10" fill="#374151">Que lo decodificado se parezca a la</text>
  <text x="552" y="285" font-size="10" fill="#374151">entrada. Sin ella no se aprende nada.</text>

  <text x="552" y="313" font-size="10.5" font-weight="700" fill="#374151">Regularización (divergencia KL)</text>
  <text x="552" y="329" font-size="10" fill="#374151">Empuja la salida del encoder hacia una</text>
  <text x="552" y="342" font-size="10" fill="#374151">normal bien redondeada centrada en 0.</text>
  <text x="552" y="358" font-size="10" fill="#6b7280">Es la suposición previa sobre la forma</text>
  <text x="552" y="371" font-size="10" fill="#6b7280">del espacio latente.</text>

  <line x1="552" y1="388" x2="762" y2="388" stroke="#e5e7eb"/>
  <text x="552" y="408" font-size="10" fill="#374151">Continuidad + baja dimensión obligan a</text>
  <text x="552" y="421" font-size="10" fill="#374151">que <tspan font-weight="700">cada dirección codifique un eje</tspan></text>
  <text x="552" y="434" font-size="10" font-weight="700" fill="#374151">de variación con significado.</text>
</svg>
