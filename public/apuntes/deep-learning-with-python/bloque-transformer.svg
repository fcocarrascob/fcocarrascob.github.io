<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" font-family="'Segoe UI', system-ui, Arial, sans-serif">
  <defs>
    <marker id="bt-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="800" height="540" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">El bloque Transformer: dos piezas con dos trabajos distintos</text>
  <text x="400" y="48" text-anchor="middle" font-size="11.5" fill="#6b7280">La atención pasa información <tspan font-weight="700">entre</tspan> posiciones; la feedforward actualiza <tspan font-weight="700">cada</tspan> posición por separado</text>

  <!-- ENCODER -->
  <rect x="20" y="68" width="222" height="330" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="131" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">TransformerEncoder</text>

  <rect x="36" y="102" width="190" height="46" rx="5" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="131" y="120" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e40af">MultiHeadAttention</text>
  <text x="131" y="137" text-anchor="middle" font-size="10" font-family="'Consolas', monospace" fill="#374151">query = key = value = x</text>

  <rect x="36" y="156" width="190" height="26" rx="5" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="131" y="173" text-anchor="middle" font-size="10" fill="#6b7280">+ residual → LayerNormalization</text>

  <rect x="36" y="190" width="190" height="46" rx="5" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="131" y="208" text-anchor="middle" font-size="10.5" font-weight="700" fill="#166534">Feedforward</text>
  <text x="131" y="225" text-anchor="middle" font-size="10" font-family="'Consolas', monospace" fill="#374151">Dense(2048, relu) → Dense(256)</text>

  <rect x="36" y="244" width="190" height="26" rx="5" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="131" y="261" text-anchor="middle" font-size="10" fill="#6b7280">+ residual → LayerNormalization</text>

  <line x1="131" y1="278" x2="131" y2="296" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#bt-ar)"/>
  <text x="131" y="318" text-anchor="middle" font-size="10.5" fill="#374151">Entra y sale la misma shape</text>
  <text x="131" y="333" text-anchor="middle" font-size="10.5" font-weight="700" fill="#374151">→ los bloques se apilan</text>

  <text x="131" y="362" text-anchor="middle" font-size="10" fill="#9ca3af">La máscara acá solo tapa el padding:</text>
  <text x="131" y="376" text-anchor="middle" font-size="10" fill="#9ca3af">nada que predecir, nada que ocultar.</text>

  <!-- DECODER -->
  <rect x="262" y="68" width="222" height="330" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="373" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">TransformerDecoder</text>

  <rect x="278" y="102" width="190" height="46" rx="5" fill="#fef2f2" stroke="#fecaca"/>
  <text x="373" y="120" text-anchor="middle" font-size="10.5" font-weight="700" fill="#991b1b">Self-attention</text>
  <text x="373" y="137" text-anchor="middle" font-size="10" font-family="'Consolas', monospace" fill="#374151">use_causal_mask=True</text>

  <rect x="278" y="156" width="190" height="26" rx="5" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="373" y="173" text-anchor="middle" font-size="10" fill="#6b7280">+ residual → LayerNormalization</text>

  <rect x="278" y="190" width="190" height="46" rx="5" fill="#eff6ff" stroke="#2563eb"/>
  <text x="373" y="208" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e40af">Cross-attention</text>
  <text x="373" y="225" text-anchor="middle" font-size="10" font-family="'Consolas', monospace" fill="#374151">query = x · key = value = encoder</text>

  <rect x="278" y="244" width="190" height="26" rx="5" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="373" y="261" text-anchor="middle" font-size="10" fill="#6b7280">+ residual → LayerNormalization</text>

  <rect x="278" y="278" width="190" height="26" rx="5" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="373" y="295" text-anchor="middle" font-size="10.5" font-weight="700" fill="#166534">Feedforward</text>

  <rect x="278" y="312" width="190" height="26" rx="5" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="373" y="329" text-anchor="middle" font-size="10" fill="#6b7280">+ residual → LayerNormalization</text>

  <text x="373" y="362" text-anchor="middle" font-size="10" fill="#9ca3af">Acá sí hay que predecir, así que la</text>
  <text x="373" y="376" text-anchor="middle" font-size="10" fill="#9ca3af">máscara causal impide leer el futuro.</text>

  <!-- arrow encoder -> cross attention -->
  <path d="M242 213 L262 213" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#bt-ar)"/>
  <text x="252" y="203" text-anchor="middle" font-size="9" fill="#2563eb">enc</text>

  <!-- RIGHT PANEL -->
  <rect x="504" y="68" width="276" height="156" rx="8" fill="#fffbeb" stroke="#fde68a"/>
  <text x="522" y="90" font-size="11.5" font-weight="700" fill="#92400e">Por qué no basta con la atención</text>
  <text x="522" y="112" font-size="10.5" fill="#374151">La capa combina <tspan font-weight="700">proyecciones lineales</tspan></text>
  <text x="522" y="127" font-size="10.5" fill="#374151">de la secuencia, y nada más.</text>
  <text x="522" y="149" font-size="10.5" fill="#374151">Con un solo token, la matriz de scores</text>
  <text x="522" y="164" font-size="10.5" fill="#374151">es un único 1 y toda la capa colapsa</text>
  <text x="522" y="179" font-size="10.5" fill="#374151">a una proyección lineal.</text>
  <text x="522" y="203" font-size="11" font-weight="700" fill="#92400e">100 capas de atención apiladas</text>
  <text x="522" y="218" font-size="11" font-weight="700" fill="#92400e">= una multiplicación de matrices.</text>

  <!-- causal mask -->
  <rect x="504" y="236" width="276" height="162" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="522" y="258" font-size="11.5" font-weight="700" fill="#374151">La máscara causal</text>
  <text x="522" y="274" font-size="10" fill="#9ca3af">cada fila i = qué puede mirar el token i</text>

  <g font-size="10" font-family="'Consolas', monospace" text-anchor="middle">
    <rect x="560" y="286" width="24" height="20" fill="#2563eb" fill-opacity="0.18"/><text x="572" y="301" fill="#1e3a8a">1</text>
    <rect x="586" y="286" width="24" height="20" fill="#f3f4f6"/><text x="598" y="301" fill="#d1d5db">0</text>
    <rect x="612" y="286" width="24" height="20" fill="#f3f4f6"/><text x="624" y="301" fill="#d1d5db">0</text>
    <rect x="638" y="286" width="24" height="20" fill="#f3f4f6"/><text x="650" y="301" fill="#d1d5db">0</text>
    <rect x="664" y="286" width="24" height="20" fill="#f3f4f6"/><text x="676" y="301" fill="#d1d5db">0</text>

    <rect x="560" y="308" width="24" height="20" fill="#2563eb" fill-opacity="0.18"/><text x="572" y="323" fill="#1e3a8a">1</text>
    <rect x="586" y="308" width="24" height="20" fill="#2563eb" fill-opacity="0.18"/><text x="598" y="323" fill="#1e3a8a">1</text>
    <rect x="612" y="308" width="24" height="20" fill="#f3f4f6"/><text x="624" y="323" fill="#d1d5db">0</text>
    <rect x="638" y="308" width="24" height="20" fill="#f3f4f6"/><text x="650" y="323" fill="#d1d5db">0</text>
    <rect x="664" y="308" width="24" height="20" fill="#f3f4f6"/><text x="676" y="323" fill="#d1d5db">0</text>

    <rect x="560" y="330" width="24" height="20" fill="#2563eb" fill-opacity="0.18"/><text x="572" y="345" fill="#1e3a8a">1</text>
    <rect x="586" y="330" width="24" height="20" fill="#2563eb" fill-opacity="0.18"/><text x="598" y="345" fill="#1e3a8a">1</text>
    <rect x="612" y="330" width="24" height="20" fill="#2563eb" fill-opacity="0.18"/><text x="624" y="345" fill="#1e3a8a">1</text>
    <rect x="638" y="330" width="24" height="20" fill="#f3f4f6"/><text x="650" y="345" fill="#d1d5db">0</text>
    <rect x="664" y="330" width="24" height="20" fill="#f3f4f6"/><text x="676" y="345" fill="#d1d5db">0</text>

    <rect x="560" y="352" width="24" height="20" fill="#2563eb" fill-opacity="0.18"/><text x="572" y="367" fill="#1e3a8a">1</text>
    <rect x="586" y="352" width="24" height="20" fill="#2563eb" fill-opacity="0.18"/><text x="598" y="367" fill="#1e3a8a">1</text>
    <rect x="612" y="352" width="24" height="20" fill="#2563eb" fill-opacity="0.18"/><text x="624" y="367" fill="#1e3a8a">1</text>
    <rect x="638" y="352" width="24" height="20" fill="#2563eb" fill-opacity="0.18"/><text x="650" y="367" fill="#1e3a8a">1</text>
    <rect x="664" y="352" width="24" height="20" fill="#f3f4f6"/><text x="676" y="367" fill="#d1d5db">0</text>
  </g>
  <text x="522" y="301" font-size="9.5" fill="#6b7280">token 1</text>
  <text x="522" y="323" font-size="9.5" fill="#6b7280">token 2</text>
  <text x="522" y="345" font-size="9.5" fill="#6b7280">token 3</text>
  <text x="522" y="367" font-size="9.5" fill="#6b7280">token 4</text>
  <text x="700" y="330" font-size="9.5" fill="#9ca3af">el mismo</text>
  <text x="700" y="343" font-size="9.5" fill="#9ca3af">efecto que</text>
  <text x="700" y="356" font-size="9.5" fill="#9ca3af">una RNN</text>
  <text x="522" y="390" font-size="10" fill="#6b7280">Sin ella, el modelo copia el token siguiente.</text>

  <!-- footer -->
  <rect x="20" y="414" width="760" height="106" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="40" y="438" font-size="11.5" font-weight="700" fill="#166534">Las dos importaciones del capítulo 9, tal cual</text>
  <text x="40" y="460" font-size="10.5" fill="#374151"><tspan font-weight="700">Conexión residual</tspan> — el atajo sin ruido para el gradiente, idéntico al de las ConvNets.</text>
  <text x="40" y="478" font-size="10.5" fill="#374151"><tspan font-weight="700">Normalización</tspan> — pero <tspan font-family="'Consolas', monospace">LayerNormalization</tspan> (<tspan font-family="'Consolas', monospace">axis=-1</tspan>, dentro de cada secuencia) en vez de <tspan font-family="'Consolas', monospace">BatchNormalization</tspan></text>
  <text x="40" y="493" font-size="10.5" fill="#374151">(<tspan font-family="'Consolas', monospace">axis=(0,1,2)</tspan>, que incluye el eje batch). El BatchNorm crea interacciones entre las muestras del batch:</text>
  <text x="40" y="508" font-size="10.5" fill="#374151">tolerable en imágenes, no en secuencias de largo distinto.</text>
</svg>
