<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 552" font-family="'Segoe UI', system-ui, Arial, sans-serif">
  <defs>
    <marker id="nn-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="800" height="552" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Ni neuronales ni redes: qué es realmente un modelo profundo</text>
  <text x="400" y="48" text-anchor="middle" font-size="11.5" fill="#6b7280">«Un nombre más apropiado habría sido aprendizaje de representaciones por capas — o transformaciones geométricas encadenadas.»</text>

  <!-- crumpled paper metaphor -->
  <rect x="20" y="66" width="470" height="196" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="255" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">Desarrugar una bola de papel</text>

  <path d="M60 130 L82 112 L104 134 L126 110 L142 138 L124 158 L98 148 L74 162 Z" fill="#dc2626" fill-opacity="0.12" stroke="#dc2626" stroke-width="1.3"/>
  <text x="101" y="186" text-anchor="middle" font-size="10" fill="#991b1b">el manifold de entrada,</text>
  <text x="101" y="199" text-anchor="middle" font-size="10" fill="#991b1b">arrugado y enredado</text>

  <line x1="152" y1="136" x2="176" y2="136" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#nn-ar)"/>
  <text x="164" y="126" text-anchor="middle" font-size="9" fill="#6b7280">capa</text>

  <path d="M186 126 L214 114 L238 132 L252 116 L258 146 L232 156 L206 150 Z" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-width="1.3"/>
  <line x1="268" y1="136" x2="292" y2="136" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#nn-ar)"/>
  <text x="280" y="126" text-anchor="middle" font-size="9" fill="#6b7280">capa</text>

  <path d="M302 120 L360 116 L366 148 L306 152 Z" fill="#16a34a" fill-opacity="0.14" stroke="#16a34a" stroke-width="1.3"/>
  <line x1="376" y1="136" x2="400" y2="136" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#nn-ar)"/>
  <text x="388" y="126" text-anchor="middle" font-size="9" fill="#6b7280">capa</text>

  <rect x="410" y="118" width="60" height="34" fill="#16a34a" fill-opacity="0.22" stroke="#16a34a" stroke-width="1.3"/>
  <text x="440" y="186" text-anchor="middle" font-size="10" fill="#166534">plano y separable</text>


  <!-- the two ideas -->
  <rect x="506" y="66" width="274" height="196" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="643" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">Todo pende de dos ideas</text>

  <text x="526" y="118" font-size="10.5" font-weight="700" fill="#1e40af">1</text>
  <text x="544" y="118" font-size="10.5" fill="#374151">El significado se deriva de la</text>
  <text x="544" y="132" font-size="10.5" fill="#374151"><tspan font-weight="700">relación por pares</tspan> entre las cosas:</text>
  <text x="544" y="146" font-size="10.5" fill="#374151">entre palabras, entre píxeles.</text>

  <text x="526" y="176" font-size="10.5" font-weight="700" fill="#1e40af">2</text>
  <text x="544" y="176" font-size="10.5" fill="#374151">Esas relaciones pueden capturarse</text>
  <text x="544" y="190" font-size="10.5" fill="#374151">mediante <tspan font-weight="700">una función de distancia</tspan>.</text>

  <line x1="526" y1="210" x2="762" y2="210" stroke="#bfdbfe"/>
  <text x="526" y="230" font-size="10" fill="#6b7280">Si el cerebro implementa el significado así</text>
  <text x="526" y="243" font-size="10" fill="#6b7280">es <tspan font-style="italic">otra</tspan> pregunta. Se pueden concebir otras</text>
  <text x="526" y="256" font-size="10" fill="#6b7280">estructuras — grafos, por ejemplo.</text>

  <rect x="20" y="278" width="760" height="78" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="40" y="302" font-size="10.5" fill="#374151">Cada movimiento del que desarruga es <tspan font-weight="700">una transformación geométrica simple operada por una capa</tspan>. La secuencia completa</text>
  <text x="40" y="320" font-size="10.5" fill="#374151">es la transformación del modelo entero. Y tiene que ser <tspan font-weight="700">diferenciable</tspan>: la deformación de entradas a salidas debe ser <tspan font-weight="700">suave</tspan></text>
  <text x="40" y="338" font-size="10.5" fill="#374151"><tspan font-weight="700">y continua</tspan> — una restricción significativa, y la raíz de todos los límites que enumera el capítulo 19.</text>

  <!-- four enabling factors -->
  <rect x="20" y="372" width="760" height="166" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="40" y="396" font-size="11.5" font-weight="700" fill="#166534">Cuatro factores habilitantes, no una invención</text>
  <text x="40" y="413" font-size="10" fill="#6b7280">«Como cualquier otra revolución, es el producto de una vasta acumulación de factores — lentamente al principio, y luego de repente.»</text>

  <rect x="40" y="426" width="172" height="96" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="126" y="446" text-anchor="middle" font-size="10.5" font-weight="700" fill="#166534">Algoritmos</text>
  <text x="126" y="464" text-anchor="middle" font-size="9.5" fill="#374151">Dos décadas de mejoras</text>
  <text x="126" y="477" text-anchor="middle" font-size="9.5" fill="#374151">incrementales desde el</text>
  <text x="126" y="490" text-anchor="middle" font-size="9.5" fill="#374151">backpropagation, y aceleradas</text>
  <text x="126" y="503" text-anchor="middle" font-size="9.5" fill="#374151">después de 2012. El salto</text>
  <text x="126" y="516" text-anchor="middle" font-size="9.5" fill="#374151">mayor: el Transformer, 2017.</text>

  <rect x="224" y="426" width="172" height="96" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="310" y="446" text-anchor="middle" font-size="10.5" font-weight="700" fill="#166534">Datos</text>
  <text x="310" y="464" text-anchor="middle" font-size="9.5" fill="#374151">Subproducto del internet de</text>
  <text x="310" y="477" text-anchor="middle" font-size="9.5" fill="#374151">consumo y de la ley de Moore</text>
  <text x="310" y="490" text-anchor="middle" font-size="9.5" fill="#374151">sobre el almacenamiento.</text>
  <text x="310" y="507" text-anchor="middle" font-size="9.5" fill="#6b7280">Hoy se entrena sobre una</text>
  <text x="310" y="520" text-anchor="middle" font-size="9.5" fill="#6b7280">fracción grande de internet.</text>

  <rect x="408" y="426" width="172" height="96" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="494" y="446" text-anchor="middle" font-size="10.5" font-weight="700" fill="#166534">Hardware</text>
  <text x="494" y="464" text-anchor="middle" font-size="9.5" fill="#374151">GPU de gaming primero, y</text>
  <text x="494" y="477" text-anchor="middle" font-size="9.5" fill="#374151">después chips diseñados desde</text>
  <text x="494" y="490" text-anchor="middle" font-size="9.5" fill="#374151">cero para deep learning.</text>
  <text x="494" y="507" text-anchor="middle" font-size="9.5" fill="#6b7280">NVIDIA apostó la compañía</text>
  <text x="494" y="520" text-anchor="middle" font-size="9.5" fill="#6b7280">a ello, y le rindió.</text>

  <rect x="592" y="426" width="168" height="96" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="676" y="446" text-anchor="middle" font-size="10.5" font-weight="700" fill="#166534">Software</text>
  <text x="676" y="464" text-anchor="middle" font-size="9.5" fill="#374151">CUDA abajo; TensorFlow, JAX</text>
  <text x="676" y="477" text-anchor="middle" font-size="9.5" fill="#374151">y PyTorch haciendo</text>
  <text x="676" y="490" text-anchor="middle" font-size="9.5" fill="#374151">diferenciación automática.</text>
  <text x="676" y="507" text-anchor="middle" font-size="9.5" fill="#6b7280">Y Keras arriba, para que</text>
  <text x="676" y="520" text-anchor="middle" font-size="9.5" fill="#6b7280">esto sea accesible.</text>
</svg>
