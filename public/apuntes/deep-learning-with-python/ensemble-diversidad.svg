<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'Segoe UI', system-ui, Arial, sans-serif">
  <defs>
    <marker id="en-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="800" height="440" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">La diversidad es fuerza: por qué el peor modelo puede ser el que más aporte</text>
  <text x="400" y="48" text-anchor="middle" font-size="11.5" fill="#6b7280">Los modelos son ciegos tanteando el manifold. Cada uno captura parte de la verdad, ninguno toda.</text>

  <!-- diverse -->
  <rect x="20" y="66" width="374" height="216" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="207" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Sesgos distintos → se cancelan</text>

  <ellipse cx="207" cy="152" rx="72" ry="38" fill="#d1d5db" fill-opacity="0.5" stroke="#9ca3af"/>
  <text x="207" y="157" text-anchor="middle" font-size="10.5" font-weight="700" fill="#374151">el manifold</text>

  <circle cx="96" cy="118" r="17" fill="#ffffff" stroke="#16a34a"/>
  <text x="96" y="122" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534">CNN</text>
  <line x1="113" y1="124" x2="139" y2="136" stroke="#16a34a" stroke-width="1.3" marker-end="url(#en-ar)"/>

  <circle cx="96" cy="188" r="17" fill="#ffffff" stroke="#16a34a"/>
  <text x="96" y="192" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534">GBT</text>
  <line x1="113" y1="182" x2="139" y2="170" stroke="#16a34a" stroke-width="1.3" marker-end="url(#en-ar)"/>

  <circle cx="318" cy="118" r="17" fill="#ffffff" stroke="#16a34a"/>
  <text x="318" y="122" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534">MLP</text>
  <line x1="301" y1="124" x2="275" y2="136" stroke="#16a34a" stroke-width="1.3" marker-end="url(#en-ar)"/>

  <circle cx="318" cy="188" r="17" fill="#ffffff" stroke="#16a34a"/>
  <text x="318" y="192" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534">RGF</text>
  <line x1="301" y1="182" x2="275" y2="170" stroke="#16a34a" stroke-width="1.3" marker-end="url(#en-ar)"/>

  <text x="207" y="222" text-anchor="middle" font-size="10.5" fill="#374151">Cuatro perspectivas, cuatro suposiciones distintas.</text>
  <text x="207" y="238" text-anchor="middle" font-size="10.5" fill="#374151">Los errores apuntan en direcciones distintas y</text>
  <text x="207" y="254" text-anchor="middle" font-size="10.5" font-weight="700" fill="#166534">se cancelan entre sí al promediar.</text>
  <text x="207" y="272" text-anchor="middle" font-size="10" fill="#6b7280">Ese es todo el negocio del ensembling.</text>

  <!-- same bias -->
  <rect x="410" y="66" width="370" height="216" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="595" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Sesgos iguales → se conservan</text>

  <ellipse cx="595" cy="152" rx="72" ry="38" fill="#d1d5db" fill-opacity="0.5" stroke="#9ca3af"/>
  <text x="595" y="157" text-anchor="middle" font-size="10.5" font-weight="700" fill="#374151">el manifold</text>

  <circle cx="486" cy="118" r="17" fill="#ffffff" stroke="#dc2626"/>
  <text x="486" y="122" text-anchor="middle" font-size="9" font-weight="700" fill="#991b1b">CNN</text>
  <circle cx="486" cy="188" r="17" fill="#ffffff" stroke="#dc2626"/>
  <text x="486" y="192" text-anchor="middle" font-size="9" font-weight="700" fill="#991b1b">CNN</text>
  <circle cx="706" cy="118" r="17" fill="#ffffff" stroke="#dc2626"/>
  <text x="706" y="122" text-anchor="middle" font-size="9" font-weight="700" fill="#991b1b">CNN</text>
  <circle cx="706" cy="188" r="17" fill="#ffffff" stroke="#dc2626"/>
  <text x="706" y="192" text-anchor="middle" font-size="9" font-weight="700" fill="#991b1b">CNN</text>

  <line x1="503" y1="124" x2="546" y2="140" stroke="#dc2626" stroke-width="1.3" marker-end="url(#en-ar)"/>
  <line x1="503" y1="182" x2="546" y2="150" stroke="#dc2626" stroke-width="1.3" marker-end="url(#en-ar)"/>
  <line x1="689" y1="124" x2="646" y2="140" stroke="#dc2626" stroke-width="1.3" marker-end="url(#en-ar)"/>
  <line x1="689" y1="182" x2="646" y2="150" stroke="#dc2626" stroke-width="1.3" marker-end="url(#en-ar)"/>

  <text x="595" y="222" text-anchor="middle" font-size="10.5" fill="#374151">La misma red con distintas semillas toca</text>
  <text x="595" y="238" text-anchor="middle" font-size="10.5" fill="#374151">siempre la misma parte del elefante.</text>
  <text x="595" y="254" text-anchor="middle" font-size="10.5" font-weight="700" fill="#991b1b">El ensemble hereda el sesgo intacto.</text>
  <text x="595" y="272" text-anchor="middle" font-size="10" fill="#6b7280">Mejora minúscula por mucho más cómputo.</text>

  <!-- higgs -->
  <rect x="20" y="298" width="760" height="126" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="40" y="322" font-size="12" font-weight="700" fill="#1e40af">Kaggle, bosón de Higgs, 2014 — cuarto lugar</text>
  <text x="40" y="346" font-size="10.5" fill="#374151">Uno de los modelos del ensemble venía de un método distinto a los demás (un <tspan font-style="italic">regularized greedy forest</tspan>) y tenía un score</text>
  <text x="40" y="362" font-size="10.5" fill="#374151"><tspan font-weight="700">significativamente peor</tspan>. Se le asignó un peso pequeño. Y aun así <tspan font-weight="700">mejoró el ensemble general por un factor grande</tspan>,</text>
  <text x="40" y="378" font-size="10.5" fill="#374151">porque era tan distinto de todos los otros que proveía información a la que ninguno tenía acceso.</text>
  <text x="40" y="404" font-size="11.5" font-weight="700" fill="#1e40af">«No es tanto sobre qué tan bueno es tu mejor modelo; es sobre la diversidad de tu conjunto de modelos candidatos.»</text>
</svg>
