<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'Segoe UI', system-ui, Arial, sans-serif">
  <defs>
    <marker id="cb-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="760" height="340" fill="#ffffff"/>

  <text x="380" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">El cuello de botella de información</text>
  <text x="380" y="50" text-anchor="middle" font-size="11.5" fill="#6b7280">Cada capa solo ve lo que le pasó la anterior. Lo que se descarta, se pierde para siempre.</text>

  <!-- ── Top: healthy model ────────────────────────────── -->
  <text x="24" y="86" font-size="11.5" font-weight="600" fill="#1e3a8a">64 → 64 → 46</text>
  <rect x="150" y="70" width="70" height="52" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="185" y="94" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">64</text>
  <text x="185" y="111" text-anchor="middle" font-size="9.5" fill="#1e3a8a">unidades</text>

  <line x1="220" y1="96" x2="256" y2="96" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#cb-ar)"/>

  <rect x="258" y="70" width="70" height="52" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="293" y="94" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">64</text>
  <text x="293" y="111" text-anchor="middle" font-size="9.5" fill="#1e3a8a">unidades</text>

  <line x1="328" y1="96" x2="364" y2="96" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#cb-ar)"/>

  <rect x="366" y="70" width="70" height="52" rx="6" fill="#2563eb"/>
  <text x="401" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">46</text>
  <text x="401" y="111" text-anchor="middle" font-size="9.5" fill="#dbeafe">clases</text>

  <!-- accuracy bar -->
  <rect x="480" y="80" width="200" height="18" rx="4" fill="#f3f4f6"/>
  <rect x="480" y="80" width="158" height="18" rx="4" fill="#2563eb"/>
  <text x="690" y="94" font-size="12.5" font-weight="700" fill="#2563eb">79 %</text>
  <text x="480" y="116" font-size="10.5" fill="#6b7280">accuracy de validación</text>

  <line x1="24" y1="146" x2="736" y2="146" stroke="#e5e7eb"/>

  <!-- ── Bottom: bottleneck model ──────────────────────── -->
  <text x="24" y="188" font-size="11.5" font-weight="600" fill="#991b1b">64 → 4 → 46</text>
  <rect x="150" y="172" width="70" height="52" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="185" y="196" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">64</text>
  <text x="185" y="213" text-anchor="middle" font-size="9.5" fill="#1e3a8a">unidades</text>

  <line x1="220" y1="198" x2="256" y2="198" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#cb-ar)"/>

  <rect x="272" y="186" width="42" height="24" rx="4" fill="#fecaca" stroke="#dc2626"/>
  <text x="293" y="203" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">4</text>

  <line x1="328" y1="198" x2="364" y2="198" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#cb-ar)"/>

  <rect x="366" y="172" width="70" height="52" rx="6" fill="#2563eb"/>
  <text x="401" y="196" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">46</text>
  <text x="401" y="213" text-anchor="middle" font-size="9.5" fill="#dbeafe">clases</text>

  <!-- accuracy bar -->
  <rect x="480" y="182" width="200" height="18" rx="4" fill="#f3f4f6"/>
  <rect x="480" y="182" width="142" height="18" rx="4" fill="#dc2626"/>
  <text x="690" y="196" font-size="12.5" font-weight="700" fill="#dc2626">71 %</text>
  <text x="480" y="218" font-size="10.5" fill="#991b1b">−8 puntos absolutos</text>

  <!-- annotation on the bottleneck -->
  <line x1="293" y1="186" x2="293" y2="164" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="293" y="158" text-anchor="middle" font-size="10.5" font-weight="600" fill="#991b1b">4 dimensiones para 46 clases</text>

  <!-- footer -->
  <rect x="24" y="252" width="712" height="66" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="380" y="276" text-anchor="middle" font-size="11.5" fill="#991b1b">El modelo logra meter <tspan font-style="italic">casi</tspan> toda la información necesaria en esas 4 dimensiones. Casi.</text>
  <text x="380" y="300" text-anchor="middle" font-size="11.5" fill="#374151">Regla: <tspan font-weight="700">no pongas capas intermedias mucho menores que tu número de clases</tspan></text>
</svg>
