<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 372" font-family="'Segoe UI', system-ui, Arial, sans-serif">
  <defs>
    <marker id="ag-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="780" height="372" fill="#ffffff"/>

  <text x="390" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Ascenso de gradiente: construir la imagen que un filtro quiere ver</text>

  <!-- the loop -->
  <rect x="30" y="56" width="150" height="52" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="105" y="78" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">Ruido aleatorio</text>
  <text x="105" y="94" text-anchor="middle" font-size="9.5" fill="#6b7280">uniform(0.4, 0.6)</text>

  <line x1="180" y1="82" x2="204" y2="82" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ag-ar)"/>

  <rect x="206" y="56" width="180" height="52" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="296" y="76" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e3a8a">feature_extractor(image)</text>
  <text x="296" y="92" text-anchor="middle" font-size="9.5" fill="#1e3a8a">pesos CONGELADOS</text>

  <line x1="386" y1="82" x2="410" y2="82" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ag-ar)"/>

  <rect x="412" y="52" width="196" height="60" rx="6" fill="#2563eb"/>
  <text x="510" y="72" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">loss = mean(activación</text>
  <text x="510" y="87" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">del filtro elegido)</text>
  <text x="510" y="103" text-anchor="middle" font-size="9" fill="#93c5fd">recortando 2 px de borde</text>

  <line x1="608" y1="82" x2="632" y2="82" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ag-ar)"/>
  <rect x="634" y="56" width="116" height="52" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="692" y="78" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e3a8a">∂loss / ∂image</text>
  <text x="692" y="94" text-anchor="middle" font-size="9" fill="#2563eb">no ∂loss/∂pesos</text>

  <!-- loop back -->
  <path d="M 692 108 L 692 140 L 105 140 L 105 112" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ag-ar)"/>
  <rect x="290" y="126" width="210" height="28" rx="5" fill="#ffffff" stroke="#2563eb"/>
  <text x="395" y="145" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono', ui-monospace, monospace" fill="#2563eb">image += learning_rate * grads</text>
  <text x="512" y="163" font-size="10" font-weight="700" fill="#991b1b">← SUMA, no resta</text>
  <text x="118" y="163" font-size="10" fill="#6b7280">30 iteraciones</text>

  <!-- the three details -->
  <text x="390" y="188" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Tres detalles del mecanismo que se olvidan</text>

  <rect x="20" y="202" width="240" height="98" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="40" y="224" font-size="11" font-weight="700" fill="#374151">tape.watch(image)</text>
  <text x="40" y="244" font-size="10" fill="#374151">En TensorFlow solo se vigilan</text>
  <text x="40" y="259" font-size="10" fill="#374151">automáticamente las <tspan font-family="'JetBrains Mono', ui-monospace, monospace">Variable</tspan></text>
  <text x="40" y="274" font-size="10" fill="#374151">entrenables. La imagen es un</text>
  <text x="40" y="289" font-size="10" fill="#991b1b">tensor común: hay que pedirlo.</text>

  <rect x="270" y="202" width="240" height="98" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="290" y="224" font-size="11" font-weight="700" fill="#374151">ops.normalize(grads)</text>
  <text x="290" y="244" font-size="10" fill="#374151">Divide el gradiente por su</text>
  <text x="290" y="259" font-size="10" fill="#374151">norma L2. Así la magnitud del</text>
  <text x="290" y="274" font-size="10" fill="#374151">paso queda siempre en el mismo</text>
  <text x="290" y="289" font-size="10" fill="#2563eb">rango — el "truco no obvio".</text>

  <rect x="520" y="202" width="240" height="98" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="540" y="224" font-size="11" font-weight="700" fill="#374151">model(x), no predict(x)</text>
  <text x="540" y="244" font-size="10" fill="#374151"><tspan font-family="'JetBrains Mono', ui-monospace, monospace">predict()</tspan> itera en batches y</text>
  <text x="540" y="259" font-size="10" fill="#374151">escala, pero <tspan font-weight="700">no es derivable</tspan>:</text>
  <text x="540" y="274" font-size="10" fill="#374151">no se puede backpropagar a</text>
  <text x="540" y="289" font-size="10" fill="#991b1b">través de él.</text>

  <!-- footer: what comes out -->
  <rect x="20" y="312" width="740" height="48" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="390" y="333" text-anchor="middle" font-size="11.5" fill="#1e3a8a">Lo que sale: capas bajas → <tspan font-weight="700">bordes y colores</tspan> · capas medias → <tspan font-weight="700">texturas simples</tspan> · capas altas → <tspan font-weight="700">plumas, ojos, hojas</tspan></text>
  <text x="390" y="352" text-anchor="middle" font-size="11" fill="#374151">Cada capa descompone su entrada en un banco de filtros, como la transformada de Fourier sobre funciones coseno.</text>
</svg>
