<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="'Segoe UI', system-ui, Arial, sans-serif">
  <defs>
    <marker id="pp-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="800" height="470" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Los dos paralelismos resuelven problemas distintos</text>
  <text x="400" y="48" text-anchor="middle" font-size="11.5" fill="#6b7280">Uno acelera el entrenamiento. El otro permite entrenar modelos que no caben. Se confunden todo el tiempo.</text>

  <!-- data parallelism -->
  <rect x="20" y="66" width="374" height="232" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="207" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Data parallelism · para ir más rápido</text>

  <rect x="152" y="102" width="110" height="28" rx="5" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="207" y="121" text-anchor="middle" font-size="10.5" fill="#374151">batch de 128</text>

  <line x1="180" y1="133" x2="140" y2="150" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#pp-ar)"/>
  <line x1="234" y1="133" x2="274" y2="150" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#pp-ar)"/>

  <rect x="60" y="156" width="130" height="62" rx="5" fill="#ffffff" stroke="#16a34a"/>
  <text x="125" y="174" text-anchor="middle" font-size="10" fill="#374151">sub-batch de 64</text>
  <text x="125" y="192" text-anchor="middle" font-size="10.5" font-weight="700" fill="#166534">modelo completo</text>
  <text x="125" y="208" text-anchor="middle" font-size="9.5" fill="#9ca3af">gpu:0 · réplica</text>

  <rect x="224" y="156" width="130" height="62" rx="5" fill="#ffffff" stroke="#16a34a"/>
  <text x="289" y="174" text-anchor="middle" font-size="10" fill="#374151">sub-batch de 64</text>
  <text x="289" y="192" text-anchor="middle" font-size="10.5" font-weight="700" fill="#166534">modelo completo</text>
  <text x="289" y="208" text-anchor="middle" font-size="9.5" fill="#9ca3af">gpu:1 · réplica</text>

  <line x1="125" y1="222" x2="180" y2="238" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#pp-ar)"/>
  <line x1="289" y1="222" x2="234" y2="238" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#pp-ar)"/>

  <rect x="122" y="242" width="170" height="28" rx="5" fill="#eff6ff" stroke="#2563eb"/>
  <text x="207" y="261" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e40af">gradientes promediados</text>

  <text x="207" y="288" text-anchor="middle" font-size="10" fill="#6b7280">Entrenamiento sincrónico: los pesos son idénticos en todo momento.</text>

  <!-- model parallelism -->
  <rect x="410" y="66" width="370" height="232" rx="8" fill="#fffbeb" stroke="#fde68a"/>
  <text x="595" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Model parallelism · para que quepa</text>

  <text x="430" y="112" font-size="10.5" fill="#374151">Un <tspan font-family="'Consolas', monospace">Dense(64000)</tspan> sobre 16 000 entradas son</text>
  <text x="430" y="127" font-size="10.5" fill="#374151">mil millones de parámetros. No entra en una GPU.</text>

  <rect x="430" y="142" width="150" height="76" rx="5" fill="#ffffff" stroke="#fde68a"/>
  <text x="505" y="160" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">kernel (16000, 64000)</text>
  <rect x="444" y="170" width="60" height="38" fill="#f59e0b" fill-opacity="0.25" stroke="#f59e0b"/>
  <rect x="506" y="170" width="60" height="38" fill="#f59e0b" fill-opacity="0.45" stroke="#f59e0b"/>
  <text x="474" y="194" text-anchor="middle" font-size="9" fill="#92400e">gpu:0</text>
  <text x="536" y="194" text-anchor="middle" font-size="9" fill="#92400e">gpu:1</text>

  <text x="596" y="164" font-size="10" font-weight="700" fill="#92400e">Vertical</text>
  <text x="596" y="178" font-size="10" fill="#374151">Cada GPU toma</text>
  <text x="596" y="191" font-size="10" fill="#374151">una parte de <tspan font-weight="700">cada</tspan></text>
  <text x="596" y="204" font-size="10" fill="#374151">capa. Los matmul</text>
  <text x="596" y="217" font-size="10" fill="#374151">son paralelizables:</text>
  <text x="596" y="230" font-size="10" font-weight="700" fill="#92400e">casi siempre gana.</text>

  <text x="430" y="244" font-size="10" font-weight="700" fill="#991b1b">Horizontal</text>
  <text x="430" y="258" font-size="10" fill="#374151">Cada GPU toma capas distintas. La salida de una</text>
  <text x="430" y="271" font-size="10" fill="#374151">tiene que viajar a la otra: overhead de comunicación,</text>
  <text x="430" y="284" font-size="10" fill="#374151">y GPU ociosas esperando.</text>

  <!-- speedup + mesh -->
  <rect x="20" y="314" width="374" height="140" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="40" y="338" font-size="11.5" font-weight="700" fill="#374151">El speedup real no es lineal</text>
  <line x1="70" y1="424" x2="360" y2="424" stroke="#d1d5db"/>

  <rect x="86" y="398" width="46" height="26" fill="#2563eb" fill-opacity="0.35"/>
  <text x="109" y="392" text-anchor="middle" font-size="10" font-weight="700" fill="#1e3a8a">2,0×</text>
  <text x="109" y="440" text-anchor="middle" font-size="9.5" fill="#6b7280">2 GPU</text>

  <rect x="166" y="375" width="46" height="49" fill="#2563eb" fill-opacity="0.4"/>
  <text x="189" y="369" text-anchor="middle" font-size="10" font-weight="700" fill="#1e3a8a">3,8×</text>
  <text x="189" y="440" text-anchor="middle" font-size="9.5" fill="#6b7280">4 GPU</text>

  <rect x="246" y="330" width="46" height="94" fill="#2563eb" fill-opacity="0.45"/>
  <text x="269" y="324" text-anchor="middle" font-size="10" font-weight="700" fill="#1e3a8a">7,3×</text>
  <text x="269" y="440" text-anchor="middle" font-size="9.5" fill="#6b7280">8 GPU</text>

  <text x="312" y="378" font-size="9.5" fill="#6b7280">El overhead es</text>
  <text x="312" y="391" font-size="9.5" fill="#6b7280">fusionar los deltas</text>
  <text x="312" y="404" font-size="9.5" fill="#6b7280">de peso entre</text>
  <text x="312" y="417" font-size="9.5" fill="#6b7280">dispositivos.</text>

  <!-- mesh -->
  <rect x="410" y="314" width="370" height="140" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="430" y="338" font-size="11.5" font-weight="700" fill="#374151">DeviceMesh: los dos ejes a la vez</text>

  <g font-size="9" text-anchor="middle" font-family="'Consolas', monospace">
    <rect x="440" y="350" width="52" height="20" rx="3" fill="#eff6ff" stroke="#bfdbfe"/><text x="466" y="364" fill="#1e40af">gpu:0</text>
    <rect x="496" y="350" width="52" height="20" rx="3" fill="#eff6ff" stroke="#bfdbfe"/><text x="522" y="364" fill="#1e40af">gpu:1</text>
    <rect x="552" y="350" width="52" height="20" rx="3" fill="#eff6ff" stroke="#bfdbfe"/><text x="578" y="364" fill="#1e40af">gpu:2</text>
    <rect x="608" y="350" width="52" height="20" rx="3" fill="#eff6ff" stroke="#bfdbfe"/><text x="634" y="364" fill="#1e40af">gpu:3</text>

    <rect x="440" y="374" width="52" height="20" rx="3" fill="#eff6ff" stroke="#bfdbfe"/><text x="466" y="388" fill="#1e40af">gpu:4</text>
    <rect x="496" y="374" width="52" height="20" rx="3" fill="#eff6ff" stroke="#bfdbfe"/><text x="522" y="388" fill="#1e40af">gpu:5</text>
    <rect x="552" y="374" width="52" height="20" rx="3" fill="#eff6ff" stroke="#bfdbfe"/><text x="578" y="388" fill="#1e40af">gpu:6</text>
    <rect x="608" y="374" width="52" height="20" rx="3" fill="#eff6ff" stroke="#bfdbfe"/><text x="634" y="388" fill="#1e40af">gpu:7</text>
  </g>
  <text x="550" y="410" text-anchor="middle" font-size="9.5" fill="#166534">eje "model": el modelo se parte en 4 →</text>
  <text x="676" y="364" font-size="9.5" fill="#92400e">eje</text>
  <text x="676" y="377" font-size="9.5" fill="#92400e">"data"</text>
  <text x="676" y="390" font-size="9.5" fill="#92400e">×2</text>

  <text x="430" y="430" font-size="10" fill="#374151">Regla del pulgar: <tspan font-weight="700">shardear la última dimensión</tspan> de cada</text>
  <text x="430" y="444" font-size="10" fill="#374151">variable por el eje <tspan font-family="'Consolas', monospace">"model"</tspan> y replicar todas las demás.</text>
</svg>
