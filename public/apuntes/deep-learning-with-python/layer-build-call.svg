<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'Segoe UI', system-ui, Arial, sans-serif">
  <defs>
    <marker id="lbc-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="760" height="340" fill="#ffffff"/>

  <text x="380" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Por qué los pesos no se crean en el constructor</text>

  <!-- first call -->
  <rect x="30" y="56" width="150" height="60" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="105" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#374151">1ª llamada</text>
  <text x="105" y="99" text-anchor="middle" font-size="11" fill="#6b7280" font-family="'JetBrains Mono', ui-monospace, monospace">layer(x)</text>

  <line x1="180" y1="86" x2="222" y2="86" stroke="#2563eb" stroke-width="2" marker-end="url(#lbc-ar)"/>

  <!-- __call__ box -->
  <rect x="224" y="48" width="300" height="152" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="374" y="70" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a" font-family="'JetBrains Mono', ui-monospace, monospace">__call__()</text>
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11">
    <text x="246" y="96" fill="#1a1a1a">if not self.built:</text>
    <text x="246" y="116" fill="#2563eb">    self.build(inputs.shape)</text>
    <text x="246" y="136" fill="#1a1a1a">    self.built = True</text>
    <text x="246" y="164" fill="#2563eb">return self.call(inputs)</text>
  </g>
  <text x="374" y="188" text-anchor="middle" font-size="10.5" fill="#6b7280">(esquemáticamente, en la clase base)</text>

  <!-- build -->
  <line x1="524" y1="112" x2="566" y2="98" stroke="#2563eb" stroke-width="2" marker-end="url(#lbc-ar)"/>
  <rect x="568" y="62" width="164" height="66" rx="8" fill="#2563eb"/>
  <text x="650" y="86" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff" font-family="'JetBrains Mono', ui-monospace, monospace">build()</text>
  <text x="650" y="106" text-anchor="middle" font-size="11" fill="#dbeafe">crea los pesos, ya</text>
  <text x="650" y="120" text-anchor="middle" font-size="11" fill="#dbeafe">sabiendo la shape</text>

  <!-- call -->
  <line x1="524" y1="164" x2="566" y2="176" stroke="#2563eb" stroke-width="2" marker-end="url(#lbc-ar)"/>
  <rect x="568" y="146" width="164" height="66" rx="8" fill="#bfdbfe" stroke="#3b82f6"/>
  <text x="650" y="170" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a" font-family="'JetBrains Mono', ui-monospace, monospace">call()</text>
  <text x="650" y="190" text-anchor="middle" font-size="11" fill="#1e3a8a">el forward pass</text>
  <text x="650" y="204" text-anchor="middle" font-size="11" fill="#1e3a8a">y nada más</text>

  <!-- comparison -->
  <line x1="30" y1="228" x2="730" y2="228" stroke="#e5e7eb"/>

  <text x="30" y="252" font-size="11.5" font-weight="600" fill="#991b1b">Sin inferencia de shape (el NaiveDense del Cap. 2)</text>
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5" fill="#6b7280">
    <text x="30" y="272">NaiveDense(input_size=784, output_size=32, ...)</text>
    <text x="30" y="288">NaiveDense(input_size=32,  output_size=64, ...)</text>
    <text x="30" y="304">NaiveDense(input_size=64,  output_size=10, ...)</text>
  </g>
  <text x="30" y="326" font-size="10.5" fill="#991b1b">cada capa tiene que saber la shape de la anterior</text>

  <text x="420" y="252" font-size="11.5" font-weight="600" fill="#1e3a8a">Con inferencia de shape (Keras)</text>
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5" fill="#1a1a1a">
    <text x="420" y="272">SimpleDense(32, activation="relu")</text>
    <text x="420" y="288">SimpleDense(64, activation="relu")</text>
    <text x="420" y="304">SimpleDense(10, activation="softmax")</text>
  </g>
  <text x="420" y="326" font-size="10.5" fill="#2563eb">solo declaras la salida; la entrada se deduce sola</text>
</svg>
