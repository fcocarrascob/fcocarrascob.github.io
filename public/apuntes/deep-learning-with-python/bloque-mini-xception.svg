<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="'Segoe UI', system-ui, Arial, sans-serif">
  <defs>
    <marker id="bx-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="bx-res" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="780" height="400" fill="#ffffff"/>

  <text x="390" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Los tres patrones, ensamblados en un solo bloque</text>
  <text x="390" y="50" text-anchor="middle" font-size="11.5" fill="#6b7280">El bloque que el mini-Xception repite cinco veces, con filtros 32 → 64 → 128 → 256 → 512</text>

  <!-- main chain -->
  <rect x="30" y="150" width="58" height="40" rx="5" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="59" y="175" text-anchor="middle" font-size="12" font-weight="600" fill="#374151">x</text>

  <line x1="88" y1="170" x2="106" y2="170" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#bx-ar)"/>

  <rect x="108" y="150" width="86" height="40" rx="5" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="151" y="167" text-anchor="middle" font-size="10" font-weight="600" fill="#1e3a8a">Batch</text>
  <text x="151" y="180" text-anchor="middle" font-size="10" font-weight="600" fill="#1e3a8a">Normalization</text>

  <line x1="194" y1="170" x2="210" y2="170" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#bx-ar)"/>

  <rect x="212" y="150" width="56" height="40" rx="5" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="240" y="175" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1e3a8a">ReLU</text>

  <line x1="268" y1="170" x2="284" y2="170" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#bx-ar)"/>

  <rect x="286" y="146" width="104" height="48" rx="5" fill="#2563eb"/>
  <text x="338" y="164" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">SeparableConv2D</text>
  <text x="338" y="178" text-anchor="middle" font-size="9" fill="#dbeafe">size, 3, padding="same"</text>
  <text x="338" y="189" text-anchor="middle" font-size="9" fill="#dbeafe">use_bias=False</text>

  <line x1="390" y1="170" x2="406" y2="170" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#bx-ar)"/>
  <rect x="408" y="150" width="76" height="40" rx="5" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="446" y="167" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1e3a8a">BatchNorm</text>
  <text x="446" y="180" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1e3a8a">+ ReLU</text>

  <line x1="484" y1="170" x2="500" y2="170" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#bx-ar)"/>
  <rect x="502" y="146" width="104" height="48" rx="5" fill="#2563eb"/>
  <text x="554" y="164" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">SeparableConv2D</text>
  <text x="554" y="180" text-anchor="middle" font-size="9" fill="#dbeafe">otra vez</text>

  <line x1="606" y1="170" x2="622" y2="170" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#bx-ar)"/>
  <rect x="624" y="150" width="76" height="40" rx="5" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="662" y="167" text-anchor="middle" font-size="9.5" font-weight="600" fill="#374151">MaxPooling</text>
  <text x="662" y="180" text-anchor="middle" font-size="9.5" fill="#6b7280">3, strides=2</text>

  <line x1="700" y1="170" x2="714" y2="170" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#bx-ar)"/>
  <circle cx="732" cy="170" r="16" fill="#2563eb"/>
  <text x="732" y="176" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">+</text>

  <!-- residual path (below) -->
  <path d="M 59 190 L 59 246 L 380 246" fill="none" stroke="#2563eb" stroke-width="2"/>
  <rect x="382" y="228" width="196" height="36" rx="5" fill="#eff6ff" stroke="#2563eb"/>
  <text x="480" y="243" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1e3a8a">Conv2D(size, 1, strides=2)</text>
  <text x="480" y="256" text-anchor="middle" font-size="9" fill="#2563eb">proyecta el residual a la shape correcta</text>
  <path d="M 578 246 L 732 246 L 732 188" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#bx-res)"/>
  <text x="215" y="240" font-size="10.5" font-weight="700" fill="#2563eb">residual</text>

  <!-- annotations -->
  <text x="151" y="117" text-anchor="middle" font-size="9.5" fill="#6b7280">normaliza antes</text>
  <text x="151" y="128" text-anchor="middle" font-size="9.5" fill="#6b7280">de la activación</text>
  <line x1="151" y1="132" x2="151" y2="146" stroke="#d1d5db" stroke-width="1"/>

  <text x="338" y="128" text-anchor="middle" font-size="9.5" fill="#6b7280">sin bias: la BatchNorm ya centra en cero</text>
  <line x1="338" y1="132" x2="338" y2="142" stroke="#d1d5db" stroke-width="1"/>

  <text x="662" y="128" text-anchor="middle" font-size="9.5" fill="#6b7280">strides=2 acá…</text>
  <line x1="662" y1="132" x2="662" y2="146" stroke="#d1d5db" stroke-width="1"/>
  <text x="480" y="284" text-anchor="middle" font-size="9.5" fill="#6b7280">…obliga a strides=2 acá, para que las dos ramas puedan sumarse</text>

  <!-- footer note -->
  <rect x="20" y="304" width="740" height="76" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="40" y="326" font-size="11.5" font-weight="700" fill="#991b1b">Y la excepción que enseña la regla: la primera capa del modelo NO es separable</text>
  <text x="40" y="346" font-size="11" fill="#374151">El prior de la convolución separable es que <tspan font-style="italic">los canales son independientes</tspan>. Para features intermedias es cierto,</text>
  <text x="40" y="363" font-size="11" fill="#374151">pero <tspan font-weight="700">no para una imagen RGB cruda</tspan>: los canales rojo, verde y azul están altamente correlacionados en imágenes naturales.</text>
  <text x="40" y="378" font-size="10.5" fill="#991b1b">Por eso el modelo abre con una <tspan font-family="'JetBrains Mono', ui-monospace, monospace">Conv2D</tspan> regular. <tspan font-weight="700">Un prior solo ayuda si es verdadero.</tspan></text>
</svg>
