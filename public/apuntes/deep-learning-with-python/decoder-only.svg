<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="'Segoe UI', system-ui, Arial, sans-serif">
  <defs>
    <marker id="do-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="do-ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="800" height="430" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Decoder-only: la apuesta que definió la era</text>
  <text x="400" y="48" text-anchor="middle" font-size="11.5" fill="#6b7280">Se tira el encoder entero. Todo —pregunta y respuesta— entra como una sola secuencia, en un solo espacio latente.</text>

  <!-- encoder-decoder -->
  <rect x="20" y="68" width="368" height="212" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="204" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">Encoder–decoder (el traductor del Cap. 15)</text>

  <rect x="40" y="106" width="150" height="40" rx="5" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="115" y="122" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e40af">Secuencia origen</text>
  <text x="115" y="138" text-anchor="middle" font-size="10" fill="#374151">encoder · bidireccional</text>

  <rect x="218" y="106" width="150" height="40" rx="5" fill="#fef2f2" stroke="#fecaca"/>
  <text x="293" y="122" text-anchor="middle" font-size="10.5" font-weight="700" fill="#991b1b">Secuencia destino</text>
  <text x="293" y="138" text-anchor="middle" font-size="10" fill="#374151">decoder · causal</text>

  <path d="M192 126 L214 126" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#do-ab)"/>
  <text x="204" y="162" text-anchor="middle" font-size="9.5" fill="#2563eb">cross-attention</text>

  <text x="40" y="188" font-size="10.5" fill="#374151">Dos embeddings, dos juegos de parámetros:</text>
  <text x="40" y="203" font-size="10.5" fill="#374151">los tokens de la pregunta se procesan</text>
  <text x="40" y="218" font-size="10.5" fill="#374151">distinto de los de la respuesta.</text>
  <text x="40" y="243" font-size="10.5" font-weight="700" fill="#991b1b">El precio: hay que curar el dataset.</text>
  <text x="40" y="259" font-size="10" fill="#6b7280">Cada ejemplo tiene que venir como un par</text>
  <text x="40" y="272" font-size="10" fill="#6b7280">(entrada, salida) alineado a mano.</text>

  <!-- decoder-only -->
  <rect x="412" y="68" width="368" height="212" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="596" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">Decoder-only (GPT)</text>

  <g font-size="9.5" text-anchor="middle">
    <rect x="432" y="106" width="52" height="26" rx="4" fill="#fef2f2" stroke="#fecaca"/><text x="458" y="123" fill="#991b1b">Where</text>
    <rect x="488" y="106" width="34" height="26" rx="4" fill="#f3f4f6" stroke="#e5e7eb"/><text x="505" y="123" fill="#6b7280">is</text>
    <rect x="526" y="106" width="34" height="26" rx="4" fill="#f3f4f6" stroke="#e5e7eb"/><text x="543" y="123" fill="#6b7280">the</text>
    <rect x="564" y="106" width="60" height="26" rx="4" fill="#f3f4f6" stroke="#e5e7eb"/><text x="594" y="123" fill="#6b7280">capital</text>
    <rect x="628" y="106" width="30" height="26" rx="4" fill="#f3f4f6" stroke="#e5e7eb"/><text x="643" y="123" fill="#6b7280">of</text>
    <rect x="662" y="106" width="58" height="26" rx="4" fill="#f3f4f6" stroke="#e5e7eb"/><text x="691" y="123" fill="#6b7280">France</text>
    <rect x="724" y="106" width="24" height="26" rx="4" fill="#f3f4f6" stroke="#e5e7eb"/><text x="736" y="123" fill="#6b7280">?</text>
  </g>

  <path d="M594 148 L470 148 L462 138" stroke="#dc2626" stroke-width="1.4" fill="none" stroke-dasharray="4 3"/>
  <circle cx="532" cy="148" r="8" fill="#ffffff" stroke="#dc2626"/>
  <text x="532" y="152" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626">✗</text>
  <text x="596" y="166" text-anchor="middle" font-size="10" fill="#991b1b">La máscara causal corta este camino.</text>
  <text x="596" y="181" text-anchor="middle" font-size="10.5" fill="#374151">La representación de «Where» <tspan font-weight="700">no puede</tspan> atender</text>
  <text x="596" y="196" text-anchor="middle" font-size="10.5" fill="#374151">a «capital» ni a «France». Se pierde expresividad.</text>

  <text x="432" y="224" font-size="10.5" fill="#374151">Un solo espacio latente, un solo juego de</text>
  <text x="432" y="239" font-size="10.5" fill="#374151">parámetros para todos los tokens.</text>
  <text x="432" y="259" font-size="10.5" font-weight="700" fill="#166534">La ganancia: todo texto sirve como dato.</text>
  <text x="432" y="272" font-size="10" fill="#6b7280">Documentos crudos, sin pares, sin etiquetas.</text>

  <!-- trade-off band -->
  <rect x="20" y="298" width="760" height="120" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="400" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">El trade-off que define la era</text>
  <text x="400" y="346" text-anchor="middle" font-size="11" fill="#374151">Se sacrifica <tspan font-weight="700">expresividad</tspan> a cambio de <tspan font-weight="700">datos ilimitados</tspan>.</text>
  <text x="400" y="368" text-anchor="middle" font-size="10.5" fill="#6b7280">«No necesitamos curar datasets con pares de entradas y salidas; todo puede ser una única secuencia.</text>
  <text x="400" y="384" text-anchor="middle" font-size="10.5" fill="#6b7280">Podemos entrenar con cualquier texto que encontremos en internet, a escala masiva.»</text>
  <text x="400" y="406" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e40af">Y con el mismo cambio se pierde el límite de documento: uno se marca con &lt;|endoftext|&gt; y se sigue de largo.</text>
</svg>
