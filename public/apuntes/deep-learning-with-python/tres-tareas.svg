<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 372" font-family="'Segoe UI', system-ui, Arial, sans-serif">
  <rect width="780" height="372" fill="#ffffff"/>

  <text x="390" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">La última capa y la pérdida no se eligen: las dicta el target</text>

  <!-- column headers -->
  <text x="128" y="66" text-anchor="middle" font-size="11" font-weight="600" fill="#6b7280">EL PROBLEMA</text>
  <text x="330" y="66" text-anchor="middle" font-size="11" font-weight="600" fill="#6b7280">ÚLTIMA CAPA</text>
  <text x="530" y="66" text-anchor="middle" font-size="11" font-weight="600" fill="#6b7280">PÉRDIDA</text>
  <text x="700" y="66" text-anchor="middle" font-size="11" font-weight="600" fill="#6b7280">MÉTRICA</text>
  <line x1="24" y1="76" x2="756" y2="76" stroke="#e5e7eb"/>

  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11">

    <!-- Row 1: binary -->
    <rect x="24" y="88" width="208" height="66" rx="7" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="128" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a" font-family="'Segoe UI', system-ui, Arial, sans-serif">2 clases</text>
    <text x="128" y="131" text-anchor="middle" font-size="10.5" fill="#6b7280" font-family="'Segoe UI', system-ui, Arial, sans-serif">reseña ¿positiva o negativa?</text>
    <text x="128" y="146" text-anchor="middle" font-size="10" fill="#9ca3af" font-family="'Segoe UI', system-ui, Arial, sans-serif">IMDb · 88 % de accuracy</text>

    <rect x="244" y="88" width="172" height="66" rx="7" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="330" y="115" text-anchor="middle" fill="#1e3a8a">Dense(1,</text>
    <text x="330" y="133" text-anchor="middle" fill="#1e3a8a">  "sigmoid")</text>

    <rect x="428" y="88" width="204" height="66" rx="7" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="530" y="125" text-anchor="middle" fill="#2563eb">binary_crossentropy</text>

    <text x="700" y="120" text-anchor="middle" fill="#374151" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="11.5">accuracy</text>

    <!-- Row 2: multiclass -->
    <rect x="24" y="166" width="208" height="66" rx="7" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="128" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a" font-family="'Segoe UI', system-ui, Arial, sans-serif">N clases, una por muestra</text>
    <text x="128" y="209" text-anchor="middle" font-size="10.5" fill="#6b7280" font-family="'Segoe UI', system-ui, Arial, sans-serif">cable de prensa: ¿qué tema?</text>
    <text x="128" y="224" text-anchor="middle" font-size="10" fill="#9ca3af" font-family="'Segoe UI', system-ui, Arial, sans-serif">Reuters · 46 temas · 80 %</text>

    <rect x="244" y="166" width="172" height="66" rx="7" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="330" y="193" text-anchor="middle" fill="#1e3a8a">Dense(N,</text>
    <text x="330" y="211" text-anchor="middle" fill="#1e3a8a">  "softmax")</text>

    <rect x="428" y="166" width="204" height="66" rx="7" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="530" y="194" text-anchor="middle" fill="#2563eb">categorical_</text>
    <text x="530" y="212" text-anchor="middle" fill="#2563eb">crossentropy</text>

    <text x="700" y="192" text-anchor="middle" fill="#374151" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="11.5">accuracy</text>
    <text x="700" y="210" text-anchor="middle" fill="#374151" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="11.5">top-3</text>

    <!-- Row 3: regression -->
    <rect x="24" y="244" width="208" height="66" rx="7" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="128" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a" font-family="'Segoe UI', system-ui, Arial, sans-serif">un valor continuo</text>
    <text x="128" y="287" text-anchor="middle" font-size="10.5" fill="#6b7280" font-family="'Segoe UI', system-ui, Arial, sans-serif">¿cuánto vale la vivienda?</text>
    <text x="128" y="302" text-anchor="middle" font-size="10" fill="#9ca3af" font-family="'Segoe UI', system-ui, Arial, sans-serif">California · ±US$ 31 000</text>

    <rect x="244" y="244" width="172" height="66" rx="7" fill="#2563eb"/>
    <text x="330" y="271" text-anchor="middle" fill="#ffffff">Dense(1)</text>
    <text x="330" y="291" text-anchor="middle" fill="#dbeafe" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="10.5">sin activación</text>

    <rect x="428" y="244" width="204" height="66" rx="7" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="530" y="281" text-anchor="middle" fill="#2563eb">mean_squared_error</text>

    <text x="700" y="276" text-anchor="middle" fill="#374151" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="11.5">MAE</text>
  </g>

  <line x1="24" y1="326" x2="756" y2="326" stroke="#e5e7eb"/>
  <text x="390" y="350" text-anchor="middle" font-size="11.5" fill="#374151">La capa de regresión va <tspan font-weight="700" fill="#2563eb">desnuda</tspan>: cualquier activación le acotaría el rango de salida</text>
</svg>
