<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Segoe UI', system-ui, Arial, sans-serif">
  <defs>
    <marker id="df-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="800" height="480" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Un modelo de difusión es un autoencoder de denoising metido en un bucle</text>
  <text x="400" y="48" text-anchor="middle" font-size="11.5" fill="#6b7280">Y el nombre está al revés: «difusión» es el proceso de <tspan font-style="italic">agregar</tspan> ruido. Lo que se entrena es el camino de vuelta.</text>

  <!-- schedule -->
  <rect x="20" y="66" width="366" height="216" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="203" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">El schedule cosenoidal</text>

  <line x1="70" y1="250" x2="230" y2="250" stroke="#9ca3af" stroke-width="1.2"/>
  <line x1="70" y1="250" x2="70" y2="110" stroke="#9ca3af" stroke-width="1.2"/>
  <path d="M200 250 A130 130 0 0 0 70 120" fill="none" stroke="#d1d5db" stroke-width="1.4"/>
  <line x1="70" y1="250" x2="162" y2="158" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="162" y1="158" x2="162" y2="250" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="162" y1="158" x2="70" y2="158" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="70" y1="250" x2="162" y2="250" stroke="#16a34a" stroke-width="3.4"/>
  <line x1="70" y1="250" x2="70" y2="158" stroke="#dc2626" stroke-width="3.4"/>
  <path d="M104 250 A34 34 0 0 0 94 226" fill="none" stroke="#6b7280" stroke-width="1"/>
  <text x="110" y="241" font-size="11" font-style="italic" fill="#374151">θ</text>

  <text x="116" y="268" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">signal_rate = cos θ</text>
  <text x="78" y="182" font-size="10" font-weight="700" fill="#991b1b">noise_rate</text>
  <text x="78" y="195" font-size="10" font-weight="700" fill="#991b1b">= sin θ</text>

  <text x="248" y="120" font-size="10.5" fill="#374151">El tiempo de difusión va</text>
  <text x="248" y="134" font-size="10.5" fill="#374151">continuo de <tspan font-weight="700">1 a 0</tspan>:</text>
  <text x="248" y="154" font-size="10" fill="#991b1b"><tspan font-weight="700">t = 1</tspan> · ruido máximo</text>
  <text x="248" y="169" font-size="10" fill="#166534"><tspan font-weight="700">t = 0</tspan> · señal pura</text>
  <text x="248" y="196" font-size="10.5" fill="#374151">Y como seno y coseno</text>
  <text x="248" y="210" font-size="10.5" fill="#374151">cumplen Pitágoras:</text>
  <text x="248" y="230" font-size="10.5" font-family="'Consolas', monospace" font-weight="700" fill="#1e40af">noise² + signal² = 1</text>
  <text x="248" y="250" font-size="10" fill="#6b7280">la energía total se conserva</text>
  <text x="248" y="263" font-size="10" fill="#6b7280">en cada paso. Esa es toda la razón.</text>

  <!-- two design decisions -->
  <rect x="400" y="66" width="380" height="216" rx="8" fill="#fffbeb" stroke="#fde68a"/>
  <text x="590" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Las dos decisiones que no son obvias</text>

  <rect x="418" y="102" width="120" height="40" rx="5" fill="#ffffff" stroke="#fde68a"/>
  <text x="478" y="119" text-anchor="middle" font-size="9.5" fill="#374151">imagen con ruido</text>
  <text x="478" y="134" text-anchor="middle" font-size="9.5" font-weight="700" fill="#92400e">+ noise_rate</text>

  <line x1="541" y1="122" x2="559" y2="122" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#df-ar)"/>

  <rect x="562" y="102" width="74" height="40" rx="5" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="599" y="126" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e40af">U-Net</text>

  <line x1="639" y1="122" x2="657" y2="122" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#df-ar)"/>

  <rect x="660" y="102" width="102" height="40" rx="5" fill="#ffffff" stroke="#fde68a"/>
  <text x="711" y="119" text-anchor="middle" font-size="9.5" font-weight="700" fill="#92400e">máscara de ruido</text>
  <text x="711" y="134" text-anchor="middle" font-size="9.5" fill="#374151">predicha</text>

  <text x="418" y="166" font-size="10.5" fill="#374151"><tspan font-weight="700">1 ·</tspan> No emite la imagen limpia: emite <tspan font-weight="700">el ruido</tspan>, que después se resta.</text>
  <text x="418" y="184" font-size="10" font-family="'Consolas', monospace" fill="#1e40af">pred_images = (noisy - noise_rate * mask) / signal_rate</text>

  <text x="418" y="212" font-size="10.5" fill="#374151"><tspan font-weight="700">2 ·</tspan> Se le <tspan font-weight="700">dice cuánto ruido sacar</tspan>. El mismo modelo se reutiliza</text>
  <text x="418" y="227" font-size="10.5" fill="#374151">en cada iteración, y el <tspan font-family="'Consolas', monospace">noise_rate</tspan> entra como un canal más.</text>

  <text x="418" y="252" font-size="10" fill="#6b7280">La última capa arranca con <tspan font-family="'Consolas', monospace">kernel_initializer="zeros"</tspan>: antes de</text>
  <text x="418" y="265" font-size="10" fill="#6b7280">entrenar, la suposición por defecto es «no hay ruido».</text>

  <!-- generation loop -->
  <rect x="20" y="298" width="760" height="166" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="40" y="322" font-size="12" font-weight="700" fill="#166534">El bucle de generación: se parte de ruido puro y se dan pasos parciales</text>

  <rect x="40" y="338" width="96" height="52" rx="5" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="88" y="360" text-anchor="middle" font-size="10.5" font-weight="700" fill="#374151">ruido puro</text>
  <text x="88" y="375" text-anchor="middle" font-size="9.5" fill="#9ca3af">t = 1</text>

  <line x1="139" y1="364" x2="159" y2="364" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#df-ar)"/>

  <rect x="162" y="338" width="140" height="52" rx="5" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="232" y="358" text-anchor="middle" font-size="10" fill="#374151">predecir el ruido</text>
  <text x="232" y="374" text-anchor="middle" font-size="10" fill="#374151">y restarlo</text>

  <line x1="305" y1="364" x2="325" y2="364" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#df-ar)"/>

  <rect x="328" y="338" width="200" height="52" rx="5" fill="#eff6ff" stroke="#2563eb"/>
  <text x="428" y="358" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">recombinar con el schedule</text>
  <text x="428" y="374" text-anchor="middle" font-size="10" fill="#374151">del paso siguiente</text>

  <line x1="531" y1="364" x2="551" y2="364" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#df-ar)"/>

  <rect x="554" y="338" width="96" height="52" rx="5" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="602" y="360" text-anchor="middle" font-size="10.5" font-weight="700" fill="#374151">imagen</text>
  <text x="602" y="375" text-anchor="middle" font-size="9.5" fill="#9ca3af">t = 0</text>

  <path d="M428 392 L428 410 L232 410 L232 394" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#df-ar)"/>
  <text x="330" y="424" text-anchor="middle" font-size="9.5" fill="#6b7280">repetir num_steps veces</text>

  <text x="672" y="356" font-size="10" fill="#6b7280">Cada bloque de</text>
  <text x="672" y="369" font-size="10" fill="#6b7280">ruido blanco tiene</text>
  <text x="672" y="382" font-size="10" fill="#6b7280">una imagen dentro.</text>

  <text x="40" y="444" font-size="10.5" fill="#374151">El detalle que se pasa por alto: <tspan font-weight="700">no se salta a la imagen predicha</tspan>. Se la vuelve a mezclar con el ruido predicho según</text>
  <text x="40" y="458" font-size="10.5" fill="#374151">el schedule del paso siguiente, así que cada iteración avanza <tspan font-weight="700">un tramo</tspan> hacia la imagen limpia, no de un salto.</text>
</svg>
