<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 372" font-family="'Segoe UI', system-ui, Arial, sans-serif">
  <rect width="780" height="372" fill="#ffffff"/>

  <text x="390" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Cuatro niveles de control sobre el entrenamiento</text>
  <text x="390" y="50" text-anchor="middle" font-size="11.5" fill="#6b7280">Bajas un escalón solo cuando el anterior se te queda corto</text>

  <!-- headers -->
  <text x="30" y="82" font-size="10.5" font-weight="600" fill="#6b7280">NIVEL</text>
  <text x="440" y="82" font-size="10.5" font-weight="600" fill="#6b7280">QUÉ CONSERVAS</text>
  <line x1="24" y1="90" x2="756" y2="90" stroke="#e5e7eb"/>

  <!-- level 1 -->
  <rect x="24" y="100" width="392" height="54" rx="7" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="44" y="122" font-size="12" font-weight="700" fill="#1e3a8a">1 · fit() a secas</text>
  <text x="44" y="140" font-size="10.5" font-family="'JetBrains Mono', ui-monospace, monospace" fill="#2563eb">compile → fit → evaluate → predict</text>
  <text x="440" y="122" font-size="11" fill="#374151">Todo. Es lo que usarás la mayor</text>
  <text x="440" y="139" font-size="11" fill="#374151">parte del tiempo.</text>

  <!-- level 2 -->
  <rect x="24" y="164" width="392" height="54" rx="7" fill="#bfdbfe" stroke="#60a5fa"/>
  <text x="44" y="186" font-size="12" font-weight="700" fill="#1e3a8a">2 · fit() + métricas y callbacks propios</text>
  <text x="44" y="204" font-size="10.5" font-family="'JetBrains Mono', ui-monospace, monospace" fill="#2563eb">EarlyStopping · ModelCheckpoint · TensorBoard</text>
  <text x="440" y="186" font-size="11" fill="#374151">Todo, más el control de cuándo</text>
  <text x="440" y="203" font-size="11" fill="#374151">cortar y qué guardar.</text>

  <!-- level 3 -->
  <rect x="24" y="228" width="392" height="54" rx="7" fill="#2563eb"/>
  <text x="44" y="250" font-size="12" font-weight="700" fill="#ffffff">3 · Sobrescribir train_step()</text>
  <text x="44" y="268" font-size="10.5" fill="#dbeafe">tu algoritmo, la infraestructura de fit()</text>
  <text x="440" y="243" font-size="11" font-weight="700" fill="#2563eb">Callbacks, optimizaciones de</text>
  <text x="440" y="259" font-size="11" font-weight="700" fill="#2563eb">rendimiento y entrenamiento</text>
  <text x="440" y="275" font-size="11" font-weight="700" fill="#2563eb">distribuido. ← el punto medio</text>

  <!-- level 4 -->
  <rect x="24" y="292" width="392" height="54" rx="7" fill="#1e3a8a"/>
  <text x="44" y="314" font-size="12" font-weight="700" fill="#ffffff">4 · Bucle escrito desde cero</text>
  <text x="44" y="332" font-size="10.5" fill="#bfdbfe">backend-nativo: TensorFlow · PyTorch · JAX</text>
  <text x="440" y="307" font-size="11" fill="#991b1b">Nada: reescribes callbacks,</text>
  <text x="440" y="323" font-size="11" fill="#991b1b">optimizaciones y distribución.</text>
  <text x="440" y="339" font-size="11" fill="#374151">Para algoritmos genuinamente nuevos.</text>

  <!-- side note about why you'd leave fit -->
  <rect x="440" y="100" width="0" height="0"/>
</svg>
