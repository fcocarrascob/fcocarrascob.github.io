<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 372" font-family="'Segoe UI', system-ui, Arial, sans-serif">
  <defs>
    <marker id="pp-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="780" height="372" fill="#ffffff"/>

  <text x="390" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Por qué hace falta el max pooling</text>
  <text x="390" y="50" text-anchor="middle" font-size="11.5" fill="#6b7280">Los dos modelos tienen exactamente los mismos 372 234 parámetros</text>

  <!-- ── WITHOUT pooling ── -->
  <rect x="20" y="70" width="740" height="120" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="40" y="94" font-size="12" font-weight="700" fill="#991b1b">Sin max pooling</text>

  <g font-size="10.5">
    <rect x="150" y="104" width="86" height="30" rx="5" fill="#ffffff" stroke="#fca5a5"/>
    <text x="193" y="123" text-anchor="middle" fill="#991b1b">28 × 28</text>
    <line x1="236" y1="119" x2="256" y2="119" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#pp-ar)"/>
    <rect x="258" y="104" width="86" height="30" rx="5" fill="#ffffff" stroke="#fca5a5"/>
    <text x="301" y="123" text-anchor="middle" fill="#991b1b">26 × 26</text>
    <line x1="344" y1="119" x2="364" y2="119" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#pp-ar)"/>
    <rect x="366" y="104" width="86" height="30" rx="5" fill="#ffffff" stroke="#fca5a5"/>
    <text x="409" y="123" text-anchor="middle" fill="#991b1b">24 × 24</text>
    <line x1="452" y1="119" x2="472" y2="119" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#pp-ar)"/>
    <rect x="474" y="104" width="86" height="30" rx="5" fill="#fecaca" stroke="#dc2626"/>
    <text x="517" y="123" text-anchor="middle" font-weight="700" fill="#991b1b">22 × 22</text>
  </g>

  <text x="40" y="156" font-size="11" fill="#991b1b">✗ Las ventanas 3 × 3 de la tercera capa <tspan font-weight="700">solo ven 7 × 7 de la imagen original</tspan> — <tspan font-style="italic" fill="#374151">"intenta reconocer un dígito así"</tspan>.</text>
  <text x="40" y="176" font-size="11" fill="#991b1b">✗ El mapa final de 22 × 22: <tspan font-weight="700">promediarlo destruye muchísima información</tspan>.</text>

  <!-- ── WITH pooling ── -->
  <rect x="20" y="204" width="740" height="120" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="40" y="228" font-size="12" font-weight="700" fill="#1e3a8a">Con max pooling (2 × 2, stride 2)</text>

  <g font-size="10">
    <rect x="150" y="238" width="62" height="30" rx="5" fill="#ffffff" stroke="#93c5fd"/>
    <text x="181" y="257" text-anchor="middle" fill="#1e3a8a">28 × 28</text>
    <line x1="212" y1="253" x2="226" y2="253" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#pp-ar)"/>
    <rect x="228" y="238" width="62" height="30" rx="5" fill="#ffffff" stroke="#93c5fd"/>
    <text x="259" y="257" text-anchor="middle" fill="#1e3a8a">26 × 26</text>
    <line x1="290" y1="253" x2="304" y2="253" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#pp-ar)"/>
    <rect x="306" y="238" width="62" height="30" rx="5" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="337" y="257" text-anchor="middle" fill="#1e3a8a">13 × 13</text>
    <line x1="368" y1="253" x2="382" y2="253" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#pp-ar)"/>
    <rect x="384" y="238" width="62" height="30" rx="5" fill="#ffffff" stroke="#93c5fd"/>
    <text x="415" y="257" text-anchor="middle" fill="#1e3a8a">11 × 11</text>
    <line x1="446" y1="253" x2="460" y2="253" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#pp-ar)"/>
    <rect x="462" y="238" width="62" height="30" rx="5" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="493" y="257" text-anchor="middle" fill="#1e3a8a">5 × 5</text>
    <line x1="524" y1="253" x2="538" y2="253" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#pp-ar)"/>
    <rect x="540" y="238" width="62" height="30" rx="5" fill="#2563eb"/>
    <text x="571" y="257" text-anchor="middle" font-weight="700" fill="#ffffff">3 × 3</text>
  </g>
  <text x="620" y="257" font-size="10" fill="#6b7280">azul = pooling</text>

  <text x="40" y="290" font-size="11" fill="#1e3a8a">✓ Las capas sucesivas "miran" ventanas cada vez mayores <tspan font-weight="700">de la imagen original</tspan>.</text>
  <text x="40" y="308" font-size="11" fill="#1e3a8a">✓ La información pasa <tspan font-weight="700">del espacio a los canales</tspan>: menos distribuida, más concentrada.</text>

  <!-- footer: why max -->
  <rect x="20" y="336" width="740" height="26" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="390" y="354" text-anchor="middle" font-size="11" fill="#374151">¿Por qué <tspan font-style="italic">max</tspan> y no promedio? Las features codifican <tspan font-weight="700">presencia</tspan>, y es más informativo mirar la presencia máxima que la promedio</text>
</svg>
