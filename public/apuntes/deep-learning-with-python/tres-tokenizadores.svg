<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="'Segoe UI', system-ui, Arial, sans-serif">
  <defs>
    <marker id="tk-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="800" height="430" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Tres tokenizadores sobre Moby Dick, y por qué gana el tercero</text>
  <text x="400" y="48" text-anchor="middle" font-size="11.5" fill="#6b7280">Frase de prueba: "Call me Ishmael. Some years ago--never mind how long precisely."</text>

  <!-- three panels -->
  <rect x="20" y="70" width="245" height="150" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="142" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Carácter</text>
  <text x="142" y="120" text-anchor="middle" font-size="11" fill="#374151">Vocabulario: <tspan font-weight="700" font-size="14">64</tspan></text>
  <text x="142" y="142" text-anchor="middle" font-size="11" fill="#374151">La frase: <tspan font-weight="700" font-size="14">63</tspan> tokens</text>
  <line x1="45" y1="156" x2="240" y2="156" stroke="#fecaca"/>
  <text x="142" y="176" text-anchor="middle" font-size="10.5" fill="#991b1b">Cubre el libro entero con nada,</text>
  <text x="142" y="192" text-anchor="middle" font-size="10.5" fill="#991b1b">pero produce <tspan font-weight="700">secuencias larguísimas</tspan>.</text>
  <text x="142" y="210" text-anchor="middle" font-size="10.5" fill="#991b1b">Cero compresión.</text>

  <rect x="277" y="70" width="245" height="150" rx="8" fill="#fffbeb" stroke="#fde68a"/>
  <text x="399" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Palabra</text>
  <text x="399" y="120" text-anchor="middle" font-size="11" fill="#374151">Vocabulario: <tspan font-weight="700" font-size="14">2 000</tspan></text>
  <text x="399" y="142" text-anchor="middle" font-size="11" fill="#374151">La frase: <tspan font-weight="700" font-size="14">13</tspan> tokens</text>
  <line x1="302" y1="156" x2="497" y2="156" stroke="#fde68a"/>
  <text x="399" y="176" text-anchor="middle" font-size="10.5" fill="#92400e">El más corto — pero harían falta</text>
  <text x="399" y="192" text-anchor="middle" font-size="10.5" fill="#92400e"><tspan font-weight="700">17 000</tspan> términos para el libro entero.</text>
  <text x="399" y="210" text-anchor="middle" font-size="10.5" fill="#92400e">Lo que sobra cae en <tspan font-weight="700">[UNK]</tspan>.</text>

  <rect x="534" y="70" width="246" height="150" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="657" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Subword (byte-pair encoding)</text>
  <text x="657" y="120" text-anchor="middle" font-size="11" fill="#374151">Vocabulario: <tspan font-weight="700" font-size="14">2 000</tspan></text>
  <text x="657" y="142" text-anchor="middle" font-size="11" fill="#374151">La frase: <tspan font-weight="700" font-size="14">16</tspan> tokens</text>
  <line x1="559" y1="156" x2="755" y2="156" stroke="#bbf7d0"/>
  <text x="657" y="176" text-anchor="middle" font-size="10.5" fill="#166534">Tres tokens más que el de palabras,</text>
  <text x="657" y="192" text-anchor="middle" font-size="10.5" fill="#166534">pero tokeniza <tspan font-weight="700">todo el libro sin un solo</tspan></text>
  <text x="657" y="210" text-anchor="middle" font-size="10.5" fill="#166534"><tspan font-weight="700">[UNK]</tspan>: el peor caso es letra por letra.</text>

  <!-- BPE steps -->
  <rect x="20" y="240" width="760" height="146" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="400" y="262" text-anchor="middle" font-size="11.5" font-weight="700" fill="#374151">Cómo se construye: fusionar el par más frecuente, una y otra vez</text>

  <text x="40" y="288" font-size="11" font-family="'Consolas', monospace" fill="#6b7280">inicio</text>
  <text x="120" y="288" font-size="11" font-family="'Consolas', monospace" fill="#374151">"b r o w n" ×3   "s l o w" ×1   "f o x h o u n d" ×1   …</text>
  <text x="640" y="288" font-size="10" fill="#9ca3af">cada palabra, letra por letra</text>

  <line x1="70" y1="296" x2="70" y2="312" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#tk-ar)"/>
  <text x="82" y="309" font-size="9.5" fill="#6b7280">el par más frecuente es ("o","w") — aparece 4 veces</text>

  <text x="40" y="330" font-size="11" font-family="'Consolas', monospace" fill="#6b7280">paso 1</text>
  <text x="120" y="330" font-size="11" font-family="'Consolas', monospace" fill="#374151">"b r <tspan font-weight="700" fill="#166534">ow</tspan> n"        "s l <tspan font-weight="700" fill="#166534">ow</tspan>"     "f o x h o u n d"</text>

  <text x="40" y="352" font-size="11" font-family="'Consolas', monospace" fill="#6b7280">paso 6</text>
  <text x="120" y="352" font-size="11" font-family="'Consolas', monospace" fill="#374151">"<tspan font-weight="700" fill="#166534">brown</tspan>"          "s l ow"    "f o x h o u n d"</text>

  <text x="40" y="374" font-size="11" font-family="'Consolas', monospace" fill="#6b7280">paso 10</text>
  <text x="120" y="374" font-size="11" font-family="'Consolas', monospace" fill="#374151">"brown"          "s l ow"    "<tspan font-weight="700" fill="#166534">fox</tspan> h o u n d"</text>
  <text x="470" y="374" font-size="10" fill="#9ca3af">las comunes se fusionan enteras; las raras, a medias</text>

  <text x="400" y="410" text-anchor="middle" font-size="11" fill="#374151">Buscar el tokenizador ideal es <tspan font-weight="700">buscar la compresión ideal</tspan>: secuencias cortas <tspan font-weight="700">y</tspan> vocabulario chico.</text>
  <text x="400" y="426" text-anchor="middle" font-size="10.5" fill="#6b7280">Por eso el truco fue reutilizar un algoritmo de compresión sin pérdida de 1994. Lo usa ChatGPT hasta hoy.</text>
</svg>
