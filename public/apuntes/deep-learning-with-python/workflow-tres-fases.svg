<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="'Segoe UI', system-ui, Arial, sans-serif">
  <defs>
    <marker id="w3-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="w3-gr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="780" height="400" fill="#ffffff"/>

  <text x="390" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">El workflow universal del machine learning</text>
  <text x="390" y="50" text-anchor="middle" font-size="11.5" fill="#6b7280">Los tutoriales cubren la fase 2. El capítulo dice que no es la más difícil.</text>

  <!-- Phase 1 -->
  <rect x="20" y="70" width="230" height="228" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <rect x="20" y="70" width="230" height="32" rx="8" fill="#dbeafe"/>
  <rect x="20" y="92" width="230" height="10" fill="#dbeafe"/>
  <text x="135" y="91" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">1 · DEFINIR LA TAREA</text>

  <rect x="36" y="114" width="198" height="38" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="135" y="131" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">Enmarcar el problema</text>
  <text x="135" y="145" text-anchor="middle" font-size="10" fill="#6b7280">entradas, targets, tipo de tarea</text>

  <rect x="36" y="158" width="198" height="38" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="135" y="175" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">Recolectar y anotar</text>
  <text x="135" y="189" text-anchor="middle" font-size="10" fill="#6b7280">lo más arduo, lento y costoso</text>

  <rect x="36" y="202" width="198" height="38" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="135" y="219" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">Entender los datos</text>
  <text x="135" y="233" text-anchor="middle" font-size="10" fill="#6b7280">clases, histogramas, leaking</text>

  <rect x="36" y="246" width="198" height="38" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="135" y="263" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">Elegir la medida de éxito</text>
  <text x="135" y="277" text-anchor="middle" font-size="10" fill="#6b7280">alineada con el negocio</text>

  <!-- arrow 1→2 -->
  <line x1="250" y1="184" x2="272" y2="184" stroke="#2563eb" stroke-width="2" marker-end="url(#w3-ar)"/>

  <!-- Phase 2 -->
  <rect x="275" y="70" width="230" height="228" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <rect x="275" y="70" width="230" height="32" rx="8" fill="#2563eb"/>
  <rect x="275" y="92" width="230" height="10" fill="#2563eb"/>
  <text x="390" y="91" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2 · DESARROLLAR</text>

  <rect x="291" y="114" width="198" height="34" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="390" y="129" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">Preparar los datos</text>
  <text x="390" y="142" text-anchor="middle" font-size="10" fill="#2563eb">vectorizar, normalizar, faltantes</text>

  <rect x="291" y="154" width="198" height="30" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="390" y="173" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">Elegir protocolo de evaluación</text>

  <rect x="291" y="190" width="198" height="30" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="390" y="209" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">Batir la línea base</text>

  <rect x="291" y="226" width="198" height="30" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="390" y="245" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">Escalar hasta overfittear</text>

  <rect x="291" y="262" width="198" height="30" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="390" y="281" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">Regularizar y ajustar</text>

  <!-- arrow 2→3 -->
  <line x1="505" y1="184" x2="527" y2="184" stroke="#2563eb" stroke-width="2" marker-end="url(#w3-ar)"/>

  <!-- Phase 3 -->
  <rect x="530" y="70" width="230" height="228" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <rect x="530" y="70" width="230" height="32" rx="8" fill="#dbeafe"/>
  <rect x="530" y="92" width="230" height="10" fill="#dbeafe"/>
  <text x="645" y="91" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">3 · DESPLEGAR</text>

  <rect x="546" y="114" width="198" height="38" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="645" y="131" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">Fijar expectativas</text>
  <text x="645" y="145" text-anchor="middle" font-size="10" fill="#6b7280">modos de falla, no "98 %"</text>

  <rect x="546" y="158" width="198" height="38" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="645" y="175" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">Enviar el modelo de inferencia</text>
  <text x="645" y="189" text-anchor="middle" font-size="10" fill="#6b7280">no el objeto Python de entrenar</text>

  <rect x="546" y="202" width="198" height="38" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="645" y="219" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">Monitorear en producción</text>
  <text x="645" y="233" text-anchor="middle" font-size="10" fill="#6b7280">A/B testing, auditoría manual</text>

  <rect x="546" y="246" width="198" height="38" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="645" y="263" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">Mantener</text>
  <text x="645" y="277" text-anchor="middle" font-size="10" fill="#6b7280">y recolectar para la v2</text>

  <!-- drift loop -->
  <path d="M 645 298 L 645 326 L 135 326 L 135 304" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#w3-gr)"/>
  <rect x="300" y="313" width="180" height="24" rx="5" fill="#ffffff"/>
  <text x="390" y="330" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">concept drift: ningún modelo dura</text>

  <!-- lifespans -->
  <text x="390" y="364" text-anchor="middle" font-size="11" fill="#374151">Vida útil estimada — recomendador de música: <tspan font-weight="700">semanas</tspan> · detección de fraude: <tspan font-weight="700">días</tspan></text>
  <text x="390" y="382" text-anchor="middle" font-size="11" fill="#374151">buscador de imágenes: <tspan font-weight="700">un par de años en el mejor caso</tspan></text>
</svg>
