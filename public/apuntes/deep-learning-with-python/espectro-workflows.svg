<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" font-family="'Segoe UI', system-ui, Arial, sans-serif">
  <defs>
    <linearGradient id="ew-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <marker id="ew-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="780" height="320" fill="#ffffff"/>

  <text x="390" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Divulgación progresiva de la complejidad</text>
  <text x="390" y="50" text-anchor="middle" font-size="11.5" fill="#6b7280">No hay una forma "verdadera" de usar Keras: hay un espectro, y todos los niveles interoperan</text>

  <!-- gradient bar -->
  <rect x="30" y="70" width="720" height="10" rx="5" fill="url(#ew-grad)"/>
  <line x1="30" y1="94" x2="750" y2="94" stroke="#6b7280" stroke-width="1.2" marker-end="url(#ew-ar)"/>
  <text x="30" y="112" font-size="10.5" fill="#6b7280">más usabilidad</text>
  <text x="750" y="112" text-anchor="end" font-size="10.5" fill="#6b7280">más flexibilidad</text>

  <!-- four boxes -->
  <rect x="30" y="128" width="168" height="78" rx="7" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="114" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Sequential</text>
  <text x="114" y="170" text-anchor="middle" font-size="10.5" fill="#1e3a8a">+ capas built-in</text>
  <text x="114" y="192" text-anchor="middle" font-size="10" fill="#2563eb">"básicamente una lista</text>
  <text x="114" y="204" text-anchor="middle" font-size="10" fill="#2563eb">de Python"</text>

  <rect x="214" y="128" width="168" height="78" rx="7" fill="#bfdbfe" stroke="#60a5fa"/>
  <text x="298" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Functional API</text>
  <text x="298" y="170" text-anchor="middle" font-size="10.5" fill="#1e3a8a">+ capas built-in</text>
  <text x="298" y="192" text-anchor="middle" font-size="10" fill="#2563eb">grafo de capas;</text>
  <text x="298" y="204" text-anchor="middle" font-size="10" fill="#2563eb">"como jugar con LEGO"</text>

  <rect x="398" y="128" width="168" height="78" rx="7" fill="#60a5fa" stroke="#2563eb"/>
  <text x="482" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Functional API</text>
  <text x="482" y="170" text-anchor="middle" font-size="10.5" fill="#eff6ff">+ capas, métricas y</text>
  <text x="482" y="184" text-anchor="middle" font-size="10.5" fill="#eff6ff">pérdidas propias</text>
  <text x="482" y="202" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">← lo que usa el libro</text>

  <rect x="582" y="128" width="168" height="78" rx="7" fill="#1e3a8a"/>
  <text x="666" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Subclassing</text>
  <text x="666" y="170" text-anchor="middle" font-size="10.5" fill="#bfdbfe">escribes todo</text>
  <text x="666" y="184" text-anchor="middle" font-size="10.5" fill="#bfdbfe">desde cero</text>
  <text x="666" y="202" text-anchor="middle" font-size="10" fill="#93c5fd">bucles, recursión, lo que sea</text>

  <!-- user profiles -->
  <text x="114" y="232" text-anchor="middle" font-size="10.5" font-weight="600" fill="#6b7280">Usuarios novatos,</text>
  <text x="114" y="246" text-anchor="middle" font-size="10.5" font-weight="600" fill="#6b7280">modelos simples</text>

  <text x="298" y="232" text-anchor="middle" font-size="10.5" font-weight="600" fill="#6b7280">Ingenieros con</text>
  <text x="298" y="246" text-anchor="middle" font-size="10.5" font-weight="600" fill="#6b7280">casos estándar</text>

  <text x="482" y="232" text-anchor="middle" font-size="10.5" font-weight="600" fill="#6b7280">Ingenieros con casos</text>
  <text x="482" y="246" text-anchor="middle" font-size="10.5" font-weight="600" fill="#6b7280">de nicho a la medida</text>

  <text x="666" y="232" text-anchor="middle" font-size="10.5" font-weight="600" fill="#6b7280">Investigadores</text>

  <!-- footer -->
  <rect x="30" y="266" width="720" height="40" rx="7" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="390" y="291" text-anchor="middle" font-size="11.5" fill="#1e3a8a">Todos se apoyan en las mismas APIs (<tspan font-family="'JetBrains Mono', ui-monospace, monospace">Layer</tspan>, <tspan font-family="'JetBrains Mono', ui-monospace, monospace">Model</tspan>): <tspan font-weight="700">lo que aprendes de principiante te sirve de experto</tspan></text>
</svg>
