<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 372" font-family="'Segoe UI', system-ui, Arial, sans-serif">
  <defs>
    <marker id="ed-ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="780" height="372" fill="#ffffff"/>

  <text x="390" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Encoder-decoder: comprimir y volver a expandir</text>
  <text x="390" y="50" text-anchor="middle" font-size="11.5" fill="#6b7280">La salida debe tener el mismo tamaño que la entrada, porque es una clase por píxel</text>

  <!-- encoder side -->
  <text x="150" y="82" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991b1b">ENCODER — comprime</text>
  <text x="150" y="98" text-anchor="middle" font-size="10" fill="#6b7280">Conv2D con strides=2</text>

  <rect x="60" y="112" width="180" height="34" rx="5" fill="#2563eb"/>
  <text x="150" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">200 × 200 × 3</text>

  <line x1="150" y1="146" x2="150" y2="160" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ed-ar2)"/>
  <rect x="76" y="162" width="148" height="30" rx="5" fill="#60a5fa"/>
  <text x="150" y="182" text-anchor="middle" font-size="10.5" font-weight="600" fill="#ffffff">100 × 100 × 64</text>

  <line x1="150" y1="192" x2="150" y2="206" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ed-ar2)"/>
  <rect x="92" y="208" width="116" height="30" rx="5" fill="#93c5fd"/>
  <text x="150" y="228" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1e3a8a">50 × 50 × 128</text>

  <line x1="150" y1="238" x2="150" y2="252" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ed-ar2)"/>
  <rect x="106" y="254" width="88" height="30" rx="5" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="150" y="274" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e3a8a">25 × 25 × 256</text>

  <!-- bottleneck label -->
  <text x="390" y="262" text-anchor="middle" font-size="11.5" font-weight="700" fill="#374151">EL CUELLO</text>
  <rect x="288" y="270" width="204" height="60" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="390" y="288" text-anchor="middle" font-size="10" fill="#374151">Cada "píxel" de este mapa</text>
  <text x="390" y="303" text-anchor="middle" font-size="10" fill="#374151">resume un trozo grande de la</text>
  <text x="390" y="318" text-anchor="middle" font-size="10" fill="#374151">imagen original. Es compresión.</text>

  <line x1="196" y1="269" x2="284" y2="285" stroke="#d1d5db" stroke-width="1"/>

  <!-- decoder side -->
  <text x="630" y="82" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e3a8a">DECODER — re-expande</text>
  <text x="630" y="98" text-anchor="middle" font-size="10" fill="#6b7280">Conv2DTranspose con strides=2</text>

  <rect x="540" y="112" width="180" height="34" rx="5" fill="#2563eb"/>
  <text x="630" y="128" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">200 × 200 × 3</text>
  <text x="630" y="140" text-anchor="middle" font-size="8.5" fill="#93c5fd">softmax por píxel</text>

  <line x1="630" y1="160" x2="630" y2="148" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ed-ar2)"/>
  <rect x="556" y="162" width="148" height="30" rx="5" fill="#60a5fa"/>
  <text x="630" y="182" text-anchor="middle" font-size="10.5" font-weight="600" fill="#ffffff">100 × 100 × 64</text>

  <line x1="630" y1="206" x2="630" y2="194" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ed-ar2)"/>
  <rect x="572" y="208" width="116" height="30" rx="5" fill="#93c5fd"/>
  <text x="630" y="228" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1e3a8a">50 × 50 × 128</text>

  <line x1="630" y1="252" x2="630" y2="240" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ed-ar2)"/>
  <rect x="586" y="254" width="88" height="30" rx="5" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="630" y="274" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e3a8a">25 × 25 × 256</text>

  <line x1="584" y1="269" x2="496" y2="285" stroke="#d1d5db" stroke-width="1"/>

  <!-- the symmetry note -->
  <rect x="252" y="112" width="276" height="126" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="390" y="134" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e3a8a">Conv2DTranspose</text>
  <text x="390" y="153" text-anchor="middle" font-size="10.5" fill="#374151">"una capa de convolución que</text>
  <text x="390" y="168" text-anchor="middle" font-size="10.5" font-weight="700" fill="#374151">aprende a hacer upsampling"</text>

  <rect x="268" y="180" width="244" height="48" rx="5" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="390" y="197" text-anchor="middle" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" fill="#6b7280">(100,100,64) →Conv2D(128,3,strides=2)→</text>
  <text x="390" y="209" text-anchor="middle" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" fill="#2563eb">(50,50,128)</text>
  <text x="390" y="222" text-anchor="middle" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" fill="#6b7280">→Conv2DTranspose(64,3,strides=2)→ vuelve</text>

  <!-- footer -->
  <rect x="20" y="342" width="740" height="0" rx="6"/>
  <text x="390" y="356" text-anchor="middle" font-size="11" fill="#374151">Se usa <tspan font-family="'JetBrains Mono', ui-monospace, monospace">padding="same"</tspan> en todas partes para que el relleno de borde no altere el tamaño de los mapas</text>
</svg>
