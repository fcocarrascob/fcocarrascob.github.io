<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Segoe UI', system-ui, Arial, sans-serif">
  <rect width="760" height="360" fill="#ffffff"/>

  <text x="380" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Los dos pisos del deep learning moderno</text>

  <!-- Keras layer -->
  <rect x="110" y="58" width="540" height="76" rx="8" fill="#2563eb"/>
  <text x="380" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Keras</text>
  <text x="380" y="107" text-anchor="middle" font-size="12" fill="#dbeafe">capas · modelos · pérdidas · optimizadores</text>
  <text x="380" y="124" text-anchor="middle" font-size="12" fill="#dbeafe">métricas · bucle de entrenamiento</text>
  <text x="668" y="92" font-size="11.5" font-weight="600" fill="#2563eb">alto</text>
  <text x="668" y="108" font-size="11.5" font-weight="600" fill="#2563eb">nivel</text>

  <!-- arrow down -->
  <line x1="380" y1="134" x2="380" y2="158" stroke="#9ca3af" stroke-width="1.5"/>
  <polygon points="376,156 384,156 380,164" fill="#9ca3af"/>

  <!-- Backend layer -->
  <rect x="110" y="164" width="540" height="92" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="380" y="188" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Backend — infraestructura tensorial</text>
  <rect x="140" y="200" width="150" height="40" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="215" y="225" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">TensorFlow</text>
  <rect x="305" y="200" width="150" height="40" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="380" y="225" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">PyTorch</text>
  <rect x="470" y="200" width="150" height="40" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="545" y="225" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">JAX</text>
  <text x="668" y="208" font-size="11.5" font-weight="600" fill="#60a5fa">bajo</text>
  <text x="668" y="224" font-size="11.5" font-weight="600" fill="#60a5fa">nivel</text>

  <!-- arrow down -->
  <line x1="380" y1="256" x2="380" y2="280" stroke="#9ca3af" stroke-width="1.5"/>
  <polygon points="376,278 384,278 380,286" fill="#9ca3af"/>

  <!-- Hardware -->
  <rect x="110" y="286" width="540" height="40" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="380" y="312" text-anchor="middle" font-size="12.5" font-weight="600" fill="#374151">Hardware — CPU · GPU · TPU</text>

  <!-- side annotations -->
  <text x="98" y="90" text-anchor="end" font-size="11" fill="#6b7280">el kit</text>
  <text x="98" y="106" text-anchor="end" font-size="11" fill="#6b7280">prefabricado</text>
  <text x="98" y="212" text-anchor="end" font-size="11" fill="#6b7280">los</text>
  <text x="98" y="228" text-anchor="end" font-size="11" fill="#6b7280">materiales</text>

  <text x="380" y="349" text-anchor="middle" font-size="11.5" fill="#6b7280">El backend es <tspan font-weight="700" fill="#2563eb">enchufable</tspan>: se puede cambiar después de escribir el código</text>
</svg>
