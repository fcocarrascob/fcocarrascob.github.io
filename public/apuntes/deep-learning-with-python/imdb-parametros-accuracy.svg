<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Segoe UI', system-ui, Arial, sans-serif">
  <rect width="800" height="420" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">30 001 parámetros que ignoran el orden le ganan a 2 000 000 que no lo ignoran</text>
  <text x="400" y="48" text-anchor="middle" font-size="11.5" fill="#6b7280">Clasificación de sentimiento sobre IMDb — 20 000 reviews de entrenamiento. Accuracy de test</text>

  <!-- header -->
  <text x="40" y="84" font-size="10.5" font-weight="700" fill="#6b7280">MODELO</text>
  <text x="360" y="84" text-anchor="end" font-size="10.5" font-weight="700" fill="#6b7280">PARÁMETROS</text>
  <text x="400" y="84" font-size="10.5" font-weight="700" fill="#6b7280">ACCURACY DE TEST</text>
  <line x1="30" y1="92" x2="770" y2="92" stroke="#e5e7eb"/>

  <!-- scale: 84% -> x=400, 91% -> x=740  => 48.57 px per pct -->

  <!-- row 1: bag of words -->
  <text x="40" y="122" font-size="11.5" font-weight="700" fill="#166534">Bag-of-words (unigramas)</text>
  <text x="40" y="138" font-size="10" fill="#6b7280">una sola capa Dense sobre multi-hot</text>
  <text x="360" y="126" text-anchor="end" font-size="11.5" font-weight="700" fill="#374151">20 001</text>
  <rect x="400" y="112" width="214" height="22" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="622" y="128" font-size="11.5" font-weight="700" fill="#166534">88,4 %</text>

  <!-- row 2: bigrams -->
  <text x="40" y="174" font-size="11.5" font-weight="700" fill="#166534">Bigramas</text>
  <text x="40" y="190" font-size="10" fill="#6b7280">lo mismo, pero el vocabulario admite pares</text>
  <text x="360" y="178" text-anchor="end" font-size="11.5" font-weight="700" fill="#374151">30 001</text>
  <rect x="400" y="164" width="297" height="22" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
  <text x="705" y="180" font-size="11.5" font-weight="700" fill="#166534">90,1 %  ← el mejor</text>

  <!-- row 3: lstm one-hot -->
  <text x="40" y="226" font-size="11.5" fill="#374151">LSTM bidireccional + one-hot</text>
  <text x="40" y="242" font-size="10" fill="#b91c1c">18 000 000 de floats por review</text>
  <text x="360" y="230" text-anchor="end" font-size="11.5" font-weight="700" fill="#b91c1c">15 393 409</text>
  <rect x="400" y="216" width="39" height="22" fill="#fecaca" stroke="#dc2626"/>
  <text x="447" y="232" font-size="11.5" font-weight="700" fill="#b91c1c">84,8 %</text>

  <!-- row 4: lstm embedding -->
  <text x="40" y="278" font-size="11.5" fill="#374151">LSTM bidireccional + Embedding aprendido</text>
  <text x="40" y="294" font-size="10" fill="#6b7280">10× más chico… y la misma accuracy</text>
  <text x="360" y="282" text-anchor="end" font-size="11.5" font-weight="700" fill="#374151">1 986 177</text>
  <rect x="400" y="268" width="19" height="22" fill="#fee2e2" stroke="#f87171"/>
  <text x="427" y="284" font-size="11.5" font-weight="700" fill="#b91c1c">84,4 %</text>

  <!-- row 5: lstm pretrained -->
  <text x="40" y="330" font-size="11.5" font-weight="700" fill="#1e3a8a">LSTM bidireccional + Embedding preentrenado (CBOW)</text>
  <text x="40" y="346" font-size="10" fill="#6b7280">los mismos pesos, otra inicialización</text>
  <text x="360" y="334" text-anchor="end" font-size="11.5" font-weight="700" fill="#374151">1 986 177</text>
  <rect x="400" y="320" width="248" height="22" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="656" y="336" font-size="11.5" font-weight="700" fill="#1e3a8a">89,1 %</text>

  <line x1="30" y1="360" x2="770" y2="360" stroke="#e5e7eb"/>

  <!-- conclusion -->
  <rect x="30" y="372" width="740" height="40" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="400" y="390" text-anchor="middle" font-size="11" fill="#374151">No es que el orden no sirva: es que <tspan font-weight="700">no hay datos suficientes para aprenderlo</tspan>. El LSTM llega a 99 % en entrenamiento antes de</text>
  <text x="400" y="406" text-anchor="middle" font-size="11" fill="#374151">haber aprendido buenos embeddings. Preentrenar sobre texto sin etiquetar recupera casi cinco puntos <tspan font-weight="700">sin tocar la arquitectura</tspan>.</text>
</svg>
