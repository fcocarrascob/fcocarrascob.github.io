  <text x="621" y="52" text-anchor="middle" font-size="12.5" fill="#6b7280">3) Pesos causales · filas suman 1</text>
  <rect x="530" y="64" width="182" height="124" rx="4" fill="#dbeafe" stroke="#60a5fa"/>
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9" text-anchor="end">
    <g fill="#1e3a8a">
      <text x="561" y="80">1.00</text>
      <text x="561" y="98">0.55</text><text x="590" y="98">0.45</text>
