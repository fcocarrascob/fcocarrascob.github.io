    <text x="71" y="134">0.26</text><text x="100" y="134">0.10</text><text x="128" y="134">0.10</text><text x="157" y="134">0.02</text><text x="185" y="134">0.10</text><text x="214" y="134">0.01</text>
    <text x="71" y="152">0.22</text><text x="100" y="152">0.09</text><text x="128" y="152">0.09</text><text x="157" y="152">0.02</text><text x="185" y="152">0.08</text><text x="214" y="152">0.02</text>
    <text x="71" y="170">0.34</text><text x="100" y="170">0.13</text><text x="128" y="170">0.13</text><text x="157" y="170">0.02</text><text x="185" y="170">0.13</text><text x="214" y="170">0.01</text>
  </g>
  <text x="131" y="206" text-anchor="middle" font-size="9.5" fill="#9ca3af">ω₀₁ = 0.07 ≠ ω₁₀ = 0.47 · no es simétrica</text>

  <!-- flecha 1 -> 2 -->
  <path d="M228,120 L279,120" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#cm-ar)"/>
  <text x="253" y="108" text-anchor="middle" font-size="10.5" fill="#2563eb">mask −∞</text>

