      <text x="618" y="98">0</text><text x="647" y="98">0</text><text x="675" y="98">0</text><text x="704" y="98">0</text>
      <text x="647" y="116">0</text><text x="675" y="116">0</text><text x="704" y="116">0</text>
      <text x="675" y="134">0</text><text x="704" y="134">0</text>
      <text x="704" y="152">0</text>
    </g>
  </g>
  <text x="621" y="206" text-anchor="middle" font-size="9.5" fill="#9ca3af">la fila 0 vale 1.00: solo se atiende a sí misma</text>

  <!-- caption -->
  <line x1="40" y1="234" x2="740" y2="234" stroke="#e5e7eb" stroke-width="1"/>
  <text x="390" y="264" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="600">El truco eficiente de la causal attention.</text>
  <text x="390" y="288" text-anchor="middle" font-size="12.5" fill="#6b7280">Poner −∞ en los scores por encima de la diagonal <tspan font-weight="600">antes</tspan> de la softmax enmascara y renormaliza</text>
  <text x="390" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">en un solo paso: como e^(−∞) → 0, cada token solo atiende a sí mismo y a los previos.</text>
  <text x="390" y="334" text-anchor="middle" font-size="11.5" fill="#9ca3af" font-family="'JetBrains Mono', ui-monospace, monospace">masked = attn_scores.masked_fill(mask.bool(), -torch.inf)</text>
</svg>
