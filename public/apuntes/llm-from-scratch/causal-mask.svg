      <text x="316" y="170">0.34</text><text x="345" y="170">0.13</text><text x="373" y="170">0.13</text><text x="402" y="170">0.02</text><text x="430" y="170">0.13</text><text x="459" y="170">0.01</text>
    </g>
    <g fill="#dc2626">
      <text x="345" y="80">−∞</text><text x="373" y="80">−∞</text><text x="402" y="80">−∞</text><text x="430" y="80">−∞</text><text x="459" y="80">−∞</text>
      <text x="373" y="98">−∞</text><text x="402" y="98">−∞</text><text x="430" y="98">−∞</text><text x="459" y="98">−∞</text>
      <text x="402" y="116">−∞</text><text x="430" y="116">−∞</text><text x="459" y="116">−∞</text>
      <text x="430" y="134">−∞</text><text x="459" y="134">−∞</text>
