  <!-- flecha 2 -> 3 -->
  <path d="M473,120 L524,120" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#cm-ar)"/>
  <text x="498" y="108" text-anchor="middle" font-size="10.5" fill="#2563eb">softmax</text>
  <text x="498" y="136" text-anchor="middle" font-size="9.5" fill="#9ca3af">(÷ √dₖ)</text>

