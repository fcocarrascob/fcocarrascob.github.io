<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" font-family="'Segoe UI', system-ui, Arial, sans-serif">
  <defs>
    <marker id="ar-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="820" height="450" fill="#ffffff"/>

  <text x="40" y="36" font-size="13" fill="#6b7280">Una fila completa, con los números del libro — query = <tspan font-family="'JetBrains Mono', ui-monospace, monospace" fill="#1e3a8a" font-weight="600">journey</tspan> (x⁽²⁾)</text>

  <!-- cabeceras -->
  <g font-size="11" fill="#6b7280">
    <text x="40" y="72">token x⁽ʲ⁾</text>
    <text x="228" y="72" text-anchor="end">① ω₂ⱼ = x⁽²⁾·x⁽ʲ⁾</text>
    <text x="345" y="72" text-anchor="end">② e^ω₂ⱼ</text>
    <text x="470" y="72" text-anchor="end">③ α₂ⱼ = e^ω / Σ</text>
  </g>
  <line x1="35" y1="80" x2="625" y2="80" stroke="#d1d5db" stroke-width="1"/>

  <!-- filas -->
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11.5">
    <!-- Your -->
    <text x="40" y="106" fill="#374151">Your</text>
    <text x="228" y="106" text-anchor="end" fill="#374151">0.9544</text>
    <text x="345" y="106" text-anchor="end" fill="#374151">2.5971</text>
    <text x="470" y="106" text-anchor="end" fill="#374151">0.1385</text>
    <rect x="486" y="96" width="76" height="13" rx="2" fill="#93c5fd"/>

    <!-- journey -->
    <rect x="35" y="118" width="590" height="24" fill="#dbeafe"/>
    <text x="40" y="134" fill="#1e3a8a" font-weight="600">journey</text>
    <text x="228" y="134" text-anchor="end" fill="#1e3a8a" font-weight="600">1.4950</text>
    <text x="345" y="134" text-anchor="end" fill="#1e3a8a" font-weight="600">4.4593</text>
    <text x="470" y="134" text-anchor="end" fill="#1e3a8a" font-weight="600">0.2379</text>
    <rect x="486" y="124" width="131" height="13" rx="2" fill="#2563eb"/>

    <!-- starts -->
    <text x="40" y="162" fill="#374151">starts</text>
    <text x="228" y="162" text-anchor="end" fill="#374151">1.4754</text>
    <text x="345" y="162" text-anchor="end" fill="#374151">4.3728</text>
    <text x="470" y="162" text-anchor="end" fill="#374151">0.2333</text>
    <rect x="486" y="152" width="128" height="13" rx="2" fill="#3b82f6"/>

    <!-- with -->
    <text x="40" y="190" fill="#374151">with</text>
    <text x="228" y="190" text-anchor="end" fill="#374151">0.8434</text>
    <text x="345" y="190" text-anchor="end" fill="#374151">2.3243</text>
    <text x="470" y="190" text-anchor="end" fill="#374151">0.1240</text>
    <rect x="486" y="180" width="68" height="13" rx="2" fill="#93c5fd"/>

    <!-- one -->
    <text x="40" y="218" fill="#374151">one</text>
    <text x="228" y="218" text-anchor="end" fill="#374151">0.7070</text>
    <text x="345" y="218" text-anchor="end" fill="#374151">2.0279</text>
    <text x="470" y="218" text-anchor="end" fill="#374151">0.1082</text>
    <rect x="486" y="208" width="60" height="13" rx="2" fill="#bfdbfe"/>

    <!-- step -->
    <text x="40" y="246" fill="#374151">step</text>
    <text x="228" y="246" text-anchor="end" fill="#374151">1.0865</text>
    <text x="345" y="246" text-anchor="end" fill="#374151">2.9639</text>
    <text x="470" y="246" text-anchor="end" fill="#374151">0.1581</text>
    <rect x="486" y="236" width="87" height="13" rx="2" fill="#93c5fd"/>
  </g>

  <!-- totales -->
  <line x1="255" y1="258" x2="470" y2="258" stroke="#d1d5db" stroke-width="1"/>
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11">
    <text x="345" y="276" text-anchor="end" fill="#6b7280">Σ = 18.7453</text>
    <text x="470" y="276" text-anchor="end" fill="#6b7280">Σ = 1.0000</text>
  </g>

  <!-- flecha al context vector -->
  <path d="M636,175 L676,175" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#ar-a)"/>
  <text x="656" y="164" text-anchor="middle" font-size="10.5" fill="#2563eb">④</text>

  <!-- bloque context vector -->
  <rect x="686" y="118" width="104" height="114" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="738" y="140" text-anchor="middle" font-size="12" fill="#1e3a8a" font-weight="600">z⁽²⁾</text>
  <text x="738" y="157" text-anchor="middle" font-size="9.5" fill="#6b7280">Σⱼ α₂ⱼ · x⁽ʲ⁾</text>
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11.5" fill="#1e3a8a" text-anchor="middle">
    <text x="738" y="181">0.4419</text>
    <text x="738" y="199">0.6515</text>
    <text x="738" y="217">0.5683</text>
  </g>

  <!-- desglose de la primera coordenada -->
  <text x="40" y="308" font-size="11.5" fill="#6b7280">Desglosando la primera coordenada de z⁽²⁾ (④ es una suma ponderada, nada más):</text>
  <text x="40" y="331" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#374151">0.1385·0.43 + 0.2379·0.55 + 0.2333·0.57 + 0.1240·0.22 + 0.1082·0.77 + 0.1581·0.05 = 0.4419</text>

  <!-- caption -->
  <line x1="40" y1="358" x2="780" y2="358" stroke="#e5e7eb" stroke-width="1"/>
  <text x="410" y="388" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="600">Self-attention simplificada: scores → exponenciales → pesos → suma ponderada.</text>
  <text x="410" y="411" text-anchor="middle" font-size="12.5" fill="#6b7280">La softmax no es más que ② dividido por su propia suma. Los pesos resultantes suman 1, y con ellos</text>
  <text x="410" y="429" text-anchor="middle" font-size="12.5" fill="#6b7280">se promedian los seis vectores de entrada: <tspan font-family="'JetBrains Mono', ui-monospace, monospace">journey</tspan> y <tspan font-family="'JetBrains Mono', ui-monospace, monospace">starts</tspan> aportan casi la mitad de z⁽²⁾ entre los dos.</text>
</svg>
