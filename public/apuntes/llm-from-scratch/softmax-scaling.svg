<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" font-family="'Segoe UI', system-ui, Arial, sans-serif">
  <rect width="780" height="460" fill="#ffffff"/>

  <text x="390" y="34" text-anchor="middle" font-size="13" fill="#6b7280">La misma fila de seis scores, con y sin dividir por √dₖ  (dₖ = 64, √dₖ = 8)</text>

  <!-- ================= PANEL IZQUIERDO ================= -->
  <text x="205" y="64" text-anchor="middle" font-size="13" fill="#b91c1c" font-weight="600">Sin escalar</text>
  <text x="205" y="82" text-anchor="middle" font-size="10.5" fill="#9ca3af" font-family="'JetBrains Mono', ui-monospace, monospace">[8.0, 4.8, 1.6, −2.4, −6.4, −9.6]</text>

  <line x1="70" y1="100" x2="70" y2="262" stroke="#d1d5db" stroke-width="1"/>
  <line x1="70" y1="262" x2="340" y2="262" stroke="#d1d5db" stroke-width="1"/>

  <g fill="#fca5a5">
    <rect x="82"  y="118" width="30" height="144" rx="2" fill="#dc2626"/>
    <rect x="124" y="256" width="30" height="6"   rx="2"/>
    <rect x="166" y="262" width="30" height="0.4" rx="0"/>
    <rect x="208" y="262" width="30" height="0.4" rx="0"/>
    <rect x="250" y="262" width="30" height="0.4" rx="0"/>
    <rect x="292" y="262" width="30" height="0.4" rx="0"/>
  </g>
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" text-anchor="middle">
    <text x="97"  y="110" fill="#b91c1c" font-weight="600">0.959</text>
    <text x="139" y="248" fill="#6b7280">0.039</text>
    <text x="181" y="254" fill="#9ca3af">0.002</text>
    <text x="223" y="254" fill="#9ca3af">0.000</text>
    <text x="265" y="254" fill="#9ca3af">0.000</text>
    <text x="307" y="254" fill="#9ca3af">0.000</text>
  </g>
  <text x="205" y="282" text-anchor="middle" font-size="11" fill="#6b7280">la softmax colapsa a un solo token</text>

  <!-- ================= PANEL DERECHO ================= -->
  <text x="575" y="64" text-anchor="middle" font-size="13" fill="#166534" font-weight="600">Escalada (÷ 8)</text>
  <text x="575" y="82" text-anchor="middle" font-size="10.5" fill="#9ca3af" font-family="'JetBrains Mono', ui-monospace, monospace">[1.0, 0.6, 0.2, −0.3, −0.8, −1.2]</text>

  <line x1="440" y1="100" x2="440" y2="262" stroke="#d1d5db" stroke-width="1"/>
  <line x1="440" y1="262" x2="710" y2="262" stroke="#d1d5db" stroke-width="1"/>

  <g fill="#4ade80">
    <rect x="452" y="206" width="30" height="56" rx="2" fill="#16a34a"/>
    <rect x="494" y="224" width="30" height="38" rx="2" fill="#22c55e"/>
    <rect x="536" y="237" width="30" height="25" rx="2"/>
    <rect x="578" y="247" width="30" height="15" rx="2"/>
    <rect x="620" y="253" width="30" height="9"  rx="2"/>
    <rect x="662" y="256" width="30" height="6"  rx="2"/>
  </g>
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" text-anchor="middle" fill="#166534">
    <text x="467" y="198">0.375</text>
    <text x="509" y="216">0.251</text>
    <text x="551" y="229">0.168</text>
    <text x="593" y="239">0.102</text>
    <text x="635" y="245">0.062</text>
    <text x="677" y="248">0.042</text>
  </g>
  <text x="575" y="282" text-anchor="middle" font-size="11" fill="#6b7280">la distribución sigue siendo «blanda»</text>

  <!-- gradiente -->
  <rect x="70" y="298" width="640" height="56" rx="5" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="390" y="320" text-anchor="middle" font-size="11.5" fill="#374151">Mayor entrada del jacobiano de la softmax  ∂α/∂ω  —  el gradiente que llega a los pesos:</text>
  <text x="286" y="342" font-size="12.5" fill="#b91c1c" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="600">0.039</text>
  <text x="348" y="342" font-size="11.5" fill="#9ca3af">frente a</text>
  <text x="412" y="342" font-size="12.5" fill="#166534" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="600">0.234</text>
  <text x="472" y="342" font-size="11.5" fill="#9ca3af">— seis veces más</text>

  <!-- caption -->
  <line x1="40" y1="376" x2="740" y2="376" stroke="#e5e7eb" stroke-width="1"/>
  <text x="390" y="402" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="600">Por qué el «scaled» del scaled dot-product attention no es cosmético.</text>
  <text x="390" y="424" text-anchor="middle" font-size="12.5" fill="#6b7280">Los productos punto de dₖ términos tienen desviación estándar ∝ √dₖ. Sin dividir, la softmax se satura</text>
  <text x="390" y="442" text-anchor="middle" font-size="12.5" fill="#6b7280">hacia una función escalón y sus gradientes se apagan: el modelo deja de aprender a repartir atención.</text>
</svg>
