  <text x="237.9" y="464.0" font-size="11" text-anchor="end" fill="#8a857c">H = 40 m</text>
  <line x1="268.5" y1="460.0" x2="446.0" y2="460.0" stroke="#a8641b" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="446.0" cy="460.0" r="4.5" fill="#a8641b"/>
  <text x="268.5" y="451.0" font-size="10.5" fill="#a8641b">media altura, H/2 = 20 m — acá termina el L_h</text>
  <line x1="446.0" y1="560.0" x2="620.0" y2="560.0" stroke="#8a857c" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <text x="533.0" y="554.0" font-size="10.5" text-anchor="middle" fill="#8a857c">L_h = 120 m</text>
  <line x1="446.0" y1="460.0" x2="446.0" y2="564.0" stroke="#8a857c" stroke-width="0.8" stroke-dasharray="4 4"/>
  <line x1="620.0" y1="400.0" x2="620.0" y2="564.0" stroke="#8a857c" stroke-width="0.8" stroke-dasharray="4 4"/>
  <line x1="651.4" y1="400.0" x2="651.4" y2="376.0" stroke="#8a857c" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <text x="657.4" y="392.0" font-size="10.5" fill="#8a857c">z = 8,0 m</text>
  <line x1="268.5" y1="388.0" x2="322.5" y2="388.0" stroke="#2d6b9c" stroke-width="3"/>
  <polygon points="334.5,388.0 320.5,382.5 320.5,393.5" fill="#2d6b9c"/>
  <text x="342.5" y="392.0" font-size="11.5" fill="#2d6b9c" font-weight="bold">viento</text>
  <text x="60" y="104" font-size="12.5" fill="#222" font-weight="bold">Ec. (1) de §5.6.2 — K_zt = (1 + K₁·K₂·K₃)²</text>
  <text x="60" y="130" font-size="11.5" fill="#222" font-weight="bold">H/L_h</text>
  <text x="112" y="130" font-size="11" fill="#666">40/120</text>
  <text x="272" y="130" font-size="11.5" fill="#1b4a6e" font-weight="bold">0,3333</text>
  <text x="336" y="130" font-size="10.5" fill="#666">≥ 0,20 ✓ (§5.6.1, condición 2)</text>
  <text x="60" y="156" font-size="11.5" fill="#222" font-weight="bold">K₁</text>
  <text x="112" y="156" font-size="11" fill="#666">1,45 × 0,3333</text>
  <text x="272" y="156" font-size="11.5" fill="#1b4a6e" font-weight="bold">0,4833</text>
  <text x="336" y="156" font-size="10.5" fill="#666">cima 2D, exposición C</text>
  <text x="60" y="182" font-size="11.5" fill="#222" font-weight="bold">K₂</text>
  <text x="112" y="182" font-size="11" fill="#666">1 − 0/(1,5 × 120)</text>
  <text x="272" y="182" font-size="11.5" fill="#1b4a6e" font-weight="bold">1,0000</text>
  <text x="336" y="182" font-size="10.5" fill="#666">el galpón está en la cresta</text>
  <text x="60" y="208" font-size="11.5" fill="#222" font-weight="bold">K₃</text>
  <text x="112" y="208" font-size="11" fill="#666">e^(−3 × 8,0/120)</text>
  <text x="272" y="208" font-size="11.5" fill="#1b4a6e" font-weight="bold">0,8187</text>
  <text x="336" y="208" font-size="10.5" fill="#666">γ = 3 para cima 2D</text>
  <line x1="60" y1="246" x2="700" y2="246" stroke="#d1d5db" stroke-width="1"/>
  <text x="60" y="268" font-size="13" fill="#a8641b" font-weight="bold">K_zt = (1 + 0,4833 × 1,0000 × 0,8187)² = 1,395720² = 1,9480</text>
  <text x="60" y="292" font-size="11" fill="#666">Multiplica la presión por 1,948, o sea le agrega un 94,8 %. Y no sale de ninguna tabla: hay que medir el cerro en el plano</text>
  <text x="60" y="308" font-size="11" fill="#666">topográfico y clasificarlo. Ahí se juega el resultado, no en la aritmética de arriba.</text>
  <text x="60" y="578" font-size="10.5" fill="#666">Corte con la vertical exagerada 2,1 veces: con la misma escala en los dos ejes, un galpón de 8 m sobre un cerro de 40 m no se vería. El perfil de coseno es ilustrativo;</text>
  <text x="60" y="594" font-size="10.5" fill="#666">lo que la norma usa son H, L_h y x. Definiciones y parámetros: Figura 3 de NCh 432:2025 (págs. 21-22), que no estaba transcrita al material de referencia.</text>
</svg>
