<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="610" fill="#ffffff"/>
  <text x="500" y="30" font-size="15.5" text-anchor="middle" fill="#222" font-weight="bold">La loma del proyecto, y de dónde sale cada letra de la Ec. (1)</text>
  <text x="500" y="50" font-size="12" text-anchor="middle" fill="#666">L_h se mide hasta donde el terreno está a media altura, no hasta el pie del cerro — y ahí empieza la mitad de los errores</text>
