  <line x1="237.2" y1="520.0" x2="898.4" y2="520.0" stroke="#8a857c" stroke-width="1" stroke-dasharray="6 5"/>
  <text x="237.2" y="536.0" font-size="10.5" fill="#666">terreno general</text>
  <rect x="602.6" y="376.0" width="34.8" height="24.0" fill="#1b4a6e" fill-opacity="0.25" stroke="#1b4a6e" stroke-width="1.6"/>
  <polyline points="602.6,376.0 620.0,369.7 637.4,376.0" fill="#1b4a6e" fill-opacity="0.25" stroke="#1b4a6e" stroke-width="1.6"/>
  <text x="620.0" y="359.7" font-size="11" text-anchor="middle" fill="#1b4a6e" font-weight="bold">el galpón, en la cresta (x = 0)</text>
  <line x1="245.9" y1="520.0" x2="245.9" y2="400.0" stroke="#8a857c" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/>
