<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="580" fill="#ffffff"/>
  <text x="500" y="30" font-size="15.5" text-anchor="middle" fill="#222" font-weight="bold">La presión de velocidad del galpón: lo que la altitud descuenta y lo que la loma devuelve</text>
  <text x="500" y="50" font-size="12" text-anchor="middle" fill="#666">Ec. (2) de §5.8.2 · V = 30 m/s (zona I-B) · I = 1,00 (categoría II) · exposición C · z_e = 3 800 m · el K_d de §5.4 NO va acá</text>
  <defs>
    <marker id="dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a857c"/>
    </marker>
  </defs>
  <line x1="120.0" y1="380.0" x2="820.0" y2="380.0" stroke="#d1d5db" stroke-width="1"/>
  <text x="112.0" y="384.0" font-size="11" text-anchor="end" fill="#666">0</text>
  <line x1="120.0" y1="331.3" x2="820.0" y2="331.3" stroke="#d1d5db" stroke-width="1"/>
  <text x="112.0" y="335.3" font-size="11" text-anchor="end" fill="#666">200</text>
  <line x1="120.0" y1="282.5" x2="820.0" y2="282.5" stroke="#d1d5db" stroke-width="1"/>
  <text x="112.0" y="286.5" font-size="11" text-anchor="end" fill="#666">400</text>
  <line x1="120.0" y1="233.8" x2="820.0" y2="233.8" stroke="#d1d5db" stroke-width="1"/>
  <text x="112.0" y="237.8" font-size="11" text-anchor="end" fill="#666">600</text>
  <line x1="120.0" y1="185.1" x2="820.0" y2="185.1" stroke="#d1d5db" stroke-width="1"/>
  <text x="112.0" y="189.1" font-size="11" text-anchor="end" fill="#666">800</text>
  <line x1="120.0" y1="136.4" x2="820.0" y2="136.4" stroke="#d1d5db" stroke-width="1"/>
  <text x="112.0" y="140.4" font-size="11" text-anchor="end" fill="#666">1 000</text>
  <line x1="120.0" y1="380.0" x2="820.0" y2="380.0" stroke="#333" stroke-width="1.5"/>
  <text x="112.0" y="102.0" font-size="11.5" fill="#333">q [N/m²]</text>
  <rect x="167.3" y="245.6" width="80.5" height="134.4" fill="#1b4a6e" fill-opacity="0.16" stroke="#1b4a6e" stroke-width="1.4"/>
  <line x1="167.3" y1="245.6" x2="295.0" y2="245.6" stroke="#333" stroke-width="2"/>
  <text x="167.3" y="236.6" font-size="12" text-anchor="start" fill="#222" font-weight="bold">551,7</text>
  <text x="207.5" y="402.0" font-size="11.5" text-anchor="middle" fill="#1b4a6e" font-weight="bold">p₀ — referencia</text>
  <text x="207.5" y="418.0" font-size="10" text-anchor="middle" fill="#666">Tabla 1 · K_z = K_zt = K_e = 1</text>
  <rect x="342.3" y="245.6" width="80.5" height="6.7" fill="#2d6b9c" fill-opacity="0.30" stroke="#2d6b9c" stroke-width="1.4"/>
  <line x1="295.0" y1="245.6" x2="342.3" y2="245.6" stroke="#666" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="430.8" y="252.9" font-size="11.5" fill="#2d6b9c" font-weight="bold">-5,0 %</text>
  <line x1="342.3" y1="252.3" x2="470.0" y2="252.3" stroke="#333" stroke-width="2"/>
  <text x="342.3" y="243.3" font-size="12" text-anchor="start" fill="#222" font-weight="bold">524,1</text>
  <text x="382.5" y="402.0" font-size="11.5" text-anchor="middle" fill="#2d6b9c" font-weight="bold">× K_z = 0,95</text>
  <text x="382.5" y="418.0" font-size="10" text-anchor="middle" fill="#666">Tabla 5 · exposición C, z = 8,0 m</text>
  <rect x="517.3" y="252.3" width="80.5" height="46.5" fill="#2d6b9c" fill-opacity="0.30" stroke="#2d6b9c" stroke-width="1.4"/>
  <line x1="470.0" y1="252.3" x2="517.3" y2="252.3" stroke="#666" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="605.8" y="279.5" font-size="11.5" fill="#2d6b9c" font-weight="bold">-36,4 %</text>
  <line x1="517.3" y1="298.8" x2="645.0" y2="298.8" stroke="#333" stroke-width="2"/>
  <text x="517.3" y="289.8" font-size="12" text-anchor="start" fill="#222" font-weight="bold">333,5</text>
  <text x="557.5" y="402.0" font-size="11.5" text-anchor="middle" fill="#2d6b9c" font-weight="bold">× K_e = 0,6362</text>
  <text x="557.5" y="418.0" font-size="10" text-anchor="middle" fill="#666">Tabla 4, Nota 2 · la altitud</text>
  <rect x="692.3" y="221.7" width="80.5" height="77.0" fill="#a8641b" fill-opacity="0.30" stroke="#a8641b" stroke-width="1.4"/>
  <line x1="645.0" y1="298.8" x2="692.3" y2="298.8" stroke="#666" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="780.8" y="264.2" font-size="11.5" fill="#a8641b" font-weight="bold">+94,8 %</text>
  <line x1="692.3" y1="221.7" x2="772.8" y2="221.7" stroke="#333" stroke-width="2"/>
  <text x="692.3" y="212.7" font-size="12" text-anchor="start" fill="#222" font-weight="bold">649,6</text>
  <text x="732.5" y="402.0" font-size="11.5" text-anchor="middle" fill="#a8641b" font-weight="bold">× K_zt = 1,948</text>
  <text x="732.5" y="418.0" font-size="10" text-anchor="middle" fill="#666">Ec. (1) · cima 2D, en la cresta</text>
  <line x1="295.0" y1="252.3" x2="846.0" y2="252.3" stroke="#2d6b9c" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="820.0" y1="221.7" x2="846.0" y2="221.7" stroke="#a8641b" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="852.0" y="256.3" font-size="10.5" fill="#2d6b9c">plano</text>
  <text x="852.0" y="225.7" font-size="10.5" fill="#a8641b">q_h</text>
  <text x="120.0" y="470" font-size="12.5" fill="#222" font-weight="bold">El neto del sitio: +23,9 % — y es exactamente K_zt · K_e = 1,2394</text>
  <text x="120.0" y="492" font-size="11" fill="#666">Se mide contra la segunda columna, no contra p₀: el mismo galpón, con su misma exposición C, en terreno plano y a nivel del</text>
  <text x="120.0" y="508" font-size="11" fill="#666">mar. La altitud le descuenta un 36,4 % y la loma le agrega un 94,8 %: no se compensan, y la loma gana por bastante.</text>
  <text x="120.0" y="530" font-size="11" fill="#666">El orden de los factores no cambia nada — el K_e se dibuja antes del K_zt solo porque es el que todo el mundo aplica primero,</text>
  <text x="120.0" y="546" font-size="11" fill="#666">y muchas veces el único que se aplica. Quien se queda en la tercera columna diseña con el 51 % de la presión que corresponde.</text>
  <text x="120" y="566" font-size="10" fill="#666">Los valores son acumulativos sobre p₀ = 0,613·V² = 551,7 N/m², que la Nota 1 de la Tabla 1 tabula redondeado como 552 N/m². Cierre por dos vías: 552 × (0,95 × 1,948 × 0,6362) = 650 N/m².</text>
</svg>
