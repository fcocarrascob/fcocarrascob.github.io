<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ea" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <pattern id="arcilla" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#b02a1a" fill-opacity="0.10"/>
      <line x1="0" y1="9" x2="9" y2="0" stroke="#b02a1a" stroke-width="0.8" opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="940" height="470" fill="#ffffff"/>
  <text x="470" y="28" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">El caso: la zapata del ejemplo de hormigón, ahora con el perfil de suelo completo</text>

  <!-- ======== perfil ======== -->
  <g>
    <!-- estratos (escala: 1 m = 34 px, superficie en y = 66) -->
    <rect x="90" y="66" width="380" height="153" fill="#e8e0cd" stroke="#8a857c" stroke-width="1"/>
    <rect x="90" y="219" width="380" height="51" fill="#d4cbb2" stroke="#8a857c" stroke-width="1"/>
    <rect x="90" y="270" width="380" height="102" fill="url(#arcilla)" stroke="#8a857c" stroke-width="1"/>
    <rect x="90" y="372" width="380" height="22" fill="#9a9a9a" stroke="#8a857c" stroke-width="1"/>

    <!-- napa -->
    <line x1="90" y1="219" x2="470" y2="219" stroke="#1a63a8" stroke-width="1.8"/>
    <path d="M100,215 l5,-6 l5,6 z" fill="#1a63a8"/>

    <!-- zapata -->
    <rect x="243" y="117" width="75" height="17" fill="#dcd8d0" stroke="#8a857c" stroke-width="1.6"/>
    <rect x="270" y="86" width="20" height="31" fill="#dcd8d0" stroke="#8a857c" stroke-width="1.3"/>
    <line x1="280" y1="58" x2="280" y2="82" stroke="#666" stroke-width="2.5" marker-end="url(#ea)"/>
    <text x="292" y="74" font-size="11.5" fill="#666">P = 90 tonf</text>

    <!-- bulbo 2:1 -->
    <path d="M243,134 L142,336 M318,134 L419,336" stroke="#b35c0e" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="425" y="300" font-size="10.5" fill="#b35c0e">2:1</text>

    <!-- cotas -->
    <line x1="112" y1="66" x2="112" y2="117" stroke="#666" stroke-width="1" marker-start="url(#ea)" marker-end="url(#ea)"/>
    <text x="106" y="96" font-size="11" fill="#666" text-anchor="end">1,5</text>
    <line x1="478" y1="66" x2="478" y2="219" stroke="#1a63a8" stroke-width="1" marker-start="url(#ea)" marker-end="url(#ea)"/>
    <text x="484" y="146" font-size="10.5" fill="#1a63a8">4,5 m</text>
    <line x1="478" y1="270" x2="478" y2="372" stroke="#b02a1a" stroke-width="1" marker-start="url(#ea)" marker-end="url(#ea)"/>
    <text x="484" y="325" font-size="10.5" fill="#b02a1a">3,0 m</text>

    <!-- etiquetas de estrato -->
    <text x="100" y="176" font-size="11.5" fill="#555">Arena media · γ = 18 · φ' = 32°</text>
    <text x="100" y="247" font-size="11.5" fill="#555">Arena saturada · γ_sat = 19</text>
    <text x="100" y="312" font-size="12" fill="#b02a1a" font-weight="bold">ARCILLA BLANDA</text>
    <text x="100" y="330" font-size="11" fill="#b02a1a">γ_sat = 17,3 · e₀ = 1,0 · LL = 40</text>
    <text x="100" y="387" font-size="11.5" fill="#444">Roca</text>
    <text x="243" y="112" font-size="11" fill="#222" text-anchor="end">2,20 × 2,20 m</text>
  </g>

  <!-- ======== datos ======== -->
  <line x1="530" y1="52" x2="530" y2="404" stroke="#e5e2dc" stroke-width="1.5"/>
  <text x="560" y="76" font-size="13" fill="#222" font-weight="bold">Datos</text>
  <g font-size="12">
    <text x="560" y="102" fill="#555">Carga muerta (servicio)</text><text x="890" y="102" fill="#222" text-anchor="end" font-weight="bold">D = 60 tonf</text>
    <text x="560" y="124" fill="#555">Carga viva (servicio)</text><text x="890" y="124" fill="#222" text-anchor="end" font-weight="bold">L = 30 tonf</text>
    <text x="560" y="146" fill="#555">Presión de servicio</text><text x="890" y="146" fill="#222" text-anchor="end" font-weight="bold">182 kPa = 1,86 kgf/cm²</text>
    <text x="560" y="168" fill="#555">Presión neta</text><text x="890" y="168" fill="#222" text-anchor="end" font-weight="bold">155 kPa</text>
  </g>
  <line x1="560" y1="184" x2="890" y2="184" stroke="#e5e2dc" stroke-width="1.2"/>

  <text x="560" y="210" font-size="13" fill="#222" font-weight="bold">Lo que hay que decidir</text>
  <text x="560" y="234" font-size="12" fill="#555">El post original tomó q_a = 2,0 kgf/cm² como dato.</text>
  <text x="560" y="252" font-size="12" fill="#555">Acá se calcula desde cero, por los dos criterios.</text>

  <rect x="560" y="272" width="330" height="52" rx="5" fill="#b02a1a" fill-opacity="0.07" stroke="#b02a1a" stroke-width="1.2"/>
  <text x="576" y="294" font-size="12" fill="#b02a1a" font-weight="bold">El detalle que lo cambia todo:</text>
  <text x="576" y="313" font-size="12" fill="#555">hay arcilla blanda 4,5 m bajo el sello.</text>

  <text x="560" y="350" font-size="11.5" fill="#555">La napa queda a d = 3,0 m bajo el sello, mayor que</text>
  <text x="560" y="367" font-size="11.5" fill="#555">B = 2,20 m: <tspan font-weight="bold">Caso III, no afecta la capacidad.</tspan></text>
  <text x="560" y="391" font-size="11.5" fill="#555">Pero sí decide el peso sumergido con que se calcula</text>
  <text x="560" y="408" font-size="11.5" fill="#555">σ'_o en la arcilla, y eso sí entra en el asentamiento.</text>

  <!-- takeaway -->
  <rect x="60" y="424" width="820" height="34" rx="6" fill="#f7f6f3" stroke="#8a857c"/>
  <text x="470" y="446" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">El bulbo de tensiones 2:1 alcanza la arcilla. Un cálculo que solo mire el suelo del sello no la vería.</text>
</svg>
