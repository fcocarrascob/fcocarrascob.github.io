<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 462" font-family="Segoe UI, Arial, sans-serif">
  <rect width="940" height="462" fill="#ffffff"/>
  <text x="470" y="28" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">El cierre obligatorio de todo ejemplo de esta sección: el análisis de sensibilidad</text>
  <text x="470" y="49" font-size="12" text-anchor="middle" fill="#666">Caso base: 81,7 mm de asentamiento total a 50 años. Cada barra es una decisión distinta sobre el mismo caso.</text>

  <!-- eje cero -->
  <line x1="800" y1="76" x2="800" y2="320" stroke="#8a857c" stroke-width="1.6"/>
  <text x="800" y="340" font-size="11" fill="#666" text-anchor="middle">caso base · 81,7 mm</text>

  <!-- guias: escala unica de 6 px por punto porcentual -->
  <g stroke="#e5e2dc" stroke-width="1">
    <line x1="440" y1="76" x2="440" y2="320"/>
    <line x1="530" y1="76" x2="530" y2="320"/>
    <line x1="620" y1="76" x2="620" y2="320"/>
    <line x1="710" y1="76" x2="710" y2="320"/>
  </g>
  <g font-size="10" fill="#aaa" text-anchor="middle">
    <text x="440" y="340">−60 %</text>
    <text x="530" y="340">−45 %</text>
    <text x="620" y="340">−30 %</text>
    <text x="710" y="340">−15 %</text>
  </g>

  <!-- fila 1: omitir la secundaria -->
  <text x="290" y="104" font-size="12.5" fill="#b02a1a" text-anchor="end" font-weight="bold">Omitir la consolidación secundaria</text>
  <rect x="415.4" y="88" width="384.6" height="22" fill="#b02a1a" fill-opacity="0.8"/>
  <text x="432" y="104" font-size="12.5" fill="#ffffff" font-weight="bold">29,3 mm</text>
  <text x="407" y="104" font-size="13" fill="#b02a1a" text-anchor="end" font-weight="bold">−64 %</text>

  <!-- fila 2: Cs/Cc -->
  <text x="290" y="141" font-size="12" fill="#555" text-anchor="end">C_s/C_c = 0,17 en vez de 0,25</text>
  <rect x="689" y="126" width="111" height="20" fill="#b35c0e" fill-opacity="0.75"/>
  <text x="681" y="141" font-size="12" fill="#b35c0e" text-anchor="end" font-weight="bold">−18,5 %</text>

  <!-- fila 3: OCR -->
  <text x="290" y="175" font-size="12" fill="#555" text-anchor="end">La arcilla resulta sobreconsolidada</text>
  <rect x="699.8" y="160" width="100.2" height="20" fill="#b35c0e" fill-opacity="0.75"/>
  <text x="692" y="175" font-size="12" fill="#b35c0e" text-anchor="end" font-weight="bold">−16,7 %</text>

  <!-- fila 4: E_s bajo -->
  <text x="290" y="209" font-size="12" fill="#555" text-anchor="end">E_s de la arena: 15 en vez de 20</text>
  <rect x="800" y="194" width="27" height="20" fill="#1a63a8" fill-opacity="0.7"/>
  <text x="835" y="209" font-size="12" fill="#1a63a8" font-weight="bold">+4,5 %</text>

  <!-- fila 5: E_s alto -->
  <text x="290" y="243" font-size="12" fill="#555" text-anchor="end">E_s de la arena: 30 en vez de 20</text>
  <rect x="773" y="228" width="27" height="20" fill="#1a63a8" fill-opacity="0.7"/>
  <text x="765" y="243" font-size="12" fill="#1a63a8" text-anchor="end" font-weight="bold">−4,5 %</text>

  <!-- fila 6: Boussinesq -->
  <text x="290" y="277" font-size="12" fill="#555" text-anchor="end">Boussinesq en vez del método 2:1</text>
  <rect x="782.6" y="262" width="17.4" height="20" fill="#1a63a8" fill-opacity="0.7"/>
  <text x="775" y="277" font-size="12" fill="#1a63a8" text-anchor="end" font-weight="bold">−2,9 %</text>

  <!-- fila 7: flexible -->
  <text x="290" y="311" font-size="12" fill="#555" text-anchor="end">Suponerla flexible, no rígida</text>
  <rect x="800" y="296" width="6" height="20" fill="#1a63a8" fill-opacity="0.7"/>
  <text x="814" y="311" font-size="12" fill="#1a63a8" font-weight="bold">+1,0 %</text>

  <!-- takeaway -->
  <rect x="60" y="372" width="820" height="78" rx="6" fill="#f7f6f3" stroke="#8a857c"/>
  <text x="470" y="396" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">La decisión más cara del cálculo es una que ni siquiera se toma: simplemente no calcular la fluencia.</text>
  <text x="470" y="418" font-size="12.5" text-anchor="middle" fill="#555">Vale un 64 %. Los tres parámetros de la arcilla juntos valen la mitad de eso, y toda la modelación de la zapata</text>
  <text x="470" y="436" font-size="12.5" text-anchor="middle" fill="#555">—rigidez, E_s de la arena, método de distribución de tensiones— no llega al 5 %.</text>
</svg>
