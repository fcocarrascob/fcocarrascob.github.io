  <rect x="48" y="484" width="904" height="76" rx="8" fill="#fdf6f4" stroke="#b02a1a" stroke-width="1.4"/>
  <text x="70" y="512" font-size="13.5" fill="#333" text-anchor="start" font-weight="bold">Con un solo tramo la flecha se equivoca 3,20 % y la deriva 46,4 %: un factor 14,5.</text>
  <text x="70" y="534" font-size="12" fill="#6b7280" text-anchor="start">Con base articulada el momento de la columna es cero abajo y máximo en la rodilla, así que la deriva la gobierna</text>
  <text x="70" y="551" font-size="12" fill="#6b7280" text-anchor="start">el peralte del extremo (d = 800 mm) y no el del promedio. La flecha del dintel la manda la zona central, y casi no se entera.</text>
