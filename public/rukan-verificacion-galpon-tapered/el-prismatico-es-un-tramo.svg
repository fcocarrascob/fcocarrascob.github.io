  <rect x="646" y="350" width="300" height="118" rx="8" fill="#fdf6f4" stroke="#b02a1a" stroke-width="1.4"/>
  <text x="660" y="372" font-size="12.5" fill="#b02a1a" text-anchor="start" font-weight="bold">El período se mueve ×2,4…</text>
  <text x="660" y="394" font-size="12.5" fill="#333" text-anchor="start">…y los momentos, 1,6 % y 1,9 %.</text>
  <text x="660" y="420" font-size="11.5" fill="#6b7280" text-anchor="start">El reparto lo decide la RAZÓN entre</text>
  <text x="660" y="437" font-size="11.5" fill="#6b7280" text-anchor="start">rigideces, no su nivel. Cambiar el</text>
  <text x="660" y="454" font-size="11.5" fill="#6b7280" text-anchor="start">peralte parejo no redistribuye nada.</text>
  <rect x="48" y="528" width="904" height="60" rx="8" fill="#f7f9fb" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="70" y="554" font-size="13" fill="#333" text-anchor="start" font-weight="bold">El prismático de peralte medio (d = 575 mm) NO es una alternativa a discretizar: es la malla de UN tramo.</text>
  <text x="70" y="574" font-size="12" fill="#6b7280" text-anchor="start">Con N = 1 la sección se toma en el punto medio del miembro, y el reparto de momentos da los mismos 552,18 y 373,44 kN·m.</text>
</svg>
