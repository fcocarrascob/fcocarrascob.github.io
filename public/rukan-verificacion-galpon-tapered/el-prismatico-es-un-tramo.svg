  <text x="660" y="150" font-size="13" fill="#333" text-anchor="start" font-weight="bold">Los tres prismáticos equivalentes</text>
  <text x="660" y="170" font-size="10.5" fill="#6b7280" text-anchor="start">malla fina, para que no se mezcle con la discretización</text>
  <text x="660" y="202" font-size="10.5" fill="#6b7280" text-anchor="start">d [mm]</text>
  <text x="778" y="202" font-size="10.5" fill="#6b7280" text-anchor="end">T₁ [s]</text>
  <text x="870" y="202" font-size="10.5" fill="#6b7280" text-anchor="end">M rodilla</text>
  <text x="966" y="202" font-size="10.5" fill="#6b7280" text-anchor="end">M cumbrera</text>
