<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 490" font-family="Segoe UI, Arial, sans-serif">
  <rect width="940" height="490" fill="#ffffff"/>
  <text x="470" y="28" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">La lista, ordenada por cuánto mueve el resultado</text>
  <text x="470" y="49" font-size="12" text-anchor="middle" fill="#666">Todos los factores medidos a lo largo de esta serie, sobre la misma zapata</text>

  <line x1="60" y1="68" x2="880" y2="68" stroke="#8a857c" stroke-width="1.3"/>
  <text x="76" y="62" font-size="11" fill="#666" font-weight="bold">Qué preguntar</text>
  <text x="700" y="62" font-size="11" fill="#666" font-weight="bold">Cuánto mueve</text>
  <text x="864" y="62" font-size="11" fill="#666" font-weight="bold" text-anchor="end">Nota</text>

  <!-- filas: (y, texto, subtexto, valor, barra, color, nota) -->
  <g font-size="12.5">
    <text x="76" y="96" fill="#222" font-weight="bold">¿Qué E_s se usó, y con qué rango?</text>
    <text x="76" y="112" font-size="11" fill="#666">Rango tabulado de arcilla blanda: 4 a 20 MN/m²</text>
    <rect x="620" y="84" width="130" height="16" fill="#b02a1a" fill-opacity="0.8"/>
    <text x="758" y="97" font-size="12.5" fill="#b02a1a" font-weight="bold">×5</text>
    <text x="864" y="97" font-size="11" fill="#888" text-anchor="end">nota 4</text>

    <text x="76" y="140" fill="#222" font-weight="bold">¿Se calculó la consolidación secundaria?</text>
    <text x="76" y="156" font-size="11" fill="#666">Omitirla es la decisión más cara del cálculo</text>
    <rect x="620" y="128" width="118" height="16" fill="#b02a1a" fill-opacity="0.8"/>
    <text x="746" y="141" font-size="12.5" fill="#b02a1a" font-weight="bold">−64 %</text>
    <text x="864" y="141" font-size="11" fill="#888" text-anchor="end">nota 7</text>

    <text x="76" y="184" fill="#222" font-weight="bold">¿Qué correlación de N a φ'?</text>
    <text x="76" y="200" font-size="11" fill="#666">Wolff, Schmertmann o Hatanaka: hasta 10° de diferencia</text>
    <rect x="620" y="172" width="88" height="16" fill="#1a63a8" fill-opacity="0.8"/>
    <text x="716" y="185" font-size="12.5" fill="#1a63a8" font-weight="bold">×3,3</text>
    <text x="864" y="185" font-size="11" fill="#888" text-anchor="end">esta nota</text>

    <text x="76" y="228" fill="#222" font-weight="bold">¿Cuál es σ'_c, la preconsolidación?</text>
    <text x="76" y="244" font-size="11" fill="#666">Y ojo: es un umbral, no un gradiente</text>
    <rect x="620" y="216" width="105" height="16" fill="#b35c0e" fill-opacity="0.8"/>
    <text x="733" y="229" font-size="12.5" fill="#b35c0e" font-weight="bold">×4</text>
    <text x="864" y="229" font-size="11" fill="#888" text-anchor="end">nota 6</text>

    <text x="76" y="272" fill="#222" font-weight="bold">¿A qué cota está la napa, y en qué estación?</text>
    <text x="76" y="288" font-size="11" fill="#666">De −7 % a −49 % según dónde esté</text>
    <rect x="620" y="260" width="98" height="16" fill="#b35c0e" fill-opacity="0.8"/>
    <text x="726" y="273" font-size="12.5" fill="#b35c0e" font-weight="bold">−49 %</text>
    <text x="864" y="273" font-size="11" fill="#888" text-anchor="end">nota 3</text>

    <text x="76" y="316" fill="#222" font-weight="bold">¿Qué método de capacidad de soporte?</text>
    <text x="76" y="332" font-size="11" fill="#666">Terzaghi o la ecuación general</text>
    <rect x="620" y="304" width="62" height="16" fill="#1c7c3c" fill-opacity="0.8"/>
    <text x="690" y="317" font-size="12.5" fill="#1c7c3c" font-weight="bold">+31 %</text>
    <text x="864" y="317" font-size="11" fill="#888" text-anchor="end">nota 2</text>

    <text x="76" y="360" fill="#222" font-weight="bold">¿Qué eficiencia de martillo tuvo el SPT?</text>
    <text x="76" y="376" font-size="11" fill="#666">Casi nunca aparece en el informe</text>
    <rect x="620" y="348" width="55" height="16" fill="#1c7c3c" fill-opacity="0.8"/>
    <text x="683" y="361" font-size="12.5" fill="#1c7c3c" font-weight="bold">×1,55</text>
    <text x="864" y="361" font-size="11" fill="#888" text-anchor="end">esta nota</text>

    <text x="76" y="404" fill="#222" font-weight="bold">¿Drena la arcilla por una cara o por dos?</text>
    <text x="76" y="420" font-size="11" fill="#666">No cambia cuánto asienta, sino cuándo</text>
    <rect x="620" y="392" width="72" height="16" fill="#1a63a8" fill-opacity="0.8"/>
    <text x="700" y="405" font-size="12.5" fill="#1a63a8" font-weight="bold">×4 el plazo</text>
    <text x="864" y="405" font-size="11" fill="#888" text-anchor="end">nota 5</text>
  </g>

  <rect x="60" y="436" width="820" height="44" rx="6" fill="#f7f6f3" stroke="#8a857c"/>
  <text x="470" y="458" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">Ninguna de estas preguntas cuestiona al geotecnista. Todas piden lo mismo: la procedencia del número.</text>
  <text x="470" y="474" font-size="12" text-anchor="middle" fill="#555">Un q_adm sin su cadena no es un dato: es una conclusión sin su argumento.</text>
</svg>
