<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="push" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b02a1a"/>
    </marker>
    <marker id="suck" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d6b9c"/>
    </marker>
    <marker id="dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a857c"/>
    </marker>
    <marker id="wind" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="600" fill="#ffffff"/>

  <text x="450" y="28" font-size="15.5" text-anchor="middle" fill="#222" font-weight="bold">Zonas del SPRFV — Figura 12, Caso de Carga 1 (viento transversal), (GC_pf) interpolados a θ = 10°</text>

  <!-- ================= PLANTA ================= -->
  <text x="140" y="48" font-size="12.5" fill="#666">Planta · 24 × 60 m · a = 2,4 m</text>

  <!-- roof plan: 60 m -> 600 px, 24 m -> 240 px  (10 px/m) -->
  <!-- leeward half (zones 3 / 3E) -->
  <rect x="140" y="70" width="600" height="120" fill="#dce8f2" stroke="none"/>
  <!-- windward half (zones 2 / 2E) -->
  <rect x="140" y="190" width="600" height="120" fill="#c9dcec" stroke="none"/>
  <!-- 2a end strip -->
  <rect x="140" y="70" width="48" height="240" fill="#8fb6d4" fill-opacity="0.45" stroke="none"/>
  <rect x="140" y="70" width="600" height="240" fill="none" stroke="#8a857c" stroke-width="1.6"/>
  <line x1="188" y1="70" x2="188" y2="310" stroke="#2d6b9c" stroke-width="1.4" stroke-dasharray="5 4"/>
  <!-- ridge -->
  <line x1="140" y1="190" x2="740" y2="190" stroke="#8a857c" stroke-width="2"/>
  <text x="700" y="184" font-size="11" fill="#8a857c" text-anchor="end">cumbrera</text>

  <!-- zone labels -->
  <text x="164" y="256" font-size="13" fill="#1b4a6e" text-anchor="middle" font-weight="bold">2E</text>
  <text x="164" y="272" font-size="10.5" fill="#1b4a6e" text-anchor="middle">−1,070</text>
  <text x="164" y="136" font-size="13" fill="#1b4a6e" text-anchor="middle" font-weight="bold">3E</text>
  <text x="164" y="152" font-size="10.5" fill="#1b4a6e" text-anchor="middle">−0,583</text>
  <text x="464" y="252" font-size="14" fill="#1b4a6e" text-anchor="middle" font-weight="bold">2 — faldón de barlovento</text>
  <text x="464" y="270" font-size="11.5" fill="#1b4a6e" text-anchor="middle">(GC_pf) = −0,690</text>
  <text x="464" y="132" font-size="14" fill="#1b4a6e" text-anchor="middle" font-weight="bold">3 — faldón de sotavento</text>
  <text x="464" y="150" font-size="11.5" fill="#1b4a6e" text-anchor="middle">(GC_pf) = −0,407</text>

  <!-- wall edges -->
  <text x="464" y="327" font-size="11.5" fill="#b02a1a" text-anchor="middle">muro de barlovento — zona 1 (+0,443) · zona 1E (+0,673)</text>
  <text x="464" y="62" font-size="11.5" fill="#2d6b9c" text-anchor="middle">muro de sotavento — zona 4 (−0,337) · zona 4E (−0,500)</text>

  <!-- wind arrows (transverse) -->
  <line x1="320" y1="370" x2="320" y2="330" stroke="#333" stroke-width="2" marker-end="url(#wind)"/>
  <line x1="430" y1="370" x2="430" y2="330" stroke="#333" stroke-width="2" marker-end="url(#wind)"/>
  <line x1="540" y1="370" x2="540" y2="330" stroke="#333" stroke-width="2" marker-end="url(#wind)"/>
  <line x1="650" y1="370" x2="650" y2="330" stroke="#333" stroke-width="2" marker-end="url(#wind)"/>
  <text x="450" y="388" font-size="12.5" fill="#333" text-anchor="middle" font-weight="bold">viento — Caso de Carga 1, esquina de barlovento a la izquierda</text>

  <!-- dimensions -->
  <line x1="140" y1="320" x2="188" y2="320" stroke="#8a857c" stroke-width="1.2" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <text x="140" y="338" font-size="11" fill="#8a857c">2a = 4,8 m (zonas «E»)</text>
  <line x1="770" y1="70" x2="770" y2="310" stroke="#8a857c" stroke-width="1.2" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <text x="778" y="194" font-size="11" fill="#8a857c">B = 24 m</text>
  <text x="730" y="338" font-size="11" fill="#8a857c" text-anchor="middle">L = 60 m</text>

  <!-- ================= ELEVACIÓN ================= -->
  <text x="120" y="404" font-size="12.5" fill="#666">Sección transversal · θ = 10°</text>

  <!-- ground -->
  <line x1="120" y1="560" x2="420" y2="560" stroke="#8a857c" stroke-width="1.5"/>
  <!-- section: 24 m -> 240 px, eave 7,5 m -> 75 px, ridge +2,12 m -> 21 px -->
  <path d="M 150,560 L 150,485 L 270,464 L 390,485 L 390,560 Z" fill="#efece6" stroke="#8a857c" stroke-width="1.8"/>
  <line x1="270" y1="464" x2="270" y2="560" stroke="#8a857c" stroke-width="0.8" stroke-dasharray="4 4"/>

  <!-- windward wall: pressure in -->
  <line x1="118" y1="520" x2="148" y2="520" stroke="#b02a1a" stroke-width="2" marker-end="url(#push)"/>
  <text x="112" y="524" font-size="11.5" fill="#b02a1a" text-anchor="end">+333</text>
  <text x="112" y="508" font-size="10.5" fill="#b02a1a" text-anchor="end">zona 1</text>
  <!-- windward roof: suction out (perpendicular to slope) -->
  <line x1="205" y1="470" x2="197" y2="443" stroke="#2d6b9c" stroke-width="2" marker-end="url(#suck)"/>
  <text x="196" y="436" font-size="11.5" fill="#2d6b9c" text-anchor="middle">−465</text>
  <text x="196" y="424" font-size="10.5" fill="#2d6b9c" text-anchor="middle">zona 2</text>
  <!-- leeward roof -->
  <line x1="335" y1="470" x2="343" y2="443" stroke="#2d6b9c" stroke-width="2" marker-end="url(#suck)"/>
  <text x="346" y="436" font-size="11.5" fill="#2d6b9c" text-anchor="middle">−314</text>
  <text x="346" y="424" font-size="10.5" fill="#2d6b9c" text-anchor="middle">zona 3</text>
  <!-- leeward wall -->
  <line x1="392" y1="520" x2="422" y2="520" stroke="#2d6b9c" stroke-width="2" marker-end="url(#suck)"/>
  <text x="428" y="524" font-size="11.5" fill="#2d6b9c">−276</text>
  <text x="428" y="508" font-size="10.5" fill="#2d6b9c">zona 4</text>

  <text x="270" y="580" font-size="11" fill="#8a857c" text-anchor="middle">alero 7,5 m = h · cumbrera +2,12 m · presiones en N/m²</text>

  <!-- ================= PANEL DE VALORES ================= -->
  <rect x="470" y="410" width="410" height="172" fill="#f7f5f1" stroke="#e0dbd2" stroke-width="1"/>
  <text x="486" y="432" font-size="12.5" fill="#222" font-weight="bold">p = q_h · K_d · [(GC_pf) − (GC_pi)]</text>
  <text x="864" y="432" font-size="12" fill="#222" text-anchor="end">q_h · K_d = 534,4 N/m²</text>
  <text x="486" y="454" font-size="11.5" fill="#666">zona</text>
  <text x="640" y="454" font-size="11.5" fill="#666" text-anchor="end">(GC_pi) = +0,18</text>
  <text x="760" y="454" font-size="11.5" fill="#666" text-anchor="end">(GC_pi) = −0,18</text>
  <line x1="486" y1="460" x2="864" y2="460" stroke="#e0dbd2" stroke-width="1"/>

  <text x="486" y="478" font-size="11.5" fill="#333">1 — muro barlovento</text>
  <text x="640" y="478" font-size="11.5" fill="#333" text-anchor="end">+141</text>
  <text x="760" y="478" font-size="11.5" fill="#b02a1a" text-anchor="end" font-weight="bold">+333</text>

  <text x="486" y="498" font-size="11.5" fill="#333">2 — faldón barlovento</text>
  <text x="640" y="498" font-size="11.5" fill="#2d6b9c" text-anchor="end" font-weight="bold">−465</text>
  <text x="760" y="498" font-size="11.5" fill="#333" text-anchor="end">−273</text>

  <text x="486" y="518" font-size="11.5" fill="#333">3 — faldón sotavento</text>
  <text x="640" y="518" font-size="11.5" fill="#2d6b9c" text-anchor="end" font-weight="bold">−314</text>
  <text x="760" y="518" font-size="11.5" fill="#333" text-anchor="end">−121</text>

  <text x="486" y="538" font-size="11.5" fill="#333">4 — muro sotavento</text>
  <text x="640" y="538" font-size="11.5" fill="#2d6b9c" text-anchor="end" font-weight="bold">−276</text>
  <text x="760" y="538" font-size="11.5" fill="#333" text-anchor="end">−84</text>

  <text x="486" y="560" font-size="11.5" fill="#333">2E — faldón de borde</text>
  <text x="640" y="560" font-size="11.5" fill="#2d6b9c" text-anchor="end" font-weight="bold">−668</text>
  <text x="760" y="560" font-size="11.5" fill="#333" text-anchor="end">−476</text>

  <text x="486" y="576" font-size="10.5" fill="#8a857c">la franja «E» succiona un 44 % más que el resto del faldón</text>
</svg>
