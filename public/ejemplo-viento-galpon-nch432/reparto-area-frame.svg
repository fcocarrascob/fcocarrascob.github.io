<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="load" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d6b9c"/>
    </marker>
    <marker id="dim3" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a857c"/>
    </marker>
  </defs>
  <rect width="900" height="430" fill="#ffffff"/>

  <text x="450" y="28" font-size="15.5" text-anchor="middle" fill="#222" font-weight="bold">El reparto área→frame: dos esquemas consistentes y uno que duplica la carga</text>
  <text x="450" y="48" font-size="12" text-anchor="middle" fill="#666">vista del faldón entre dos marcos · objeto área con sección «None» (sin rigidez ni masa)</text>

  <!-- ============ PANEL A ============ -->
  <text x="55" y="80" font-size="13" fill="#1b4a6e" font-weight="bold">(a) con costaneras modeladas</text>
  <!-- area patch between two purlins -->
  <rect x="75" y="150" width="180" height="36" fill="#c9dcec" stroke="#2d6b9c" stroke-width="1.2" stroke-dasharray="5 3"/>
  <!-- purlins -->
  <line x1="75" y1="114" x2="255" y2="114" stroke="#a8641b" stroke-width="3"/>
  <line x1="75" y1="150" x2="255" y2="150" stroke="#a8641b" stroke-width="3"/>
  <line x1="75" y1="186" x2="255" y2="186" stroke="#a8641b" stroke-width="3"/>
  <line x1="75" y1="222" x2="255" y2="222" stroke="#a8641b" stroke-width="3"/>
  <!-- frames -->
  <line x1="75" y1="100" x2="75" y2="240" stroke="#444" stroke-width="5"/>
  <line x1="255" y1="100" x2="255" y2="240" stroke="#444" stroke-width="5"/>
  <!-- load arrows onto the patch -->
  <line x1="110" y1="132" x2="110" y2="162" stroke="#2d6b9c" stroke-width="1.8" marker-end="url(#load)"/>
  <line x1="165" y1="132" x2="165" y2="162" stroke="#2d6b9c" stroke-width="1.8" marker-end="url(#load)"/>
  <line x1="220" y1="132" x2="220" y2="162" stroke="#2d6b9c" stroke-width="1.8" marker-end="url(#load)"/>
  <text x="165" y="258" font-size="11" fill="#a8641b" text-anchor="middle">costaneras @ 1,5 m</text>
  <text x="165" y="274" font-size="11" fill="#444" text-anchor="middle">marcos @ 6,0 m</text>

  <text x="55" y="300" font-size="11.5" fill="#333">El área cubre el paño entre costaneras</text>
  <text x="55" y="316" font-size="11.5" fill="#333">y les entrega la carga; ellas la llevan</text>
  <text x="55" y="332" font-size="11.5" fill="#333">al marco. Es el que hay que usar si el</text>
  <text x="55" y="348" font-size="11.5" fill="#333">techo trabaja como diafragma.</text>

  <!-- ============ PANEL B ============ -->
  <text x="335" y="80" font-size="13" fill="#1b4a6e" font-weight="bold">(b) sin costaneras</text>
  <rect x="355" y="100" width="180" height="140" fill="#c9dcec" stroke="#2d6b9c" stroke-width="1.2" stroke-dasharray="5 3"/>
  <line x1="355" y1="100" x2="355" y2="240" stroke="#444" stroke-width="5"/>
  <line x1="535" y1="100" x2="535" y2="240" stroke="#444" stroke-width="5"/>
  <line x1="390" y1="120" x2="390" y2="150" stroke="#2d6b9c" stroke-width="1.8" marker-end="url(#load)"/>
  <line x1="445" y1="120" x2="445" y2="150" stroke="#2d6b9c" stroke-width="1.8" marker-end="url(#load)"/>
  <line x1="500" y1="120" x2="500" y2="150" stroke="#2d6b9c" stroke-width="1.8" marker-end="url(#load)"/>
  <!-- tributary width -->
  <line x1="355" y1="256" x2="535" y2="256" stroke="#8a857c" stroke-width="1.2" marker-start="url(#dim3)" marker-end="url(#dim3)"/>
  <text x="445" y="272" font-size="11" fill="#8a857c" text-anchor="middle">ancho tributario 6,0 m</text>
  <text x="445" y="180" font-size="12.5" fill="#1b4a6e" text-anchor="middle" font-weight="bold">p = −465 N/m²</text>
  <text x="445" y="200" font-size="12.5" fill="#1b4a6e" text-anchor="middle">w = 2,79 kN/m al marco</text>

  <text x="335" y="300" font-size="11.5" fill="#333">El área cubre el faldón entre marcos y</text>
  <text x="335" y="316" font-size="11.5" fill="#333">les entrega la carga directamente.</text>
  <text x="335" y="332" font-size="11.5" fill="#333">Basta para dimensionar el marco, y</text>
  <text x="335" y="348" font-size="11.5" fill="#333">es más rápido.</text>

  <!-- ============ PANEL C ============ -->
  <text x="615" y="80" font-size="13" fill="#b02a1a" font-weight="bold">los dos a la vez — incorrecto</text>
  <rect x="635" y="100" width="180" height="140" fill="#c9dcec" stroke="#2d6b9c" stroke-width="1.2" stroke-dasharray="5 3"/>
  <rect x="635" y="150" width="180" height="36" fill="#8fb6d4" stroke="#2d6b9c" stroke-width="1.2" stroke-dasharray="5 3"/>
  <line x1="635" y1="114" x2="815" y2="114" stroke="#a8641b" stroke-width="3"/>
  <line x1="635" y1="150" x2="815" y2="150" stroke="#a8641b" stroke-width="3"/>
  <line x1="635" y1="186" x2="815" y2="186" stroke="#a8641b" stroke-width="3"/>
  <line x1="635" y1="222" x2="815" y2="222" stroke="#a8641b" stroke-width="3"/>
  <line x1="635" y1="100" x2="635" y2="240" stroke="#444" stroke-width="5"/>
  <line x1="815" y1="100" x2="815" y2="240" stroke="#444" stroke-width="5"/>
  <line x1="660" y1="118" x2="790" y2="228" stroke="#b02a1a" stroke-width="3"/>
  <line x1="790" y1="118" x2="660" y2="228" stroke="#b02a1a" stroke-width="3"/>
  <text x="725" y="272" font-size="12.5" fill="#b02a1a" text-anchor="middle" font-weight="bold">la carga entra dos veces</text>

  <text x="615" y="300" font-size="11.5" fill="#333">El área del paño y el área del faldón</text>
  <text x="615" y="316" font-size="11.5" fill="#333">cargadas juntas duplican la carga. La</text>
  <text x="615" y="332" font-size="11.5" fill="#333">deformada se ve razonable y nada avisa:</text>
  <text x="615" y="348" font-size="11.5" fill="#333">solo lo caza Σ p·A contra la reacción.</text>

  <!-- ============ pie ============ -->
  <rect x="45" y="368" width="810" height="46" fill="#f7f5f1" stroke="#e0dbd2" stroke-width="1"/>
  <text x="62" y="388" font-size="12" fill="#222" font-weight="bold">El chequeo, en los tres casos: Σ p·A = 0,780 · 534,4 · 7,5 · 60 = 187,6 kN de corte transversal (solo muros).</text>
  <text x="62" y="406" font-size="11.5" fill="#333">Con los faldones cargados el modelo devuelve 168,3 kN — la diferencia es la succión de techo que §7.3.3 no deja acreditar.</text>
</svg>
