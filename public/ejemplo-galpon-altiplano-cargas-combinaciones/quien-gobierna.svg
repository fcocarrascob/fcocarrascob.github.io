<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="630" fill="#ffffff"/>
  <text x="500" y="30" font-size="15.5" text-anchor="middle" fill="#222" font-weight="bold">La envolvente: la gravedad con nieve gana casi todo, y el sismo se queda con el arriostramiento</text>
  <text x="500" y="50" font-size="12" text-anchor="middle" fill="#666">Con S = 1,20 kPa y el sismo dividido por R* (4,00 en la transversal, 3,83 en la longitudinal), la envolvente sísmica llega al 53 % del momento de alero</text>
  <text x="70" y="104" font-size="12" fill="#666">Ocho verificaciones de la envolvente, gobernadas por solo 5 nombres. En la envolvente completa —diez miembros × tres esfuerzos— son nueve.</text>
  <rect x="70" y="130.0" width="820" height="30" fill="#ffffff"/>
  <rect x="70" y="130.0" width="5" height="30" fill="#2d6b9c"/>
  <text x="88" y="150.0" font-size="12" fill="#333">Columna, alero</text>
  <text x="300" y="150.0" font-size="12" fill="#222" font-family="Consolas, monospace">M₃ = 633,284 kN·m</text>
  <text x="500" y="150.0" font-size="12" fill="#2d6b9c" font-weight="bold" font-family="Consolas, monospace">G3A_B</text>
  <rect x="70" y="170.0" width="820" height="30" fill="#fafafa"/>
  <rect x="70" y="170.0" width="5" height="30" fill="#2d6b9c"/>
  <text x="88" y="190.0" font-size="12" fill="#333">Dintel, alero</text>
  <text x="300" y="190.0" font-size="12" fill="#222" font-family="Consolas, monospace">M₃ = −633,206 kN·m</text>
  <text x="500" y="190.0" font-size="12" fill="#2d6b9c" font-weight="bold" font-family="Consolas, monospace">G3A_B</text>
  <rect x="70" y="210.0" width="820" height="30" fill="#ffffff"/>
  <rect x="70" y="210.0" width="5" height="30" fill="#7aa8cc"/>
  <text x="88" y="230.0" font-size="12" fill="#333">Dintel, medio</text>
  <text x="300" y="230.0" font-size="12" fill="#222" font-family="Consolas, monospace">M₃ = 176,334 kN·m</text>
  <text x="500" y="230.0" font-size="12" fill="#7aa8cc" font-weight="bold" font-family="Consolas, monospace">G3A_I</text>
  <rect x="70" y="250.0" width="820" height="30" fill="#fafafa"/>
  <rect x="70" y="250.0" width="5" height="30" fill="#2d6b9c"/>
  <text x="88" y="270.0" font-size="12" fill="#333">Dintel, cumbrera</text>
  <text x="300" y="270.0" font-size="12" fill="#222" font-family="Consolas, monospace">M₃ = 207,932 kN·m</text>
  <text x="500" y="270.0" font-size="12" fill="#2d6b9c" font-weight="bold" font-family="Consolas, monospace">G3A_B</text>
  <rect x="70" y="290.0" width="820" height="30" fill="#ffffff"/>
  <rect x="70" y="290.0" width="5" height="30" fill="#1c7c3c"/>
  <text x="88" y="310.0" font-size="12" fill="#333">Dintel, alero (tracción)</text>
  <text x="300" y="310.0" font-size="12" fill="#222" font-family="Consolas, monospace">P = +24,780 kN</text>
  <text x="500" y="310.0" font-size="12" fill="#1c7c3c" font-weight="bold" font-family="Consolas, monospace">G6_LYNP</text>
  <rect x="70" y="330.0" width="820" height="30" fill="#fafafa"/>
  <rect x="70" y="330.0" width="5" height="30" fill="#a8641b"/>
  <text x="88" y="350.0" font-size="12" fill="#333">Puntal de alero</text>
  <text x="300" y="350.0" font-size="12" fill="#222" font-family="Consolas, monospace">P = +28,248 kN</text>
  <text x="500" y="350.0" font-size="12" fill="#a8641b" font-weight="bold" font-family="Consolas, monospace">E2P_A</text>
  <rect x="70" y="370.0" width="820" height="30" fill="#ffffff"/>
  <rect x="70" y="370.0" width="5" height="30" fill="#a8641b"/>
  <text x="88" y="390.0" font-size="12" fill="#333">Media diag. de muro</text>
  <text x="300" y="390.0" font-size="12" fill="#222" font-family="Consolas, monospace">P = −39,895 kN</text>
  <text x="500" y="390.0" font-size="12" fill="#a8641b" font-weight="bold" font-family="Consolas, monospace">E2P_A</text>
  <rect x="70" y="410.0" width="820" height="30" fill="#fafafa"/>
  <rect x="70" y="410.0" width="5" height="30" fill="#1c7c3c"/>
  <text x="88" y="430.0" font-size="12" fill="#333">Pilar de hastial</text>
  <text x="300" y="430.0" font-size="12" fill="#222" font-family="Consolas, monospace">M₃ = −23,432 kN·m</text>
  <text x="500" y="430.0" font-size="12" fill="#1c7c3c" font-weight="bold" font-family="Consolas, monospace">G4_BLYPN</text>
  <rect x="70" y="471.0" width="12" height="12" fill="#2d6b9c" fill-opacity="0.5" stroke="#2d6b9c" stroke-width="1.1"/>
  <text x="90" y="480.0" font-size="11" fill="#333">G3A_B = 1,2 D + 1,6 S balanceada</text>
  <rect x="70" y="491.0" width="12" height="12" fill="#7aa8cc" fill-opacity="0.5" stroke="#7aa8cc" stroke-width="1.1"/>
  <text x="90" y="500.0" font-size="11" fill="#333">G3A_I = ídem, con la nieve DESBALANCEADA</text>
  <rect x="70" y="511.0" width="12" height="12" fill="#1c7c3c" fill-opacity="0.5" stroke="#1c7c3c" stroke-width="1.1"/>
  <text x="90" y="520.0" font-size="11" fill="#333">G6_* = 0,9 D + 1,6 W  ·  G4_* = 1,2 D + 1,6 W + 0,5 S</text>
  <rect x="70" y="531.0" width="12" height="12" fill="#a8641b" fill-opacity="0.5" stroke="#a8641b" stroke-width="1.1"/>
  <text x="90" y="540.0" font-size="11" fill="#333">E* = las sísmicas de NCh 2369 §4.5.1</text>
  <text x="560" y="480.0" font-size="11.5" fill="#222" font-weight="bold">Dos cosas que no se esperaban</text>
  <text x="560" y="500.0" font-size="10.5" fill="#666">La nieve DESBALANCEADA gobierna el dintel a media luz —</text>
  <text x="560" y="514.0" font-size="10.5" fill="#666">el caso que casi nadie corre, y que ninguna norma chilena</text>
  <text x="560" y="528.0" font-size="10.5" fill="#666">disponible obliga a correr: entra por el estudio de sitio.</text>
  <text x="560" y="548.0" font-size="10.5" fill="#666">Y a la diagonal de muro la gobierna el SISMO, no el viento:</text>
  <text x="560" y="562.0" font-size="10.5" fill="#666">39,895 kN contra 34,233 de la envolvente de gravedad y</text>
  <text x="560" y="576.0" font-size="10.5" fill="#666">viento, un 16,5 % más.</text>
  <text x="70" y="608" font-size="10.5" fill="#666">Envolvente sobre las 79 combinaciones, extraída del modelo verificado con combinaciones envolventes de SAP2000 (SERIE-GALPON.md §5.37).</text>
</svg>
