<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="rr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="880" height="480" fill="#ffffff"/>
  <text x="440" y="26" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">La sección efectiva del gusset: 30° o 45° según el estado límite que se verifique</text>

  <!-- ================= PANEL A — soldado ================= -->
  <text x="45" y="56" font-size="12" fill="#1a63a8" font-weight="bold">A · Conexión soldada — el cono nace en el primer punto de transferencia</text>
  <text x="45" y="72" font-size="10" fill="#666">El vértice está en el extremo de la diagonal; la sección se toma donde la transferencia termina</text>

  <!-- plancha gusset -->
  <rect x="50" y="80" width="190" height="280" fill="#f4f6f9" stroke="#777" stroke-width="1.2"/>
  <text x="62" y="97" font-size="9.5" fill="#888">plancha gusset, espesor t</text>

  <!-- cono 45 -->
  <polygon points="110,220 240,90 240,350" fill="#c07a00" fill-opacity="0.10" stroke="#c07a00" stroke-width="1.1" stroke-dasharray="5 3"/>
  <!-- cono 30 -->
  <polygon points="110,220 240,144.9 240,295.1" fill="#1a63a8" fill-opacity="0.18" stroke="#1a63a8" stroke-width="1.3"/>

  <!-- diagonal -->
  <rect x="110" y="190" width="230" height="60" fill="#dfe5ec" fill-opacity="0.85" stroke="#333" stroke-width="1.6"/>
  <line x1="110" y1="220" x2="365" y2="220" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
  <text x="322" y="182" font-size="10.5" fill="#333" font-weight="bold">diagonal</text>

  <!-- cordones de filete -->
  <path d="M110,190 l6,-5 6,5 6,-5 6,5 6,-5 6,5 6,-5 6,5 6,-5 6,5 6,-5 6,5 6,-5 6,5 6,-5 6,5 6,-5 6,5 6,-5 6,5 6,-5 6,5" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <path d="M110,250 l6,5 6,-5 6,5 6,-5 6,5 6,-5 6,5 6,-5 6,5 6,-5 6,5 6,-5 6,5 6,-5 6,5 6,-5 6,5 6,-5 6,5 6,-5 6,5 6,-5" fill="none" stroke="#c0392b" stroke-width="1.5"/>

  <!-- vertice -->
  <circle cx="110" cy="220" r="3.2" fill="#c0392b"/>
  <text x="104" y="212" font-size="9.5" text-anchor="end" fill="#c0392b">extremo de</text>
  <text x="104" y="223" font-size="9.5" text-anchor="end" fill="#c0392b">la diagonal</text>

  <!-- angulos -->
  <path d="M150,220 A40,40 0 0,0 144.6,197.1" fill="none" stroke="#1a63a8" stroke-width="1"/>
  <rect x="155" y="198" width="24" height="12" fill="#ffffff"/>
  <text x="158" y="207" font-size="9.5" fill="#1a63a8" font-weight="bold">30°</text>
  <path d="M176,220 A66,66 0 0,0 156.7,173.3" fill="none" stroke="#c07a00" stroke-width="1"/>
  <rect x="177" y="179" width="24" height="12" fill="#ffffff"/>
  <text x="180" y="188" font-size="9.5" fill="#c07a00" font-weight="bold">45°</text>

  <!-- secciones de Whitmore -->
  <line x1="240" y1="144.9" x2="240" y2="295.1" stroke="#1a63a8" stroke-width="3.4"/>
  <line x1="264" y1="144.9" x2="264" y2="295.1" stroke="#1a63a8" stroke-width="0.9" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="272" y="216" font-size="10.5" fill="#1a63a8" font-weight="bold">b</text>
  <text x="280" y="220" font-size="8" fill="#1a63a8" font-weight="bold">w</text>
  <text x="286" y="216" font-size="10.5" fill="#1a63a8" font-weight="bold">(30°)</text>

  <line x1="240" y1="90" x2="240" y2="350" stroke="#c07a00" stroke-width="2.2" stroke-dasharray="7 4"/>
  <line x1="300" y1="90" x2="300" y2="350" stroke="#c07a00" stroke-width="0.9" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="308" y="112" font-size="10.5" fill="#c07a00" font-weight="bold">b</text>
  <text x="316" y="116" font-size="8" fill="#c07a00" font-weight="bold">w</text>
  <text x="322" y="112" font-size="10.5" fill="#c07a00" font-weight="bold">(45°)</text>

  <!-- cota l -->
  <line x1="110" y1="378" x2="240" y2="378" stroke="#555" stroke-width="0.9" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="175" y="392" font-size="10.5" text-anchor="middle" fill="#555">l — largo de la conexión</text>

  <!-- ================= PANEL B — apernado ================= -->
  <text x="465" y="56" font-size="12" fill="#1a63a8" font-weight="bold">B · Conexión apernada — el cono nace en la primera fila de pernos</text>
  <text x="465" y="72" font-size="10" fill="#666">Arranca con el ancho del gramil, no en un punto: b<tspan font-size="8" dy="2">w</tspan><tspan dy="-2"> = g + 2·l·tanθ</tspan></text>

  <!-- plancha -->
  <rect x="470" y="100" width="200" height="240" fill="#f4f6f9" stroke="#777" stroke-width="1.2"/>

  <!-- cono 45 (recortado visualmente por el borde) -->
  <polygon points="500,200 620,80 620,360 500,240" fill="#c07a00" fill-opacity="0.10" stroke="#c07a00" stroke-width="1.1" stroke-dasharray="5 3"/>
  <!-- cono 30 -->
  <polygon points="500,200 620,130.7 620,309.3 500,240" fill="#1a63a8" fill-opacity="0.18" stroke="#1a63a8" stroke-width="1.3"/>

  <!-- zonas que se salen de la plancha -->
  <rect x="600" y="80" width="20" height="20" fill="#c0392b" fill-opacity="0.20" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 2"/>
  <rect x="600" y="340" width="20" height="20" fill="#c0392b" fill-opacity="0.20" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- diagonal (contorno) -->
  <rect x="490" y="188" width="230" height="64" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="700" y="182" font-size="10.5" text-anchor="end" fill="#333" font-weight="bold">diagonal (contorno)</text>

  <!-- pernos -->
  <g fill="#333">
    <circle cx="500" cy="200" r="5"/><circle cx="540" cy="200" r="5"/><circle cx="580" cy="200" r="5"/><circle cx="620" cy="200" r="5"/>
    <circle cx="500" cy="240" r="5"/><circle cx="540" cy="240" r="5"/><circle cx="580" cy="240" r="5"/><circle cx="620" cy="240" r="5"/>
  </g>
  <line x1="500" y1="220" x2="720" y2="220" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>

  <!-- gramil -->
  <line x1="478" y1="200" x2="478" y2="240" stroke="#2c7a4b" stroke-width="0.9" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="472" y="224" font-size="10" text-anchor="end" fill="#2c7a4b" font-weight="bold">g</text>

  <!-- seccion de Whitmore -->
  <line x1="620" y1="130.7" x2="620" y2="309.3" stroke="#1a63a8" stroke-width="3.4"/>
  <line x1="620" y1="80" x2="620" y2="360" stroke="#c07a00" stroke-width="2.2" stroke-dasharray="7 4"/>
  <text x="632" y="126" font-size="9.5" fill="#c0392b" font-weight="bold">la banda de 45° no cabe</text>
  <text x="632" y="138" font-size="9.5" fill="#c0392b">en la plancha: se recorta</text>
  <text x="632" y="150" font-size="9.5" fill="#c0392b">al borde real</text>

  <!-- cota l -->
  <line x1="500" y1="378" x2="620" y2="378" stroke="#555" stroke-width="0.9" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="560" y="392" font-size="10.5" text-anchor="middle" fill="#555">l — primera a última fila</text>

  <!-- ================= FRANJA INFERIOR ================= -->
  <line x1="45" y1="408" x2="835" y2="408" stroke="#dcd8d0" stroke-width="1"/>

  <rect x="45" y="418" width="255" height="48" fill="#c07a00" fill-opacity="0.08" stroke="#c07a00" stroke-width="1"/>
  <text x="55" y="434" font-size="10.5" fill="#c07a00" font-weight="bold">TRACCIÓN — Coment. J4.1: 45°</text>
  <text x="55" y="448" font-size="9.5" fill="#666">porque el gusset tiene gran capacidad de</text>
  <text x="55" y="459" font-size="9.5" fill="#666">deformación inelástica y la tensión alcanza a repartirse</text>

  <rect x="312" y="418" width="255" height="48" fill="#1a63a8" fill-opacity="0.08" stroke="#1a63a8" stroke-width="1"/>
  <text x="322" y="434" font-size="10.5" fill="#1a63a8" font-weight="bold">COMPRESIÓN — Coment. J4.4: 30°</text>
  <text x="322" y="448" font-size="9.5" fill="#666">trayectorias elásticas medidas por Whitmore (1952);</text>
  <text x="322" y="459" font-size="9.5" fill="#666">es el ángulo con que se calibraron los L<tspan font-size="8" dy="2">c</tspan><tspan dy="-2"> = KL</tspan></text>

  <rect x="579" y="418" width="256" height="48" fill="#f2f0ec" stroke="#8a857c" stroke-width="1"/>
  <text x="707" y="437" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">b(45°) / b(30°) = tan45° / tan30° = √3</text>
  <text x="707" y="455" font-size="10" text-anchor="middle" fill="#555">la banda de tracción es 1,73 veces la de compresión</text>
</svg>
