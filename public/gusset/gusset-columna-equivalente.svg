<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c7a4b"/>
    </marker>
    <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#8a857c" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="880" height="470" fill="#ffffff"/>
  <text x="440" y="26" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">El gusset en compresión: una columna equivalente de ancho b<tspan font-size="11" dy="3">w</tspan><tspan dy="-3"> y espesor t</tspan></text>

  <!-- ================= PANEL A ================= -->
  <text x="40" y="54" font-size="12" fill="#1a63a8" font-weight="bold">A · La banda, y su longitud de pandeo</text>
  <text x="40" y="70" font-size="10" fill="#666">Del extremo de la diagonal al borde soportado</text>

  <!-- columna y viga -->
  <rect x="50" y="80" width="26" height="250" fill="#dcd8d0" stroke="#666" stroke-width="1.2"/>
  <rect x="50" y="330" width="330" height="26" fill="#dcd8d0" stroke="#666" stroke-width="1.2"/>
  <text x="63" y="100" font-size="9" fill="#555" transform="rotate(90 63 100)">columna</text>
  <text x="356" y="348" font-size="9" text-anchor="end" fill="#555">viga</text>

  <!-- gusset -->
  <polygon points="76,330 76,150 300,330" fill="#eef2f7" stroke="#333" stroke-width="1.6"/>
  <text x="232" y="306" font-size="9.5" fill="#888">gusset</text>

  <!-- eje de la diagonal -->
  <line x1="76" y1="330" x2="320" y2="86" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>

  <!-- banda de Whitmore: cono desde el extremo de la diagonal -->
  <polygon points="167.9,238.1 147.0,316.2 89.8,259.0" fill="#1a63a8" fill-opacity="0.18" stroke="#1a63a8" stroke-width="1.2"/>
  <line x1="89.8" y1="259.0" x2="147.0" y2="316.2" stroke="#1a63a8" stroke-width="3.4"/>
  <line x1="118.4" y1="287.6" x2="196" y2="300" stroke="#1a63a8" stroke-width="0.7"/>
  <text x="200" y="304" font-size="10.5" fill="#1a63a8" font-weight="bold">b</text>
  <text x="208" y="308" font-size="8" fill="#1a63a8" font-weight="bold">w</text>

  <!-- diagonal -->
  <polygon points="152.3,222.5 258.4,116.4 289.6,147.6 183.5,253.7" fill="#dfe5ec" stroke="#333" stroke-width="1.6"/>
  <text x="296" y="122" font-size="10.5" fill="#333" font-weight="bold">diagonal</text>
  <circle cx="167.9" cy="238.1" r="3.4" fill="#c0392b"/>

  <!-- las tres longitudes de pandeo, paralelas al eje: sobre el eje y desde los dos bordes de la banda -->
  <line x1="167.9" y1="238.1" x2="80" y2="326" stroke="#2c7a4b" stroke-width="1.8" marker-end="url(#gr)"/>
  <text x="146" y="250" font-size="11" fill="#2c7a4b" font-weight="bold">L<tspan font-size="8" dy="2">1</tspan></text>
  <line x1="147.0" y1="316.2" x2="134.5" y2="328.7" stroke="#2c7a4b" stroke-width="1.6" marker-end="url(#gr)"/>
  <text x="157" y="327" font-size="11" fill="#2c7a4b" font-weight="bold">L<tspan font-size="8" dy="2">2</tspan></text>
  <line x1="89.8" y1="259.0" x2="77.3" y2="271.5" stroke="#2c7a4b" stroke-width="1.6" marker-end="url(#gr)"/>
  <text x="95" y="253" font-size="11" fill="#2c7a4b" font-weight="bold">L<tspan font-size="8" dy="2">3</tspan></text>

  <text x="40" y="382" font-size="9.5" fill="#666">La práctica mide <tspan font-weight="bold">tres</tspan> longitudes —sobre el eje y desde los dos</text>
  <text x="40" y="395" font-size="9.5" fill="#666">bordes de la banda, todas paralelas al eje— y toma el promedio o el máximo.</text>
  <text x="40" y="412" font-size="9.5" fill="#666">El Comentario J4.4 admite que en un gusset de esquina, restringido</text>
  <text x="40" y="425" font-size="9.5" fill="#666">en dos bordes, <tspan font-weight="bold" fill="#c0392b">es difícil establecer tanto L como K</tspan>, y remite a la</text>
  <text x="40" y="438" font-size="9.5" fill="#666">guía empírica de Dowswell (2006).</text>

  <!-- ================= PANEL B ================= -->
  <text x="400" y="54" font-size="12" fill="#1a63a8" font-weight="bold">B · Pandea fuera del plano</text>
  <text x="400" y="70" font-size="10" fill="#666">Vista de canto</text>

  <rect x="400" y="336" width="165" height="14" fill="url(#hatch)" stroke="#8a857c" stroke-width="1"/>
  <text x="482" y="366" font-size="9.5" text-anchor="middle" fill="#555">borde soldado a la viga</text>

  <!-- plancha recta -->
  <rect x="474" y="140" width="7" height="196" fill="#dfe5ec" stroke="#333" stroke-width="1.3"/>
  <text x="492" y="150" font-size="9.5" fill="#555">t</text>

  <!-- forma pandeada -->
  <path d="M477,336 C 500,270 528,210 512,142" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="528" y="232" font-size="9.5" fill="#c0392b" font-weight="bold">pandeo</text>
  <text x="528" y="244" font-size="9.5" fill="#c0392b">fuera del</text>
  <text x="528" y="256" font-size="9.5" fill="#c0392b">plano</text>

  <!-- carga -->
  <line x1="477" y1="116" x2="477" y2="136" stroke="#c0392b" stroke-width="2.2" marker-end="url(#ar)"/>
  <text x="477" y="110" font-size="10" text-anchor="middle" fill="#c0392b" font-weight="bold">P</text>

  <!-- cota Lc -->
  <line x1="440" y1="140" x2="440" y2="336" stroke="#555" stroke-width="0.9" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="432" y="236" font-size="11" text-anchor="end" fill="#555" font-weight="bold">L<tspan font-size="8" dy="2">c</tspan></text>
  <text x="432" y="252" font-size="10" text-anchor="end" fill="#555">= K·L</text>

  <text x="400" y="400" font-size="9.5" fill="#666">K depende de cuántos bordes</text>
  <text x="400" y="413" font-size="9.5" fill="#666">están restringidos, y de si el</text>
  <text x="400" y="426" font-size="9.5" fill="#666">borde libre está ahusado.</text>

  <!-- ================= PANEL C ================= -->
  <text x="600" y="54" font-size="12" fill="#1a63a8" font-weight="bold">C · Las dos ramas de J4.4</text>

  <rect x="600" y="66" width="248" height="86" fill="#2c7a4b" fill-opacity="0.08" stroke="#2c7a4b" stroke-width="1.2"/>
  <text x="612" y="86" font-size="10.5" fill="#2c7a4b" font-weight="bold">L<tspan font-size="8" dy="2">c</tspan><tspan dy="-2">/r ≤ 25</tspan></text>
  <text x="612" y="106" font-size="12" fill="#222" font-weight="bold">P<tspan font-size="9" dy="2">n</tspan><tspan dy="-2"> = F</tspan><tspan font-size="9" dy="2">y</tspan><tspan dy="-2">A</tspan><tspan font-size="9" dy="2">g</tspan><tspan dy="-2">   (Ec. J4-6)</tspan></text>
  <text x="612" y="124" font-size="9.5" fill="#666">φ = 0,90 — no hay reducción por</text>
  <text x="612" y="136" font-size="9.5" fill="#666">pandeo: la plancha desarrolla su fluencia</text>
  <text x="612" y="148" font-size="9.5" fill="#666">completa</text>

  <rect x="600" y="164" width="248" height="72" fill="#c07a00" fill-opacity="0.08" stroke="#c07a00" stroke-width="1.2"/>
  <text x="612" y="184" font-size="10.5" fill="#c07a00" font-weight="bold">L<tspan font-size="8" dy="2">c</tspan><tspan dy="-2">/r &gt; 25</tspan></text>
  <text x="612" y="204" font-size="12" fill="#222" font-weight="bold">aplica el Capítulo E</text>
  <text x="612" y="222" font-size="9.5" fill="#666">la curva de columna completa, con la</text>
  <text x="612" y="234" font-size="9.5" fill="#666">banda de Whitmore como sección</text>

  <rect x="600" y="252" width="248" height="112" fill="#f2f0ec" stroke="#8a857c" stroke-width="1.2"/>
  <text x="724" y="272" font-size="10.5" text-anchor="middle" fill="#222" font-weight="bold">Dónde cae el umbral de 25</text>
  <text x="724" y="294" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">r = t/√12 = 0,289 t</text>
  <text x="724" y="316" font-size="12" text-anchor="middle" fill="#1a63a8" font-weight="bold">L<tspan font-size="9" dy="2">c</tspan><tspan dy="-2"> ≤ 25 r = 7,2 t</tspan></text>
  <text x="612" y="338" font-size="9.5" fill="#666">La franja rectangular tiene ese radio de giro</text>
  <text x="612" y="350" font-size="9.5" fill="#666">exacto, y <tspan font-weight="bold">no depende del ancho</tspan>. Con</text>
  <text x="612" y="362" font-size="9.5" fill="#666">t = 16 mm el umbral son <tspan font-weight="bold" fill="#c0392b">115 mm</tspan>.</text>

  <text x="600" y="392" font-size="9.5" fill="#666">Por eso casi ningún gusset real cae en la</text>
  <text x="600" y="405" font-size="9.5" fill="#666">rama fácil. El Comentario ofrece la salida:</text>
  <text x="600" y="418" font-size="9.5" fill="#666">si el gusset resulta <tspan font-style="italic">compacto</tspan>, puede</text>
  <text x="600" y="431" font-size="9.5" fill="#666">suponerse L<tspan font-size="8" dy="2">c</tspan><tspan dy="-2">/r ≤ 25 sin calcularlo.</tspan></text>
</svg>
