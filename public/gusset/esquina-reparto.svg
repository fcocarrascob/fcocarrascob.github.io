  <text x="159.2" y="216.0" font-size="10" text-anchor="end" fill="#2c7a4b" font-weight="bold">L_c = 60</text>
  <text x="40" y="502" font-size="10.5" fill="#c0392b" font-weight="bold">La condición geométrica del UFM, dicha con un dibujo: el punto (a, b) cae SOBRE el eje de la diagonal.</text>
  <text x="40" y="522" font-size="9.5" fill="#666">Es lo mismo que tan θ = (α+e_c)/(β+e_b) = 0,750 = 0,750. Si no se cumple, aparece un momento en las interfaces y hay que superponerlo.</text>
  <text x="40" y="540" font-size="9.5" fill="#666">Con ella cumplida, ΣM se reduce a α·V_c = β·V_b — y quedan 3 ecuaciones para 4 incógnitas.</text>
  <text x="468" y="56" font-size="12" fill="#1a63a8" font-weight="bold">B · Tres cierres, los tres en equilibrio</text>
  <text x="468" y="72" font-size="10" fill="#666">P = 98,00 tonf · Px = 58,80 · Py = 78,40 tonf</text>
