  <text x="468" y="124" font-size="9.5" fill="#666" font-weight="normal">A · KISS (V→viga, H→columna)</text>
  <text x="668" y="124" font-size="10" text-anchor="end" fill="#666" font-weight="normal">0,00</text>
  <text x="722" y="124" font-size="10" text-anchor="end" fill="#666" font-weight="normal">78,40</text>
  <text x="776" y="124" font-size="10" text-anchor="end" fill="#666" font-weight="normal">58,80</text>
  <text x="830" y="124" font-size="10" text-anchor="end" fill="#666" font-weight="normal">0,00</text>
  <text x="834" y="139" font-size="9" text-anchor="end" fill="#2c7a4b">ΣFx = ΣFy = ΣM = 0 ✓</text>
  <text x="468" y="164" font-size="9.5" fill="#c0392b" font-weight="bold">B · UFM (P/r por su brazo)</text>
  <text x="668" y="164" font-size="10" text-anchor="end" fill="#c0392b" font-weight="bold">32,67</text>
  <text x="722" y="164" font-size="10" text-anchor="end" fill="#c0392b" font-weight="bold">39,20</text>
  <text x="776" y="164" font-size="10" text-anchor="end" fill="#c0392b" font-weight="bold">26,13</text>
  <text x="830" y="164" font-size="10" text-anchor="end" fill="#c0392b" font-weight="bold">39,20</text>
  <text x="834" y="179" font-size="9" text-anchor="end" fill="#2c7a4b">ΣFx = ΣFy = ΣM = 0 ✓</text>
  <text x="468" y="204" font-size="9.5" fill="#666" font-weight="normal">C · resultantes al punto de trabajo</text>
  <text x="668" y="204" font-size="10" text-anchor="end" fill="#666" font-weight="normal">42,00</text>
  <text x="722" y="204" font-size="10" text-anchor="end" fill="#666" font-weight="normal">28,00</text>
  <text x="776" y="204" font-size="10" text-anchor="end" fill="#666" font-weight="normal">16,80</text>
  <text x="830" y="204" font-size="10" text-anchor="end" fill="#666" font-weight="normal">50,40</text>
  <text x="834" y="219" font-size="9" text-anchor="end" fill="#2c7a4b">ΣFx = ΣFy = ΣM = 0 ✓</text>
  <rect x="468" y="248" width="368" height="76" fill="#c0392b" fill-opacity="0.07" stroke="#c0392b" stroke-width="1.4"/>
  <text x="652" y="270" font-size="11.5" text-anchor="middle" fill="#222" font-weight="bold">Lo que distingue al UFM</text>
  <text x="652" y="290" font-size="12" text-anchor="middle" fill="#c0392b" font-weight="bold">V_b/L_b = V_c/L_c = P/(2r) = 0,653 tonf/cm</text>
  <text x="652" y="308" font-size="9.5" text-anchor="middle" fill="#666">el flujo de corte es el mismo en las dos interfaces: de ahí «fuerza uniforme»</text>
  <rect x="468" y="340" width="368" height="62" fill="#c07a00" fill-opacity="0.09" stroke="#c07a00" stroke-width="1.2"/>
