  <text x="478" y="374" font-size="10.5" fill="#222" font-weight="bold">V_b = 42,00  N_b = 78,40  N_c = 58,80  V_c = 50,40 tonf</text>
  <text x="478" y="392" font-size="9.5" fill="#c0392b">No está en equilibrio: es una cota de diseño, no un estado.</text>
