<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 505" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="rr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="880" height="505" fill="#ffffff"/>
  <text x="440" y="26" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">La rótula del gusset: la holgura no es un descuido de dibujo, es el mecanismo</text>

  <!-- ================= PANEL A ================= -->
  <text x="40" y="54" font-size="12" fill="#1a63a8" font-weight="bold">A · Cómo se mide la holgura 2t — el detalle que más se equivoca</text>
  <text x="40" y="70" font-size="10" fill="#666">No es la distancia al borde: es al pie de la perpendicular al eje de la diagonal</text>

  <!-- columna y viga -->
  <rect x="50" y="80" width="26" height="270" fill="#dcd8d0" stroke="#666" stroke-width="1.2"/>
  <rect x="50" y="330" width="380" height="26" fill="#dcd8d0" stroke="#666" stroke-width="1.2"/>

  <!-- gusset -->
  <polygon points="76,330 76,150 300,330" fill="#eef2f7" stroke="#333" stroke-width="1.6"/>

  <!-- eje -->
  <line x1="76" y1="330" x2="340" y2="66" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>

  <!-- punto restringido y linea de restriccion -->
  <circle cx="196.2" cy="330" r="4" fill="#2c7a4b"/>
  <text x="204" y="348" font-size="9.5" fill="#2c7a4b" font-weight="bold">punto restringido más cercano</text>
  <line x1="118.4" y1="252.2" x2="196.2" y2="330" stroke="#2c7a4b" stroke-width="2.2"/>
  <text x="84" y="232" font-size="9.5" fill="#2c7a4b" font-weight="bold">línea de</text>
  <text x="84" y="244" font-size="9.5" fill="#2c7a4b" font-weight="bold">restricción</text>

  <!-- diagonal pandeada (fantasma) -->
  <polygon points="180.6,194.2 293.7,81.1 324.9,112.3 211.8,225.4" fill="none" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="6 4" transform="rotate(9 160.9 244.7)"/>

  <!-- diagonal -->
  <polygon points="180.6,194.2 293.7,81.1 324.9,112.3 211.8,225.4" fill="#dfe5ec" stroke="#333" stroke-width="1.6"/>
  <text x="330" y="86" font-size="10.5" fill="#333" font-weight="bold">diagonal</text>
  <circle cx="196.2" cy="209.8" r="3.4" fill="#c0392b"/>
  <text x="230" y="205" font-size="9.5" fill="#c0392b" font-weight="bold">extremo</text>

  <!-- rotula -->
  <line x1="136.2" y1="220" x2="185.6" y2="269.4" stroke="#c0392b" stroke-width="3.4"/>
  <text x="112" y="292" font-size="10" fill="#c0392b" font-weight="bold">rótula plástica</text>
  <text x="112" y="304" font-size="9.5" fill="#c0392b">del gusset</text>

  <!-- cota 2t -->
  <line x1="114.9" y1="248.7" x2="175" y2="188.6" stroke="#555" stroke-width="0.9" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="132" y="212" font-size="12" fill="#222" font-weight="bold">2t</text>

  <!-- giro fuera del plano -->
  <path d="M300,150 A50,50 0 0,1 330,186" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#rr)"/>
  <text x="344" y="168" font-size="9.5" fill="#c0392b">giro al</text>
  <text x="344" y="180" font-size="9.5" fill="#c0392b">pandear</text>

  <text x="40" y="382" font-size="9.5" fill="#666">La holgura deja una franja de plancha libre para plastificar. Si el extremo</text>
  <text x="40" y="395" font-size="9.5" fill="#666">de la diagonal llega hasta la línea de restricción, el giro no tiene dónde</text>
  <text x="40" y="408" font-size="9.5" fill="#666">ocurrir y <tspan font-weight="bold" fill="#c0392b">la conexión se fractura antes de que la diagonal trabaje</tspan>.</text>

  <!-- ================= PANEL B ================= -->
  <text x="470" y="54" font-size="12" fill="#1a63a8" font-weight="bold">B · Tres modelos, y el que conviene no es el más antiguo</text>

  <!-- fila 1 -->
  <rect x="470" y="66" width="368" height="52" fill="#f4f6f9" stroke="#8a857c" stroke-width="1"/>
  <line x1="486" y1="80" x2="486" y2="104" stroke="#c0392b" stroke-width="2.4"/>
  <text x="504" y="84" font-size="11" fill="#222" font-weight="bold">Lineal 2t</text>
  <text x="504" y="98" font-size="9.5" fill="#666">Astaneh-Asl (1986, 1998). El clásico; muy efectivo</text>
  <text x="504" y="110" font-size="9.5" fill="#666">con gussets ahusados</text>

  <!-- fila 2 -->
  <rect x="470" y="122" width="368" height="52" fill="#f4f6f9" stroke="#8a857c" stroke-width="1"/>
  <ellipse cx="486" cy="148" rx="8" ry="13" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="504" y="140" font-size="11" fill="#222" font-weight="bold">Elíptica 8t</text>
  <text x="504" y="154" font-size="9.5" fill="#666">Roeder et al. (2011). Para gussets de esquina</text>
  <text x="504" y="166" font-size="9.5" fill="#666">— el caso de un marco arriostrado</text>

  <!-- fila 3 -->
  <rect x="470" y="178" width="368" height="52" fill="#f4f6f9" stroke="#8a857c" stroke-width="1"/>
  <line x1="476" y1="204" x2="498" y2="204" stroke="#c0392b" stroke-width="2.4"/>
  <text x="504" y="196" font-size="11" fill="#222" font-weight="bold">Horizontal 6t</text>
  <text x="504" y="210" font-size="9.5" fill="#666">Roeder et al. (2011). Para gussets de vano</text>
  <text x="504" y="222" font-size="9.5" fill="#666">medio (el ápice de un chevron)</text>

  <!-- caja contraintuitiva -->
  <rect x="470" y="244" width="368" height="86" fill="#c07a00" fill-opacity="0.09" stroke="#c07a00" stroke-width="1.4"/>
  <text x="654" y="264" font-size="11.5" text-anchor="middle" fill="#222" font-weight="bold">Más holgura → plancha más delgada</text>
  <text x="654" y="280" font-size="11.5" text-anchor="middle" fill="#222" font-weight="bold">→ MÁS capacidad inelástica</text>
  <text x="482" y="300" font-size="9.5" fill="#666">Con el modelo 2t el pandeo del propio gusset puede</text>
  <text x="482" y="312" font-size="9.5" fill="#666">controlar el diseño, porque la plancha debe impedir su</text>
  <text x="482" y="324" font-size="9.5" fill="#666">pandeo antes que el del miembro que protege.</text>

  <!-- cita NCh -->
  <rect x="470" y="342" width="368" height="66" fill="#1a63a8" fill-opacity="0.07" stroke="#1a63a8" stroke-width="1.2"/>
  <text x="482" y="360" font-size="9.5" fill="#1a63a8" font-weight="bold">NCh2369:2025, comentario C8.6.9</text>
  <text x="482" y="376" font-size="9.5" fill="#333" font-style="italic">«cuidar que la geometría de la placa gusset sea capaz</text>
  <text x="482" y="388" font-size="9.5" fill="#333" font-style="italic">de producir el giro plástico estable en lugar de</text>
  <text x="482" y="400" font-size="9.5" fill="#333" font-style="italic">robustecerla y trasladar la plastificación al elemento»</text>

  <!-- ================= FRANJA INFERIOR ================= -->
  <line x1="40" y1="428" x2="838" y2="428" stroke="#dcd8d0" stroke-width="1"/>
  <text x="40" y="450" font-size="10.5" fill="#222" font-weight="bold">El gusset completo es zona protegida</text>
  <text x="40" y="466" font-size="9.5" fill="#666">AISC 341-22 §F2.5c(b): sin perforaciones, sin fijaciones de instalaciones, sin soldaduras ajenas. §A4.2(g) obliga a acotarlo en planos.</text>
  <text x="40" y="484" font-size="9.5" fill="#666">Es coherente con todo lo anterior: si la plancha es la que debe plastificar de forma estable, cualquier agujero ajeno cambia el mecanismo que se diseñó.</text>
</svg>
