  <rect width="880" height="608" fill="#ffffff"/>
  <text x="440" y="24" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">El nudo simple: gusset de un solo borde, diagonal tubular a 45° — una sola interfaz, sin UFM</text>
  <text x="272" y="44" font-size="11.5" fill="#1a63a8" text-anchor="middle" font-weight="bold">A · SOLDADO — el detalle chileno típico</text>
  <rect x="58" y="50" width="370" height="46" fill="#dcd8d0" stroke="#666" stroke-width="1.2"/>
