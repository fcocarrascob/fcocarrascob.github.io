  <text x="246" y="300" font-size="9.8" fill="#c0392b" font-weight="bold">filetes longitudinales</text>
  <line x1="204.5" y1="215.2" x2="243.5" y2="317.5" stroke="#1a63a8" stroke-width="0.8"/>
  <text x="246" y="324" font-size="10" fill="#1a63a8" font-weight="bold">dos bandas, no una</text>
  <text x="246" y="338" font-size="9.5" fill="#1a63a8">llena 30° → compresión (Com. J4.4)</text>
  <text x="246" y="351" font-size="9.5" fill="#1a63a8">punteada 45° → tracción (Com. J4.1)</text>
  <text x="246" y="364" font-size="9.5" fill="#c0392b">acá la de tracción se sale: el gusset la recorta</text>
  <line x1="86" y1="313.1" x2="61.8" y2="350.1" stroke="#222" stroke-width="0.8"/>
  <text x="58" y="356" font-size="9.8" fill="#222" font-weight="bold">□ 150×150×8 ranurado</text>
  <line x1="272" y1="96" x2="310" y2="118.4" stroke="#c0392b" stroke-width="0.8"/>
  <text x="316" y="122" font-size="9.8" fill="#c0392b" font-weight="bold">PT sin excentricidad</text>
  <line x1="639.5" y1="169.4" x2="686.8" y2="261.8" stroke="#1a63a8" stroke-width="0.8"/>
  <text x="690" y="268" font-size="9.8" fill="#1a63a8" font-weight="bold">entra con el gramil,</text>
  <text x="690" y="281" font-size="9.8" fill="#1a63a8" font-weight="bold">no en punta · acá las dos caben</text>
  <line x1="626.7" y1="177" x2="686.9" y2="299.7" stroke="#2c7a4b" stroke-width="0.8"/>
  <text x="690" y="306" font-size="9.8" fill="#2c7a4b" font-weight="bold">2 filas de 3 pernos, en terreno</text>
  <line x1="527.9" y1="289.7" x2="683.3" y2="337.9" stroke="#a07a2c" stroke-width="0.8"/>
  <text x="690" y="340" font-size="9.8" fill="#a07a2c" font-weight="bold">2 planchas a las caras del tubo</text>
  <text x="690" y="353" font-size="9.5" fill="#a07a2c">soldadas en taller → corte doble, sin ranura</text>
  <line x1="485.4" y1="323.7" x2="471.3" y2="349.8" stroke="#222" stroke-width="0.8"/>
  <text x="468" y="356" font-size="9.8" fill="#222" font-weight="bold">□ 150×150×8</text>
  <line x1="40" y1="384" x2="840" y2="384" stroke="#dcd8d0" stroke-width="1"/>
  <text x="40" y="402" font-size="11" fill="#222" font-weight="bold">Cuatro estados límite del gusset, idénticos en las dos variantes — y ahí está la lección</text>
  <rect x="40" y="412" width="390" height="104" fill="#1a63a8" fill-opacity="0.07" stroke="#1a63a8" stroke-width="1.2"/>
  <text x="52" y="430" font-size="10.5" fill="#1a63a8" font-weight="bold">A · soldado — 67,1 cm en tracción (recortada), 55,4 en compresión</text>
  <text x="52" y="448" font-size="9.8" fill="#222">Whitmore: fluencia J4-1 · rotura J4-2 con Aₙ = A_g</text>
  <text x="52" y="463" font-size="9.8" fill="#222">Bloque de corte J4-5: los planos son los cordones</text>
  <text x="52" y="478" font-size="9.8" fill="#222">Pandeo J4.4: L_c/r = 70,9 → Capítulo E, no la rama J4-6</text>
  <text x="52" y="493" font-size="9.8" fill="#222">De pasada: filetes §J2.4 y Caso 5 de la Tabla D3.1</text>
  <rect x="450" y="412" width="390" height="104" fill="#2c7a4b" fill-opacity="0.07" stroke="#2c7a4b" stroke-width="1.2"/>
  <text x="462" y="430" font-size="10.5" fill="#2c7a4b" font-weight="bold">B · apernado — 45,0 cm en tracción, 29,8 en compresión</text>
  <text x="462" y="448" font-size="9.8" fill="#222">Whitmore: acá la rotura J4-2 sí compite (dos agujeros)</text>
  <text x="462" y="463" font-size="9.8" fill="#222">Bloque de corte J4-5 en U: dos planos, tracción al medio</text>
  <text x="462" y="478" font-size="9.8" fill="#222">Pandeo J4.4: L_c/r = 49,7 → Capítulo E. GOBIERNA</text>
  <text x="462" y="493" font-size="9.8" fill="#222">De pasada: pernos §J3.11 y las planchas (fluencia y rotura)</text>
  <text x="40" y="547" font-size="9.8" fill="#666">Los cuatro estados son los mismos, y sobre la misma plancha: lo único que cambia es el ancho que cada unión alcanza a movilizar. Ese ancho lo fija el</text>
  <text x="40" y="561" font-size="9.8" fill="#666">largo de transferencia, no los agujeros. En el panel B la parte dispersada va √3 y la banda entera 1,51; en el A el tope de la plancha rompe las dos razones.</text>
  <text x="40" y="578" font-size="9.8" fill="#c0392b" font-weight="bold">La rama compacta de J4.4(a) exige L ≤ 6,01·t y la banda de tracción exige L ≥ w/2: juntas piden t ≥ w/12, o sea 37 mm acá. Por eso J4-6 no aplica.</text>
  <text x="40" y="592" font-size="9.8" fill="#1a63a8" font-weight="bold">Los dos ángulos y la columna equivalente no están en el cuerpo de AISC 360-22: viven en los Comentarios a J4.1 y J4.4.</text>
</svg>
