  <text x="248" y="199" font-size="9.5" text-anchor="end" fill="#222">Gusset — aplast. + desgarre</text>
  <rect x="258" y="187" width="296.6" height="16" fill="#8a857c" fill-opacity="0.16" stroke="#8a857c" stroke-width="0.7"/>
  <rect x="258" y="187" width="163.5" height="16" fill="#2c7a4b" fill-opacity="0.55"/>
  <text x="562.6" y="199" font-size="9.5" fill="#2c7a4b" font-weight="bold">0,551</text>
  <text x="248" y="222" font-size="9.5" text-anchor="end" fill="#222">Interfaz viga — normal al borde</text>
  <rect x="258" y="210" width="380.0" height="16" fill="#8a857c" fill-opacity="0.16" stroke="#8a857c" stroke-width="0.7"/>
  <rect x="258" y="210" width="130.8" height="16" fill="#2c7a4b" fill-opacity="0.55"/>
  <text x="646.0" y="222" font-size="9.5" fill="#2c7a4b" font-weight="bold">0,344</text>
  <text x="248" y="245" font-size="9.5" text-anchor="end" fill="#222">Interfaz columna — corte del borde</text>
  <rect x="258" y="233" width="304.0" height="16" fill="#8a857c" fill-opacity="0.16" stroke="#8a857c" stroke-width="0.7"/>
  <rect x="258" y="233" width="84.1" height="16" fill="#2c7a4b" fill-opacity="0.55"/>
  <text x="570.0" y="245" font-size="9.5" fill="#2c7a4b" font-weight="bold">0,277</text>
  <text x="258" y="268" font-size="9.5" fill="#666">Barra clara = capacidad · sólida = demanda · el número es el factor de uso</text>
  <line x1="40" y1="294" x2="840" y2="294" stroke="#dcd8d0" stroke-width="1"/>
  <text x="40" y="318" font-size="12" fill="#1a63a8" font-weight="bold">B · Las tres longitudes de pandeo, y el umbral de J4-6</text>
  <text x="248" y="345" font-size="9.5" text-anchor="end" fill="#222">L₁ · sobre el eje</text>
  <rect x="258" y="334" width="339.3" height="14" fill="#666" fill-opacity="0.45" stroke="#666" stroke-width="0.8"/>
  <text x="605.3" y="345" font-size="9.5" fill="#666" font-weight="bold">22,50 cm</text>
  <text x="248" y="367" font-size="9.5" text-anchor="end" fill="#222">L₂ · borde exterior de la banda</text>
  <rect x="258" y="356" width="180.0" height="14" fill="#666" fill-opacity="0.45" stroke="#666" stroke-width="0.8"/>
  <text x="446.0" y="367" font-size="9.5" fill="#666" font-weight="bold">11,94 cm</text>
  <text x="248" y="389" font-size="9.5" text-anchor="end" fill="#222">L₃ · borde interior de la banda</text>
  <rect x="258" y="378" width="119.0" height="14" fill="#666" fill-opacity="0.45" stroke="#666" stroke-width="0.8"/>
  <text x="385.0" y="389" font-size="9.5" fill="#666" font-weight="bold">7,89 cm</text>
  <text x="248" y="411" font-size="9.5" text-anchor="end" fill="#222">promedio de las tres</text>
  <rect x="258" y="400" width="212.8" height="14" fill="#2c7a4b" fill-opacity="0.45" stroke="#2c7a4b" stroke-width="0.8"/>
  <text x="478.8" y="411" font-size="9.5" fill="#2c7a4b" font-weight="bold">14,11 cm</text>
  <text x="248" y="433" font-size="9.5" text-anchor="end" fill="#222">máximo (el adoptado)</text>
  <rect x="258" y="422" width="339.3" height="14" fill="#c0392b" fill-opacity="0.45" stroke="#c0392b" stroke-width="0.8"/>
  <text x="605.3" y="433" font-size="9.5" fill="#c0392b" font-weight="bold">22,50 cm</text>
  <line x1="439.4" y1="326" x2="439.4" y2="446" stroke="#1a63a8" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="445.4" y="322" font-size="10" fill="#1a63a8" font-weight="bold">umbral de J4-6 sobre L: 25r/K = 12,03 cm</text>
  <text x="258" y="466" font-size="9.5" fill="#666">El umbral de J4-6 es sobre <tspan font-weight="bold">L_c = K·L</tspan>, no sobre L: con K = 1.2 equivale a L ≤ 12,03 cm.</text>
  <text x="258" y="480" font-size="9.5" fill="#666"><tspan font-weight="bold" fill="#c0392b">Las dos longitudes lo superan</tspan>, así que ambas caen en el Capítulo E: la elección cambia el <tspan font-style="italic">valor</tspan></text>
  <text x="258" y="494" font-size="9.5" fill="#666">(122,59 → 114,32 tonf, −6,7 %), no la rama. Se adopta el máximo, y es el que gobierna la hoja.</text>
</svg>