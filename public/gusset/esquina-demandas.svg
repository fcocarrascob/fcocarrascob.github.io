  <text x="248" y="176" font-size="9.5" text-anchor="end" fill="#222">Viga — fluencia local del alma</text>
  <rect x="258" y="164" width="219.6" height="16" fill="#8a857c" fill-opacity="0.16" stroke="#8a857c" stroke-width="0.7"/>
  <rect x="258" y="164" width="130.8" height="16" fill="#2c7a4b" fill-opacity="0.55"/>
