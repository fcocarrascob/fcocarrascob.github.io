  <text x="481.2" y="130" font-size="9.5" fill="#c07a00" font-weight="bold">0,760</text>
  <text x="248" y="153" font-size="9.5" text-anchor="end" fill="#222">Gusset — Whitmore, rotura</text>
  <rect x="258" y="141" width="234.6" height="16" fill="#8a857c" fill-opacity="0.16" stroke="#8a857c" stroke-width="0.7"/>
