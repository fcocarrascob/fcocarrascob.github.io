  <rect width="880" height="480" fill="#ffffff"/>
  <text x="440.0" y="26" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">Gobierna el pandeo del gusset — y la longitud de Thornton que se elija mueve la capacidad un 6,7 %</text>
  <text x="40" y="56" font-size="12" fill="#1a63a8" font-weight="bold">A · Demanda contra capacidad de diseño</text>
  <text x="248" y="84" font-size="9.5" text-anchor="end" fill="#222">Gusset — pandeo (L máx, K = 1,2)</text>
  <rect x="258" y="72" width="190.8" height="16" fill="#8a857c" fill-opacity="0.16" stroke="#8a857c" stroke-width="0.7"/>
  <rect x="258" y="72" width="163.5" height="16" fill="#c0392b" fill-opacity="0.55"/>
  <text x="456.8" y="84" font-size="9.5" fill="#c0392b" font-weight="bold">0,857</text>
  <text x="248" y="107" font-size="9.5" text-anchor="end" fill="#222">Gusset — Whitmore, fluencia</text>
