<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" font-family="Segoe UI, Arial, sans-serif">
  <rect width="940" height="500" fill="#ffffff"/>
  <text x="470.0" y="28" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">Qué mueve el arrastre</text>
  <text x="470.0" y="49" font-size="12" text-anchor="middle" fill="#666">Caso base: Q<tspan font-size="0.72em" baseline-shift="sub">n</tspan> = 61,43 tonf por pilote. Escala única de 3,6 px por punto porcentual.</text>
  <line x1="660" y1="74" x2="660" y2="350" stroke="#8a857c" stroke-width="1.6"/>
  <line x1="390.0" y1="74" x2="390.0" y2="350" stroke="#e5e2dc"/>
  <text x="390.0" y="367" font-size="10" fill="#aaa" text-anchor="middle">−75 %</text>
  <line x1="480.0" y1="74" x2="480.0" y2="350" stroke="#e5e2dc"/>
  <text x="480.0" y="367" font-size="10" fill="#aaa" text-anchor="middle">−50 %</text>
  <line x1="570.0" y1="74" x2="570.0" y2="350" stroke="#e5e2dc"/>
  <text x="570.0" y="367" font-size="10" fill="#aaa" text-anchor="middle">−25 %</text>
  <line x1="750.0" y1="74" x2="750.0" y2="350" stroke="#e5e2dc"/>
  <text x="750.0" y="367" font-size="10" fill="#aaa" text-anchor="middle">+25 %</text>
  <text x="660" y="367" font-size="10.5" fill="#666" text-anchor="middle">caso base · 61,43 tonf</text>
  <text x="318.8" y="99" font-size="12.5" fill="#b02a1a" text-anchor="end" font-weight="bold">Betún en la zona de arrastre</text>
  <rect x="336.0" y="84" width="324.0" height="20" fill="#b02a1a" fill-opacity="0.85"/>
  <text x="346.0" y="99" font-size="12" fill="#ffffff" font-weight="bold">6,14 tonf · −90,0 %</text>
  <text x="318.8" y="129" font-size="12.5" fill="#b35c0e" text-anchor="end" font-weight="bold">Pilote de 0,80 m en vez de 0,60</text>
  <rect x="660.0" y="114" width="120.0" height="20" fill="#b35c0e" fill-opacity="0.85"/>
  <text x="788.0" y="129" font-size="12" fill="#b35c0e" font-weight="bold">81,90 tonf · +33,3 %</text>
  <text x="318.8" y="159" font-size="12.5" fill="#1a63a8" text-anchor="end" font-weight="bold">Relleno de 5,0 m en vez de 3,0</text>
  <rect x="660.0" y="144" width="114.8" height="20" fill="#1a63a8" fill-opacity="0.85"/>
  <text x="782.8" y="159" font-size="12" fill="#1a63a8" font-weight="bold">81,03 tonf · +31,9 %</text>
  <text x="318.8" y="189" font-size="12" fill="#555" text-anchor="end">Pilote de 0,45 m</text>
  <rect x="570.0" y="174" width="90.0" height="20" fill="#b35c0e" fill-opacity="0.65"/>
  <text x="562.0" y="189" font-size="12" fill="#b35c0e" text-anchor="end" font-weight="bold">46,07 tonf · −25,0 %</text>
  <text x="318.8" y="219" font-size="12" fill="#555" text-anchor="end">Relleno de 1,5 m</text>
  <rect x="573.9" y="204" width="86.1" height="20" fill="#1a63a8" fill-opacity="0.65"/>
  <text x="565.9" y="219" font-size="12" fill="#1a63a8" text-anchor="end" font-weight="bold">46,73 tonf · −23,9 %</text>
  <text x="318.8" y="249" font-size="12" fill="#555" text-anchor="end">δ′ = 0,7 φ′ (borde superior de Das)</text>
  <rect x="660.0" y="234" width="63.9" height="20" fill="#6a7280" fill-opacity="0.65"/>
  <text x="731.9" y="249" font-size="12" fill="#6a7280" font-weight="bold">72,34 tonf · +17,8 %</text>
  <text x="318.8" y="279" font-size="12" fill="#555" text-anchor="end">δ′ = 0,5 φ′ (borde inferior de Das)</text>
  <rect x="597.7" y="264" width="62.3" height="20" fill="#6a7280" fill-opacity="0.65"/>
  <text x="589.7" y="279" font-size="12" fill="#6a7280" text-anchor="end" font-weight="bold">50,79 tonf · −17,3 %</text>
  <text x="318.8" y="309" font-size="12" fill="#555" text-anchor="end">φ′ = 24°</text>
  <rect x="649.7" y="294" width="10.3" height="20" fill="#6a7280" fill-opacity="0.65"/>
  <text x="641.7" y="309" font-size="12" fill="#6a7280" text-anchor="end" font-weight="bold">59,67 tonf · −2,9 %</text>
  <text x="318.8" y="339" font-size="12" fill="#555" text-anchor="end">φ′ = 28° (arcilla menos plástica)</text>
  <rect x="660.0" y="324" width="7.7" height="20" fill="#6a7280" fill-opacity="0.65"/>
  <text x="675.7" y="339" font-size="12" fill="#6a7280" font-weight="bold">62,75 tonf · +2,1 %</text>
  <rect x="60" y="388" width="820" height="98" rx="6" fill="#f7f6f3" stroke="#8a857c"/>
  <text x="470.0" y="414" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">Lo que mueve el arrastre son decisiones, no parámetros del suelo.</text>
  <text x="470.0" y="438" font-size="12.5" text-anchor="middle" fill="#555">Los ±2° de φ′ —el dato que se discute en el informe— valen menos de un 3 %. El espesor del relleno, el diámetro del pilote</text>
  <text x="470.0" y="460" font-size="12.5" text-anchor="middle" fill="#555">y la elección de δ′ dentro del rango que el propio Das declara valen entre un 17 % y un 33 % cada uno. Y el betún,</text>
  <text x="470.0" y="482" font-size="12.5" text-anchor="middle" fill="#555">que es una decisión de proyecto y no un número, vale un 90 %.</text>
</svg>
