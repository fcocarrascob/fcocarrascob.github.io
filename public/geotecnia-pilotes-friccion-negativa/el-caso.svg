<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" font-family="Segoe UI, Arial, sans-serif">
  <rect width="940" height="620" fill="#ffffff"/>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b02a1a"/></marker>
    <marker id="fn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b35c0e"/></marker>
  </defs>
  <text x="470.0" y="28" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">El caso: cabezal de una torre de traspaso sobre un relleno reciente</text>
  <text x="470.0" y="49" font-size="12" text-anchor="middle" fill="#666">3 m de relleno granular colocados sobre 17 m de arcilla blanda. La arcilla consolida, el suelo baja 34 cm y el pilote no.</text>
  <text x="240" y="120" font-size="12" fill="#b35c0e" font-weight="bold">V = 60 tonf (h = 4,00 m)</text>
  <line x1="240" y1="139" x2="301" y2="139" stroke="#b35c0e" stroke-width="2.2" marker-end="url(#fn)"/>
  <line x1="400" y1="92" x2="400" y2="120" stroke="#b02a1a" stroke-width="2.4" marker-end="url(#fl)"/>
  <text x="412" y="110" font-size="12" fill="#b02a1a" font-weight="bold">D = 360 tonf · L = 95 tonf</text>
  <rect x="60" y="150.0" width="440" height="43.636363636363626" fill="#e8ddc8"/>
  <rect x="60" y="193.63636363636363" width="440" height="247.27272727272725" fill="#cfd8dc"/>
  <rect x="60" y="440.9090909090909" width="440" height="29.090909090909122" fill="#d7ccc1"/>
  <line x1="60" y1="150.0" x2="500" y2="150.0" stroke="#8a857c" stroke-width="1.2"/>
  <line x1="60" y1="193.63636363636363" x2="500" y2="193.63636363636363" stroke="#8a857c" stroke-width="1.2"/>
  <line x1="60" y1="440.9090909090909" x2="500" y2="440.9090909090909" stroke="#8a857c" stroke-width="1.2"/>
  <text x="70" y="164.54545454545453" font-size="11.5" fill="#5b4c2a">Relleno granular · 3,00 m</text>
  <text x="70" y="183.45454545454544" font-size="11.5" fill="#5b4c2a">γ = 1,95 tonf/m³</text>
  <text x="70" y="251.8181818181818" font-size="11.5" fill="#31505c">Arcilla blanda · 17,00 m</text>
  <text x="70" y="270.72727272727275" font-size="11.5" fill="#31505c">γ′ = 0,75 tonf/m³ · φ′ = 26°</text>
  <text x="70" y="289.6363636363636" font-size="11.5" fill="#31505c">s<tspan font-size="0.72em" baseline-shift="sub">u</tspan> = 3,0 tonf/m² · OCR 1,4</text>
  <text x="70" y="455.45454545454544" font-size="11.5" fill="#5b4326">Grava densa · desde 20,00 m</text>
  <path d="M 255 193.63636363636363 l 7 -9 l 7 9 z" fill="#1a63a8"/>
  <text x="269" y="189.63636363636363" font-size="11" fill="#1a63a8">napa</text>
  <rect x="305" y="124.0" width="190" height="26" fill="#dfe3e8" stroke="#222" stroke-width="1.2"/>
  <text x="400" y="141.0" font-size="11" text-anchor="middle" fill="#222">cabezal 4,40 × 4,40 × 1,00 m</text>
  <rect x="333" y="150.0" width="14" height="305.45454545454544" fill="#cfc9c0" stroke="#222" stroke-width="1.1"/>
  <rect x="393" y="150.0" width="14" height="305.45454545454544" fill="#cfc9c0" stroke="#222" stroke-width="1.1"/>
  <rect x="453" y="150.0" width="14" height="305.45454545454544" fill="#cfc9c0" stroke="#222" stroke-width="1.1"/>
  <text x="280.0" y="488.0" font-size="11.5" text-anchor="middle" fill="#222">9 pilotes pre-excavados Ø 0,60 m · L = 21,0 m · s = 1,80 m (3D)</text>
  <text x="540" y="150" font-size="13" fill="#222" font-weight="bold">Por qué 10.2.4 aplica</text>
  <text x="540" y="178" font-size="12" fill="#555">Sobrecarga del relleno sobre la arcilla</text>
  <text x="880" y="178" font-size="12" fill="#222" text-anchor="end">Δσ = 5,85 tonf/m²</text>
  <line x1="540" y1="185" x2="880" y2="185" stroke="#e5e2dc"/>
  <text x="540" y="206" font-size="12" fill="#555">Tensión efectiva a media capa, antes</text>
  <text x="880" y="206" font-size="12" fill="#222" text-anchor="end">σ′<tspan font-size="0.72em" baseline-shift="sub">0</tspan> = 6,38 tonf/m²</text>
  <line x1="540" y1="213" x2="880" y2="213" stroke="#e5e2dc"/>
  <text x="540" y="234" font-size="12" fill="#555">Preconsolidación (OCR 1,4)</text>
  <text x="880" y="234" font-size="12" fill="#222" text-anchor="end">σ′<tspan font-size="0.72em" baseline-shift="sub">p</tspan> = 8,93 tonf/m²</text>
  <line x1="540" y1="241" x2="880" y2="241" stroke="#e5e2dc"/>
  <text x="540" y="262" font-size="12" fill="#555">Tensión efectiva final</text>
  <text x="880" y="262" font-size="12" fill="#222" text-anchor="end">σ′<tspan font-size="0.72em" baseline-shift="sub">f</tspan> = 12,23 tonf/m²</text>
  <line x1="540" y1="269" x2="880" y2="269" stroke="#e5e2dc"/>
  <text x="540" y="290" font-size="12" fill="#555">Recompresión (C<tspan font-size="0.72em" baseline-shift="sub">r</tspan> = C<tspan font-size="0.72em" baseline-shift="sub">c</tspan>/6)</text>
  <text x="880" y="290" font-size="12" fill="#222" text-anchor="end">5,2 cm</text>
  <line x1="540" y1="297" x2="880" y2="297" stroke="#e5e2dc"/>
  <text x="540" y="318" font-size="12" fill="#555">Rama virgen (C<tspan font-size="0.72em" baseline-shift="sub">c</tspan> = 0,25)</text>
  <text x="880" y="318" font-size="12" fill="#222" text-anchor="end">29,0 cm</text>
  <line x1="540" y1="325" x2="880" y2="325" stroke="#e5e2dc"/>
  <text x="540" y="354" font-size="13.5" fill="#b02a1a" font-weight="bold">El suelo baja 34 cm</text>
  <text x="880" y="354" font-size="13.5" fill="#b02a1a" text-anchor="end" font-weight="bold">el pilote, milímetros</text>
  <text x="540" y="394" font-size="12" fill="#555">«En aquellos casos en que se prevé el desarrollo de</text>
  <text x="540" y="414" font-size="12" fill="#555">fricción negativa sobre los pilotes…»</text>
  <text x="540" y="434" font-size="12" fill="#666">NCh2369:2025, 10.2.4</text>
  <rect x="60" y="512" width="820" height="84" rx="6" fill="#f7f6f3" stroke="#8a857c"/>
  <text x="470.0" y="538" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">El relleno no es una carga sobre el pilote: es una carga sobre la arcilla.</text>
  <text x="470.0" y="562" font-size="12.5" text-anchor="middle" fill="#555">Al consolidarla la hace bajar 34 cm mientras el pilote, apoyado en la grava, no se mueve —</text>
  <text x="470.0" y="584" font-size="12.5" text-anchor="middle" fill="#555">y esos 17 m de fuste dejan de sostener para colgarse.</text>
</svg>
