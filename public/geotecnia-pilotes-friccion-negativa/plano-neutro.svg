  <text x="705.0" y="464.0" font-size="11.5" text-anchor="middle" fill="#222">Q<tspan font-size="0.72em" baseline-shift="sub">n</tspan> = 61,43 tonf sobre los 17 m de arcilla (Ec. 18.58)</text>
  <rect x="60" y="540" width="820" height="84" rx="6" fill="#f7f6f3" stroke="#8a857c"/>
  <text x="470.0" y="566" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">El máximo del axial no está donde se lo dibuja siempre: está en la punta.</text>
  <text x="470.0" y="590" font-size="12.5" text-anchor="middle" fill="#555">Un pilote de punta no se mueve, así que el suelo baja más que él en TODA la arcilla y el plano neutro cae al fondo:</text>
  <text x="470.0" y="612" font-size="12.5" text-anchor="middle" fill="#555">61,43 tonf de arrastre contra 33,52 si el mismo pilote flotara. El pilote «mejor» atrae un 83 % más de carga.</text>
