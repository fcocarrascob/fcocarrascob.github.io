  <text x="470.0" y="28" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">El plano neutro decide cuánto arrastre hay — y el pilote de punta se lleva todo</text>
  <text x="470.0" y="49" font-size="12" text-anchor="middle" fill="#666">Es la profundidad donde el pilote y el suelo bajan lo mismo. Sobre ella el suelo cuelga; bajo ella el fuste vuelve a sostener.</text>
  <text x="250.0" y="98" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">A · Cuánto baja cada uno</text>
