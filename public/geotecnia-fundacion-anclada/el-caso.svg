<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ea" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="er" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b02a1a"/>
    </marker>
    <pattern id="roca" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#c9c4bb"/>
      <line x1="0" y1="10" x2="10" y2="0" stroke="#8a857c" stroke-width="0.7" opacity="0.6"/>
      <line x1="0" y1="0" x2="10" y2="10" stroke="#8a857c" stroke-width="0.7" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="940" height="500" fill="#ffffff"/>
  <text x="470" y="28" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">El caso: torre de proceso sobre un dado anclado a la roca</text>

  <g>
    <!-- relleno y roca (escala bajo el terreno: 1 m = 40 px, superficie en y = 200) -->
    <rect x="60" y="200" width="420" height="72" fill="#e8e0cd" stroke="#8a857c" stroke-width="1"/>
    <rect x="60" y="272" width="420" height="150" fill="url(#roca)" stroke="#8a857c" stroke-width="1"/>
    <line x1="60" y1="200" x2="480" y2="200" stroke="#8a857c" stroke-width="1.8"/>
    <text x="70" y="222" font-size="11" fill="#555">relleno compactado</text>
    <text x="350" y="330" font-size="12" fill="#222" font-weight="bold">Roca fracturada</text>
    <text x="350" y="348" font-size="11.5" fill="#555">k_v = 40.000 tonf/m³</text>
    <text x="350" y="366" font-size="11.5" fill="#555">tan δ = 0,70</text>

    <!-- dado y pedestal -->
    <rect x="170" y="240" width="160" height="32" fill="#dcd8d0" stroke="#8a857c" stroke-width="1.6"/>
    <rect x="210" y="200" width="80" height="40" fill="#dcd8d0" stroke="#8a857c" stroke-width="1.3"/>

    <!-- anclajes -->
    <g stroke="#b02a1a" stroke-width="2.6">
      <line x1="186" y1="240" x2="186" y2="392"/>
      <line x1="314" y1="240" x2="314" y2="392"/>
    </g>
    <g stroke="#b02a1a" stroke-width="1.2">
      <line x1="180" y1="392" x2="192" y2="392"/>
      <line x1="308" y1="392" x2="320" y2="392"/>
    </g>
    <text x="150" y="344" font-size="11" fill="#b02a1a" text-anchor="end" font-weight="bold">4 barras Ø32</text>
    <text x="150" y="360" font-size="10.5" fill="#b02a1a" text-anchor="end">L libre 6 m</text>
    <text x="150" y="376" font-size="10.5" fill="#b02a1a" text-anchor="end">eje a 0,40 m del borde</text>

    <!-- torre, con quiebre -->
    <rect x="210" y="88" width="80" height="112" fill="#dfe3e8" stroke="#8a857c" stroke-width="1.3"/>
    <path d="M210,140 l80,-12 M210,152 l80,-12" stroke="#ffffff" stroke-width="7"/>
    <path d="M210,140 l80,-12 M210,152 l80,-12" stroke="#8a857c" stroke-width="1.1"/>
    <ellipse cx="250" cy="88" rx="40" ry="9" fill="#dfe3e8" stroke="#8a857c" stroke-width="1.3"/>
    <text x="250" y="176" font-size="11.5" fill="#555" text-anchor="middle">Ø 2,0 m</text>

    <!-- cargas -->
    <line x1="250" y1="46" x2="250" y2="72" stroke="#666" stroke-width="2.5" marker-end="url(#ea)"/>
    <text x="262" y="58" font-size="11.5" fill="#222" font-weight="bold">D = 20 tonf (operación)</text>
    <line x1="120" y1="190" x2="204" y2="190" stroke="#b02a1a" stroke-width="2.5" marker-end="url(#er)"/>
    <text x="114" y="194" font-size="11.5" fill="#b02a1a" text-anchor="end" font-weight="bold">V = 13 tonf</text>
    <text x="114" y="174" font-size="11.5" fill="#b02a1a" text-anchor="end" font-weight="bold">M = 150 tonf·m</text>

    <!-- cotas -->
    <line x1="352" y1="88" x2="352" y2="200" stroke="#666" stroke-width="1" marker-start="url(#ea)" marker-end="url(#ea)"/>
    <text x="360" y="146" font-size="11" fill="#666">H = 22 m</text>
    <line x1="146" y1="200" x2="146" y2="272" stroke="#666" stroke-width="1" marker-start="url(#ea)" marker-end="url(#ea)"/>
    <text x="140" y="240" font-size="11" fill="#666" text-anchor="end">1,80</text>
    <line x1="170" y1="406" x2="330" y2="406" stroke="#666" stroke-width="1" marker-start="url(#ea)" marker-end="url(#ea)"/>
    <text x="250" y="400" font-size="11.5" fill="#222" text-anchor="middle" font-weight="bold">B = 4,00 m</text>
  </g>

  <!-- ======== datos ======== -->
  <line x1="520" y1="52" x2="520" y2="420" stroke="#e5e2dc" stroke-width="1.5"/>
  <text x="550" y="76" font-size="13" fill="#222" font-weight="bold">Lo que baja al sello</text>
  <g font-size="12">
    <text x="550" y="102" fill="#555">Torre en operación</text><text x="890" y="102" fill="#222" text-anchor="end">20,00 tonf</text>
    <text x="550" y="124" fill="#555">Dado 4,00 × 4,00 × 0,80</text><text x="890" y="124" fill="#222" text-anchor="end">32,63 tonf</text>
    <text x="550" y="146" fill="#555">Pedestal 2,00 × 2,00 × 1,00</text><text x="890" y="146" fill="#222" text-anchor="end">10,20 tonf</text>
    <text x="550" y="168" fill="#555">Relleno sobre el dado</text><text x="890" y="168" fill="#222" text-anchor="end">23,25 tonf</text>
  </g>
  <line x1="550" y1="180" x2="890" y2="180" stroke="#e5e2dc" stroke-width="1.2"/>
  <text x="550" y="202" font-size="12" fill="#222" font-weight="bold">N</text>
  <text x="890" y="202" font-size="12.5" fill="#222" text-anchor="end" font-weight="bold">86,08 tonf</text>
  <text x="550" y="222" font-size="11" fill="#666">la torre es apenas el 23 % del total</text>

  <text x="550" y="256" font-size="13" fill="#222" font-weight="bold">Del informe y de la norma</text>
  <g font-size="12">
    <text x="550" y="282" fill="#555">q_adm estática / sísmica</text><text x="890" y="282" fill="#222" text-anchor="end">12 / 18 kgf/cm²</text>
    <text x="550" y="304" fill="#555">Resistencia «realista» (C10.1.6)</text><text x="890" y="304" fill="#222" text-anchor="end">40 kgf/cm²</text>
    <text x="550" y="326" fill="#555">Extracción por barra</text><text x="890" y="326" fill="#222" text-anchor="end">25 tonf</text>
    <text x="550" y="348" fill="#555">R (Tabla 7, línea 10.1)</text><text x="890" y="348" fill="#222" text-anchor="end">3</text>
  </g>

  <rect x="550" y="366" width="340" height="52" rx="5" fill="#b02a1a" fill-opacity="0.07" stroke="#b02a1a" stroke-width="1.2"/>
  <text x="566" y="388" font-size="12" fill="#b02a1a" font-weight="bold">Factor de amplificación de 10.1.6:</text>
  <text x="566" y="408" font-size="12.5" fill="#222" font-weight="bold">0,7 R₁ = 0,7 × 3 = 2,10</text>

  <!-- takeaway -->
  <rect x="60" y="448" width="820" height="38" rx="6" fill="#f7f6f3" stroke="#8a857c"/>
  <text x="470" y="472" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">Mucho momento y poco peso: el caso donde agrandar el dado deja de ser una solución.</text>
</svg>
