<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ea" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="er" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b02a1a"/>
    </marker>
    <marker id="eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b35c0e"/>
    </marker>
  </defs>
  <rect width="940" height="470" fill="#ffffff"/>
  <text x="470" y="28" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">El mismo dado bajo las dos combinaciones</text>
  <text x="470" y="49" font-size="12" text-anchor="middle" fill="#666">Fundación rígida sobre cama de balasto (10.1.2), con levantamiento y anclajes elásticos. Escala horizontal 1 m = 55 px.</text>

  <!-- ================= panel A: sin amplificar ================= -->
  <text x="220" y="86" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">Combinación 4.5, sin amplificar</text>
  <text x="220" y="105" font-size="11.5" text-anchor="middle" fill="#666">M = 121,38 tonf·m · e = 1,410 m</text>

  <rect x="110" y="132" width="220" height="24" fill="#dcd8d0" stroke="#8a857c" stroke-width="1.5"/>
  <polygon points="110,156 220.7,156 110,182" fill="#1a63a8" fill-opacity="0.20" stroke="#1a63a8" stroke-width="1.5"/>
  <text x="106" y="196" font-size="11.5" fill="#1a63a8" text-anchor="end" font-weight="bold">2,20</text>
  <text x="106" y="212" font-size="10.5" fill="#1a63a8" text-anchor="end">kgf/cm²</text>
  <line x1="110" y1="222" x2="220.7" y2="222" stroke="#1a63a8" stroke-width="1" marker-start="url(#ea)" marker-end="url(#ea)"/>
  <text x="165" y="238" font-size="11" fill="#1a63a8" text-anchor="middle">c = 2,012 m (50,3 %)</text>

  <line x1="308" y1="156" x2="308" y2="200" stroke="#b02a1a" stroke-width="2.5" marker-end="url(#er)"/>
  <text x="316" y="180" font-size="12" fill="#b02a1a" font-weight="bold">T = 2,37 tonf</text>
  <text x="220" y="264" font-size="11.5" text-anchor="middle" fill="#666">giro θ = 0,27 mrad</text>

  <!-- ================= panel B: amplificada ================= -->
  <text x="720" y="86" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">Amplificada por 0,7R₁ = 2,10</text>
  <text x="720" y="105" font-size="11.5" text-anchor="middle" fill="#b02a1a" font-weight="bold">M = 254,90 tonf·m · e = 2,961 m &gt; B/2</text>

  <rect x="610" y="132" width="220" height="24" fill="#dcd8d0" stroke="#8a857c" stroke-width="1.5"/>
  <polygon points="610,156 655.9,156 610,241" fill="#b02a1a" fill-opacity="0.22" stroke="#b02a1a" stroke-width="1.5"/>
  <text x="606" y="200" font-size="11.5" fill="#b02a1a" text-anchor="end" font-weight="bold">7,09</text>
  <text x="606" y="216" font-size="10.5" fill="#b02a1a" text-anchor="end">kgf/cm²</text>
  <line x1="610" y1="256" x2="655.9" y2="256" stroke="#b02a1a" stroke-width="1" marker-start="url(#ea)" marker-end="url(#ea)"/>
  <text x="700" y="260" font-size="11" fill="#b02a1a">c = 0,834 m (20,8 %)</text>

  <line x1="808" y1="156" x2="808" y2="228" stroke="#b02a1a" stroke-width="4" marker-end="url(#er)"/>
  <text x="820" y="180" font-size="12.5" fill="#b02a1a" font-weight="bold">T = 32,11 tonf</text>
  <text x="820" y="197" font-size="11" fill="#b02a1a">16,06 por barra</text>
  <text x="720" y="288" font-size="11.5" text-anchor="middle" fill="#666">giro θ = 2,12 mrad → 47 mm en la punta de la torre</text>

  <!-- ================= la flecha del medio ================= -->
  <line x1="390" y1="170" x2="550" y2="170" stroke="#b35c0e" stroke-width="2.5" marker-end="url(#eb)"/>
  <text x="470" y="160" font-size="12.5" text-anchor="middle" fill="#b35c0e" font-weight="bold">el momento × 2,10</text>
  <text x="470" y="192" font-size="14" text-anchor="middle" fill="#b35c0e" font-weight="bold">la tracción × 13,5</text>

  <!-- takeaway -->
  <rect x="60" y="322" width="820" height="118" rx="6" fill="#f7f6f3" stroke="#8a857c"/>
  <text x="470" y="348" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">El peso propio aporta un momento restaurador fijo, del orden de N(B/2 − c/3).</text>
  <text x="470" y="372" font-size="12.5" text-anchor="middle" fill="#555">El anclaje solo se lleva lo que sobra — y por eso su tracción crece mucho más rápido que la demanda que la produce.</text>
  <text x="470" y="400" font-size="12.5" text-anchor="middle" fill="#555">Diseñar el anclaje con la combinación sin amplificar no deja un 110 % de déficit: deja un 1.250 %.</text>
  <text x="470" y="424" font-size="11.5" text-anchor="middle" fill="#666">(El espesor del dado está fuera de escala para que se lea el diagrama de presiones.)</text>
</svg>
