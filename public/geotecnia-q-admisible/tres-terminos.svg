<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="taq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a7449"/>
    </marker>
    <pattern id="peso" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#1a63a8" stroke-width="1.2" opacity="0.45"/>
    </pattern>
  </defs>
  <rect width="940" height="440" fill="#ffffff"/>
  <text x="470" y="28" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">Los tres términos de Terzaghi: qué representa cada uno y cuánto pesa</text>

  <!-- ================= IZQUIERDA: la zapata ================= -->
  <g>
    <!-- superficie -->
    <line x1="60" y1="98" x2="410" y2="98" stroke="#8a857c" stroke-width="1.5"/>
    <text x="60" y="90" font-size="11" fill="#666">superficie</text>

    <!-- suelo sobre el sello (la sobrecarga) -->
    <rect x="60" y="98" width="350" height="72" fill="#8a7449" fill-opacity="0.14"/>

    <!-- zapata -->
    <rect x="176" y="170" width="118" height="24" fill="#dcd8d0" stroke="#8a857c" stroke-width="1.5"/>
    <line x1="235" y1="146" x2="235" y2="166" stroke="#666" stroke-width="2.5" marker-end="url(#ta)"/>

    <!-- suelo bajo la zapata (el peso propio) -->
    <rect x="60" y="194" width="350" height="86" fill="url(#peso)"/>
    <rect x="60" y="194" width="350" height="86" fill="none" stroke="#8a857c" stroke-width="1"/>

    <!-- cota Df -->
    <line x1="130" y1="98" x2="130" y2="170" stroke="#8a7449" stroke-width="1.2" marker-start="url(#taq)" marker-end="url(#taq)"/>
    <text x="122" y="138" font-size="12.5" fill="#8a7449" text-anchor="end" font-weight="bold">D_f</text>

    <!-- sobrecarga q = gamma Df a los lados del sello -->
    <line x1="100" y1="150" x2="100" y2="168" stroke="#8a7449" stroke-width="2" marker-end="url(#taq)"/>
    <line x1="340" y1="150" x2="340" y2="168" stroke="#8a7449" stroke-width="2" marker-end="url(#taq)"/>
    <text x="352" y="164" font-size="12" fill="#8a7449">q = γ D_f</text>

    <!-- cota B -->
    <line x1="176" y1="300" x2="294" y2="300" stroke="#666" stroke-width="1" marker-start="url(#ta)" marker-end="url(#ta)"/>
    <text x="235" y="318" font-size="12.5" fill="#666" text-anchor="middle" font-weight="bold">B</text>

    <text x="235" y="345" font-size="12" fill="#1a63a8" text-anchor="middle">el suelo rayado es el que aporta el peso propio</text>

    <text x="60" y="378" font-size="12" fill="#555">Caso real: la zapata de 2,20 × 2,20 m del ejemplo</text>
    <text x="60" y="396" font-size="12" fill="#555">de hormigón, con D_f = 1,5 m supuesto, arena</text>
    <text x="60" y="414" font-size="12" fill="#555">φ' = 26,7°, γ = 18 kN/m³, c' = 0, sin napa.</text>
  </g>

  <line x1="440" y1="52" x2="440" y2="420" stroke="#e5e2dc" stroke-width="1.5"/>

  <!-- ================= DERECHA: los tres terminos ================= -->
  <g>
    <!-- fila 1: cohesion -->
    <rect x="470" y="66" width="14" height="14" fill="#1c7c3c"/>
    <text x="494" y="78" font-size="13.5" fill="#1c7c3c" font-weight="bold">c' N_c</text>
    <text x="576" y="78" font-size="13" fill="#222" font-weight="bold">COHESIÓN</text>
    <text x="470" y="98" font-size="12" fill="#555">Único término vivo en arcilla saturada no drenada</text>
    <text x="470" y="115" font-size="12" fill="#555">(φ = 0, N_c = 5,14). En arena limpia vale cero.</text>
    <text x="880" y="98" font-size="13" fill="#1c7c3c" text-anchor="end" font-weight="bold">0 kPa</text>

    <!-- fila 2: sobrecarga -->
    <rect x="470" y="146" width="14" height="14" fill="#8a7449"/>
    <text x="494" y="158" font-size="13.5" fill="#8a7449" font-weight="bold">q N_q</text>
    <text x="576" y="158" font-size="13" fill="#222" font-weight="bold">SOBRECARGA</text>
    <text x="470" y="178" font-size="12" fill="#555">El peso del suelo sobre el sello. Crece con D_f:</text>
    <text x="470" y="195" font-size="12" fill="#555">enterrar la zapata es la capacidad más barata.</text>
    <text x="880" y="178" font-size="13" fill="#8a7449" text-anchor="end" font-weight="bold">414 kPa · 70 %</text>

    <!-- fila 3: peso propio -->
    <rect x="470" y="226" width="14" height="14" fill="#1a63a8"/>
    <text x="494" y="238" font-size="13.5" fill="#1a63a8" font-weight="bold">0,4 γ B N_γ</text>
    <text x="600" y="238" font-size="13" fill="#222" font-weight="bold">PESO PROPIO</text>
    <text x="470" y="258" font-size="12" fill="#555">El suelo bajo la zapata. Crece con B, y es el único</text>
    <text x="470" y="275" font-size="12" fill="#555">término que castiga el nivel freático.</text>
    <text x="880" y="258" font-size="13" fill="#1a63a8" text-anchor="end" font-weight="bold">175 kPa · 30 %</text>

    <!-- barra apilada -->
    <text x="470" y="312" font-size="11.5" fill="#666">Reparto de la capacidad última en este caso:</text>
    <rect x="470" y="320" width="287" height="26" fill="#8a7449" fill-opacity="0.75"/>
    <rect x="757" y="320" width="123" height="26" fill="#1a63a8" fill-opacity="0.75"/>
    <rect x="470" y="320" width="410" height="26" fill="none" stroke="#8a857c" stroke-width="1"/>
    <text x="613" y="338" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">q N_q — 70 %</text>
    <text x="818" y="338" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">30 %</text>
  </g>

  <!-- takeaway -->
  <rect x="450" y="366" width="440" height="56" rx="6" fill="#f7f6f3" stroke="#8a857c"/>
  <text x="670" y="388" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">Si sube la napa hasta el sello, γ pasa a γ' ≈ γ/2</text>
  <text x="670" y="409" font-size="12.5" text-anchor="middle" fill="#555">pero solo castiga el término azul: q_adm cae 15 %, no 33 %.</text>
</svg>
