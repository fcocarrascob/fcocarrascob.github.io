<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="940" height="420" fill="#ffffff"/>
  <text x="470" y="28" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">El mismo suelo y la misma zapata, dos métodos legítimos: 34 % de diferencia</text>
  <text x="470" y="49" font-size="12" text-anchor="middle" fill="#666">Zapata 2,20 × 2,20 m · D_f = 1,5 m · arena c' = 0, γ = 18 kN/m³ · FS = 3</text>

  <line x1="470" y1="70" x2="470" y2="330" stroke="#e5e2dc" stroke-width="1.5"/>

  <!-- ============ IZQUIERDA: que phi' hace falta ============ -->
  <g>
    <text x="240" y="88" font-size="13.5" text-anchor="middle" fill="#222" font-weight="bold">Para llegar a q_adm = 2,0 kgf/cm²,</text>
    <text x="240" y="107" font-size="13.5" text-anchor="middle" fill="#222" font-weight="bold">¿qué φ' hay que suponer?</text>

    <!-- eje -->
    <line x1="120" y1="290" x2="380" y2="290" stroke="#8a857c" stroke-width="1.5"/>

    <!-- barras proporcionales desde cero: 26,7 -> 140 px ; 24,3 -> 127 px -->
    <rect x="150" y="150" width="72" height="140" fill="#b02a1a" fill-opacity="0.75"/>
    <text x="186" y="142" font-size="17" fill="#b02a1a" text-anchor="middle" font-weight="bold">26,7°</text>
    <text x="186" y="308" font-size="12.5" fill="#555" text-anchor="middle">Terzaghi</text>
    <text x="186" y="324" font-size="11.5" fill="#888" text-anchor="middle">(1943)</text>

    <rect x="278" y="163" width="72" height="127" fill="#1a63a8" fill-opacity="0.75"/>
    <text x="314" y="155" font-size="17" fill="#1a63a8" text-anchor="middle" font-weight="bold">24,3°</text>
    <text x="314" y="308" font-size="12.5" fill="#555" text-anchor="middle">Ec. general</text>
    <text x="314" y="324" font-size="11.5" fill="#888" text-anchor="middle">(Meyerhof, 1963)</text>

    <!-- delta -->
    <line x1="230" y1="132" x2="306" y2="132" stroke="#666" stroke-width="1" marker-start="url(#ra)" marker-end="url(#ra)"/>
    <text x="268" y="126" font-size="11.5" fill="#666" text-anchor="middle" font-weight="bold">2,4°  (9 %)</text>
  </g>

  <!-- ============ DERECHA: que q_adm entrega cada uno ============ -->
  <g>
    <text x="700" y="88" font-size="13.5" text-anchor="middle" fill="#222" font-weight="bold">Fijando φ' = 26,7°,</text>
    <text x="700" y="107" font-size="13.5" text-anchor="middle" fill="#222" font-weight="bold">¿qué q_adm entrega cada uno?</text>

    <line x1="580" y1="290" x2="840" y2="290" stroke="#8a857c" stroke-width="1.5"/>

    <!-- barra Terzaghi -->
    <rect x="610" y="180" width="72" height="110" fill="#b02a1a" fill-opacity="0.75"/>
    <text x="646" y="172" font-size="17" fill="#b02a1a" text-anchor="middle" font-weight="bold">2,00</text>
    <text x="646" y="308" font-size="12.5" fill="#555" text-anchor="middle">Terzaghi</text>
    <text x="646" y="324" font-size="11.5" fill="#888" text-anchor="middle">196 kPa</text>

    <!-- barra general -->
    <rect x="738" y="143" width="72" height="147" fill="#1a63a8" fill-opacity="0.75"/>
    <text x="774" y="135" font-size="17" fill="#1a63a8" text-anchor="middle" font-weight="bold">2,68</text>
    <text x="774" y="308" font-size="12.5" fill="#555" text-anchor="middle">Ec. general</text>
    <text x="774" y="324" font-size="11.5" fill="#888" text-anchor="middle">263 kPa</text>

    <text x="700" y="126" font-size="12" fill="#666" text-anchor="middle">kgf/cm²</text>

    <!-- delta -->
    <line x1="690" y1="160" x2="730" y2="160" stroke="#1a63a8" stroke-width="1.5" marker-end="url(#ra)"/>
    <text x="710" y="153" font-size="13" fill="#1a63a8" text-anchor="middle" font-weight="bold">+34 %</text>
  </g>

  <!-- takeaway -->
  <rect x="70" y="340" width="800" height="70" rx="6" fill="#f7f6f3" stroke="#8a857c"/>
  <text x="470" y="363" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">Comparar el q_adm de dos informes sin saber qué ecuación usó cada uno no significa nada.</text>
  <text x="470" y="384" font-size="12.5" text-anchor="middle" fill="#555">Un 2,7 kgf/cm² calculado con la ecuación general y un 2,0 con Terzaghi pueden ser exactamente el mismo terreno.</text>
  <text x="470" y="403" font-size="12.5" text-anchor="middle" fill="#555">Nótese además la sensibilidad: <tspan font-weight="bold" fill="#222">9 % de cambio en φ' mueve q_adm un 34 %</tspan> — el error vive en los parámetros, no en la fórmula.</text>
</svg>
