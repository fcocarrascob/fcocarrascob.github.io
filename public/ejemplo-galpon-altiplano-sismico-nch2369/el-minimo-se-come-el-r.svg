  <rect x="214.0" y="160" width="161.2" height="26" rx="3" fill="#1a63a8" fill-opacity="0.55"/>
  <text x="202" y="178" font-size="11" fill="#6b7280" text-anchor="end">X · marcos</text>
  <text x="385.21088554894413" y="178" font-size="11.5" fill="#1a63a8" text-anchor="start" font-weight="bold">86,960 kN</text>
  <rect x="214.0" y="200" width="241.5" height="26" rx="3" fill="#1a63a8" fill-opacity="0.55"/>
  <text x="202" y="218" font-size="11" fill="#6b7280" text-anchor="end">Y · arriostrada</text>
  <text x="465.4767885866804" y="218" font-size="11.5" fill="#1a63a8" text-anchor="start" font-weight="bold">130,257 kN</text>
  <rect x="345.4" y="256" width="216.1" height="118" fill="#1f7a4d" fill-opacity="0.08"/>
