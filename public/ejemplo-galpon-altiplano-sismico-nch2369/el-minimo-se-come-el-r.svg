  <text x="500" y="34" font-size="15.5" fill="#222" text-anchor="middle" font-weight="bold">Las dos rutas contra la banda de §5.12–§5.13 — y el único corte que se cae por abajo</text>
  <text x="500" y="56" font-size="12" fill="#6b7280" text-anchor="middle">Mismo modelo, misma masa P = 674,861 kN. Solo cambia el R de tabla, y con él el R* de cada dirección y el Q₀máx de la Ec. (13)</text>
