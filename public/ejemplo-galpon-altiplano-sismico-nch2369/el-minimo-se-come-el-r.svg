  <text x="553.4520010897974" y="268" font-size="10.5" fill="#1f7a4d" text-anchor="end">Q₀máx = 187,422 kN</text>
  <text x="202" y="274" font-size="11.5" fill="#b02a1a" text-anchor="end" font-weight="bold">fila 5.5 · R = 5 (la ilustrativa)</text>
