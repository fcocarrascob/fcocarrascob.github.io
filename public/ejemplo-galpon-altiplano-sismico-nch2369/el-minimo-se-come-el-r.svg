  <line x1="345.4" y1="112" x2="345.4" y2="392" stroke="#b45309" stroke-width="2"/>
  <text x="345.3643069814524" y="104" font-size="11.5" fill="#b45309" text-anchor="middle" font-weight="bold">Q₀mín = 70,860 kN  (Ec. 12)</text>
  <rect x="726" y="150" width="236" height="224" rx="6" fill="#fdf6ec" stroke="#b45309" stroke-width="1.6"/>
  <text x="742" y="176" font-size="12.5" fill="#b45309" text-anchor="start" font-weight="bold">Lo que cobra el mínimo</text>
  <text x="742" y="198" font-size="11" fill="#333" text-anchor="start">Dirección X, ruta R = 5:</text>
  <text x="742" y="222" font-size="11" fill="#333" text-anchor="start">§5.12 amplifica todo por</text>
  <text x="742" y="240" font-size="11.5" fill="#333" text-anchor="start" font-weight="bold">70,860 / 69,568 = 1,018575</text>
  <text x="742" y="268" font-size="11" fill="#333" text-anchor="start">y la Ec. (14) devuelve</text>
  <text x="742" y="290" font-size="11.5" fill="#333" text-anchor="start">R₁ = 5,00 × 0,981764</text>
  <text x="742" y="316" font-size="17" fill="#b02a1a" text-anchor="start" font-weight="bold">R₁ = 4,908819</text>
  <text x="742" y="342" font-size="11" fill="#6b7280" text-anchor="start">La fila que promete el R</text>
  <text x="742" y="358" font-size="11" fill="#6b7280" text-anchor="start">más alto no lo entrega.</text>
  <text x="40" y="462" font-size="11" fill="#333" text-anchor="start">La banda verde es distinta en cada ruta: el Q₀máx de la Ec. (13) divide por (R + 1), así que subir el R de 4 a 5 baja el techo de 224,907 a 187,422 kN.</text>
  <text x="40" y="480" font-size="11" fill="#333" text-anchor="start">El piso de la Ec. (12) no depende del R y queda donde estaba. Con R = 5, el corte de la dirección de marcos cae por debajo de ese piso.</text>
  <text x="40" y="506" font-size="10.5" fill="#6b7280" text-anchor="start">Cortes CQC del análisis modal espectral (60 modos, §5.6.2 cumplida) del modelo galpon-altiplano.sdb, SAP2000 v27.1</text>
  <text x="40" y="522" font-size="10.5" fill="#6b7280" text-anchor="start">Ecs. (1a), (1b), (12), (13) y (14) de NCh2369:2025 (3.ª ed.), págs. impresas 27-29 y 48-49 · recalculadas contra src/lib/nch2369-spectrum.ts</text>
</svg>
