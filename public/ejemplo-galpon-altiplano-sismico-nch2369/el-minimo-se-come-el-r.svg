  <line x1="630.9" y1="124" x2="630.9" y2="242" stroke="#1f7a4d" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="622.9424013077569" y="136" font-size="10.5" fill="#1f7a4d" text-anchor="end">Q₀máx = 224,907 kN</text>
