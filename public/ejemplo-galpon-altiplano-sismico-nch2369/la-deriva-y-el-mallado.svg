  <text x="419.8674285714285" y="162" font-size="11.5" fill="#b02a1a" text-anchor="start" font-weight="bold">0,113504 m</text>
  <text x="419.8674285714285" y="178" font-size="11" fill="#b02a1a" text-anchor="start">94,6 % del límite</text>
