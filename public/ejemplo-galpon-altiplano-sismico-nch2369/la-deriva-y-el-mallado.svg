  <text x="500" y="34" font-size="15.5" fill="#222" text-anchor="middle" font-weight="bold">La deriva pasa por 5,4 % — y ese margen es más chico que el error de una malla gruesa</text>
  <text x="500" y="56" font-size="12" fill="#6b7280" text-anchor="middle">Desplazamientos con el espectro de referencia de §6.1 (sin R*, con (0,05/ξ)^0,4 y con I) y la simultaneidad de §4.5.2</text>
  <text x="106" y="88" font-size="12" fill="#333" text-anchor="start" font-weight="bold">Desplazamiento de alero [m], contra el límite de §6.3</text>
  <text x="596" y="88" font-size="12" fill="#333" text-anchor="start" font-weight="bold">Cuánto sobreestima la deriva cada malla (§5.34)</text>
