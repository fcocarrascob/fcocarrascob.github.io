  <text x="653.7280000000001" y="230" font-size="10.5" fill="#6b7280" text-anchor="start">+0,95 %</text>
  
  <rect x="606.0" y="244" width="2.6" height="19" rx="3" fill="#1f7a4d" fill-opacity="0.5"/>
  <text x="596" y="258" font-size="11" fill="#333" text-anchor="end">N = 9</text>
  <text x="653.7280000000001" y="258" font-size="10.5" fill="#6b7280" text-anchor="start">+0,40 %</text>
  
  <line x1="641.7" y1="118" x2="641.7" y2="272" stroke="#b45309" stroke-width="2.2" stroke-dasharray="6 4"/>
  <text x="647.7280000000001" y="112" font-size="11.5" fill="#b45309" text-anchor="start" font-weight="bold">margen real: 5,4 %</text>
  <text x="106" y="332" font-size="11" fill="#333" text-anchor="start">La dirección de marcos usa el 94,6 % del límite y la arriostrada el 5,8 %:</text>
  <text x="106" y="350" font-size="11" fill="#333" text-anchor="start">el mismo edificio, la misma masa, y 16,4 veces de diferencia.</text>
  <text x="106" y="376" font-size="11" fill="#333" text-anchor="start">El mismo 0,015·h de §6.3 es el gatillo del P-Delta de §6.4: estamos a un 5 %</text>
  <text x="106" y="394" font-size="11" fill="#333" text-anchor="start">de tener que correr segundo orden. Y C6.4 avisa que el P-Delta «puede serlo</text>
  <text x="106" y="412" font-size="11" fill="#333" text-anchor="start">en estructuras de marcos resistentes a momento».</text>
  <text x="596" y="332" font-size="11" fill="#333" text-anchor="start">N es el número de tramos por columna del peralte variable, contra</text>
  <text x="596" y="350" font-size="11" fill="#333" text-anchor="start">N = 36 como referencia. La malla adoptada es N = 4: cae entre las</text>
  <text x="596" y="368" font-size="11" fill="#333" text-anchor="start">filas N = 3 y N = 6, o sea entre +3,98 % y +0,95 %. Con uno o dos</text>
  <text x="596" y="386" font-size="11" fill="#333" text-anchor="start">tramos por columna el error solo se habría comido el margen: la</text>
  <text x="596" y="404" font-size="11" fill="#333" text-anchor="start">deriva habría «reprobado» sin que nada en la salida lo delatara.</text>
  <text x="106" y="462" font-size="10.5" fill="#6b7280" text-anchor="start">Desplazamientos del modelo galpon_altiplano.sdb (SAP2000 v27.1), caso espectral de referencia · chequeo de consistencia: bajo el caso de diseño</text>
  <text x="106" y="478" font-size="10.5" fill="#6b7280" text-anchor="start">el mismo nodo da 0,028105 m, y 0,112442 / 0,028105 = 4,0009 ≈ R*_X = 4,0</text>
  <text x="106" y="498" font-size="10.5" fill="#6b7280" text-anchor="start">NCh2369:2025 (3.ª ed.) · §6.1, §6.3 y §6.4 con C6.4, págs. impresas 68-70, leídas rasterizadas el 2026-08-12</text>
