  <text x="738" y="290" font-size="11" fill="#6b7280" text-anchor="middle">20 %</text>
  <line x1="804.0" y1="118" x2="804.0" y2="272" stroke="#d1d5db" stroke-width="1"/>
  <text x="804" y="290" font-size="11" fill="#6b7280" text-anchor="middle">30 %</text>
