  <text x="145.77371428571428" y="242" font-size="11" fill="#1a63a8" text-anchor="start">5,8 % del límite</text>
  <line x1="426.6" y1="118" x2="426.6" y2="272" stroke="#1f7a4d" stroke-width="2.2"/>
  <text x="426.5714285714285" y="110" font-size="11.5" fill="#1f7a4d" text-anchor="middle" font-weight="bold">0,015·h = 0,120 m</text>
