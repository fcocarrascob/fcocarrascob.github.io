<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1000" height="660" fill="#ffffff"/>
  <text x="500" y="34" font-size="15.5" fill="#222" text-anchor="middle" font-weight="bold">La Tabla 7 clasifica el edificio, no la dirección — y la fila no la elige el ingeniero</text>
  <text x="500" y="56" font-size="12" fill="#6b7280" text-anchor="middle">Un galpón con marcos transversales en X y crucería en Y tiene dos sistemas sismorresistentes y una sola fila de la Tabla 7</text>
  <text x="48" y="92" font-size="12.5" fill="#333" text-anchor="start" font-weight="bold">Las cuatro filas que un galpón industrial puede terminar usando</text>
  <text x="48" y="112" font-size="11" fill="#6b7280" text-anchor="start">La barra es el R de tabla. La línea gris de cada caja dice quien decide que te toque esa fila.</text>
  <text x="706" y="174" font-size="12.5" fill="#333" text-anchor="start" font-weight="bold">El camino de este galpón</text>
  <rect x="48" y="152" width="624" height="82" rx="6" fill="#ffffff" stroke="#b02a1a" stroke-width="1.4"/>
  <text x="64" y="176" font-size="12.5" fill="#b02a1a" text-anchor="start" font-weight="bold">Tabla 7, fila 5.5</text>
  <text x="64" y="196" font-size="11.5" fill="#333" text-anchor="start">Edificios industriales de un piso, con o sin puente grúa,</text>
  <text x="64" y="212" font-size="11.5" fill="#333" text-anchor="start">CON arriostramiento continuo de techo, anclajes dúctiles</text>
  <text x="64" y="228" font-size="10.5" fill="#6b7280" text-anchor="start">§12.1.2 la vuelve la fila por defecto</text>
  <line x1="482" y1="162" x2="482" y2="224" stroke="#d1d5db" stroke-width="1"/>
  <rect x="500" y="192" width="108.0" height="22" rx="3" fill="#b02a1a" fill-opacity="0.45"/>
  <text x="500" y="182" font-size="13" fill="#b02a1a" text-anchor="start" font-weight="bold">R = 5</text>
  <rect x="48" y="252" width="624" height="82" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="64" y="276" font-size="12.5" fill="#9ca3af" text-anchor="start" font-weight="bold">Tabla 7, fila 5.6</text>
  <text x="64" y="296" font-size="11.5" fill="#333" text-anchor="start">Edificios industriales de un piso, sin puente grúa,</text>
  <text x="64" y="312" font-size="11.5" fill="#333" text-anchor="start">SIN arriostramiento continuo de techo, anclajes dúctiles</text>
  <text x="64" y="328" font-size="10.5" fill="#6b7280" text-anchor="start">solo para la excepción de §12.1.2</text>
  <line x1="482" y1="262" x2="482" y2="324" stroke="#d1d5db" stroke-width="1"/>
  <rect x="500" y="292" width="64.8" height="22" rx="3" fill="#9ca3af" fill-opacity="0.45"/>
  <text x="500" y="282" font-size="13" fill="#9ca3af" text-anchor="start" font-weight="bold">R = 3</text>
  <rect x="48" y="352" width="624" height="82" rx="6" fill="#eef4fb" stroke="#1a63a8" stroke-width="2.4"/>
  <text x="64" y="376" font-size="12.5" fill="#1a63a8" text-anchor="start" font-weight="bold">Tabla 7, fila 5.7</text>
  <text x="64" y="396" font-size="11.5" fill="#333" text-anchor="start">Galpones livianos de acero</text>
  <text x="64" y="412" font-size="11.5" fill="#333" text-anchor="start">— definidos por las ocho condiciones de §12.2.1</text>
  <text x="64" y="428" font-size="10.5" fill="#6b7280" text-anchor="start">§12.2: «se DEBE evaluar utilizando […] punto 5.7»</text>
  <line x1="482" y1="362" x2="482" y2="424" stroke="#d1d5db" stroke-width="1"/>
  <rect x="500" y="392" width="86.4" height="22" rx="3" fill="#1a63a8" fill-opacity="0.85"/>
  <text x="500" y="382" font-size="13" fill="#1a63a8" text-anchor="start" font-weight="bold">R = 4</text>
  <rect x="48" y="452" width="624" height="82" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
  <text x="64" y="476" font-size="12.5" fill="#b45309" text-anchor="start" font-weight="bold">Tabla 7, fila 2</text>
  <text x="64" y="496" font-size="11.5" fill="#333" text-anchor="start">Otras estructuras no incluidas o asimilables</text>
  <text x="64" y="512" font-size="11.5" fill="#333" text-anchor="start">— donde cae «con puente grúa y SIN arriostramiento»</text>
  <text x="64" y="528" font-size="10.5" fill="#6b7280" text-anchor="start">el hueco: esa combinación no tiene fila propia</text>
  <line x1="482" y1="462" x2="482" y2="524" stroke="#d1d5db" stroke-width="1"/>
  <rect x="500" y="492" width="32.4" height="22" rx="3" fill="#b45309" fill-opacity="0.45"/>
  <text x="500" y="482" font-size="13" fill="#b45309" text-anchor="start" font-weight="bold">R = 1,5</text>
  <rect x="706" y="200" width="252" height="74" rx="6" fill="#f6faf7" stroke="#1f7a4d" stroke-width="1.4"/>
  <text x="720" y="222" font-size="11.5" fill="#1f7a4d" text-anchor="start" font-weight="bold">¿Marcos transversales?</text>
  <text x="720" y="240" font-size="10.5" fill="#333" text-anchor="start">Sí → §12.1.2 obliga el</text>
  <text x="720" y="256" font-size="10.5" fill="#333" text-anchor="start">arriostramiento continuo</text>
  <line x1="832" y1="274" x2="832" y2="300" stroke="#1f7a4d" stroke-width="1.6" marker-end="url(#punta)"/>
  <rect x="706" y="304" width="252" height="74" rx="6" fill="#f6faf7" stroke="#1f7a4d" stroke-width="1.4"/>
  <text x="720" y="326" font-size="11.5" fill="#1f7a4d" text-anchor="start" font-weight="bold">¿Solo carga su peso propio?</text>
  <text x="720" y="344" font-size="10.5" fill="#333" text-anchor="start">No: 0,35 kPa de carga muerta</text>
  <text x="720" y="360" font-size="10.5" fill="#333" text-anchor="start">superpuesta → sin excepción</text>
  <line x1="832" y1="378" x2="832" y2="404" stroke="#1f7a4d" stroke-width="1.6" marker-end="url(#punta)"/>
  <rect x="706" y="408" width="252" height="74" rx="6" fill="#f6faf7" stroke="#1f7a4d" stroke-width="1.4"/>
  <text x="720" y="430" font-size="11.5" fill="#1f7a4d" text-anchor="start" font-weight="bold">¿Las ocho de §12.2.1?</text>
  <text x="720" y="448" font-size="10.5" fill="#333" text-anchor="start">Se cumplen las ocho letras,</text>
  <text x="720" y="464" font-size="10.5" fill="#333" text-anchor="start">de la a) hasta la h)</text>
  
  <rect x="706" y="512" width="252" height="76" rx="6" fill="#eef4fb" stroke="#1a63a8" stroke-width="2.4"/>
  <text x="720" y="534" font-size="12.5" fill="#1a63a8" text-anchor="start" font-weight="bold">Va por §12.2: R = 4</text>
  <text x="720" y="552" font-size="10.5" fill="#333" text-anchor="start">y el amplificador de capacidad</text>
  <text x="720" y="568" font-size="10.5" fill="#333" text-anchor="start">baja de 0,7R₁ a 0,5R₁,</text>
  <text x="720" y="584" font-size="10.5" fill="#333" text-anchor="start" font-weight="bold">por §12.2.2</text>
  <line x1="832" y1="478" x2="832" y2="508" stroke="#1a63a8" stroke-width="1.6" marker-end="url(#punta)"/>
  <text x="48" y="620" font-size="11" fill="#333" text-anchor="start">La fila 5.6 (R = 3) es casi inalcanzable: §12.1.2 exige arriostramiento continuo de techo en todo edificio con marcos transversales, salvo los que</text>
  <text x="48" y="636" font-size="11" fill="#333" text-anchor="start">solo cargan su peso propio. Y «con puente grúa y sin arriostramiento» no está en la tabla: cae en la fila 2, con R = 1,5.</text>
  <text x="48" y="654" font-size="10.5" fill="#6b7280" text-anchor="start">NCh2369:2025 (3.ª ed.) · Tabla 7 (pág. impresa 61) · §12.1.2 y §12.2 (págs. 143-145), leídas rasterizadas el 2026-08-12</text>
</svg>
